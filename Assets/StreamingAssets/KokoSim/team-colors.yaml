# チームカラー・パレット表（設計書18 §3.5.1）
#
# 架空4000校のユニフォーム配色を、この表から School.Id で決定論的に1件選ぶ（TeamColorPalette.For）。
# 全校を列挙するのではなく「実在校らしい配色の型」を並べ、同じ配色の学校が複数出ることを許容する。
#
# 1件は色2〜3個で書く。表示上の6領域はここから規則で導出する（TeamColors.Resolve）:
#   ユニ上・ズボン           ← base
#   アンダーシャツ・ソックス ← team
#   帽子クラウン             ← team
#   帽子つば                 ← visor（省略時は team）
# 実物の高校野球は「白系の地色＋チーム色1」でほぼ説明がつくので、この形が破綻しない最小の表現になる。
#
# 表の規模（issue #620）: 4000校をこの表で回すので、件数が少ないと1シーズン10校見ただけで被る。
# 60件前後を保つ。ただし実物準拠を壊さない＝**地色は白が過半**のままにする（現実の高校野球は
# 「白系の地色＋チーム色1」でほぼ説明がつく）。派手な型を等分に足すと嘘くさくなる。
#
# 地色の階調は**身体の上で測ってから足す**（issue #620 実測・KokoSim/Duel/チームカラー一覧を撮る）。
# 16進では違って見えても、照明とポスタライズを通すと潰れる。実測した着用時の色:
#   白 #EDEBE0→#A6A59D ／ クリーム #E8E2CE→#A29E90 ／ 薄グレー #D8D8D4→#979794
#   砂色 #DCD3B8→#9A9380 ／ 銀鼠 #C6C7C4→#8A8B89
# 「生成り #F4F1E6」も一度足したが、着ると #ABA9A1＝白との差が全チャンネル5しかなく
# **白との見分けが付かない**ので取り下げた（表の枠を1件使って被りが減らないのが理由）。
#
# 配色の軸（issue #621）。**表の1件とは独立に校IDから**決まる型で、表の件数を増減しても
# 出方は変わらない（＝#620 で表を厚くするのとは別に掛け算で効く。60件×2×2×2＝240通り相当）。
#   stripe       … 縦縞を出す割合。色と密度は下の stripe: の型（無ければチーム色・40本/m）
#   visor        … つばを地色にする割合（つばの色を明示している件には効かない＝二重に振らない）
#   white_under  … アンダーシャツ・ソックスを地色にする割合（チーム色が帽子だけに残る型）
# 実物準拠で偏らせる＝等分にしない。縦縞と白アンダーは少数派、白つばはそこそこ居る。
axes:
  - { stripe: 0.20, visor: 0.30, white_under: 0.20 }

# stripe: 縦縞の型（§3.5.3）。**縞を出すかどうかは上の軸が決める**ので、ここに書くのは
#   「その配色が縞を出すときの色と密度」だけ（省略＝チーム色・40本/m）。
#   freq は横1mあたりの縞の本数。実物のピンストライプは間隔2.5cm前後＝40本/m。
#
# 注意: 対決ビューは両校とも自校の配色で描く（実物準拠・2026-07-29 監督決定）。したがって
# 紺同士のような同系色の対戦では両者の見分けが付きにくくなる。これは承知の上の仕様であり、
# 「守備側を白へ寄せてコントラストを作る」旧 UniformPalette の考え方は破棄した。

# 色の和名。チーム設定画面が領域ごとの色を「白」「紺」と出すために使う（16進を人に見せない）。
# ここに無い色は16進のまま表示される＝下の palettes に色を足したらこちらにも足すこと。
color_names:
  - { hex: "#EDEBE0", name: 白 }
  - { hex: "#E8E2CE", name: クリーム }
  - { hex: "#DCD3B8", name: 砂色 }
  - { hex: "#D8D8D4", name: 薄グレー }
  - { hex: "#C6C7C4", name: 銀鼠 }
  - { hex: "#293356", name: 紺 }
  - { hex: "#1C2440", name: 濃紺 }
  - { hex: "#853032", name: えんじ }
  - { hex: "#1F4A34", name: 深緑 }
  - { hex: "#23242A", name: 黒 }
  - { hex: "#1F4E9C", name: 青 }
  - { hex: "#4E9BC4", name: 水色 }
  - { hex: "#A32B2B", name: 赤 }
  - { hex: "#C9622A", name: オレンジ }
  - { hex: "#4E3272", name: 紫 }
  - { hex: "#6B3A2E", name: えび茶 }
  - { hex: "#A8863A", name: 金茶 }
  - { hex: "#4A7A35", name: 若草 }
  - { hex: "#6B2233", name: ワインレッド }
  - { hex: "#3A3F45", name: チャコール }
  - { hex: "#1F6B6B", name: 青緑 }
  - { hex: "#4E3526", name: 焦茶 }
  - { hex: "#6E63A6", name: 藤紫 }
  - { hex: "#C7961B", name: 山吹 }
  - { hex: "#5A6B37", name: モスグリーン }
  - { hex: "#2E9AA0", name: ターコイズ }

