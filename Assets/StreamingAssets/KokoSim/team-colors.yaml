  - { id: sand_crimson,      label: 砂色＋えんじ,     base: "#DCD3B8", team: "#853032" }
  - { id: sand_darkgreen,    label: 砂色＋深緑,       base: "#DCD3B8", team: "#1F4A34" }
  - { id: sand_brown,        label: 砂色＋焦茶,       base: "#DCD3B8", team: "#4E3526" }
  - { id: sand_wine,         label: 砂色＋ワインレッド, base: "#DCD3B8", team: "#6B2233" }

  # ---- 薄グレー地 ----
