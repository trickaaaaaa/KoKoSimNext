  - { id: white_orange_black, label: 白＋オレンジ（つば黒）, base: "#EDEBE0", team: "#C9622A", visor: "#23242A" }
  - { id: white_sky_navy,    label: 白＋水色（つば紺）, base: "#EDEBE0", team: "#4E9BC4", visor: "#1C2440" }
  - { id: white_purple_gold, label: 白＋紫（つば金）, base: "#EDEBE0", team: "#4E3272", visor: "#A8863A" }
