  - { id: white_deepnavy,    label: 白＋濃紺,         base: "#EDEBE0", team: "#1C2440" }
  - { id: white_crimson,     label: 白＋えんじ,       base: "#EDEBE0", team: "#853032" }
  - { id: white_darkgreen,   label: 白＋深緑,         base: "#EDEBE0", team: "#1F4A34" }
  - { id: white_black,       label: 白＋黒,           base: "#EDEBE0", team: "#23242A",
      stripe: { color: "#23242A", freq: 44 } }
  - { id: white_royal,       label: 白＋ロイヤルブルー, base: "#EDEBE0", team: "#1F4E9C" }
  - { id: white_sky,         label: 白＋水色,         base: "#EDEBE0", team: "#4E9BC4" }
  - { id: white_red,         label: 白＋赤,           base: "#EDEBE0", team: "#A32B2B" }
  - { id: white_orange,      label: 白＋オレンジ,     base: "#EDEBE0", team: "#C9622A" }
  - { id: white_purple,      label: 白＋紫,           base: "#EDEBE0", team: "#4E3272" }
  - { id: white_maroon,      label: 白＋えび茶,       base: "#EDEBE0", team: "#6B3A2E" }
  - { id: white_gold,        label: 白＋金茶,         base: "#EDEBE0", team: "#A8863A" }
  - { id: white_grass,       label: 白＋若草,         base: "#EDEBE0", team: "#4A7A35" }
  - { id: white_wine,        label: 白＋ワインレッド, base: "#EDEBE0", team: "#6B2233" }
  - { id: white_charcoal,    label: 白＋チャコール,   base: "#EDEBE0", team: "#3A3F45" }
  - { id: white_teal,        label: 白＋青緑,         base: "#EDEBE0", team: "#1F6B6B" }
  - { id: white_brown,       label: 白＋焦茶,         base: "#EDEBE0", team: "#4E3526" }
  - { id: white_fuji,        label: 白＋藤紫,         base: "#EDEBE0", team: "#6E63A6" }
  - { id: white_yamabuki,    label: 白＋山吹,         base: "#EDEBE0", team: "#C7961B" }
  - { id: white_moss,        label: 白＋モスグリーン, base: "#EDEBE0", team: "#5A6B37" }
  - { id: white_turquoise,   label: 白＋ターコイズ,   base: "#EDEBE0", team: "#2E9AA0" }

  # ---- 白地＋つば別色（クラウンとつばを塗り分ける型） ----
  - { id: white_navy_red,    label: 白＋紺（つば赤）, base: "#EDEBE0", team: "#293356", visor: "#A32B2B" }
  - { id: white_black_gold,  label: 白＋黒（つば金）, base: "#EDEBE0", team: "#23242A", visor: "#A8863A" }
  - { id: white_green_white, label: 白＋深緑（つば白）, base: "#EDEBE0", team: "#1F4A34", visor: "#EDEBE0" }
  - { id: white_royal_navy,  label: 白＋青（つば紺）, base: "#EDEBE0", team: "#1F4E9C", visor: "#1C2440" }
  - { id: white_red_navy,    label: 白＋赤（つば紺）, base: "#EDEBE0", team: "#A32B2B", visor: "#1C2440" }
  - { id: white_navy_gold,   label: 白＋紺（つば金）, base: "#EDEBE0", team: "#293356", visor: "#A8863A" }
  - { id: white_crimson_white, label: 白＋えんじ（つば白）, base: "#EDEBE0", team: "#853032", visor: "#EDEBE0" }

  # ---- クリーム地 ----
  - { id: cream_navy,        label: クリーム＋紺,     base: "#E8E2CE", team: "#293356" }
  - { id: cream_crimson,     label: クリーム＋えんじ, base: "#E8E2CE", team: "#853032" }
  - { id: cream_darkgreen,   label: クリーム＋深緑,   base: "#E8E2CE", team: "#1F4A34" }
