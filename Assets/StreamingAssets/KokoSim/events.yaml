# イベントテーブル（設計書04 §3）。発火は EventScheduler、提示はノベル画面（issue #609）。
# 追加・調整はこのファイル編集だけで完結させる（データ駆動）。
#
# ■ 書き方
#   text:     通知フィードに残る1行の要約。**バリエーションを持たせない**（後から一覧で追う行なので固定）。
#   variants: ノベル画面で見せる会話。**会話まるごと**でN通り書き、発火時に1つだけ選ばれる
#             （行ごとに独立抽選すると前後が噛み合わない文が出るため。2026-08-13 オーナー決定）。
#             同じ (イベント, 通算週) なら常に同じ会話＝開き直しても文が変わらない。
#   lines:    会話の中身。who=役割ID（立ち絵スロット＋既定の話者名）、say=本文、name=話者名の上書き。
#             who: manager 監督 / player 部員 / coach コーチ / ob OB / scout スカウト /
#                  local 地域の人 / captain 主将 / narration 地の文（立ち絵なし）
#
# ■ 差し込み語（EventTextFormat が展開。未知の語はそのまま残る＝データ側の書き間違いが絵に出る）
#   {player} 主役の部員名 ／ {school} 自校名 ／ {manager} 監督名 ／ {count} 1年生の人数（新入部員）
#   ※ {player} はいまは「在籍部員から暦で決まる1人」。イベントの効果（誰が故障したか等）と
#     結び付くのは #610 以降で、そのとき主役はイベント側から渡される。
#
# ■ バリエーションを足すとき
#   variants: の下に `- lines:` を1ブロック足すだけでよい（コード変更は不要）。
#   発火の乱数は Fork で引くので、**通数を増やしても「いつ何が起きるか」は1語もずれない**。

events:
  # --- 固定イベント（カレンダー連動, calendar_week: 0〜49） ---
  - id: entrance_ceremony
    kind: Fixed
    calendar_week: 0
    text: "入学式。新入部員が加わった。"
    variants:
      - lines:
          - who: narration
            say: "校門の桜はもう散りかけている。新しい部員が、少し大きすぎる制服で並んでいた。"
          - who: captain
            say: "監督、今年の一年、声だけは立派です。"
          - who: manager
            say: "声が出るのはいいことだ。あとは三年でどこまで伸びるかだな。"
      - lines:
          - who: narration
            say: "入学式。グラウンドの土はまだ湿っていて、真新しいスパイクの跡がくっきり残る。"
          - who: player
            say: "あの、自分、中学では外野で……いえ、どこでもやります！"
          - who: manager
            say: "緊張しなくていい。まずは名前と、投げるか打つかだけ教えてくれ。"
      - lines:
          - who: coach
            say: "新入部員、{count}名です。少ないですが、身体つきは悪くない。"
          - who: manager
            say: "人数はどうにでもなる。問題は三年後にどんな顔をしているかだ。"
      - lines:
          - who: narration
            say: "{school}野球部、新年度。部室の名簿にまた行が増えた。"
          - who: manager
            say: "……さて、今年はどんなチームになるかな。"

  - id: summer_camp
    kind: Fixed
    calendar_week: 18
    text: "夏合宿。全体の経験値が跳ね上がる。"
    variants:
      - lines:
          - who: narration
            say: "夏合宿。日が落ちてもアスファルトは熱を持ったままで、ノックの音だけが響いていた。"
          - who: coach
            say: "監督、そろそろ切り上げますか。倒れられたら元も子もない。"
          - who: manager
            say: "あと十本。……いや、五本にしておこう。"
      - lines:
          - who: player
            say: "もう……無理です……。"
          - who: captain
            say: "無理って言えるうちは大丈夫だ。俺なんか声も出ねえ。"
          - who: manager
            say: "（この時期に一度、底を見せておくといい。夏はそこから始まる）"
      - lines:
          - who: narration
            say: "合宿最終日の夜。誰も口を利かず、それでも誰も先に寝ようとしなかった。"
          - who: manager
            say: "……よくやった。明日からは、勝つ練習をする。"

  - id: culture_festival
    kind: Fixed
    calendar_week: 28
    text: "文化祭。束の間の休息。"
    variants:
      - lines:
          - who: narration
            say: "文化祭。グラウンドの脇に模擬店が並び、バットの音がしない土曜日。"
          - who: player
            say: "監督、焼きそば食べていきませんか。俺たちの店なんで。"
          - who: manager
            say: "……野球部が焼きそばか。まあいい、二つもらおう。"
      - lines:
          - who: captain
            say: "一日くらい、部活のこと忘れてもバチは当たらないですよね。"
          - who: manager
            say: "当たらんよ。忘れられるならな。"
      - lines:
          - who: narration
            say: "教室から笑い声が漏れてくる。部員たちの、野球以外の顔を見た。"
          - who: manager
            say: "（こういう時間があるから、あの練習に戻れる）"

  - id: winter_camp
    kind: Fixed
    calendar_week: 38
    text: "冬合宿。鍛錬期の山場。"
    variants:
      - lines:
          - who: narration
            say: "冬。吐く息が白い。打球音が乾いて、遠くまで届く。"
          - who: coach
            say: "この時期に走らせた分だけ、夏に足が残ります。"
          - who: manager
            say: "分かっている。……見えない場所で差がつく季節だ。"
      - lines:
          - who: player
            say: "監督、指の感覚がないんですけど……。"
          - who: manager
            say: "握れるならまだ振れる。振れなくなったら言え。"
      - lines:
          - who: captain
            say: "夏に負けた分、冬でやり返します。"
          - who: manager
            say: "いい顔になった。その顔のまま三月まで来い。"

  - id: draft_meeting
    kind: Fixed
    calendar_week: 30
    text: "ドラフト会議。教え子に指名がかかるか。"
    variants:
      - lines:
          - who: narration
            say: "ドラフト会議。部室の小さなテレビの前に、全員が座り込んでいる。"
          - who: manager
            say: "（呼ばれても呼ばれなくても、こいつらの三年は変わらん。……それでも）"
      - lines:
          - who: coach
            say: "監督、電話は繋がるようにしてありますか。"
          - who: manager
            say: "……ああ。鳴らないほうに賭けたいくらいだがな。"
      - lines:
          - who: scout
            say: "今年はどこも即戦力を欲しがっています。高校生は下位まで残るかと。"
          - who: manager
            say: "順位は本人には関係ない。行けるかどうかだけだ。"

  - id: graduation
    kind: Fixed
    calendar_week: 49
    text: "卒業式。3年生を送り出す。"
    variants:
      - lines:
          - who: narration
            say: "卒業式。三年生が、最後にグラウンドへ寄っていった。"
          - who: player
            say: "……監督。ありがとうございました。"
          - who: manager
            say: "礼はいい。次に会うときは、野球の話以外もしよう。"
      - lines:
          - who: captain
            say: "この土、持って帰っていいですか。"
          - who: manager
            say: "好きなだけ持っていけ。どうせ来週には均される。"
      - lines:
          - who: narration
            say: "背番号を返しに来た三年生の手が、少しだけ震えていた。"
          - who: manager
            say: "……よく三年、続けたな。それだけで十分だ。"

  # --- ランダムイベント（重み付き抽選） ---
  - id: injury
    kind: Random
    weight: 2.0
    cooldown_weeks: 6
    text: "選手が練習中に故障した。"
    variants:
      - lines:
          - who: player
            say: "監督、すみません……走ったら、ここが。"
          - who: coach
            say: "無理はさせられません。二、三週は外しましょう。"
          - who: manager
            say: "分かった。治すのも練習のうちだ。焦るな。"
      - lines:
          - who: coach
            say: "{player} が練習中に痛めました。歩けてはいますが。"
          - who: manager
            say: "……歩けるうちに止めたのは正解だ。よく見ていた。"
      - lines:
          - who: narration
            say: "ノックの途中で、ひとり動きが止まった。周りの音がすっと引いていく。"
          - who: player
            say: "……大丈夫です。まだやれます。"
          - who: manager
            say: "その『大丈夫』が一番あてにならん。今日は上がれ。"
      - lines:
          - who: captain
            say: "監督、{player} が。……あいつ、痛いって言わないタイプなんで心配で。"
          - who: manager
            say: "よく言ってくれた。言わない奴ほど、周りが見てやるしかない。"

  - id: rain_week
    kind: Random
    weight: 3.0
    cooldown_weeks: 2
    text: "雨天でグラウンドが使えない。"
    variants:
      - lines:
          - who: narration
            say: "朝から雨。水たまりに映る空は、当分晴れそうにない。"
          - who: coach
            say: "室内に切り替えますか。"
          - who: manager
            say: "そうしよう。こういう日に何をしたかで、夏に差が出る。"
      - lines:
          - who: player
            say: "監督、今日は中止ですよね？"
          - who: manager
            say: "グラウンドは使えん。だが体はある。走るぞ。"
      - lines:
          - who: captain
            say: "雨、恵みだと思うことにします。脚がもう限界だったんで。"
          - who: manager
            say: "……たまには休むのも仕事だ。今日はそれでいい。"

  - id: media_coverage
    kind: Random
    weight: 1.5
    cooldown_weeks: 8
    text: "マスコミの取材が入った。名声が上がる。"
    variants:
      - lines:
          - who: narration
            say: "地元紙の記者がグラウンドに来ている。カメラを向けられた部員が急に固くなった。"
          - who: manager
            say: "普段どおりでいい。見られて困る練習はしていない。"
      - lines:
          - who: local
            name: "記者"
            say: "監督、今年のチームの手応えは？"
          - who: manager
            say: "……悪くない、とだけ。あとは夏に見てください。"
      - lines:
          - who: coach
            say: "写真、{player} ばかり撮られていましたね。"
          - who: manager
            say: "本人が浮かれなければいい。浮かれたら、それも勉強だ。"

  - id: ob_donation
    kind: Random
    weight: 1.0
    cooldown_weeks: 10
    text: "OB会から寄付があった。"
    variants:
      - lines:
          - who: ob
            say: "監督、少ないですが部で使ってください。私も、ここで三年間転がされた口です。"
          - who: manager
            say: "……ありがたく。道具に回させてもらいます。"
      - lines:
          - who: narration
            say: "OB会の封筒が部室の机に置かれていた。添えられた紙には「がんばれ」の四文字だけ。"
          - who: manager
            say: "（この四文字が一番重い）"
      - lines:
          - who: ob
            say: "うちの代は一回戦負けでしてね。だから、あなたたちに託すんです。"
          - who: manager
            say: "重い荷物だ。……だが、悪くない。"

  # 争奪戦（能動勧誘・設計書04 §2.2・issue #588）。
  # 発火のタイミングは週次の抽選ではなく「訪問1回ごと」なので、確率は
  # coefficients.yaml recruiting.rival_event_prob が持つ（週次イベントの weight は使わない）。
  # ここはイベント表としての登録と文言の正典で、UI もこの言い回しに合わせる。
  - id: recruit_rival_move
    kind: Random
    weight: 0.0
    text: "訪問した。だが競合校も動いたようだ。"

  # --- システムイベント（issue #610〜）---
  # 週次抽選には載せず（kind: System）、実際に起きた出来事から**主役つき**で呼ばれる。
  # 発生元が誰に何が起きたかを知っているので {player} は必ず実在の部員になる。
  # クールダウンは効かない（起きたら必ず出す）。通知フィードの行は発生元が出すので text は控えに留める。
  - id: injury_occurred
    kind: System
    text: "選手が故障した。"
    variants:
      - lines:
          - who: coach
            say: "監督、{player} がノックの途中で足を止めました。"
          - who: player
            say: "……大丈夫です。まだやれます。"
          - who: manager
            say: "その「大丈夫」が一番あてにならん。今日は上がれ。"
      - lines:
          - who: player
            say: "監督、すみません……ここ、ちょっと。"
          - who: manager
            say: "隠さずに言えたなら上出来だ。治すのも練習のうちだぞ。"
      - lines:
          - who: narration
            say: "全体練習の途中で、ひとり動きが止まった。周りの音がすっと引いていく。"
          - who: coach
            say: "{player} です。歩けてはいますが、無理はさせられません。"
          - who: manager
            say: "……歩けるうちに止めたのは正解だ。よく見ていた。"
      - lines:
          - who: captain
            say: "監督、{player} が。……あいつ、痛いって言わないタイプなんで心配で。"
          - who: manager
            say: "よく言ってくれた。言わない奴ほど、周りが見てやるしかない。"

  - id: injury_returned
    kind: System
    text: "選手が怪我から復帰した。"
    variants:
      - lines:
          - who: player
            say: "監督。……戻りました。"
          - who: manager
            say: "焦って取り返そうとするな。まず走れ。話はそれからだ。"
      - lines:
          - who: coach
            say: "{player}、今日から全体に合流させます。動きは戻っています。"
          - who: manager
            say: "本人が「もう平気だ」と言い出したら、逆に一日休ませろ。"
      - lines:
          - who: narration
            say: "久しぶりに、その背番号がノックの列に並んでいる。"
          - who: manager
            say: "（休んでいた間に、周りが伸びた。それも本人が一番よく分かっている）"

  # 選手成長イベント（設計書03 §5.5・issue #611）。
  # 上げは「兆しの上に起きた」、下げは**理不尽にしない**（「ここが限界だった」と納得できる言い方）。
  - id: growth_awakening
    kind: System
    text: "選手が覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "打球音が、今週だけ違う。"
          - who: coach
            say: "監督、{player} のスイング……先週までと別人です。"
          - who: manager
            say: "（来たな。毎年ひとりだけ、ここで一段上がる子がいる）"
      - lines:
          - who: player
            say: "監督、なんか……分かった気がします。うまく言えないんですけど。"
          - who: manager
            say: "言葉にしなくていい。その感じを、明日も覚えていろ。"
      - lines:
          - who: captain
            say: "{player}、化けましたね。夏前にこれは大きい。"
          - who: manager
            say: "本人が調子に乗る前に、もう一段上を見せてやらんとな。"

  - id: growth_breakthrough
    kind: System
    text: "選手がコツを掴んだ。"
    variants:
      - lines:
          - who: coach
            say: "{player}、フォームの詰まりが取れました。素直な回り方になっています。"
          - who: manager
            say: "本人が気づいたなら本物だ。教えすぎるな、ここからは。"
      - lines:
          - who: player
            say: "監督、今のもう一回いいですか。……今のが一番しっくり来ました。"
          - who: manager
            say: "覚えておけ。その形が、お前の基準だ。"
      - lines:
          - who: narration
            say: "同じ練習をしているのに、ひとりだけ音が変わる日がある。"
          - who: manager
            say: "（積み上げた分が、今日つながったな）"

  - id: growth_slump
    kind: System
    text: "選手がスランプに入った。"
    variants:
      - lines:
          - who: player
            say: "……なんで当たらないんですかね。やってること、変えてないのに。"
          - who: manager
            say: "変えるな。三週間で戻す。それまでは振り方に手を入れるな。"
      - lines:
          - who: coach
            say: "{player}、数字が落ちてきました。手首をいじり始めています。"
          - who: manager
            say: "止めろ。落ちている時に触ると、戻り方まで忘れる。"
      - lines:
          - who: narration
            say: "バットは同じ、フォームも同じ。それでも打球が上がらない時期がある。"
          - who: manager
            say: "（こういう時に何を言うかで、三年の残りが決まる）"

  - id: growth_plateau
    kind: System
    text: "選手の伸びが頭打ちになった。"
    variants:
      - lines:
          - who: coach
            say: "{player}、ここから先はもう、大きくは伸びないかもしれません。"
          - who: manager
            say: "なら、伸ばす場所を変える。そこで勝負しない野球はいくらでもある。"
      - lines:
          - who: narration
            say: "測っても、去年の数字とほとんど変わらない。"
          - who: manager
            say: "（限界が見えた、というだけだ。使い方はこれから考えればいい）"
      - lines:
          - who: player
            say: "自分、もう頭打ちですかね。"
          - who: manager
            say: "上限が見えるところまで来た、ということだ。そこまで来た奴は多くない。"

  - id: growth_yips
    kind: System
    text: "選手が送球・制球を崩した。"
    variants:
      - lines:
          - who: player
            say: "……投げられないんです。近い距離ほど、手が言うことを聞かなくて。"
          - who: manager
            say: "原因を探すな。今日は遠投だけしろ。近いのは、そのうち戻る。"
      - lines:
          - who: coach
            say: "{player}、山なりでしか投げられなくなっています。"
          - who: manager
            say: "見ている前で投げさせるな。人の目が一番効く時期だ。"

  - id: growth_yips_overcome
    kind: System
    text: "選手が送球・制球の不調を克服した。"
    variants:
      - lines:
          - who: player
            say: "監督。……さっきの、普通に投げられました。"
          - who: manager
            say: "そうか。何も言わずに見ていた甲斐があった。"
      - lines:
          - who: narration
            say: "何でもない送球が、何でもないように一塁へ収まった。"
          - who: coach
            say: "{player}、戻りましたね。長かった。"

  # 監督成長イベント（設計書04 §1.1b・issue #612）。年度の終わり（3月の総括）に出る。
  # 主役は監督なので {player} は使わない（{manager} と {school} だけ）。
  - id: mgr_koshien_experience
    kind: System
    text: "甲子園の経験が采配に返ってきた。"
    variants:
      - lines:
          - who: narration
            say: "あの夏、ベンチから見た景色は、まだ手の中に残っている。"
          - who: manager
            say: "（あそこで動けなかった一球を、来年は動ける）"
      - lines:
          - who: coach
            say: "監督、去年とサインの出し方が変わりましたね。速くなった。"
          - who: manager
            say: "……甲子園は、迷っている時間をくれないからな。"

  - id: mgr_rival_lesson
    kind: System
    text: "名将との練習試合で学びがあった。"
    variants:
      - lines:
          - who: manager
            say: "（同じ場面で、あの人はもう一枚代えていた。……そういうことか）"
      - lines:
          - who: coach
            say: "完敗でしたね。点差以上に、やられた感じがします。"
          - who: manager
            say: "いい負け方だ。何をされたか全部分かる負けは、勉強代が安い。"

  - id: mgr_big_loss
    kind: System
    text: "大敗から学んだ。"
    variants:
      - lines:
          - who: narration
            say: "勝てないまま一年が終わった。ノートには反省ばかりが並んでいる。"
          - who: manager
            say: "（選手のせいにした行が一行でもあるなら、そこが俺の弱点だ）"
      - lines:
          - who: captain
            say: "監督。……来年は、勝ちましょう。"
          - who: manager
            say: "ああ。まず俺が直す。お前たちに直させる前にな。"

  - id: mgr_seminar
    kind: System
    text: "指導者講習会に参加した。"
    variants:
      - lines:
          - who: narration
            say: "オフの週末、他校の監督たちに混じって、また生徒の側に座っている。"
          - who: manager
            say: "（教える側が習わなくなったら終わりだ。費用は部費から出させてもらおう）"
      - lines:
          - who: coach
            say: "講習、どうでした。"
          - who: manager
            say: "半分は知っていた。残りの半分に金を払った価値がある。"

  - id: mgr_pro_ob
    kind: System
    text: "プロOBが訪ねてきた。"
    variants:
      - lines:
          - who: ob
            say: "監督、久しぶりです。……この子ら、いい体になってきましたね。"
          - who: manager
            say: "見る目が違う。どこを見ているのか、あとで教えてください。"
      - lines:
          - who: ob
            say: "現役の頃は、こうやって見られる側だったんですけどね。"
          - who: manager
            say: "（見られる側にいた人間の言葉は、やはり重い）"

  - id: mgr_mentor
    kind: System
    text: "名伯楽との出会いがあった。"
    variants:
      - lines:
          - who: narration
            say: "全国の常連校を三度率いた老将が、ふらりとグラウンドに現れた。"
          - who: manager
            say: "（この人と話した二時間で、去年一年ぶんの答え合わせが終わった）"
      - lines:
          - who: ob
            name: "老監督"
            say: "教えられることは何もない。ただ、私が間違えたことなら話せます。"
          - who: manager
            say: "……それが一番聞きたい話です。"

  # 気づき: 成長タイプの見立て（設計書03 §5.6・issue #614）。
  # **断定しない**（育成眼が低いと読み違える）。会話も「かもしれない」の温度で書く。
  - id: insight_growth_type
    kind: System
    text: "選手の成長タイプに見当がついた。"
    variants:
      - lines:
          - who: coach
            say: "監督、{player}、冬に入ってから急に伸びてきましたね。"
          - who: manager
            say: "（このタイプか。……三年の夏に間に合う）"
      - lines:
          - who: narration
            say: "同じ練習をしていても、伸びる時期は選手ごとに違う。"
          - who: manager
            say: "（{player} は、そういう伸び方をする子だ。……たぶん）"
      - lines:
          - who: manager
            say: "（{player} の測定値、去年から辿ると形が見えてきたな）"
          - who: coach
            say: "見立て、当たってますかね。"
          - who: manager
            say: "半分は勘だ。だが勘の当たる歳になった。"

  # --- 選択肢イベント（Phase 5で効果接続） ---
  # 選択肢そのものは #609 の範囲外（発生→提示→閉じるまで）。会話だけ先に用意しておく。
  - id: ace_hidden_injury
    kind: Choice
    weight: 1.0
    cooldown_weeks: 12
    sets_annual_flag: ace_injured_this_year
    requires_not_annual_flag: ace_injured_this_year
    text: "エースが肘の違和感を隠しているようだ…"
    variants:
      - lines:
          - who: captain
            say: "監督。……{player}、投げたあと肘を庇ってます。本人は何も言いませんけど。"
          - who: manager
            say: "……見ていたか。よく言ってくれた。"
      - lines:
          - who: coach
            say: "エースの球、走ってはいるんです。ただ、フォームが微妙に短い。"
          - who: manager
            say: "痛みを避けている動きだな。本人に聞いても『大丈夫』と言うだろうが。"
      - lines:
          - who: narration
            say: "ブルペンの後、{player} がひとりで肘に手を当てているのが見えた。"
          - who: manager
            say: "（言わないのは、外されたくないからだ。……さて、どうする）"

  - id: skipping_practice
    kind: Choice
    weight: 1.0
    cooldown_weeks: 12
    text: "主力が練習をサボっているらしい。"
    variants:
      - lines:
          - who: coach
            say: "監督、{player} が今週も途中で抜けています。"
          - who: manager
            say: "……理由も聞かずに叱るのはやめておこう。まず話す。"
      - lines:
          - who: captain
            say: "あいつ、最近来ないんです。俺が言っても聞かなくて。"
          - who: manager
            say: "主将が抱え込む話じゃない。ここからは俺の仕事だ。"
      - lines:
          - who: narration
            say: "全体練習の輪に、いるはずの背番号が見当たらない。"
          - who: manager
            say: "（サボりで片づくなら簡単なんだがな）"
