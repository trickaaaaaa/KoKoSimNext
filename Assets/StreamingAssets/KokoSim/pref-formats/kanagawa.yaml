# confidence: verified
# 出典: kanaloco 1198920, kanagawa-baseball.com/fall/2025
# 型見本: 地区予選がリーグ戦（round_robin） + 夏代表の予選免除
pref: kanagawa
snapshot_year: 2025
region: kanto
districts: [川崎, 横浜北, 横浜南, 横須賀, 湘南, 西湘, 北相]  # 7地区（issue #725 で4地区集約から実名どおりの7地区へ）
district_assignment: geographic
regional_berths: 2
seed_exemption: true          # 夏の選手権代表校（横浜）を県大会へ推薦
stages:
  - name: 地区予選
    type: group_split
    groups: 7                 # 7地区（districts と同じ並び）
    grouping: geographic
    child:
      type: round_robin       # 地区の中を4校ブロックに分けて総当たり（夏の順位でシード分散・issue #772）
      teams_per_group: 4
      advance: 2              # 各ブロックの1位・2位が県大会へ（1地区約14校・7地区で約98校＋夏代表の推薦。監督決定 2026-11-03）
  - name: 県大会
    type: knockout
# 使用球場（設計書13-stadiums §2-2）: 準決勝・決勝=横浜スタジアム、序盤=市営級プールから抽選
stadiums:
  final: kanagawa_final
  early: [municipal_small_01, municipal_small_02]
notes:
  - 春と異なり秋は地区がリーグ戦形式
  - seed_exemptionの推薦校は県大会から登場
  - 地区予選は4校ブロックのリーグ戦（issue #772）。ブロックは夏の県大会の順位でシード分散（上位校が同じブロックに固まらない）。同率は勝数→直接対決→得失点差
