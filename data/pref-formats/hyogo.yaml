# confidence: verified
# 出典: hyogo-koyaren.or.jp, 高校野球ドットコム articles/7938, note「しんのG」
# 型見本: 地区予選＋敗者復活代表決定戦 + 夏甲子園校の予選免除
pref: hyogo
snapshot_year: 2025
region: kinki
districts: [神戸, 阪神, 播淡, 但丹, 東西播]   # 5地区（各地区内にA〜Fブロック）
district_assignment: geographic
regional_berths: 3            # 大阪・兵庫は毎年固定3
seed_exemption: true          # 夏甲子園出場の東洋大姫路を県大会推薦校に追加
stages:
  - name: 地区予選
    type: group_split
    groups: 5                 # 5地区
    grouping: geographic
    child:
      type: knockout          # 各地区内はブロックトーナメント
    advance_per_group: 8       # 各地区の上位8校（5地区×8＝40校＋夏代表の推薦。実在の55校より小規模なゲーム内校数に合わせた簡略化・issue #688）
    loser_bracket:
      enabled: true           # 各地区で敗者復活の代表決定戦
      advance: null
  - name: 県大会
    type: knockout
    entries: 41               # 地区予選40（5地区×8）＋ 推薦1（東洋大姫路）。実在は56
# 使用球場（設計書13-stadiums §2-2）: 準決勝・決勝=神戸総合運動公園、序盤=市営級プールから抽選
stadiums:
  final: hyogo_final
  early: [municipal_small_01, municipal_small_02]
notes:
  - 実在の県大会は56チーム＝地区予選勝ち上がり55＋夏甲子園校の推薦1（本ゲームは校数規模に合わせ41）
  - 各地区の県大会枠内訳と敗者復活の救い上げ数は要項PDFで確定
