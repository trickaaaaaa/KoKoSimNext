# confidence: verified
# 出典: kanaloco 1198920, kanagawa-baseball.com/fall/2025
# 型見本: 地区予選がリーグ戦（round_robin） + 夏代表の予選免除
pref: kanagawa
snapshot_year: 2025
region: kanto
# 実在の秋季地区予選は4地区のリーグ戦＝「川崎・横浜北」「横浜南・横須賀」「湘南・西湘」「北相」（2025年も同じ・計41ブロック・県大会80校。
# 出典 kanagawa-baseball.com/fall/2025）。ゲームは4地区の内訳を実名で分け、7地区として回す簡略化（issue #725・監督決定）。
districts: [川崎, 横浜北, 横浜南, 横須賀, 湘南, 西湘, 北相]  # 7地区
district_assignment: geographic
seed_exemption: true          # 夏の選手権代表校（横浜）を県大会へ推薦
stages:
  - name: 地区予選
    type: group_split
    groups: 7                 # 7地区（districts と同じ並び。実在は4地区＝上のコメント）
    grouping: geographic
    child:
      type: round_robin       # 地区の中を4校ブロックに分けて総当たり（夏の順位でシード分散・issue #772）
      teams_per_group: 4
      advance: 2              # 各ブロックの1位・2位が県大会へ（1地区約14校・7地区で約98校＋夏代表の推薦。監督決定 2026-11-03）
  - name: 県大会
    type: knockout
# 使用球場（設計書13-stadiums §2-2）: 準決勝・決勝=保土ケ谷球場（秋の会場・設計書13 §6.4）、序盤=市営級プールから抽選
stadiums:
  final: kanagawa_autumn_final
  early: [municipal_small_01, municipal_small_02]
notes:
  - 春と異なり秋は地区がリーグ戦形式
  - seed_exemptionの推薦校は県大会から登場
  - 地区予選は4校ブロックのリーグ戦（issue #772）。ブロックは夏の県大会の順位でシード分散（上位校が同じブロックに固まらない）。同率は勝数→直接対決→得失点差
