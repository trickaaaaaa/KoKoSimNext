# 画面に出す実在の大会名の表（issue #1319・docs/release/steam-roadmap.md 段階2）。
#
# 甲子園・センバツ・明治神宮大会などの実名を、商標の調べ次第で架空名へ一斉に替えるための表。
# **ここを書き換えるだけで、ゲーム内の大会名・イベント文が全部替わる**（Unity は起動時にこの表を読む）。
#
# - 既定値（engine の DisplayNames）は今の実名。DisplayNamesTests が「この表＝既定値」を固定しているので、
#   架空名に替えたら engine/KokoSim.Engine/Season/DisplayNames.cs の既定値も同じ値にそろえる（テストが赤で知らせる）。
#   既定値は表が読めないとき・engine 単体のテスト・Balance CLI でしか使わない＝ゲームの見た目はこの表で決まる。
# - イベント文（events.yaml）は {koshien} のように差し込み語で書く。「甲子園の土」のような場所としての使い方も
#   {koshien} なので、架空名は場所としても読める呼び名（例: 聖地）にする。
# - 球場名はここではなく data/stadiums.yaml（72球場の name）。
# - 書いてよいキーはこの一覧だけ（知らないキー・空の値は読み込みで止まる）。

koshien: 甲子園                                   # 夏の全国大会の通称。場所としても使う（甲子園出場・甲子園の土）
senbatsu: センバツ                                # 春の全国大会の通称
jingu: 明治神宮大会                               # 秋の全国大会
jingu_short: 神宮大会                             # 秋の全国大会の短い呼び名（「神宮大会まで」）
summer_official: 全国高等学校野球選手権大会       # 夏の全国大会の正式名（「2026年 〜」の見出し）
senbatsu_official: 選抜高等学校野球大会           # 春の全国大会の正式名
jingu_official: 明治神宮野球大会（高校の部）      # 秋の全国大会の正式名
pref_summer_prefix: 選手権                        # 夏の県大会の冠（「選手権神奈川大会」）
