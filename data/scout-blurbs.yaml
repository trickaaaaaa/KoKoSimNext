# スカウト候補の寸評（issue #867・design-04 §2.4）
#
# 候補1人につき、ノイズ入り4軸（打/守/走/投）の最大値から「軸」と「水準」（高/中/低）を選び、
# 対応する語彙から1文を決定論で引く（engine の ScoutModel.PickBlurb + ScoutBlurbPhrases）。
# 読むのは engine の純パーサ ScoutBlurbPhrasesParser（Unity は StreamingAssets 経由・テストは data/ を直接）。
#
# 対応する構文は preview-phrases.yaml と同じ部分集合: 全行コメント(#)・空行は無視／「名前:」が
# 置き場の始まり（phrases: は見出しなので読み飛ばす）／「- "文"」が候補（前後の " は外す）。
#
# 置き場: scout.blurb.<axis>.<bucket>
#   axis: batting(打撃) / mobility(走塁) / defense(守備) / pitching(投球)
#   bucket: high(60以上) / mid(40〜60) / low(40未満)
#
# 書いてはいけないこと（CLAUDE.md・issue #867）: 守備位置・投手適性（「本来は投手」「遊撃適性」等）。
# 隠し能力（才能上限・成長タイプ・怪物）。入部の見込み・パーセンテージ。

phrases:

  scout.blurb.batting.high:
    - "振りが鋭い。打球の伸びはこの世代屈指。"
    - "バットに当てる技術が高く、長打も出せる。"
    - "打席での勝負強さが光る。"
    - "思い切ったスイングから鋭い打球を飛ばす。"
    - "ミートもパワーも水準が高い。"

  scout.blurb.batting.mid:
    - "打撃はまだ粗さが残るが、素材は悪くない。"
    - "振りに力強さがある。これから技術が付いてくるか。"
    - "打席での我慢強さを磨けば伸びそうだ。"
    - "芯で捉える日と空振りする日の差が大きい。"

  scout.blurb.batting.low:
    - "打撃はまだこれからという段階。"
    - "バットコントロールに課題が残る。"
    - "打席での経験を積ませたい選手。"

  scout.blurb.mobility.high:
    - "走力は目を引く速さ。足を絡めた攻撃ができる。"
    - "塁間のスピードが際立つ。"
    - "走り出しの一歩が速い。"
    - "走塁のセンスの良さがうかがえる。"

  scout.blurb.mobility.mid:
    - "足はまずまず。使い方次第で武器になる。"
    - "走塁の判断は及第点。経験を積めば安定しそうだ。"
    - "スピードは平均的だが、無駄のない走り方をする。"

  scout.blurb.mobility.low:
    - "走力は上積みが欲しいところ。"
    - "足よりも他の部分で見せたい選手。"

  scout.blurb.defense.high:
    - "グラブさばきが柔らかく、守備範囲も広い。"
    - "守備の安定感は世代でも上位。"
    - "送球の正確さが際立つ。"
    - "軽快なフットワークで打球に食いつく。"

  scout.blurb.defense.mid:
    - "守備はまずまずの出来。経験を積めば安定しそうだ。"
    - "肩・グラブさばきともに水準並み。"
    - "基本的な捕球はできているが、送球に粗さが残る。"

  scout.blurb.defense.low:
    - "守備はまだ発展途上。"
    - "グラブさばきに不安が残る。"

  scout.blurb.pitching.high:
    - "腕の振りが鋭く、打者を押し込む投球をする。"
    - "テンポの良い投球でリズムを作れる。"
    - "球持ちが良く、ボールの出所が見えにくい。"
    - "投げっぷりの良さが光るタイプ。"

  scout.blurb.pitching.mid:
    - "投球はまずまずの出来。経験を積めば安定しそうだ。"
    - "まだ粗さは残るが、腕の振りは悪くない。"
    - "制球に波があるが、素材は悪くない。"

  scout.blurb.pitching.low:
    - "投球はまだこれからという段階。"
    - "腕の振りにぎこちなさが残る。"
