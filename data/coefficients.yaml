      - { cost: 30, defense_factor: 1.05 }       # ノックバット・防具一式
      - { cost: 70, defense_factor: 1.07 }       # 守備マシン
  - id: gear_baserunning
    name: 走塁の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 10, base_running_factor: 1.05 }  # ラダー・ミニハードル
      - { cost: 70, base_running_factor: 1.07 }  # タイム計測システム
  - id: gear_pitching
    name: 投手の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 15, pitching_factor: 1.05 }      # 重量球・練習球一式
      - { cost: 70, pitching_factor: 1.07 }      # スピードガン＋ブルペン整備

  # --- 備品（kind: gear）: 買い切り1段 ---
  - id: video             # ビデオ・分析機材: 気づきが増え、読み違えも減る
    name: ビデオ・分析機材
    kind: gear
    tiers:
      - {}
      - { cost: 50, insight_prob_factor: 1.5, insight_accuracy_add: 0.05 }

# --- 年契約（設計書04 §1.4a）: 毎年部費から払い、いつでも解約できる継続契約 ---
# 施設・練習道具（facilities:）が「買い切り・効果が累積」なのに対し、年契約は
# 「いま何段で契約しているか」だけが効く＝Lv2 の年額と効果は Lv1 を置き換える（累積しない）。
# tiers[0] は未契約（年額0・効果なし）。
#
# スカウト網 Lv1（30万/年・質への効果0）は career.scout_cost と同額。新規ゲームは全部未契約から始まる。
#
# 年額の決め方（2026-08-11 値上げ・監督決定）: 部費の差引は 35 + 0.8×信頼度 - 年額
# （収入 80+0.8×信頼度、合宿45万）なので、「その契約だけで赤字にならない最低信頼度」= (年額-35)/0.8。
# 改定前は Lv3 でも 18.8＝新任監督（信頼30）が初年度から全部契約でき、設計が謳う「どれを取るか」が
# 成立していなかった。改定後は スカウト網 Lv1=常に可 / Lv2=信頼56 / Lv3=信頼131（上限100超＝恒常維持
# できず、貯めた部費を切り崩して勝負の数年だけ張る）、専門コーチ 1人=信頼19 / 2人=信頼81 / 3人=不可。
# 全部を最上段にすると 140+20+50×3＝310万/年で、自由に使える上限（信頼100で115万）の約3倍。
contracts:
  - id: scouting
    name: スカウト網
    tiers:
      - {}
      # 効果1=新入生の質(scout_talent_add) / 効果2=入部予定者の事前開示精度(prospect_disclosure, #587)
      # 年額は「その契約だけで部費が赤字にならない最低信頼度 = (年額-35)/0.8」で決める（2026-08-11 値上げ）
      - { annual_cost: 30, scout_talent_add: 0, prospect_disclosure: 0.15 }    # 県内を回る（必要信頼度 -6＝常に可）
      - { annual_cost: 80, scout_talent_add: 3, prospect_disclosure: 0.45 }    # 近隣県まで（必要信頼度 56）
      - { annual_cost: 140, scout_talent_add: 6, prospect_disclosure: 0.75 }   # 全国に網を張る（必要信頼度 131＝恒常維持不能）
  - id: expedition
    name: 遠征
    tiers:
      - {}
      - { annual_cost: 20, out_of_prefecture_opponents: true }   # 県外の学校と練習試合が組める
  # 専門コーチ: 分野別指導力の実効値だけを底上げする（監督自身の指導力は変えない＝解約で元に戻る）
  - id: coach_batting
    name: 打撃コーチ
    tiers:
      - {}
      - { annual_cost: 50, coaching_batting_add: 10 }
  - id: coach_pitching
    name: 投手コーチ
    tiers:
      - {}
      - { annual_cost: 50, coaching_pitching_add: 10 }
  - id: coach_defense
    name: 守備走塁コーチ
    tiers:
      - {}
      - { annual_cost: 50, coaching_defense_add: 10 }

# --- 新入生生成（設計書04 §2.1・設計書01 §1.1b-c）: 名声→総合力→凸凹配分 ---
roster:
  intake_mean: 10.0
  intake_sd: 1.5
  intake_min: 8
  intake_max: 13
  # 投手適性→投手能力の創発（#174）: 生成時決め打ちを廃し投手も適性から創発させる。
  pitcher_aptitude_bias: 8.0       # 投手適性への供給バイアス（創発投手率を狙い値へ。帯校正で決める）
  pitcher_aptitude_weight_span: 6.0 # 投手寄せ重みwのロジスティック幅（小=二極化/大=なだらか）
  # 捕手供給の下限（#589・設計書04 §2.3）: 捕手として読める下限適性。50=適性補正が付かない点(×1.0)。
  # これ未満しか居ないコホートで最も惜しい1人をここまで引き上げる（実測発動率 0.122%）。
  catcher_aptitude_floor: 50.0
  # 総合力（名声由来。既定は一般校相当。名声接続後は talentCenter を上書き）
  talent_center_default: 32.0
  talent_sd: 8.0
  talent_min: 10.0
  talent_max: 90.0
  # 名声→talentCenterフィードバック（issue #127・設計書04 §2.1）: 監督の名声が高いほど良い新入生が集まる。
  # 上振れは指数飽和カーブ（線形→漸近）で頭打ち＝「勝つ→怪物→また勝つ」の暴走ループ防止が必須要件。
  # 2026-08-15（案D）: 8/30 → 50/50。旧値は Fame最大でも 32→40（E境界）で、自校の新入生は名声を極めても
  # AI C校（強度60）の新入生に届かず、自校がD以上へ行く経路が実質閉じていた。新値は名声20→48(E) / 40→59(D) /
  # 60→67(C) / 80→72(B) / 100→75(B。SD8なので上位個体はA)。頭打ち（span）は残す＝暴走防止の要件は維持。
  # 名声は fame_decay(0.80) で自己制限するので、勝ち続けないと中心も落ちる。
  fame_talent_center_span: 50.0
  fame_talent_center_tau: 50.0
  # ティア→能力の圧縮（issue #578・OPEN-QUESTIONS Q24 の確定2）。AI校の「強度→能力中心」だけを寝かせ、
  # 格差マッチの一方的さを緩める。#536 の実測では実力差10ポイントごとに得点が約0.4倍になっていた。
  # 自校（ProspectGenerator）は対象外なので、ピボットを平均帯(50)に置くと自校との差が縮まらず効果が出ない
  # ＝自校の実力域（≒35〜40）に置く。表示ランク（School.Strength）は圧縮しない（確定4＝表示は直さない）。
  tier_compression_pivot: 40.0
  # 2026-08-19（設計書21・案C）: 0.55 → 1.0（圧縮なし）。AI校だけを寝かせる圧縮は表示ランクと中身を乖離させるので撤去し、
  # 代わりに ability_effect:（表示→物理の効き）を全員対称に寝かせる＝raw が中身。式は比較・実験用に残す（slope=1・knee=100 は恒等）。
  tier_compression_slope: 1.0
  # 膝（issue prefecture-dominance・2026-08-18 で 60→100＝膝なし・一様圧縮）: 膝60は「上を100で元尺度へ戻す」勾配1.225で
  # 上位帯の差を raw より拡大し（80→75.5 / 65→57.1）、県1位 vs 2位（差15）が単試合 99%＝同じ校が毎年優勝する主因だった。
  # 一様0.55: 80vs75 63% / 80vs70 75% / 80vs65 86% / 80vs60 92% / 80vs50 98%（フルシム実測）。代償として強度85の校の
  # 能力中心は 64.75（表示A・中身B−）まで落ちる＝オーナー承認済み（表示ランクは raw のまま。展望の能力バーとは乖離する）。
  tier_compression_knee: 100.0

  # 凸凹配分（総ポイントをランダム重みで配分・偏り自体もばらつく＝金太郎飴回避）
  concentration_mean: 0.35    # 偏り強度σ。大きいほど内訳が凸凹
  concentration_sd: 0.15
  specialty_floor: 14         # 専門能力の下限（「できない」を作らない）
  off_specialty_factor: 0.55  # 専門外能力の中心係数（総合力×これ）。パワプロ型特化を禁止
  off_specialty_floor: 8
  # 投打の両立素質（#684）: 専用乱数 z2 がゲートを超えた分だけ専門外の中心係数(0.55)が上がる＝投打とも高い選手が
  # 分布の裾に出る。ゲート未満（大多数）は従来と同じ。corr は総合力との相関。
  dual_talent_corr: 0.3
  dual_talent_gate_z: 0.5
  dual_talent_ratio_slope: 0.30
  # 運動能力ベースライン（走力・地肩・スタミナ, §1.1b-2）。physical_mean は名声0（talentCenter=talent_center_default）
  # のときの中心。physical_talent_slope は talentCenter が上がったぶんの何割を身体系中心に乗せるか
  # （2026-08-15 案D: 0.75。0 なら旧来の名声独立）。SD は据え置き＝弱小校の俊足・強肩は残る。
  # 0 のままだと名声で入るB/Aの新入生が「打撃Aで走力E」になり、機動力・肩・球速の天井でチームがCで頭打ちになる。
  # AI校（StrengthTeamFactory）は身体系が強度連動なので、これで自校だけ天井が低い非対称が消える。
  physical_mean: 45.0
  physical_sd: 12.0
  physical_talent_slope: 0.75
  # スタミナLevel→目安投球数の変換（切片・傾き, 設計書02 §1.1e / issue #408）。#356の上限撤廃に伴い水準を引き上げ。
  # Lv10→70.5 / Lv45→96.75（生成平均）/ Lv50→100.5（D帯）/ Lv92→132（完投上限域）。傾きを 0.9→0.75 に寝かせて
  # 下限を持ち上げつつ上限が高校野球の完投域(120〜140)を外れないよう解いた。順変換・逆変換・生成が同じ定数で動く。
  stamina_pitches_intercept: 63.0
  stamina_pitches_per_level: 0.75
  # 精神力・統率傾向（設計書02 §3 / 09 §8。才能・身体と独立）
  # 実戦成長ループ接続（Q8・2026-07-20）: 「新入生は未熟（中心46）→3年間の実戦で開花」へ初期分布を引き下げ
  mental_mean: 46.0
  mental_sd: 12.0
  leadership_mean: 50.0
  leadership_sd: 15.0
  # 捕手リード（設計書01 §2①）: 野球脳(Mental)相関＋個体差。中心50不変で統計帯を保つ（不変条件#5）
  lead_mean: 46.0                # Q8: 未熟→捕手出場で伸びる時間アークへ引き下げ（旧50）
  lead_sd: 8.0
  lead_mental_corr: 0.30
  lead_cap_mental_corr: 0.15     # Q8(c): リードcapの野球脳相関（名捕手の天井）
  # AI校の精神力・統率・捕手リード（issue ai-school-mental-fixed-50, 2026-08-18）: 旧実装は全員50固定・主将なし。
  # 自校と同じ分布（mental_mean/sd・leadership_*・lead_*）を学校の強さ・校風・学年で寄せて引く（専用Fork＝他の能力ロール不変）
  ai_mental_strength_slope: 0.25   # 精神力中心 = mental_mean + (School.Strength − 50)×これ（圧縮前の強度。G≈40／D≈47／S≈56）
  ai_mental_per_grade: 4.0         # 進級ごとに精神力 +これ（3年で +8＝自校の実戦成長の平均像）
  ai_style_mental_bonus: 3.0       # 校風「守り勝つ」「全員野球」の精神・統率の上乗せ
  # AI校の打撃プロフィール（issue ai-roster-power-top-tier-all-sluggers, 2026-08-18）: 旧実装は全能力を同じ中心で独立に引き
  # 成長も一律なので B/A校は先発全員がスラッガーだった。パワーを希少側にしてミートへ振り替え（打撃指標不変）＋5能力の凸凹配分。
  ai_power_skew: 8.0               # パワー中心 −これ／ミート中心 +これ（.35C+.35P の打撃指標を保つ）
  ai_concentration: 0.15           # ミート/パワー/選球眼/守備/捕球の凸凹配分σ（総和不変。自校 concentration_mean 0.35 より控えめ）
  # AI校の上位集中＝スター型（issue prefecture-dominance-star, 2026-08-18）: ティア圧縮を一様に掛けると上位校のエースが平凡になる
  # （A校のエース最速 138km/h）。圧縮で削った分（raw−圧縮後）をエース＋主軸へ戻し、脇役は圧縮後の中心のまま＝現実の強豪の形。
  # チーム総合（6指標）は圧縮後の尺度に留める（Create は脇役を lift×cast_drop 下げる／永続ロスターは逆算配分が自動で寄せる）。
  ai_star_share: 1.0               # スターの上乗せの割合（1.0＝既定量／0＝スター無し）
  # 2026-08-19: 圧縮撤去に伴い lift の定義を「圧縮で削った分」から (強さ−40)×これ へ。raw 80 でエース/主軸 +10（Lv 90＝146km/h）
  ai_star_lift_per_point: 0.25
  ai_star_hitters: 3               # 使い捨て生成（Create）: 先発野手8人のうち主軸の人数
  ai_star_hitters_per_cohort: 1    # 永続ロスター: 1学年あたりの主軸打者（3学年で Create と同数）
  ai_star_pitchers_per_cohort: 1   # 永続ロスター: 1学年あたりのエース格（投手適性順）
  ai_star_cast_drop: 0.30          # 使い捨て生成: 脇役の中心を lift×これ 下げてチーム総合を圧縮後の尺度に留める（実測: 0.25で+0.7・0.35で−0.6）
  # 投打の利き（§1.1c）
  throw_left_prob: 0.12
  switch_prob: 0.03
  bat_left_given_right_throw: 0.40   # 右投→左打（右投左打を意図的に量産）
  bat_left_given_left_throw: 0.98    # 左投→ほぼ左打（左投右打は絶滅危惧種）
  # 投手球速 = 地肩 ＋ 投手センス（§1.1b-3。km/h校正は Slice 2D）
  pitcher_sense_bonus: 10.0
  non_pitcher_sense_factor: 0.45
  velocity_arm_weight: 0.5
  velocity_sense_weight: 0.5
  # 伸びしろ（分野別・凸凹, 現在値と独立, §5.1）
  growth_mean: 1.0
  growth_sd: 0.22
  growth_min: 0.5
  growth_max: 1.6
  late_growth_bonus: 0.15
  # 才能上限（凸凹）
  cap_gap_mean: 26.0
  cap_gap_sd: 10.0
  late_cap_bonus: 6.0         # 晩成の才能上限上方補正（設計書02 §5.2）
  # 能力別 才能上限gap圧縮（Issue #114）: 素質固定能力（足）は「伸びる速さ」だけでなく「天井」も近い＝両方きつく。
  # gap（mean/sd）に乗じる。既定1.0で従来一致。cap_gap_mean 26×0.4≈10（＝天井も近い）。逸材は免除。
  speed_cap_gap_factor: 0.4
  # 逸材（隠しフラグ, Issue #114 / Q20）の出現率。素質固定能力の cap 圧縮・trainability 減衰を免除
  # ＝規格外の俊足が稀に出る。既定0.0（逸材なし＝従来一致）。値はたたき台（要実測校正）。
  prodigy_prob: 0.02
  # 隠し属性「投手経歴」（野手の変化球上振れの素, §1.1b）
  pitcher_background_prob: 0.06
  # 変化球レパートリー（設計書02 §2.2）: 投手適性の連続量(RoleWeight)で本数が決まる 🟡
  pitcher_second_pitch_prob: 0.75
  pitcher_third_pitch_prob: 0.30
  fielder_breaking_prob: 0.35
  pitch_offset_sd: 8.0
  # 守備位置適性の初期分布（設計書01 §1.1, 創発モデル）: 本職は事前に決めず結果として定まる
  aptitude_base_mean: 50.0         # 守備地力の全体水準（高い個体は全ポジ器用になりうる）
  aptitude_base_sd: 14.0
  aptitude_group_affinity_sd: 12.0 # 系統(投/捕/内/外)ごとの向き不向き（独立に振る）
  aptitude_position_noise_sd: 6.0  # 各ポジ個別の個体差
  # 球質タイプ（設計書01 §1.1b / 02 §2）: 投手総合は変えず、球速・制球・スタミナ・キレの配分だけ振り替える。
  # これにより「球速＝投手の良さ」ではなくなり、同じ総合ランクに本格派と技巧派が併存する。
  # オフセットは「実際の試合の失点が型によらず揃う」よう実測で校正（式の加重和ではない）。
  # 実測の限界失点（baseLv68）: 球速 −0.015/Lv・制球 −0.057/Lv・キレ −0.009/Lv。
  # 球速を物理層へ接続して空振り価値を3倍にしたが、制球の失点価値は依然その約4倍あるため
  # 制球の振れ幅は±5程度が中立の上限。本格派は設計書02「球速とキレで押し込む」に沿ってキレを+へ戻した。
  archetype_power_share: 0.25        # 本格派
  archetype_finesse_share: 0.22      # 技巧派
  archetype_soft_toss_share: 0.08    # 軟投派（残りはバランス型）
  # #578 Step 3: 球速の価値が2倍になったので球速オフセットを寝かせて型の中立性を回復（12/−10/−14 → 8/−7/−10）。
  # 制球・スタミナ・キレでの代償は実測で効かない（軟投派は制球を上げると失点が増える＝打たせて取る型の宿命）。
  # 2026-08-16（issue matchup-gap-saturation-k-rate ＋ fatigue-gradual-before-threshold）: 投打差の soft-cap で高球速の
  # 空振り価値が頭打ちになり（本格派 3.01→3.85 失点）、消耗カーブで球速天井が目安の手前から落ちる（→4.08）ため、
  # 本格派の制球の代償を −12→−7 に寝かせて型の中立性を回復（実測400試合: バランス3.49／本格3.6前後／技巧3.29／軟投3.49）。
  # 投手総合の加重和では本格派が +1.5 ほど有利に見えるが、型の中立は「実戦の失点」で校正する（式の中立は循環論法）。
  # 2026-08-18（issue pitcher-barely-affects-contact-quality）: 投手の打球品質寄与を ×3 にしたので制球・キレの失点価値がさらに
  # 上がり、本格派 3.35 vs 技巧派 2.49（spread 0.86）に開いた。制球の振れ幅を縮め（本格 −7→−4・技巧 +6→+3）球速の振れ幅を
  # 広げ（本格 +8→+10・技巧 −7→−8・軟投 −10→−11）、キレを +2 で揃えて実戦中立へ（400試合: バランス2.97／本格2.99／技巧2.74／
  # 軟投2.79＝spread 0.26。守備依存 swing 本格 8.86 vs 技巧・軟投 9.27 で「打たせて取る＝守備依存」も維持）。
  archetype_power_velocity: 10
  archetype_power_control: -4
  archetype_power_stamina: -2
  archetype_power_pitch_rank: 2
  archetype_finesse_velocity: -8
  archetype_finesse_control: 3
  archetype_finesse_stamina: 1
  archetype_finesse_pitch_rank: 2
  # 軟投派の上乗せは 2026-07-21（Issue #24）に再校正。打球の塁打数を転がり込みの幾何で
  # 決めるようにした結果、打球初速の低さ（＝転がらない＝長打になりにくい）が以前より価値を持ち、
  # 軟投派だけ失点が下がった（実測 3.65 vs 技巧派 3.96）。キレ+5→+3・制球+4→+3 で実戦中立へ戻す
  # （Archetypes_AreBalanceNeutral_InActualGames）。
  archetype_soft_toss_velocity: -11
  archetype_soft_toss_control: 2
  archetype_soft_toss_stamina: 2
  archetype_soft_toss_pitch_rank: 2
  # 旧フィールド（後方互換）
  init_level_mean: 32.0
  init_level_sd: 8.0
  # 打順編成＋DH使用判断（issue #54, 設計書11 §4「オーダー編成」）。自校・AI校で共有する。
  # 1番=出塁力＋走力、2番=小技・ミート、中軸=打撃総合（最強打者は4番）、6番以降=残りを打撃総合順。
  lineup_leadoff_discipline_weight: 0.45
  lineup_leadoff_contact_weight: 0.30
  lineup_leadoff_speed_weight: 0.25
  lineup_second_contact_weight: 0.55
  lineup_second_bunt_weight: 0.45
  lineup_overall_contact_weight: 0.5
  lineup_overall_power_weight: 0.5
  # DH使用判断: 投手の打撃総合（ミート＋パワー）が野手平均よりこれ以上低ければDHを使う。
  lineup_dh_pitcher_batting_gap: 15.0
  # 投手の打順（issue #360）: 打撃総合が「野手平均＋この差分」以上の打撃型エースだけ野手と同じ
  # 土俵で並べる（未満は9番固定）。0.0=野手平均以上でだけ上位打順に入る。
  lineup_pitcher_batting_order_gap: 0.0

# ===== AI校の永続ロスター（設計書 OPEN-QUESTIONS Q19/Q20 · #80/#82）=====
# 他校の選手個人が入学〜引退の3年間在籍し節目成長する（使い捨て生成を廃止）。怪物（Phenom）も同居。
# バランス調整はこのセクションで行う（不変条件#4）。
persistent_roster:
  # 学年編成（Issue #384）: 「野手8人＋投手プール」の固定編成を廃し、同じ生成器を通した N 人にした。
  # 誰がどこを守り誰がマウンドに立つかは適性と能力から毎回選抜する（選手は配置を持たない）。
  # 投手適性のバイアスは自校と共通（roster.pitcher_aptitude_bias）＝AI校だけ別の下駄を履かせない。
  cohort_size: 11                # 1学年の人数（旧編成の実測 8＋約2.9人 に合わせた値）
  pitcher_count_floor: 1         # マウンドに立てる人数の下限（0人化を構造的に防ぐ）
  # 二刀流運用（issue ai-two-way-hitting-pitchers-start-as-fielders）: 守備8枠の割当重み＝実効守備力＋打撃総合×これ。
  # 0 なら従来どおり守備だけで先発を選ぶ。打撃は候補ごとの定数なので「誰を出すか」にだけ効き、枠の割り振りには効かない。
  field_slot_batting_weight: 2.0
  freshman_gap: 8.0             # 新入生の能力中心 = Strength − これ（未熟スタート・3年で開花）
  fame_recruit_weight: 0.04     # 名声由来の入学時上振れ（(Fame−50)×これ）
  annual_growth: 6.0            # 逆算配分のベースライン年間成長素点
  senior_growth_factor: 0.75    # 3年（引退間際）の成長係数（0.4→0.75 2026-08-18: 逆算配分の伸びが2年に集中して2年>3年が6〜8割の校で起きていた）
  target_tolerance: 3.0         # 逆算配分の許容誤差（翌夏チーム総合 vs 進化後Strength）
  max_residual_per_node: 4.0    # 逆算残差補正の1節目あたり上限
  # 年3節目の分割比（夏大会後 / 秋大会後 / 冬明け）。合計1.0。
  summer_node_share: 0.34
  autumn_node_share: 0.33
  winter_node_share: 0.33
  # 怪物（Phenom）: 全4000校一様・名声重み無し（Q20 §2）。出現率・型比・能力帯はここで調整。
  phenom_spike_rate_per_school_year: 0.00038      # 尖り型 ≒ 全国 期待1.5人/年（年1〜2人/全国, Q20 §3）
  phenom_all_round_rate_per_school_year: 0.00008  # 総合型 ≒ 全国 期待0.32人/年（数年に1人）
  phenom_ace_weight: 1.0        # 剛腕（球速S＋キレ/スタミナ）
  phenom_finesse_weight: 1.0    # 超技巧（制球S＋キレ）
  phenom_slugger_weight: 1.0    # スラッガー（パワーS＋ミート/弾道）
  phenom_speedster_weight: 1.0  # 韋駄天（走力S＋ミート/盗塁/走塁）
  phenom_strong_arm_weight: 1.0 # 鉄砲肩（肩S＋守備/捕球）
  phenom_main_min: 90           # 主軸能力の帯（S帯）
  phenom_main_max: 99
  phenom_support_min: 70        # 支持能力の底上げ帯
  phenom_support_max: 82
  phenom_all_round_min: 82      # 総合型の主要能力帯（S級）
  phenom_all_round_max: 95
