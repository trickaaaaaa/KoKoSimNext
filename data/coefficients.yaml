  pro_ob_visit_fame_slope: 0.001
  pro_ob_visit_boost: 2.0
  mentor_prob: 0.02
  mentor_boost: 2.0
  cap: 99.0

# --- 育成（練習→能力, 設計書02 §5.1） ---
training:
  # 2026-08-15: 85→130（案D）。旧値では中核能力+4〜5/3年で「新入生の質＝チームの質」になりすぎた。
  base_main_exp: 130.0
  sub_factor: 0.4
  facility_coef: 1.0          # 施設レベル0（施設なし）の基準施設係数。facility_tiers で上位を注入（#115）
  # 基準指導力（中立点, #115）。監督メタ（分野別指導力）を注入しないときの既定＝この指導力で従来と1ビット一致。
  # 監督指導力を注入すると 投手系←Coaching.Pitching / 守備・走塁系←Coaching.Defense / 打撃系←Coaching.Batting で駆動。
  coaching_level: 20.0
  coaching_slope: 0.005       # 1+指導力×slope×素直さ。名将(指導力90)→factor≈1.45（設計書02）
  # 個別指導3枠（#126・#693・OPEN-QUESTIONS Q7(a)）: 指名選手の主効果expだけに掛かる追加倍率。
  # 追加倍率=base_multiplier+(coachingFactor比−1)×bonus_scale（下限1.0）。指名なしなら1.0で従来一致。
  # 旧式は base 無し（=1）で、新任監督（指導力20＝中立点）では指名しても倍率ちょうど1.0だった（#693）。
  # 2026-10-28 監督決定: 新任でも×1.5、名将（指導力90）で×2.5程度。
  individual_coaching_slots: 3
  individual_coaching_base_multiplier: 1.5
  individual_coaching_bonus_scale: 3.0
  # 効果3「信頼関係」（#702・設計書03 §3.3）: 指名中の週ごとに精神力へ足すexp（成長段階・練習倍率は掛けない）。
  # 必要expは能力と同じ曲線（精神力55で約865）。2026-10-31 監督決定「1年指名し続けて+5相当」。
  individual_coaching_mental_exp: 90.0
  # 施設レベル→(係数, 週練習時間[分])（#115・設計書03 §4 / 04）。index=施設レベル。Lv0=現状(1.0/300)で従来一致。
  # 資金/名声からレベルを上げる接続は将来（OPEN-QUESTIONS Q6）。現状は SeasonContext.FacilityLevel の注入口のみ。
  # 「豪腕素質×名将＋フル施設(Lv4)で3年+15〜20km/h」が成立するよう据える（out/overnight/issue-115 で実測）。
  facility_tiers:
    - { coef: 1.00, budget_minutes: 300 }   # Lv0 施設なし（現状・従来一致）
    - { coef: 1.35, budget_minutes: 400 }   # Lv1
    - { coef: 1.70, budget_minutes: 500 }   # Lv2
    - { coef: 2.05, budget_minutes: 600 }   # Lv3
    - { coef: 2.40, budget_minutes: 700 }   # Lv4 フル施設（名門・強豪）
  level_up_base: 100.0        # 必要exp = base × growth^level
  # 2026-08-15: 1.05→1.04（案D）。1.05だと Lv70台の必要expがLv32の7.8倍で成長がほぼ止まり、名声で入る
  # B/Aの新入生が「入学時が完成形」になる。1.04で Lv74 でも3年+2〜3（施設フルで+10）。
  level_up_growth: 1.04
  aptitude_required_exp_factor: 0.6   # 守備位置適性は能力より緩い必要exp（<1.0で速く伸びる, 守備適性 未決1）
  # 能力別 trainability（伸ばしやすさ, Issue #114）: 能力の素質の形（内在特性）。exp加算時に乗算する。
  # GrowthMultiplier（分野別の伸びしろ・個体差）や環境倍率（監督指導力・施設 #115）とは直交する。
  # 既定は全1.0で従来と1ビットも変わらない。未指定の能力は1.0。
  # 方針（会話 2026-07-22）: 足=素質固定でフラット／技術系=相対的に伸びやすい／球速=1.0固定（環境が担う）／弾道=触らない。
  # 値はたたき台（要統計回帰校正・出力レポートは out/overnight/issue-114/）。
  trainability:
    speed: 0.4            # 足＝素質固定。ほぼ伸びない（足の速い子／遅い子の手触り）
    # 技術で決まる能力＝相対的に伸びやすい
    fielding: 1.25
    catching: 1.25
    throw_accuracy: 1.25
    discipline: 1.20
    control: 1.20
    pitch_rank: 1.20
    bunt: 1.30
    contact: 1.15
    # 以下は現状維持（1.0固定・明示）: 肩/球速/スタミナ/パワー/盗塁/走塁判断/弾道
    arm_strength: 1.0
    velocity: 1.0        # 球速は素質で伸ばさない。「+20km/h」は環境倍率が担う（#115）
    stamina: 1.0
    power: 1.0
    steal: 1.0
    baserunning: 1.0
    launch_tendency: 1.0 # 型属性（触らない）
  summer_camp_mult: 2.0       # 設計書04 §4
  winter_camp_mult: 2.5
  tournament_practice_mult: 0.5   # 大会モード中は練習効果が落ちる（設計書03/05）。<1.0で低下
  # 練習時間配分（設計書03 §3.1）: 基準週=1メニュー満額の基準、default_budget=施設0の週練習時間
  reference_week_minutes: 300
  default_budget_minutes: 300  # 照明/寮などの施設導入で増やす（設計書03 §4, 今回は口だけ）
  # 実戦成長（設計書02 §5.3a, Q8・2026-07-20）: 精神力/走塁判断/捕手リードは試合出場でのみ伸びる。
  # 1試合出場あたりのexp（成長段階係数を乗算）。必要expは能力値と同じ曲線（100×level_up_growth^v）🟡
  match_mental_exp: 260.0
  match_lead_exp: 400.0        # 捕手として出場した試合のみ
  match_baserunning_exp: 300.0

# --- 全国（架空校生成・AI校進化, 設計書05） ---
# --- チーム総合力6指標（設計決定 2026-07-18）: 打撃/投手/守備/機動/選手層/精神の加重平均 ---
# たたき台の重み。総合を加重平均へ切替（実装③）時に統計回帰で再校正する。
team_strength:
  # 6指標→総合（投手力が王様）。総和は Compute 側で正規化する。
  pitching_weight: 0.28
  batting_weight: 0.24
  defense_weight: 0.18
  depth_weight: 0.12
  mobility_weight: 0.10
  mental_weight: 0.08
  # 打撃合成（1野手, 合計1.0）
  contact_weight: 0.35
  power_weight: 0.35
  launch_weight: 0.15
  discipline_weight: 0.15
  # 投手合成（1投手, 合計1.0）
  velocity_weight: 0.40
  control_weight: 0.25
  stamina_weight: 0.15
  pitch_rank_weight: 0.20
  # 守備合成（1野手, 合計1.0）
  fielding_weight: 0.40
  catching_weight: 0.30
  arm_weight: 0.30
  # 機動力合成（1野手, 合計1.0）
  speed_weight: 0.70
  steal_weight: 0.30
  # 投手力: エース偏重（ace/2番手/3番手以降平均, 合計1.0）
  ace_weight: 0.50
  second_pitcher_weight: 0.30
  rest_pitcher_weight: 0.20
  # 選手層: 控え野手平均＋2枚目以降投手（合計1.0）
  bench_batter_weight: 0.60
  backup_pitcher_weight: 0.40
  lineup_size: 9
  bench_sample_size: 6
  # 総合のリーグ標準化（③）: 6指標加重平均(raw)を旧AverageLevel/AI校Strength尺度へ写す線形較正。
  # 実測フィット（TeamOverallCalibrationTests, 残差<0.6）。表示・シードとも同一値になる。
  overall_scale: 1.037
  overall_offset: -6.6

nation:
  strength_mean: 44.0
  # 母集団のσ（issue prefecture-high-rank-distribution・2026-09-05）: 13→15。
  # 13 だと 80 が +2.8σ ＝ 全国4000校でAランク以上が 13校（0.33%）しか出ず、校数最多の神奈川ですら
  # 期待 0.66 校・「Aが1校もない年」が 49%。校数と高ランク数の相関自体は 0.99 と強いのに、
  # ランク帯（Tiers.FromStrength）に対して母集団が低すぎて県差が表示に出ていなかった。
  # 15 で 全国A 37校／神奈川 期待 2.0校・P(A≥2) 57%。県1位vs2位の勝率は 0.649→0.666 でほぼ動かない
  # （σを広げると1位も2位も一緒に上がるため）＝ nation_dominance 帯 0.55–0.78 の内側。
  # 17 まで上げると全国Sが 15.7 で NationTests の S≤15 に触るので 15〜16 が上限。
  strength_sd: 15.0
  strength_min: 8.0
  strength_max: 99.0
  storied_fame_bonus: 20.0
  # 古豪の強さボーナス（issue prefecture-dominance・2026-08-18）: 8→4。8だと県1位−2位の差が最大22ポイントに開き
  # （宮崎 seed2026 は 81.8 vs 65.6）、その県は生成時点で一強が確定していた。
  storied_strength_bonus: 4.0
  emerging_fame_penalty: -5.0
  # 強さ差→勝率のロジスティック尺度。フルシム（実ゲーム経路＝永続ロスター同士）へ校正: 4.0→7.2（2026-08-19・設計書21）。
  # 圧縮撤去＋効き ability_effect ≈0.55 の世界で 差5→63%／10→77〜84%／15→88%／20→95%／30→99% を fit すると 6〜9（平均 7.1）。
  # 旧 4.0 は圧縮0.55の差で引いていた（＝raw 差なら 4/0.55≈7.3）ので、実質据え置き。Heavy AggregateModel_MatchesGameEngineWinRate が固定する。
  aggregate_scale: 7.2
  # 年次進化（issue prefecture-dominance・2026-08-18）: 旧 rev 0.10 / churn 5.5 / per_win 0.12 だと強さ82の校の期待ドリフトが
  # −2/年＝一度覇権を取った校が10年近く落ちず、集計20年×49地区で最多優勝校の中央値 9/20・10回以上が15地区。
  # rev 0.15 / churn 6.5 / per_win 0.06 で中央値 5〜7/20・10回以上 4〜7地区（現実の県の分布に近い）。
  # 定常sd＝churn/√(1−(1−rev)²)＝churn/0.527 なので、churn_sd は strength_sd と必ずセットで動かす。
  # 片方だけ変えると進化が初期σを打ち消す＝「新規ゲームは正しいが数年で元へ戻る」という気づきにくい壊れ方をする
  # （実測: sd15・churn6.5 据え置きだと 10年後に sd 13.0・全国A 13.5 へ回帰した。2026-09-05）。
  # sd 15 に対して churn 7.9（=15×0.527）。実測: 10年後 sd 15.3・全国A 44.9・神奈川A 2.30 で保つ。
  mean_reversion: 0.15        # 平均回帰（全国統計の安定化）
  churn_sd: 7.9               # 世代交代の揺らぎ（勢力変動）。定常sd≈初期sdを保つ（strength_sd 連動）
  strength_per_win: 0.06
  fame_to_strength: 0.015
  fame_decay: 0.90
  fame_champion: 40.0
  fame_per_win: 2.5

# --- 大会モード日程（設計書03/05, 抽象日カウント） ---
tournament:
  # 大会日程（issue #583）。ラウンド番号でなく「残りラウンド数」で引く＝ラウンド数は県の出場校数で
  # 5〜9と変わるのに対し、決勝・準決勝・準々決勝は決勝から数えた位置で決まるため。
  # 既定（A案）で8ラウンド県は全18日・5ラウンド県は9日。試合日は AceRestSelector の温存抽選シードに
  # 入るので**帯に効く**（旧 round_gap_days=2 の等差は本 issue が置き換え。OPEN-QUESTIONS Q23）。
  first_round_day: 1                # 開幕(0日目)から初戦までの日数
  early_round_spread_days: 3        # 序盤ラウンドのカードを分散させる日数（1回戦は1日で消化しきれない）
  middle_round_spread_days: 2       # 中盤ラウンドの分散日数
  late_round_spread_days: 1         # 準々決勝以降は同日開催
  early_rounds_threshold: 6         # 残りこのラウンド数以上を序盤とする
  late_rounds_threshold: 3          # 残りこのラウンド数以下を終盤とする（準々決勝・準決勝・決勝）
  rest_days_after_quarterfinal: 1   # 準々決勝の後の休養日
  rest_days_after_semifinal: 1      # 準決勝の後の休養日
  # 実開幕月日（表示専用）。週暦は50週×7日＝350日で実暦と一致しないので、大会期間だけ実カレンダーで数える。
  summer_open_month: 7
  summer_open_day: 10
  autumn_open_month: 9
  autumn_open_day: 12
  # 夏の甲子園（設計書05 §1.1）。暦の週では始まらず夏の県大会の後始末から直接つなぐので、
  # ここは「表示する実月日」だけを決める（週インデックスとは独立）。
  koshien_open_month: 8
  koshien_open_day: 6
  # 秋季地区大会・明治神宮大会・春のセンバツ本戦（設計書05 §1.5b）。地区大会・神宮大会は
  # 前段の後始末から即座連鎖、センバツ本戦は選考発表週から即座連鎖＝ここも表示専用。
  regional_open_month: 10
  regional_open_day: 18
  jingu_open_month: 11
  jingu_open_day: 15
  senbatsu_open_month: 3
  senbatsu_open_day: 19

# --- 記録室の規定（issue #600・設計書06 §3.9） ---
# 高校野球は試合数が少なく、閾値が無いと「1打数1安打＝打率1.000」が校歴代1位に出る。
# NPB と同じくチーム試合数に比例させる（絶対値だと大会が短い年と長い年で意味が変わる）。
# 基準のチーム試合数は「選手の最大出場試合数」で代用する（チーム試合数のカウンタが無いため）。
