# 表示層→物理層の変換係数（不変条件#1: 変換式はここに集約）。
# バランス調整はこのファイルの編集で行い、C# は書き換えない（不変条件#4）。
# 読込は KokoSim.Config が担い、純エンジンへ型付きオブジェクトとして注入する（不変条件#3: エンジンはIOを持たない）。

version: 1

# --- 空力・物理定数（弾道積分の係数, 設計書01 §2⑥） ---
aerodynamics:
  ball_mass_kg: 0.145
  ball_radius_m: 0.0365
  air_density: 1.225
  gravity: 9.81
  drag_coefficient: 0.35
  # 揚力係数 Cl = min(lift_coefficient_per_spin_factor × S, max_lift_coefficient), S = r|ω|/|v|
  lift_coefficient_per_spin_factor: 0.80
  max_lift_coefficient: 0.35

# --- マウンド幾何 ---
mound:
  # リリース〜本塁の実効距離[m]（18.44m − エクステンション約1.7m）
  release_to_plate_distance_m: 16.74

# --- 投球（表示層→物理層, 設計書02 §1.2） ---
pitching:
  # コントロール → 投球散布σ[cm]: σ = intercept − C×slope（例: C50→19cm, C100→8cm）
  control_to_sigma:
    intercept_cm: 30.0
    slope_cm_per_point: 0.22
    min_sigma_cm: 2.0
  # 死球（HBP, design-14 未決F・2026-07-20）: 散布結果が体側ウィンドウ（X負側・高さ帯）へ入り
  # 回避に失敗した球。打者の立ち位置はX負側固定（左右打者の区別は現モデルに無い）🟡
  hbp_body_edge_m: 0.45          # 体側ウィンドウの内縁|X|[m]（ゾーン半幅0.216+ボックス余白）
  hbp_body_bottom_m: 0.20        # 下端[m]（これ未満はワンバウンド＝ボール）
  hbp_body_top_m: 1.60           # 上端[m]（これ超は頭上抜け＝ボール）
  hbp_dodge_prob: 0.85           # ウィンドウ内の球を打者が避けられる確率
  # 毎球の球速ばらつき（設計書02 §1.1d）: 最速=天井、常時は−3〜5km/h、たまに最速付近 🟡
  velocity_drop_mean_kmh: 4.0
  velocity_drop_sigma_kmh: 1.8
  velocity_drop_max_kmh: 10.0
  # 配球（Phase 簡略。設計書09で采配・慣れ §2.3b に接続）
  straight_share: 0.55
  catcher_lead_stuff_per_point: 0.004   # 捕手リード→球威（設計書01 §2①）。(Lead−50)×これ。50=恒等
  lead_straight_share_max_shift: 0.10   # 捕手リード→配球のストレート比率シフト上限（符号あり・catcher_lead_stuff_per_pointと同じ対称設計）。(Lead−50)×投手の軸差(FB球威 vs 変化球キレ平均)で最大この幅。Lead50/軸互角は恒等
  lead_pitch_weight_max_exponent: 1.0   # 捕手リード→変化球の選び分け強さ上限。weight=Rank^exponent（exponent=leadFactor×これ、符号あり）。Lead50/変化球1本以下は一様抽選のまま
  # 回転数マッピング（設計書15 §0.1 Q12-5, Phase B観測専用の暫定式。判定には未接続＝帯に無関係）
  # Issue #274: 球種分岐。ストレート=球威(Power)軸、変化球=キレ(Sharpness)軸。
  spin_rpm_base: 2200.0            # 基準回転数[rpm]（能力=50のとき・145km/h・2200rpm）
  spin_rpm_per_power: 6.0          # ストレート: 球威(Power−50)あたりの傾き[rpm/能力1]（Issue #274）
  spin_rpm_per_sharpness: 6.0      # 変化球: キレ(Sharpness−50)あたりの傾き[rpm/能力1]
  # 投手ギア「飛ばす/流す」（設計書02 §1.1f）🟡
  gear_push_velocity_bonus_kmh: 2.0
  gear_push_stamina_factor: 1.6
  gear_coast_velocity_penalty_kmh: 2.5
  gear_coast_stamina_factor: 0.7

# --- 表示能力→物理層の効き（設計書21・issue prefecture-dominance-physics, 2026-08-19） ---
# エンジンは「チーム全体が10Lv上＝勝率90%」と急で、AI校だけを生成で寝かせる圧縮（roster.tier_compression_*）は表示ランクと中身を
# 乖離させた。代わりに表示→物理の境界（Player.ToBatter/ToFielder・AbilityEffectCoefficients.Pitcher・PitchPlan.ReactionVelocityKmh）で
# 全員対称に effective = pivot + scale×(Lv−pivot) を掛ける。表示Lv・最速km/h・目安球数・3D表現は変えず、動くのは「Lv1あたりの結果の差」だけ。
# 正典はこの1ブロック。ローダが batting/fielding/baserunning の3ブロックへ同じ値を配る（食い違いは AbilityEffectConsistencyTests）。
# 実測（永続ロスター同士＝実ゲーム経路・スター lift 0.25・300試合×2方向）:
#   全部1.0: 80vs75 74.5%／80vs70 86%／80vs65 96%／60vs50 94%（10Lv差≈90%＝急すぎ）
#   投手1.0/打撃0.5/守備0.4/走力0.5: 65／78／89／85 だが 80vs80 が 1.3−1.3 の投手戦（投手だけ素の効きだと強豪戦が全部投手戦）
#   全員一律 0.55（守備0.45）: 65／82／88／81、80vs80 2.4−2.4 → 案A採用（オーナー決定 2026-08-19）。エースの突出はスター（roster.ai_star_*）で。
ability_effect:
  pivot: 50.0
  batting_scale: 0.55    # ミート/パワー/選球眼/バント
  fielding_scale: 0.45   # 守備/捕球/肩/送球（守備+10 の得点価値が打撃+10 より大きいので少し深く）
  running_scale: 0.55    # 走力/盗塁/走塁
  # 投手（制球/キレ/球威ランク/捕手リード）と球速の反応。球速は km/h が画面に出るので実球速は変えず、打者の反応
  # （球威・タイミング・打球質・バント難度）に使う反応球速だけを Lv50=132km/h 軸で寝かせる。スタミナ（目安球数）も据え置き。
  # 案A（オーナー決定 2026-08-19）: 投手を寝かせないと 80vs80 が 1.3−1.3 の投手戦（実測）。全員一律≈0.55 で 2.4−2.4。
  pitching_scale: 0.55

# --- 打撃（打席解決の確率・物理変換, Phase 1 統計回帰で調整済み） ---
# league-average 母集団で AVG≈.265 / K%≈19.6 / BB%≈8.6 / HR%≈3.1 に収まる初期値。
batting:
  aim_sigma_x_m: 0.10            # 投手の狙い散布σ（横）
  aim_sigma_y_m: 0.155           # 投手の狙い散布σ（縦）
  aim_spread_control_slope_per_point: 0.008  # 制球の高い投手ほど隅を狙う・低い投手は真ん中を狙う＝狙い散布σ×max(0.5, 1+これ×(Control−50))。C50で恒等（issue walk-rate-floor-vs-elite-pitcher）
  zone_swing_base: 0.68          # ゾーン内スイング率
  chase_base: 0.28               # ゾーン外追いかけ率
  chase_discipline_slope: 0.0045 # 選球眼→追いかけ抑制
  zone_swing_discipline_slope: 0.0015
  # 誘発変化合成量[m]（設計書15 Phase E-3）: ゾーン外+/ゾーン内−の対称係数（見え方と実軌道のズレの代理指標）
  chase_break_slope: 0.02
  chase_distance_slope: 0.15    # ゾーン外距離あたりのチェイス減衰（大外れが変化量だけで釣れる不自然を防ぐガード）
  # ゾーン内の縁への近さ（StrikeZone.EdgeProximity, 中心0〜縁上1）あたりのスイング率減衰（issue #403 案B）。
  # 「隅のいい球は見逃されやすい」。投手は隅を狙うため 0.02 でも見逃しKが増える＝atbat_10k 帯を再校正済み
  # （strikeout_rate 天井 0.220→0.230 / batting_average 床 0.240→0.235。実測は issue #403 のコメント参照）。
  zone_edge_swing_penalty: 0.02
  # カウント依存のスイング判断（設計書01 §2③「カウントで判定」、見逃し三振率の調査 第2便）。BatterDecisionは
  # カウントを一切見ない構造だったため、見逃し三振が全三振の6割超・3-0でのスイング率が45%（実野球はおよそ
  # 5〜7%）だった。旧 tactics.pitch_tactics_two_strike_force_swing_prob / pitch_tactics_three_zero_take_prob
  # （Brain依存の外付けパッチ）を無効化し、本則側へ統合。実測（10000打席×seed42/7/2024）: 見逃しK割合
  # 60%→14.5-16.6%（atbat_10k）/ 17.4-17.7%（games_10k_tactics）、3-0スイング率45%→7.0%（in-zone 10.2% /
  # 追いかけ 3.8%）。副作用でK%が下がるため atbat_10k/games_10k_tactics の strikeout_rate 床を再校正
  # （balance-targets.yaml 参照）。walk_rate/home_run_rate/slugging/2B/3B/2B÷HR/得点/失策/games_10kの
  # 全指標は帯内のまま非破壊。
  two_strike_swing_boost: 0.28
  three_zero_swing_factor: 0.15
  # 初球のスイング倍率・2ストライク後のファール加算（issue #683。早打ち是正）。値は実測で校正する。
  first_pitch_swing_factor: 0.65    # 初球の様子見・ゾーン内のみ（初球スイング率 46%→約34%）
  early_count_swing_factor: 0.82    # 0-1/1-0/1-1等も少し見る・ゾーン内のみ（打席あたり 3.26→約3.6球）
  two_strike_foul_bonus: 0.10     # 追い込まれてからファールで粘る（打席あたりファール 0.61→約0.68本）
  whiff_intercept: -2.52         # 空振り対数オッズ基準（Phase E-2で弾道由来モデルへ再校正。#578 で −2.40→−2.52＝stuff_per_kmh 倍化の平均中立化）
  whiff_contact_slope: 0.030     # ミート→空振り減
  whiff_out_of_zone_penalty: 0.85
  # 誘発変化合成量[m]（設計書15 Phase E-2）あたりの空振り加算。旧stuff_per_pitch_rank（球種ランク直参照）は
  # Sharpness→rpm→変化量の経路で弾道へ織り込み済みのため完全置換（二重計上回避）。校正ノブ。
  whiff_break_slope: 1.5
  # 投打差（球威−ミート項）の対数オッズ寄与の soft-cap（issue matchup-gap-saturation-k-rate）: cap×tanh(d/cap)。
  # 互角近傍は線形のまま、大差で ±cap に飽和＝A投手が格下打線から平均24三振を取るのを止める。0以下＝無効（従来の線形）。
  whiff_matchup_cap: 1.5
  # 打者の「慣れ」（設計書02 §2.3b・issue times-through-order-familiarity）: 同一投手との試合内対戦回数（打席）が
  # 増えるほど空振り対数オッズと追いかけ率が控えめに下がる。継投でその投手に対して0から。変化量が大きい球ほど割引
  # （1 − break_discount_per_m × 変化量[m]・下限0）。1打席シム（atbat_10k）は対戦回数0＝不変。
  familiarity_whiff_per_pa: 0.08
  familiarity_chase_per_pa: 0.008
  familiarity_max_pa: 3
  familiarity_break_discount_per_m: 1.2
  foul_share: 0.35               # コンタクト中のファウル割合（方位角±45°超の幾何ファウルは別枠, issue #262）
  # 球速→球威。基準はリーグ平均投手の平均リリース球速（最速132 − 平均ドロップ4）に置き、
  # 傾きは「球速1レベル ≈ ミート1レベル」になるよう 0.030 ÷ 0.47(km/h per level) ≈ 0.064 とする。
  # ⚠ 0.47 は Lv≦50 の傾き。Lv>50 は 0.36（issue velocity-kmh-mapping-flatten-top, 2026-08-18）＝上位では
  # 「球速Lv1 ≈ ミート約1.5Lv」に下がる（物理は km/h で効かせたまま。上位ティアの最速表示を現実に寄せた分の意図した副作用）。
  stuff_base_velocity_kmh: 128.0
  # issue #578 Step 2（オーナー方針 Q24-1「球速のバリューはもう少し高くてよい」）: 0.064→0.128 ＝
  # 球速1レベルの空振り価値をミート1レベル相当から**2レベル相当**へ倍化する。校正前は「制球の失点価値は
  # 球速の約4倍」だったのを2倍まで詰める。平均三振率は whiff_intercept 側（−2.40→−2.52）で据え置き＝
  # 動くのは球速の配分だけ（atbat_10k の K% 帯は 21.7/22.6/22.7 で校正前と同値・帯不変）。
  stuff_per_kmh: 0.128
  # 打球初速上限 = 切片 + パワー×傾き [km/h]。P50=166 を固定して上位を寝かせた（旧 125+0.82P は P90 で 199＝
  # MLB全史最速級・B/A校の試合が 5〜10 本塁打/試合。issue homerun-rate-explodes-at-high-power, 2026-08-18）。
  exit_velo_intercept_kmh: 141.0 # 打球初速上限の切片（P30 156／P70 176／P90 186）
  exit_velo_per_power: 0.50      # パワー1あたり初速上限
  quality_mean: 0.63             # コンタクト品質の平均（#262 で 0.62→0.60、本塁打判定の正しで 0.62、投手の品質寄与×3 で 0.63 へ 2026-08-18）
  quality_contact_slope: 0.0020
  quality_sigma: 0.17
  launch_angle_at_lt1: -5.0      # 弾道1の平均打球角
  launch_angle_at_lt100: 26.0    # 弾道100の平均打球角
  launch_angle_sigma: 12.0
  # ミートによる打球角度σの締まり（issue ai-roster-power-top-tier-all-sluggers, 2026-08-18）: σ×(1−これ×(Contact−50))、下限 floor。
  # ミートが良いほどゴロ・ポップが減ってライナー帯（安打）に集まり、本塁打帯（25〜35°）からは外れる＝「パワーは本塁打・ミートは安打」の分業。
  # C90 で AVG .353→.380／HR 4.2→1.9%（P60・D投手）。母集団は AVG .249→.252・HR 1.67→1.60%。
  launch_angle_sigma_per_contact: 0.010
  launch_angle_sigma_contact_floor: 0.6
  bearing_sigma: 19.0            # 打球方向の「残差」σ（引っ張り/流しを引いた後のばらつき）
  min_quality_velo_factor: 0.55
  # ④タイミングのズレ →⑤打球方向（設計書01 §2④⑤, issue #262）🟡実測校正
  # 打者はスイング開始を投球に合わせる。速い球・変化の大きい球ほど遅れ（差し込まれ）、ミートが良いほどズレない。
  # ズレは無次元（正＝差し込まれ／負＝早い）。これが引っ張り/流しへ変換され、打者の左右が符号を与える。
  # 座標規約: −＝左翼（三塁側）／＋＝右翼（一塁側）。右打者の引っ張り＝負、左打者の引っ張り＝正。
  timing_sigma: 1.0                  # ズレの標準偏差（無次元。bearing_pull_per_timing の単位になる）
  timing_ref_kmh: 121.5              # ズレ寄与0の実投球速度
  timing_per_kmh: 0.010              # 実投球速度1km/hあたりの平均ズレ（正＝速い球は差し込まれる）
  timing_break_ref_m: 0.47           # ズレ寄与0の誘発変化合成量
  timing_per_break_m: 0.60           # 変化量[m]あたりの平均ズレ（正＝変化が大きいほど差し込まれる）
  timing_per_contact: 0.004          # ミート(−50)あたりのズレ縮小
  bearing_pull_per_timing: 14.0       # ズレ1あたりの引っ張り角[deg]
  bearing_pull_ground_deg: 28.0      # 純ゴロでの引っ張り角[deg]
  bearing_pull_fly_deg: -6.0         # 純フライでの引っ張り角[deg]（負＝流し）
  bearing_ground_angle_deg: 0.0      # 「純ゴロ」とみなす打球角（以下で頭打ち）
  bearing_fly_angle_deg: 25.0        # 「純フライ」とみなす打球角（以上で頭打ち）
  # コンタクト品質への投手側寄与（「打たせて取る」の土台）。3項とも基準値で寄与0＝リーグ平均投手で恒等。
  # 2026-08-18: 3項を ×3（旧 0.0010/-0.0010/-0.30）。旧値だとエースが本塁打を減らせるのは三振の分だけで、当てられれば
  # F投手と同じ本塁打率だった（issue pitcher-barely-affects-contact-quality）。
  contact_quality_velocity_ref_kmh: 121.5  # 平均的な配球の実投球速度（ストレート比0.55×球種の球速比込み）
  # 2026-08-19（設計書21・球速の価値）: +0.0030 では球速Lv 50→90 で打球あたり安打率 .323→.376・本塁打率 1.8→3.45% と「速い投手ほど
  # 打たれる」になり三振増と相殺＝球速+10 の得点差 ±0（Q24-1 の倍化が無効化されていた）。−0.0050 で打球の質を球速に対して平坦〜微減
  # （差し込まれ）にする＝球速+10 ≈ 制球+10（AVG −.017）。単一対戦の実測は OPEN-QUESTIONS Q24-5。
  contact_quality_per_kmh: -0.0050         # 速い球は差し込まれる（当たっても弱い）
  contact_quality_per_control: -0.0030     # 制球が良いほど芯を外させる（技巧派の武器）
  contact_quality_break_ref_m: 0.47        # 132km/h・2200rpm の誘発変化合成量
  contact_quality_per_break_m: -0.90       # 変化が大きいほど詰まる

# --- 守備（弾道→捕球/送球判定） ---
fielding:
  fly_apex_threshold_m: 2.5
  catch_reach_factor: 1.00
  throw_transfer_seconds: 0.70
  throw_transfer_fielding_slope: 0.004 # 握り替えの守備連動（Issue #36）: 倍率=max(min,1−(守備−50)×これ)。守備50で×1.0＝恒等
  throw_transfer_factor_min: 0.70      # トランスファー倍率の下限（最速側クランプ, Issue #36）
  infield_play_overhead_seconds: 0.10  # 内野ゴロ処理のオーバーヘッド（捕球姿勢づくり・ステップ, §4.1b）。issue #358で0.88→0.10へ引き戻し: 0.88は#261の得点環境の戻しを「内野手の処理時間」に載せた値で、握り替え0.70と合わせて捕ってから離すまで1.58秒＝実際(0.6〜0.9秒)の約2倍だった。実測値は0.10+0.70×守備係数＝守備90で0.69s／50で0.80s／20で0.88s
  runner_reaction_seconds: 0.45        # 実戦オフセット（設計書02 §4.1b: 走力50右で本塁→一塁≈4.2s）
  left_batter_first_step_bonus_seconds: 0.13  # 左打者は一塁が近く速い（§4.1b）
  infield_depth_m: 46.0
  force_out_margin_seconds: 0.0        # 一塁封殺の判定余裕。issue #358 で 0.0→0.60 とした校正項を 2026-08-14 に物理層（infield_handle_jitter_mean_seconds）へ移して 0 へ戻した＝判定は素のタイミング比較。判定の秒を動かすのに絵の秒に出ない項だったため「送球が先に届いた絵なのにセーフ」が構造的に出ていた（実測: 内野安打の83.5%）。0以外にすると再びその食い違いが戻る
  infield_handle_jitter_mean_seconds: 0.49  # 0.48→0.49（2026-08-18）: ミドル前進上限4→10m＋半径捕球の処理点を体到達へ（issue middle-infielder-charge-cap/fielder-body-far-from-ball-at-catch）の差し引き−0.4ptを戻す（実測60,000打席×seed 7/42/2024で 9.4/9.3/10.0%）。 内野の打球処理のもたつき[s]の平均（指数分布・下限0で右に裾）。捕ってから離すまでに余分にかかる時間で、引いた値が**そのままタイムラインの秒**になる＝絵と判定が一致する。守備力（transfer と同じ係数）で伸縮。0.43 は内野安打率から逆算（従来の定数0.60と**同じ**内野ゴロの帰結＝アウト82.8%/内野安打9.6%/失策7.6%になる平均は0.43。実測 2026-08-14・200,000打席・seed 7）。統合時に issue #630 の前進捕球で守備が速くなった分を戻して 0.43→0.48（実測60,000打席×seed 7/42/2024で内野安打9.5/9.1/9.8%＝#630の目標9.6〜9.7%と一致）
  infield_handle_jitter_max_factor: 3.0     # もたつきの上限＝平均の何倍で頭打ちにするか。指数の裾は無限に伸びるので「捕ってから4秒動かない内野手」が極稀に出る。絵に出る量なので実在しない値は切る（3.0＝1.2秒・上位5%が頭打ち）

  catch_close_call_margin_seconds: 0.15  # 判定オーバーレイ「フェア」（Issue #328②）: |捕球余裕|がこれ未満の落球だけ着地の瞬間に表示。表示専用・帯不変
  # 失策モデル（issue #123, 2026-07-23）: 平均守備(Catching50)で0.064＝両軍計≈2.4/試合（甲子園実測2.1〜2.7域）。
  # 守備力連動は非対称: 弱小側(50未満)は急傾斜(slope 0.0065)で弱小同士(C25)を両校計≈10失策へ、
  # 精鋭側(50超)は緩傾斜(slope_strong 0.001)で「守備を上げるほど失策が減る」勾配を残す（精鋭C90でも≈1/試合＝
  # 能力向上の意味を保つ）。守備力が試合結果を大きく分ける＝オーナー方針2026-07-23。
  error_base_prob: 0.0495             # 捕球エラー基準（Catching50時）。issue #169で旧0.064から再配分（内野ゴロ失策の約60%を捕球由来に）→issue #532で×1.29（0.0384→0.0495）：外野フライ落球を難度連動で減らした分、errors_per_gameを現行水準(≈2.4)に保つため内野ゴロ側を引き上げ（捕球60/送球40の按分は維持）
  error_catching_slope: 0.0065        # 平均未満（弱小側）の傾き。旧0.0003は守備連動が弱すぎた
  error_catching_slope_strong: 0.001  # 平均超（精鋭側）の傾き。緩くして精鋭に失策の勾配を残す
  error_min_prob: 0.001               # 失策確率の下限
  error_max_prob: 0.30                # 失策確率の上限（弱小同士の大量失策の天井）
  # 空中捕球（フライ落球）の失策モデル（issue #532）: 内野ゴロの error_base_prob（捕球60%/送球40%で校正した内野向け基準）を
  # 共有していたため平凡なフライも際どい飛球も同確率で落球し外野が全失策の約39%を占めていた。フライ専用の基準確率＋
  # 捕球余裕(catchMargin=滞空予算−到達所要)連動の難度で伸縮させる。乱数消費は従来1ロールのまま（確率だけ変わる＝
  # 決定論baseline再生成を伴う）。難度=clamp(1−catchMargin/routine, 0, 1)、実効確率=(fly_base−(Catching−50)×slope)×難度。
  fly_error_base_prob: 0.20          # フライ落球の基準確率（捕球余裕≈0＝際どい飛球・Catching50時）。error_base_probと独立
  fly_error_routine_margin_seconds: 0.35  # この秒数以上の捕球余裕がある飛球は難度0（下限へ）＝平凡。大きいほど外野失策が増える帯校正ノブ
  # 送球エラー（内野ゴロ→一塁の2段階目, Issue #37 / design-14 P1-6b）。捕球ロール(Catching)の後の送球ロール(ThrowAccuracy)。
  # base=0 で送球ロールを引かない＝現行の捕球のみ判定と完全一致（決定論不変）。正値で悪送球が能力駆動に。
  throw_error_base_prob: 0.0343       # 送球エラー基準確率（ThrowAccuracy50時）。issue #169で正値化＝Ac50で内野ゴロ失策の約40%が送球由来→issue #532で×1.29（0.0266→0.0343・捕球60/送球40の按分維持）
  throw_error_accuracy_slope: 0.004   # 送球精度(Ac−50)あたりの悪送球減少幅
  # 送球逸れの回収レース（design-12 §3.8, 2026-08-30）。悪送球確定後、逸れ幅→回収ロスを守備所要時間へ
  # 加算してもう一度同じ判定基準で再評価する（拾い直しが間に合えばアウトのまま）。
  wild_throw_scatter_sigma_m: 6.0     # 逸れ幅の標準偏差[m]（半正規分布）
  recovery_reaction_seconds: 0.30     # 回収に動き出すまでの反応遅延[s]
  # トンネル（股・脇を抜けて球が外野へ行く失策, issue #632）。捕球エラーの**内訳**＝失策総数は不変（お手玉が減ってトンネルが増える）。
  # 0で内訳ロールを引かない＝従来と完全一致。正値で「球が外野へ行ったから走者が還った」が物理層の因果になる（進塁は外野からの返球との時間勝負）。
  tunnel_share_prob: 0.30             # 捕球エラーのうちトンネルになる割合
  # 空中捕球の守備範囲（Issue #24 原因2）。滞空時間比例のままだと深い飛球ほど守備範囲が
  # 無制限に広がるため、走れる時間に絶対上限を掛け、走路取りの巧拙（守備力）で伸縮させる。
  # 守備50・上限未満では従来（滞空×1.00）と同一。
  catch_reach_fielding_slope: 0.004
  catch_reach_cap_seconds: 4.00
  # --- 塁打数の決定（Issue #24 原因1: 距離しきい値を廃止し、転がり＋幾何＋走力の連続量へ） ---
  roll_decel_mps2: 2.60          # 着地後の転がりの減速度（芝・土の摩擦＋バウンド損失）
  roll_retention_flat: 0.72      # 水平に近いライナーがバウンドで保持する前進速度の割合（滑って伸びる）
  roll_retention_steep: 0.25     # 真上から落ちる大飛球が保持する割合（失速して死ぬ）
  fence_carom_seconds: 0.40      # フェンス到達打球の跳ね返り処理の追加時間
  fence_restitution: 0.35        # フェンスの反発係数（跳ね返り初速＝到達時の残速×これ。表示専用・判定不変）
  outfield_pickup_seconds: 0.30  # 転がる打球を拾い上げる時間
  throw_distance_drag_per_m: 0.0045  # 送球の失速: 到達 = 距離÷送球速度×(1+距離×この値)
  running_top_speed_factor: 1.15 # 一塁到達後の巡航速度倍率（本塁→一塁の平均速度に対する比）
  base_turn_seconds: 0.30        # 塁を回る方向転換のロス
  extra_base_margin_seconds: 0.40  # 進塁判断マージン（走者所要＋この値 ≤ 送球到達 で次の塁へ）
  # --- 打球のバウンド（Issue #63 / OPEN-QUESTIONS Q14）: 着地後も物理層で軌道を継続する ---
  bounce_restitution: 0.45          # 反発係数 e（バウンド頂点は e² で減衰）
  bounce_friction_mu: 0.50          # 接地の動摩擦係数 μ（水平減速 = μ(1+e)|v⊥|）
  bounce_rolling_retention: 0.7143  # 1接地で保持する水平速度の下限比（滑り→転がり遷移。球の 5/7）
  bounce_min_launch_mps: 0.60       # これ未満の鉛直初速は転がり扱い（弾み列の打ち切り）
  bouncer_apex_threshold_m: 1.20    # 4分類: 最大バウンド頂点がこれ以上なら「バウンド」、未満は「ゴロ」
  # 4分類: 頂点÷水平到達距離がこれ以下なら「ライナー」、超なら「フライ」。issue #451 で 0.10→0.15。
  # 表示・実況専用（捕球/送球判定は fly_apex_threshold_m で別に決まる）＝帯不変。0.15 で「平たい弾丸ライナー」が
  # ライナー表示になり、外野フライ(range≥70m)の頂点 p50 が実物オーダー(20m台)に入る（issue #451。C#既定と両面）。
  liner_apex_range_ratio: 0.15
  infielder_reach_height_m: 2.20    # 内野手が届く高さ上限（これを越える弾みは頭上を抜ける）
  infielder_fielding_radius_m: 4.20 # 内野手の横の守備範囲（グラブ＋ダイブ）。これを抜ける強い打球だけ外野へ
  infielder_dive_reach_m: 2.0       # 飛びつきの実効リーチ（体の中心→捕球点）。半径で触れると判定した打球の処理点・処理時刻は体がここまで寄れた時刻で採る（体が3〜4m離れたまま捕球・送球しない）
  chopper_wait_factor: 0.55         # 高バウンド（チョッパー）で野手が待たされる時間の係数（内野安打に効く）
  infield_intercept_step_seconds: 0.02  # 内野境界の通過時刻を求める走査刻み
  pitcher_fielding_reaction_penalty_seconds: 0.35 # 投手のゴロ処理の追加反応遅延（Issue #261: フォロースルー直後で守備体勢が崩れる分。処理野手割り当てにのみ効く）
  # 前進捕球（チャージ, issue #630）: 従来は処理野手が「守備位置に最も近い経路上の点」で打球を待った＝
  # ボテボテのゴロほど長く突っ立って待ち、内野安打が転がっていた（絵にもそのまま出ていた）。緩い打球だけ
  # 前へ出て早い時刻・本塁寄りの点で捕る。前進量 = 上限 ×(1 − 打球速度/charge_slow_ball_speed_mps) の直線＝
  # 強い打球は前進量0＝従来と完全に同じ捕球点・処理時刻（乱数は引かない）。
  charge_slow_ball_speed_mps: 30.0  # この速度以上で待って捕る（前進量0）。静止球で上限いっぱい。オーナー選択2026-08-13
  charge_max_advance_corner_m: 6.0  # 投手・一塁手・三塁手が前へ出られる距離（最短の守備範囲からの上乗せ）
  charge_max_advance_middle_m: 10.0 # 二塁手・遊撃手。4.0 では実効1〜2m でボテボテに突っ込まず待ち捕りだった（issue middle-infielder-charge-cap）。代償は前進量比例のペナルティ
  charge_throw_penalty_seconds: 0.12  # 前進いっぱいでの握り替え追加時間（走りながら捕る＝体勢が悪い分を食い戻す）
  charge_throw_accuracy_penalty: 6.0  # 前進いっぱいでの送球精度の低下[点]（悪送球ロールへ効く）
  irregular_bounce_prob: 0.030      # イレギュラーバウンドの発生確率（一律。土質接続は将来の別Issue）
  irregular_bounce_lateral_deg: 12.0     # イレギュラーの横ぶれ最大角[deg]
  irregular_bounce_restitution_swing: 0.60  # イレギュラーの反発係数の揺らぎ幅
  error_irregular_bonus: 0.10       # イレギュラーバウンド処理時のエラー確率加算
  # 守備位置適性→実効守備力の補正（設計書01 §1.1）。基準50で×1.0、本職＝高適性でボーナス、慣れないポジでペナルティ。
  aptitude_neutral: 50.0
  aptitude_slope_per_point: 0.006
  aptitude_factor_min: 0.60
  aptitude_factor_max: 1.30

# --- 走塁（進塁確率, Phase 2。平均得点≈4.3/チームに収まる初期値） ---
# 進塁判断は走塁判断(Baserunning)を参照（速度は走力, 判断は走塁判断。設計書02 §4.1）
baserunning:
  first_to_third_on_single: 0.28
  second_to_home_on_single: 0.62
  first_to_home_on_double: 0.48
  speed_slope: 0.006
  sac_fly_score_prob: 0.30
  productive_out_advance_prob: 0.18
  double_play_prob: 0.13
  fielders_choice_prob: 0.06       # 野選（FC, design-14 P1-1）: DP不成立時に先行走者アウト＋打者一塁生存（2026-07-17校正）
  error_extra_advance_prob: 0.90   # 失策連鎖（design-14 P1-6）: **悪送球のみ**でReachedOnError時に全走者+打者へ追加1進塁（issue #629 で 0.20→0.90 再校正・2026-08-13）
  error_extra_advance_accuracy_slope: 0.003  # 失策連鎖の送球精度連動（Issue #37）: 確率=prob−(Ac−50)×これ。0で非連動＝恒等

  drop_third_strike_reach_prob: 0.39       # 振り逃げ（design-14 P1-2）: 第3ストライクが捕り損ねうる球のとき成立（issue #525で 0.001→0.39 再校正）
  drop_third_strike_catching_slope: 0.002  # 捕手Catching(-50)あたりの成立確率減少幅
  wild_pitch_prob: 0.035           # 暴投（design-14 P2-8）: 走者あり・捕り損ねうる球ごとの基準確率（issue #525で 0.0012→0.035 再校正）
  wild_pitch_control_slope: 0.0006 # 投手Control(-50)あたりの暴投確率の減少幅
  passed_ball_prob: 0.023          # パスボール（design-14 P2-8）: 同上・捕手責（issue #525で 0.0008→0.023 再校正）
  passed_ball_catching_slope: 0.0006 # 捕手Catching(-50)あたりのパスボール確率の減少幅
  # 暴投・捕逸・振り逃げの着弾コースゲート（issue #525・監督判断 2026-08-07）: 「捕り損ねうる球か」は
  # 種別でなく実着弾コースで決める（BaserunningModel.CanBatteryMiss）。ゾーン内（BottomM=0.50以上）の球は
  # 構造的に対象外＝捕れる球が後逸にならない。狭めたぶん上の *_prob を校正で引き上げてある。
  battery_miss_low_y_m: 0.30       # この高さ[m]未満の低い球（ワンバウンド相当・ゾーン下端より下）は捕り損ねうる
  battery_miss_outside_m: 0.25     # ゾーン外へこの距離[m]以上外れた球（大きく外れた球）は捕り損ねうる
  # 盗塁（設計書02 §4.2）: すべて秒の時間軸で校正（🟡 設計書07で実タイムに合わせ込む）
  steal_lead_distance_m: 23.5
  catch_throw_distance_m: 38.8
  steal_reaction_intercept: 0.90   # スタート遅延[s] = intercept − steal×slope（Step4再校正: 快足を3.4秒台へ）
  steal_reaction_slope: 0.004
  steal_jump_credit_seconds: 0.19  # ジャンプ[s]。走者は投手の始動を読んで既に動き出している＝遅延から差し引く（床の後に引く）。steal_success_bias 0.38 を物理層へ移した半分（2026-08-14）。走力50/盗塁50の二塁到達 3.94→3.75秒（高校生の実測3.6〜3.8秒へ）
  pitcher_quick_seconds: 1.40      # 投手クイック（投法補正は後回し）
  pop_transfer_seconds: 0.70       # 捕手の握り替え（ポップ = これ＋立ち上がり＋送球時間）
  catcher_pop_rise_seconds: 0.19   # 捕手の立ち上がり[s]（守備力で縮まない固定部分）。steal_success_bias 0.38 を物理層へ移した残り半分（2026-08-14）。肩50のポップタイム 1.91→2.10秒（高校生の実測2.0〜2.3秒へ）。⚠ pop_transfer_seconds へ足し込むと守備力で伸縮して「移しただけ」でなくなる
  transfer_fielding_slope: 0.004   # 走塁系トランスファーの守備連動（Issue #36）。fielding.throw_transfer_fielding_slope と揃える
  transfer_factor_min: 0.70        # 走塁系トランスファー倍率の下限（Issue #36）
  tag_seconds: 0.10
  steal_margin_scale: 0.22         # margin→成功確率のlogistic幅（Step4再校正: 肩差が効く幅に拡張）
  steal_success_bias: 0.0          # リーグ平均成功率の校正項（🟡）。2026-08-14 に 0.38→0.0＝中身を物理層の秒（steal_jump_credit_seconds 0.19 ＋ catcher_pop_rise_seconds 0.19）へ移した。判定の秒だけを動かして絵の秒に出ない項なので、0以外にすると「送球が先に届いた絵なのにセーフ」が戻る（実測: 成功50%の場面で送球が0.48秒先着）。平均成功率を動かすときは移した先の2項を動かす
  catch_throw_to_third_distance_m: 27.4  # 本塁→三塁の送球距離（design-14 P1-4、三盗）
  steal_third_success_bias: -0.35  # 三盗の成功率バイアス（design-14「三盗は成功率下方」）
  steal_home_success_bias: 0.0     # 本盗の成功率バイアス。issue #637 で −0.7→0.0＝難しさは下の物理層の秒で表す（判定だけ動かす項は絵に出ない）
  steal_home_distance_m: 21.5      # 本盗の走者の残り距離[m]（issue #637）。三塁→本塁27.43mからワインドアップ中のリード約6mを引く
  steal_home_delivery_seconds: 2.45  # 本盗の守備側[s]（issue #637）。警戒していない投手の投球（クイックではない）＋球の到達。design-14「本盗は三盗よりさらに下方」を守る水準に置く（2026-10-10 ユーザー決定）
  double_steal_third_break_prob: 0.4  # 一・三塁重盗（design-14 P1-4）: 三塁走者も同時スタート（2026-07-17校正）
  pickoff_base_prob: 0.0           # 牽制アウト（design-14 P1-5）の基準確率。issue #661 でオフ（0.05→0）＝牽制は盗塁企図の球にしか出ず、映った瞬間に盗塁が読めるため。0の間は判定も絵も出ない
  pickoff_runner_lead_slope: 0.0015
  pickoff_pitcher_sense_slope: 0.001
  pickoff_max_prob: 0.08
  # バント（設計書02 §4.3）
  bunt_base: 0.60
  bunt_skill_slope: 0.005          # バント×0.5%
  bunt_velocity_ref_kmh: 130.0
  bunt_velocity_penalty_per_kmh: 0.004
  bunt_miss_share: 0.07
  bunt_foul_share: 0.18            # Bunt50時。上手いほど減る（Step4-③）
  bunt_foul_skill_slope: 0.0012   # (Bunt−50)あたりファウル減
  bunt_foul_floor: 0.06
  bunt_pop_share: 0.05
  # バント内野安打の時間軸判定（設計書02 §4.1b, Step4-②）: 打者走者→一塁 対 バント処理→送球
  bunt_base_distance_m: 27.4
  bunt_runner_reaction_seconds: 0.45   # 守備側 runner_reaction_seconds と同軸
  bunt_left_first_step_bonus_seconds: 0.13
  sacrifice_bunt_square_delay_seconds: 0.35  # 犠打は早く構えて走り出しが遅い
  safety_bunt_square_delay_seconds: 0.12     # セーフティは走りながら転がす
  bunt_field_throw_base_seconds: 3.70        # コーナー突進＋素手＋短距離送球
  bunt_placement_slope: 0.006                # 好バントほど処理が遅れる
  bunt_infield_hit_time_scale: 0.14          # margin→確率のlogistic幅
  # バント: ボール球見送り（issue bunt-no-take-on-ball-pitches）。スクイズは対象外（一球でコミット）
  bunt_take_base: 0.20
  bunt_take_distance_slope: 1.2
  bunt_take_discipline_slope: 0.006
  bunt_take_cap: 0.90
  # バント: コース補正・技術/球速/球威連動の失敗率（design-02 §4.3の欠落項の実装, issue bunt-no-take-on-ball-pitches）
  bunt_course_slope: 0.10
  bunt_stuff_ref_value: 0.0
  bunt_miss_skill_slope: 0.0008
  bunt_miss_velocity_slope: 0.001
  bunt_miss_stuff_slope: 0.015
  bunt_miss_floor: 0.02
  bunt_pop_skill_slope: 0.0006
  bunt_pop_velocity_slope: 0.0008
  bunt_pop_stuff_slope: 0.012
  bunt_pop_floor: 0.02
  # バント: 一塁走者の封殺（フォースアウト, issue bunt-no-take-on-ball-pitches）。処理点は「誰が処理したか」
  # を特定しない簡略化（bunt_field_throw_base_seconds と同じ抽象レベル）。三塁走者→本塁のスクイズ判定も共有
  bunt_fielded_x_m: -4.0
  bunt_fielded_z_m: 8.0
  bunt_fielded_at_seconds: 0.90
  bunt_fielder_throw_speed_mps: 30.0
  bunt_fielder_fielding_level: 50.0
  bunt_force_r1_start_delay_seconds: 0.15
  # バント: 二塁走者（1・2塁時）の三塁封殺。既存の third_force_*（Q31）をそのまま使う＝新規係数はスタート遅延のみ
  bunt_force_r2_start_delay_seconds: 0.15
  # バント: 三塁走者（満塁時）の本塁封殺。既存の home_force_*（Q31）をそのまま使う＝新規係数はスタート遅延のみ
  bunt_force_r3_start_delay_seconds: 0.15
  # バント: 小フライからのライナー併殺（design-09、issue bunt-no-take-on-ball-pitches）。捕球点・滞空時間は
  # TimelineBuilder の絵と共有する単一ソース（判定=絵）
  bunt_pop_fielded_z_m: 3.0
  bunt_pop_hang_seconds: 0.55
  # スクイズ: 三塁走者のスタート（走力連動, issue bunt-no-take-on-ball-pitches）。送球先が本塁になる以外は
  # 上のバント処理点を流用（home_success_bias等は既存のまま）
  squeeze_third_runner_start_delay_seconds: 0.05
  # 本塁クロスプレー（バックホーム憤死, 設計書12 §3, F2）: 走塁 §4.1 と同じ秒の時間勝負
  home_runner_reaction_intercept: 0.55       # 本塁を狙う走者の判断遅延[s] = intercept − 走塁判断×slope
  home_runner_reaction_slope: 0.004
  home_lead_distance_m: 3.5                   # 二次リード分の距離短縮[m]
  # 塁上の走者の物理（Issue #316）。打者走者側（fielding: running_top_speed_factor / base_turn_seconds）
  # と同じ値＝同じモデル。以前ここが 1.0/0.0 で「加速も踏み直しも数えない」別モデルになっていた。
  runner_top_speed_factor: 1.15               # 動き出している走者はスプリント速度より速い
  runner_base_turn_seconds: 0.30              # 目標塁の手前で回る塁1つあたりの損失[s]（三塁→本塁は0回）
  outfield_transfer_seconds: 0.60            # 外野の捕球→送球（グラブ離し）
  relay_transfer_seconds: 0.55               # 中継の握り替え
  relay_throw_speed_mps: 32.0                # 中継野手の送球速度（リーグ平均内野肩）
  cutoff_fraction_from_home: 0.5             # カットマン位置（本塁からの距離割合）
  # 中継に入る距離は「肩の送球速度 × この秒数」で決まる（issue #526）＝強肩ほど遠くから直接返球できる。
  # 旧 cutoff_distance_threshold_m: 60.0（距離固定）は肩が判定に一切効かず、しきい値をまたいだ瞬間の
  # 損失が強肩ほど大きかった（Arm20 +0.41s / Arm99 +0.71s）＝実際の野球と逆。1.88 は Arm50 で 60m ＝
  # リーグ平均の挙動を旧値と揃える値。Arm20→52m / Arm50→60m / Arm80→68m / Arm99→73m。
  cutoff_throw_seconds: 1.88
  # バックホーム悪送球（外野/中継→本塁の送球エラー, 2026-08-30）。内野送球エラー
  # （fielding.throw_error_base_prob/throw_error_accuracy_slope）と同型の二値ロール。
  # 守備が本塁で間に合う場面でだけ引き、送球者のThrowAccuracyが低いほど悪送球になりやすい。
  relay_throw_error_base_prob: 0.0343
  relay_throw_error_accuracy_slope: 0.004
  # 送球逸れの回収レース（design-12 §3.8, 2026-08-30）。悪送球確定後、逸れ幅→回収ロスを守備所要時間へ
  # 加算してもう一度同じMargin/logisticレースを評価する（拾い直しが間に合えばアウトのまま）。
  wild_throw_scatter_sigma_m: 6.0     # 逸れ幅の標準偏差[m]（半正規分布）。内野側とは独立値
  recovery_reaction_seconds: 0.30     # 回収に動き出すまでの反応遅延[s]
  recovery_sprint_speed_mps: 6.5      # 回収に動く野手のスプリント速度[m/s]（平均的な値の定数）
  home_tag_seconds: 0.12
  home_grounder_start_delay_seconds: 1.55    # ゴロ凡打の三塁走者は打球を読んでから走る＝遅い(G1)
  home_margin_scale: 0.25                    # margin→生還確率のlogistic幅
  home_success_bias: 1.57                    # #316: 走者の加速をモデル化した分(-0.43s)を引いて 2.00→1.57
  # 三塁への進塁レース（単打の一塁→三塁, Issue #89, 設計書12 §3.5/§4.6）: 本塁と同型で三塁ベースへ解く
  third_tag_seconds: 0.10                     # 三塁でのベースタッチ（本塁クロスプレーより短い）
  third_margin_scale: 0.45                    # margin→確率のlogistic幅（本塁より広め＝打球の深さ・外野の肩を効かせる）
  third_success_bias: 0.88                    # #316: 加速+回る損失をモデル化した分(-0.62s)を引いて 1.50→0.88
  # ゴロ凡打の進塁打（二塁→三塁, Issue #318／issue productive-out-second-to-third-not-advancing, 設計書12 §3.5）:
  # 18%固定テーブルを「一塁送球到達→三塁への転送レース」へ。打者走者はこの場面に至った時点で一塁アウトが確定して
  # おり（実際の内野は確実な1アウトを捨てて三塁の走者を直接狙わない）、二塁走者は転送の脅威（P_relay）だけで
  # 進むか自重するかが決まる（采配でなく物理で決める）。
  grounder_advance_start_delay_seconds: 0.90 # ゴロを読んでから走り出す追加遅延[s]。本塁(1.55)より短い＝進塁は生還ほど慎重に見極めない
  advance_tag_seconds: 0.10                   # 進塁先でのタッチ[s]（third_tag_seconds と同軸）
  advance_margin_scale: 0.45                  # margin→確率のlogistic幅（三塁レースと同軸）
  advance_success_bias: 0.00                  # 校正項[s]。帯校正はこの1本だけで行う（Issue #318）
  advance_relay_transfer_seconds: 0.55        # 一塁手の転送握り替え[s]（relay_transfer_seconds と同軸）
  # 併殺の物理レース（内野ゴロ×一塁走者, Issue #369, 設計書12 §2）: 13%固定テーブル（double_play_prob）を
  # 「捕球点→二塁の封殺（P_force2）／二塁→一塁の転送」の二段の秒勝負へ。守備は幾何で3分岐を純関数で選ぶ
  # （A=一塁のみ／B=野選／C=併殺）。方向性・深さ・打者/走者の脚は係数でなく幾何から創発する。
  # ※実ゲーム（Unity）は coefficients.yaml を読まず C#既定で動く（不変条件・NationService）。ここは sim/テスト用に
  #   C#既定と同値で追随させる（BaserunningCoefficients の既定と一致）。
  double_play_r1_start_delay_seconds: 0.30    # 一塁走者がゴロを読んでから二塁へ走り出す追加遅延[s]
  second_force_tag_seconds: 0.10              # 二塁封殺のタッチ/捕球[s]（third_tag_seconds と同軸）
  second_force_margin_scale: 0.45            # 二塁封殺 margin→到達確率のlogistic幅（三塁・進塁と同軸）
  second_force_success_bias: 0.00           # 二塁封殺の校正項[s]
  double_play_force_max_runner_success: 0.60 # 一塁走者の二塁到達見込みがこれ超なら封殺自体が不可＝一塁を取る（分岐A-1・稀）
  double_play_attempt_min_relay_success: 0.65 # 二塁→一塁の転送で打者を刺せる見込みがこれ未満なら併殺を狙わず確実な一塁アウト（分岐A-2）。0.80→0.55（2026-08-18: 見込み6〜8割の併殺まで一塁へ逃げていた）→0.65（2026-08-30: 併殺/試合の帯を高校野球の失策率実測ベースへ再校正した際の追従。詳細はBaserunningCoefficients.csのXMLコメント）
  double_play_pivot_transfer_seconds: 0.90   # 二塁ベース経由の転送（ピボット）握り替え[s]（relay_transfer_seconds とは別値）
  double_play_relay_margin_scale: 0.20       # 二塁→一塁の転送 margin→打者生存（野選）確率のlogistic幅
  double_play_relay_bias: 0.00               # 二塁→一塁の転送の校正項[s]（正で打者生存＝野選寄り）。併殺打/得点をHeavyで校正
  # 併殺の代替ルート（三塁/本塁の自己フォース, Q31）: 三塁手/捕手・投手が自打球を自分でベースへ運んで
  # フォース（送球なし）→一塁へ転送。実際にその塁を処理した野手だけが検討でき、二塁封殺より到達見込みが
  # 低い（守備に有利）ときだけ選ばれる（BaserunningModel.ResolveDoublePlay のゲート）。
  third_force_tag_seconds: 0.10              # 三塁での自己フォースのタッチ/捕球[s]（second_force_tag_seconds と同軸）
  third_force_margin_scale: 0.45             # 三塁での自己フォース margin→到達確率のlogistic幅
  third_force_success_bias: 0.00             # 三塁での自己フォースの校正項[s]
  home_force_tag_seconds: 0.10               # 本塁での自己フォースのタッチ/捕球[s]（second_force_tag_seconds と同軸）
  home_force_margin_scale: 0.45              # 本塁での自己フォース margin→到達確率のlogistic幅
  home_force_success_bias: 0.00              # 本塁での自己フォースの校正項[s]
  double_play_self_force_relay_transfer_seconds: 0.70  # 自己フォース側の一塁への転送握り替え[s]（受け取り動作が無いぶん double_play_pivot_transfer_seconds より短い）
  # 犠飛のタッチアップ（Issue #90, 設計書12 §3.5）: 走者は捕球時刻にスタート（二次リードなし＝全塁間27.4mを走る）、
  # 守備も同じ捕球時刻から送球＝共通起点が捕球時刻。深い外野フライは送球が長く生還、浅いフライは自重/憤死。
  tag_up_margin_scale: 0.40                   # margin→生還確率のlogistic幅（本塁クロスプレーより広め＝深さ・肩を効かせる）
  tag_up_success_bias: 1.50                   # 生還率・本塁憤死頻度を現実値へ校正（Heavy実測, Issue #90。球質タイプ中立を維持）
  # 犠飛以外のタッチアップ（一塁→二塁 / 二塁→三塁, design-14 P3-11）: 置換前は両方とも
  # productive_out_advance_prob の18%固定で深さ・肩・走力を見ていなかった（浅いライトフライでも一塁走者が
  # 18%で二塁へ）。塁ごとに送球距離が大きく違うため、本塁用の tag_up_success_bias(1.50) は流用せず塁固有に持つ。
  tag_up_third_success_bias: 0.85             # 二塁→三塁の校正項[s]。実測 100mまで0%・105m 86%・115m 93%。1.30だと広い球場の得点が上がりStadium/Archetypeの僅差比較が割れる
  tag_up_second_success_bias: 1.20            # 一塁→二塁の校正項[s]。二塁への送球は最短＝実測 105mまで0%・115mから動く（最深部のフライでだけ走る）
  close_call_margin_seconds: 0.15            # 判定オーバーレイ（Issue #59）: |margin|がこれ未満なら「際どい」＝セーフ表示。アウトは常時表示のため無関係
  # ライナー併殺（コンタクト始動の一塁走者が捕られ戻れず, 設計書12 §4, G2）
  liner_break_reaction_seconds: 0.05         # 接触と同時に飛び出す＝ほぼ即時
  liner_commit_cap_seconds: 1.00             # 「盲目的に走る」時間の上限（長い滞空でもリードが伸び続けない）
  liner_reference_sprint_speed_mps: 7.25     # リード算出の基準走力（個人差は戻りの走力にだけ効く）
  doubled_off_reverse_seconds: 0.35          # 捕球を見て反転するまでの判断遅延
  doubled_off_transfer_seconds: 0.30         # 捕球野手の捕球→送球（内野寄りなので外野より短い）
  doubled_off_tag_seconds: 0.10
  doubled_off_margin_scale: 0.20             # margin→塁へ戻れる確率のlogistic幅
  doubled_off_success_bias: 0.0              # 校正前の暫定値（Heavy実測で調整）
  steal_break_extra_lead_m: 6.0              # 盗塁で走っていた一塁走者が接触時点で稼いでいたリード（飛び出しの戻り距離に加算）
  doubled_off_retreat_speed_mps: 3.0         # コミット上限を過ぎてから捕球までに打球を見ながら塁へ戻る速さ（深いフライで刺されない）
  # 守備の読み/ピッチアウト（設計書09 §1, 設計書12 §5, G3）: 捕手リード＋投手センス vs 状況の意外性
  steal_expectedness_intercept: 0.42         # 盗塁企図の基準「予想されやすさ」E
  steal_expectedness_steal_slope: 0.006      # Steal能力→予想度（快足盗塁屋は読まれやすい）
  gamble_unexpectedness_reduction: 0.28      # ギャンブル始動は意表＝予想度を下げる（G3b配線）
  steal_read_intercept: 0.50                 # 読み力の基準（捕手リード＋投手センス）
  steal_read_catcher_lead_slope: 0.006       # 捕手リード(Lead−50)あたり読み力加算
  steal_read_pitcher_sense_slope: 0.003      # 投手センス(Mental−50)あたり読み力加算
  max_pitchout_prob: 0.55                    # 読み切っても上限
  pitchout_defense_bonus_seconds: 0.35       # ピッチアウト成功で守備時間短縮（捕手優位）
  gamble_pitchout_extra_bonus_seconds: 0.20  # ギャンブル走者は無防備でさらに刺されやすい（G3b配線）
  gamble_jump_bonus_seconds: 0.15            # ギャンブルの好スタート（走者時間短縮, G3b配線）

# --- 投手疲労（設計書02 §1.1e: スタミナ＝目安投球数を超えた球数で減衰・継投） ---
# 目安投球数そのものは選手側（StaminaPitches）。Level→球数の変換は 45 + level×0.9（PitcherAttributes に集約）
fatigue:
  velocity_drop_per_over_pitch: 0.05
  control_drop_per_over_pitch: 0.12
  relieve_pitch_margin: 25.0
  # 目安の手前から徐々に効く消耗カーブ（issue fatigue-gradual-before-threshold・設計書02 §1.1e）。
  # 目安×onset_ratio から二次カーブで低下を始め、目安到達時に球速天井 −velocity_drop_at_guideline_kmh／
  # 制球 −control_drop_at_guideline、超過後は上の per_over_pitch 勾配で段差なく続く。onset_ratio ≥ 1.0 で旧階段型。
  onset_ratio: 0.6
  velocity_drop_at_guideline_kmh: 2.0
  control_drop_at_guideline: 5.0
  # hard_cap_pitches はハードキャップ撤廃（issue #356）で撤去。降板は目安投球数＋relieve_pitch_margin と
  # 疲労による能力低下だけで決まる。スタミナ自体も上限なし（伸ばした分だけ長く投げられる）。

# --- 試合ごとの天候（気温）モデル（Issue #120 / OPEN-QUESTIONS Q22, design-05 大会単位の味付け） ---
# 気温を物理層（空気密度ρ・投手消耗）だけに効かせて「夏場は点が動きやすい」を創発させる（不変条件#1）。
# 気温は試合開始時に専用Forkストリームで1回引くだけ＝本体の乱数順・決定論は不変（不変条件#2）。
# enabled=true でも実プレイ側（C#既定 GameContext）は weather=null のまま＝この YAML は sim/Heavy 回帰でのみ効く
# （メモリ「sim/Unity係数の乖離」）。実ゲーム反映は C#既定＋決定論baseline再生成を伴う後続作業。
weather:
  enabled: true
  # 気温分布（決定1: 夏の甲子園を想定, 28〜36℃・平均32℃・σ2.5）
  mean_temperature_c: 32.0
  temperature_std_dev_c: 2.5
  min_temperature_c: 28.0
  max_temperature_c: 36.0
  # 気温→空気密度（決定1=案B: ρ(T)=ρ0×(273.15+基準温)/(273.15+T) の基準差分に減衰係数 k=0.5 を掛け効きを半減）
  baseline_temperature_c: 15.0   # この気温で aerodynamics.air_density の既定値になる基準
  density_damping: 0.5           # k（0=無効, 1=物理そのまま）。極端な乱打戦を避けるため 0.5
  # 気温→投手消耗（決定2=案A: 加算・線形。基準28℃超過1℃ごとに超過球数あたりの低下量を α だけ増やす。36℃で+8%）
  fatigue_baseline_temperature_c: 28.0
  fatigue_alpha_per_degree: 0.01

# --- 試合間の回復モデル（設計書02 §1.1e・issue #41: 連戦で目安投球数が回復し切らない） ---
# 前登板からの休養日数 × 直近ウィンドウの球数 → 実効の目安投球数を減衰させる。🟡 実測校正前のプレースホルダ。
# 現状は台帳＋モデルのみで本流未配線（帯不変）。本流配線＋Heavy帯再校正は後続issue（#42含む）でまとめて行う。
pitch_recovery:
  full_recovery_days: 7.0        # これ以上の休養（中6日相当）で完全回復＝実効＝目安投球数
  reference_pitches: 100.0       # 「重い登板」の基準球数（直近球数がこれ以上で負荷は最大に張り付く）
  max_reduction_fraction: 0.5    # 連投かつ重い登板が重なったときの最大減衰率（目安投球数比）

# --- 調子・試合限りの好不調（設計書02 §3.3/§3.3b）🟡「調子が支配的にならない」よう控えめ ---
form:
  # 調子（5段階, 1段階あたりの効果）
  contact_per_step: 2.5
  power_per_step: 2.0
  control_per_step: 2.5
  velocity_per_step_kmh: 0.6
  sharpness_per_step: 2.5    # キレ(PitchRank/球種Sharpness)への補正。Controlと同スケール（issue #49）
  # 試合限りの好不調（当日の出来。大半は微小・スパイクは十数試合に一度）
  day_form_base_sigma: 0.15
  day_form_clamp: 0.45
  day_form_spike_prob: 0.07
  day_form_spike_min: 0.6
  day_form_spike_max: 1.0
  contact_per_day_form: 3.0
  power_per_day_form: 2.0
  control_per_day_form: 5.0
  velocity_per_day_form_kmh: 1.5
  sharpness_per_day_form: 5.0  # キレへの当日補正。Controlと同スケール（issue #49）
  # 週次の波（数日〜数週間続く。毎試合振り直さない）
  weekly_persistence: 0.75
  weekly_sigma: 0.28
  # 相手校の調子観測（監督の育成眼が高いほど正確、低いと誤認。issue #47）
  observe_sigma_base: 0.65          # 育成眼0時のノイズσ
  observe_sigma_per_talent_eye: -0.0063  # 育成眼1あたりのσ減少（TalentEye=100でσ下限）
  observe_sigma_min: 0.02           # σの下限（育成眼MAXでも僅かな誤差は残す）
  # 試合結果によるConditionValueフィードバック（自校の詳細シム1試合ぶん。issue #46）
  match_hit_bonus: 0.02             # 好打: 安打1本あたりの加点
  match_home_run_bonus: 0.03        # 好打: 本塁打1本あたりの追加加点
  match_hitless_min_at_bats: 3      # 不振判定: この打数以上で無安打なら減点対象
  match_hitless_penalty: 0.04       # 不振の減点
  match_quality_start_min_outs: 15  # 好投判定: 投球回(アウト数)がこれ以上（15=5回）
  match_quality_start_max_runs: 2   # 好投判定: 失点がこれ以下
  match_quality_start_bonus: 0.05   # 好投の加点
  match_rocked_runs_threshold: 5    # 被弾判定: 失点がこれ以上
  match_rocked_penalty: 0.05        # 被弾の減点
  match_blowout_loss_margin: 7      # 大敗判定: 点差がこれ以上
  match_blowout_loss_penalty: 0.03  # 大敗時、出場者全員への追加減点

# --- 特殊能力の効果量・出現率（設計書10）🟡 スキルなしの選手には作用しない（帯不変） ---
# スキルの定義（id・カテゴリ・説明）は data/skills.yaml。ここは効果の強さと生成率だけ。
skills:
  # 打撃系（試合内・行動特性）
  slow_starter_bat_contact_per_pa: 1.6   # 尻上がり: 打席数あたりのミート増
  slow_starter_bat_max_bonus: 6.0
  spray_pull_factor: 0.55                # 広角打法: 引っ張りバイアスの縮小倍率（issue #262。旧 spray_bearing_factor＝σ拡大は廃止）
  first_pitch_swing_prob: 0.62           # 初球から振る
  grinder_foul_factor: 1.30              # 粘り打ち: ファウル率拡大（球数を吐かせる）
  streaky_variance_factor: 1.7           # ムラっけ: 当日の出来の振れ幅拡大
  # 投手系（試合内・非線形）
  slow_starter_pitch_control_per_bf: 0.45
  slow_starter_pitch_max_bonus: 8.0
  second_time_through_batters_faced: 18  # 打者一巡: 3巡目〜崩れる
  second_time_through_control_penalty: 6.0
  second_time_through_stuff_penalty: 0.10
  effectively_wild_control_penalty: 7.0  # 荒れ球: 制球↓（四球増）だが…
  effectively_wild_stuff_bonus: 0.13     # …打ちにくい
  deceptive_ball_stuff_bonus: 0.18       # クセ球: 球速に依らない空振り誘発
  # 守備系
  double_play_artist_bonus: 0.06
  master_catcher_lead_bonus: 10          # 名捕手: 実効リード+10（設計書10, 01 §2①）
  # チーム系
  spiritual_pillar_captain_factor: 1.4   # 精神的支柱: 主将の緩和量拡大（設計書09 §8）
  moodmaker_mitigation_bonus: 0.06       # ムードメーカー: 出場中なら緩和量へ加算（主将とは別枠、複数人でも重複しない）
  practice_leader_exp_factor: 1.05       # 練習リーダー: 保有者が居ると他の全部員の週間経験値へ乗る倍率
  role_model_exp_factor: 1.08            # お手本: 先輩・同ポジション保有者が居るとその後輩の週間経験値へ乗る倍率
  # 体質・成長系
  diligent_exp_factor: 1.15
  lazy_exp_factor: 0.85
  durable_injury_factor: 0.55
  injury_prone_injury_factor: 1.8
  # 目玉（怪物: 複数分野に確かな上乗せ）
  monster_contact_bonus: 4.0
  monster_power_bonus: 4.0
  monster_control_bonus: 4.0
  monster_stuff_bonus: 0.10
  # 生成（0〜数個、目玉は極稀、一部は隠し）
  max_skills_per_player: 3
  common_skill_prob: 0.16
  hidden_share: 0.22
  marquee_skill_prob: 0.008
  pillar_leadership_threshold: 68
  pillar_bonus_prob: 0.35

# --- 性格（設計書01 §1.1, CHANGELOG 22b）🟡 母集団平均が中立になるよう重みと係数を対称化（帯ドリフト最小化） ---
# 内部4傾向値: ①統率(leadership_mean_offset) ②素直さ(coaching_receptivity) ③勤勉さ(self_growth_factor)
# ④自己犠牲⇔目立ちたがり(bunt_success_bonus 加算 / chance_hit_factor 得点圏強攻の長打質倍率)。各軸の効き先は1つ。
personalities:
  factor_jitter_sd: 0.06     # PersonalityFactor のタイプ内個体差σ（タイプが中心）
  factor_min: 0.75
  factor_max: 1.25
  profiles:
    #                  weight  coaching  growth  bunt    chance  lead
    - { type: HotBlood,     spawn_weight: 1.0, coaching_receptivity: 1.00, self_growth_factor: 1.08, bunt_success_bonus:  0.05, chance_hit_factor: 0.99, leadership_mean_offset:  14 }
    - { type: Hardworker,   spawn_weight: 1.4, coaching_receptivity: 1.06, self_growth_factor: 1.10, bunt_success_bonus:  0.05, chance_hit_factor: 0.99, leadership_mean_offset:   4 }
    - { type: Genius,       spawn_weight: 0.5, coaching_receptivity: 0.88, self_growth_factor: 1.10, bunt_success_bonus: -0.06, chance_hit_factor: 1.10, leadership_mean_offset:   0 }
    - { type: HonorStudent, spawn_weight: 1.0, coaching_receptivity: 1.10, self_growth_factor: 1.00, bunt_success_bonus:  0.05, chance_hit_factor: 0.98, leadership_mean_offset:  12 }
    - { type: MyPace,       spawn_weight: 1.4, coaching_receptivity: 0.94, self_growth_factor: 0.95, bunt_success_bonus:  0.00, chance_hit_factor: 1.00, leadership_mean_offset:   0 }
    - { type: MoodMaker,    spawn_weight: 1.2, coaching_receptivity: 1.00, self_growth_factor: 0.92, bunt_success_bonus: -0.06, chance_hit_factor: 1.08, leadership_mean_offset:   4 }
    - { type: LoneWolf,     spawn_weight: 0.8, coaching_receptivity: 0.92, self_growth_factor: 1.00, bunt_success_bonus: -0.05, chance_hit_factor: 1.06, leadership_mean_offset: -16 }
    - { type: Introvert,    spawn_weight: 1.2, coaching_receptivity: 1.08, self_growth_factor: 0.95, bunt_success_bonus:  0.04, chance_hit_factor: 0.97, leadership_mean_offset: -14 }

# --- プレッシャー指数×精神力（設計書02 §3.1-3.2）🟡 精神力50は常に恒等（帯不変） ---
pressure:
  late_inning_from: 8        # 8回以降 +1
  close_score_diff: 2        # 2点差以内 +1
  risp_point: 1              # 得点圏 +1
  bases_loaded_point: 2      # 満塁 +2
  retirement_point: 1        # 負けたら引退（3年夏）+1
  max_index: 8
  multiplier_slope: 0.02     # 倍率 = 1 + (精神力−50)/50 × slope × P（精神力100・P8で+16%）
  fatigue_negative_amplify: 1.5   # 疲労閾値超過時は負側のみ増幅（終盤の失点劇）

# --- 采配（設計書09: サイン/守備指示/伝令/主将）🟡 判断閾値と効果量 ---
tactics:
  # 攻撃サイン判断（StandardTacticsBrain＝委任・敵AIの土台）
  sac_bunt_from_inning: 7
  sac_bunt_prob: 0.55
  sac_bunt_tie_break_prob: 0.90    # タイブレークでは犠打価値が跳ね上がる（§7）
  sac_bunt_max_power: 58
  sac_bunt_min_skill: 40
  sac_bunt_max_behind: 2
  sac_bunt_max_ahead: 1
  squeeze_from_inning: 8
  squeeze_prob: 0.28
  squeeze_max_diff_abs: 1
  squeeze_min_bunt: 55
  # issue steal-thresholds-unreachable（2026-08-27）: 旧0.72は実ロスター実測の到達可能上限（p99=60.7%・
  # max=65.8%）を超えていて原理的に一度も通らない死にコードだった。0.50は概ねp70相当（詳細は
  # TacticsCoefficients.StealMinSuccess のコメント参照）。
  steal_min_success: 0.50          # 解決式の成功見込みがこの値以上で仕掛ける
  steal_prob: 0.45
  # 三盗・本盗（issue #67, design-14 未決A）: 二塁のみ在塁／三塁のみ在塁でのみ判定。塁状況が排他のため
  # 一・三塁の重盗（baserunning.double_steal_third_break_prob）とは競合しない。
  # 三盗: issue steal-thresholds-unreachable（2026-08-27）: 旧コメントの想定天井（俊足×弱肩でも≈0.4〜0.65）
  # は実測と食い違い、実際の到達可能上限は p99=6.4%・max=7.9%（実ロスター11200件）。旧0.30は死にコード
  # だった。0.045は概ねp85相当（詳細はTacticsCoefficients.StealThirdMinSuccessのコメント参照）。
  steal_third_min_success: 0.045
  steal_third_prob: 0.25
  steal_third_max_outs: 0          # 無死のみ
  steal_third_max_diff_abs: 3      # 大差では狙わない
  # 本盗: 超高閾値のギャンブル枠。issue #637 で解決式を直し、成功見込みが走者で変わるようになった
  # （通常始動の見込みで 走力50≈1.6%・70≈3.2%・90≈5.9%）。閾値は走力70前後から上だけが仕掛ける水準＝0.03
  # （実際の企図はギャンブル始動＝成功率は見込みの約2倍）。
  steal_home_min_success: 0.03
  steal_home_prob: 0.10
  steal_home_max_outs: 1
  steal_home_max_diff_abs: 1       # 僅差のみ（スクイズと競合する場面はGameEngine側で単純上書き）
  hit_and_run_prob: 0.07
  hit_and_run_min_contact: 55
  hit_and_run_max_power: 65
  # ギャンブル始動（設計書12 §5, G3b）: 際どい盗塁ほど好ジャンプ・意表に賭ける
  gamble_start_max_success: 0.82   # 見込みがこの値未満の盗塁でギャンブルを検討
  gamble_start_prob: 0.40          # 際どい盗塁でギャンブル始動に賭ける確率
  take_max_control: 40
  take_prob: 0.30
  # 本塁への送り判定（設計書12 §3/§4, F2）: 生還推定確率がこの閾値以上なら還す
  send_home_min_success: 0.50        # 中立采配の送り閾値（Slice C校正: 憤死を目標帯へ）
  send_home_two_out_relax: 0.30      # 2アウトは緩和（積極的に還す）
  send_home_aggression_span: 0.50    # aggression(0..1)で閾値を±動かす幅
  # 三塁への送り判定（単打の一塁→三塁, Issue #89）: 三塁は失うものが小さく閾値は本塁より低め
  send_third_min_success: 0.60       # 中立采配で三塁へ回す閾値
  send_third_two_out_relax: 0.25     # 2アウトは緩和
  send_third_aggression_span: 0.45   # aggression(0..1)で閾値を±動かす幅
  # ゴロ凡打の進塁打の送り判定（二塁→三塁, Issue #318）: アウト数を取らない（2アウト緩和なし）。
  # ゴロ凡打は currentOuts>=2 で ApplyInPlayOut が即 return するため 2アウト緩和は死にコードになる。
  send_advance_min_success: 0.35     # 中立采配で進塁を狙う閾値
  send_advance_aggression_span: 0.40 # aggression(0..1)で閾値を±動かす幅
  # 犠飛以外のタッチアップの送り判定（design-14 P3-11）。静止から出るぶん博打の分が悪く、実物の三塁コーチも
  # 「ほぼ確実な時だけ行かせる」＝他の送り閾値より高い。進塁打の0.35を流用すると送った試行の3〜4割が走塁死になる。
  send_tag_up_min_success: 0.85      # 中立采配でタッチアップを行かせる閾値
  send_tag_up_aggression_span: 0.20  # aggression(0..1)で閾値を±動かす幅
  # 内野深さ×ゴロ×本塁（G1, 設計書12 §4/§5）は深さで本塁プレーの有無を分岐（前進=勝負/後退=献上/通常=テーブル）。
  # 送りバイアスは baserunning.home_grounder_start_delay_seconds で調整。
  # 守備指示判断
  bunt_shift_prob: 0.50
  infield_in_from_inning: 8
  infield_in_max_lead: 1
  outfield_deep_min_power: 72
  control_first_max_control: 38
  keep_low_min_power: 75
  gear_push_innings_left: 1
  gear_push_max_diff_abs: 1
  gear_coast_min_lead: 5
  # 敬遠（design-14 P1-3）: 一塁空き・得点圏・強打者・僅差終盤で次打者と勝負。既定オフ
  intentional_walk_min_power: 70
  intentional_walk_from_inning: 6
  intentional_walk_max_diff_abs: 3
  intentional_walk_prob: 0.6
  # 伝令判断（攻守各3回, §3）
  defense_timeout_min_pressure: 3
  offense_timeout_min_pressure: 5
  offense_timeout_max_mental: 42
  # 選手交代判断（設計書09 §6, C-2。決定論=能力の極値を選ぶ）
  pinch_hit_from_inning: 7
  pinch_hit_contact_ceiling: 46      # この打者ミート以下を代打候補に
  pinch_hit_improvement: 12          # 控えがこれだけミート上なら送る
  pinch_hit_min_diff: -3             # 代打を出す得失点差レンジ（僅差〜小ビハインド）
  pinch_hit_max_diff: 2
  pinch_run_from_inning: 8
  pinch_run_speed_ceiling: 44        # この走力以下の走者を代走候補に
  pinch_run_improvement: 22          # 控えがこれだけ走力上なら送る
  pinch_run_min_diff: -2             # 1点を取りにいく場面（ビハインドこの点以内〜+1）
  defensive_sub_from_inning: 8
  defensive_sub_min_lead: 1          # このリード以上で守備固め
  defensive_sub_fielding_ceiling: 44 # この守備以下を交代候補に
  defensive_sub_improvement: 12      # 控えがこれだけ守備上なら固める
  # サイン効果（補正係数。パイプライン不変）
  hit_and_run_contact_boost: 0.10
  hit_and_run_power_penalty: 0.15
  hit_and_run_launch_penalty: 0.20
  hit_and_run_caught_penalty: 0.15
  # 打撃姿勢（采配カード。プレイヤーが選んだ打席にだけ載る＝AI駆動のシムは不変）
  work_count_swing_factor: 0.82    # 待球策: スイング頻度の倍率（<1で球数を投げさせる）
  ground_ball_launch_penalty: 0.30 # 転がせ
  ground_ball_contact_boost: 0.05
  ground_ball_power_penalty: 0.10
  slug_power_boost: 0.12           # 長打狙い
  slug_launch_boost: 0.20
  slug_contact_penalty: 0.12
  put_in_play_contact_boost: 0.14  # 当てに行け
  put_in_play_power_penalty: 0.18
  buster_vs_shift_bonus: 0.08
  buster_penalty: 0.05
  squeeze_read_base: 0.08          # ウエスト（バッテリー察知）
  squeeze_read_per_lead: 0.002
  squeeze_read_obvious_bonus: 0.05
  # 陣形→初期守備位置（効果は幾何＝物理から出る, §2.1）
  infield_in_factor: 0.82
  infield_deep_factor: 1.12
  outfield_in_factor: 0.88
  outfield_deep_factor: 1.10
  bunt_shift_corner_charge_factor: 0.60
  # 配球方針の重み（§2.2）
  fastball_heavy_share_delta: 0.25
  breaking_heavy_share_delta: -0.25
  control_first_aim_sigma_factor: 0.72
  keep_low_aim_y_offset_m: -0.18
  inside_aim_x_offset_m: 0.15
  # 伝令効果・動揺・主将（§3/§8）
  timeout_mitigation: 0.60
  timeout_duration_pa: 3
  rattled_consecutive_baserunners: 3
  rattled_negative_amplify: 1.4
  rattled_threshold_mental_offset: 1   # 精神力50で従来同値・100で+1しにくく・0で-1しやすく（issue #73）
  rattled_recovery_outs: 2             # 動揺後、無失点でこの数アウトを重ねると自然回復（issue #73）
  captain_mitigation_per_power: 0.004   # 統率力（統率傾向×精神力/100）1あたりの負補正緩和
  captain_bench_factor: 0.30
  # 1球采配（設計書15 §2.3, Phase C）
  pitch_tactics_two_strike_force_swing_prob: 0.0   # 追い込まれ矯正はbatting.two_strike_*（本則）へ統合済み・無効化
  pitch_tactics_two_strike_min_contact: 50
  pitch_tactics_three_zero_take_prob: 0.0          # 3-0待てはbatting.three_zero_swing_factor（本則）へ統合済み・無効化
  pitch_tactics_three_zero_swing_away_min_power: 80
  pitch_tactics_three_zero_swing_away_from_inning: 7
  pitch_tactics_three_zero_swing_away_max_diff_abs: 1
  pitch_tactics_put_away_prob: 0.50                # 守備: 2ストライク後の決め球切替
  pitch_tactics_control_first_min_balls: 3         # 守備: 不利カウントでゾーンに集める

# --- 敵AI（設計書11: 三層＝能力値ミス率×ティア引き出し×校風）🟡 別途の難易度補正は持たない ---
# プレイヤーとAIは同じ采配システム（tactics:）を使い、選び方だけがこの三層で変わる。
enemy_ai:
  # ① 能力値層: 最適解選択率 = base + 采配能力 × per_sense
  optimal_base: 0.55
  optimal_per_sense: 0.004
  optimal_floor: 0.50
  optimal_cap: 0.98
  reckless_on_miss_prob: 0.18       # 正着を外したとき無謀な盗塁に走る確率
  # ② ティア層: 各戦術の最低ティア（0=G 〜 7=S）
  safety_bunt_min_tier: 2           # E: 状況セーフティ
  steal_min_tier: 2                 # E: 状況盗塁
  steal_third_min_tier: 4            # C: issue #67 三盗は状況を見極めた上位校のみ
  steal_home_min_tier: 6             # A: issue #67 本盗は超高閾値のギャンブル枠＝最上位のみ
  gamble_start_min_tier: 4          # C: ギャンブル始動（好ジャンプ・意表, G3b）
  squeeze_min_tier: 5               # B: 上級
  hit_and_run_min_tier: 5           # B: 上級
  buster_min_tier: 5                # B: 上級
  depth_min_tier: 2                 # E: 守備位置調整
  bunt_shift_min_tier: 5            # B: 守備シフト
  advanced_policy_min_tier: 2       # E: カウント別配球
  inside_policy_min_tier: 5         # B: 内角・釣り球
  gear_min_tier: 4                  # C: ギア先読み
  timeout_min_tier: 2              # E: 伝令運用
  pinch_hit_min_tier: 2             # E: 代打の基本運用
  pinch_run_min_tier: 4             # C: 代走の使いどころ
  defensive_sub_min_tier: 3         # D: 守備固め
  pitch_tactics_min_tier: 2        # E: 1球采配（カウント別の基本判断, 設計書15 §2.3）
  # ③ 校風層: 采配傾向の重み
  small_ball_steal_factor: 1.7
  small_ball_bunt_factor: 1.4
  small_ball_bunt_inning_earlier: 2
  small_ball_hit_and_run_factor: 1.8
  small_ball_steal_min_success_relax: 0.08
  small_ball_gamble_start_factor: 1.8   # 機動力校はギャンブル始動を多用（G3b）
  power_bunt_factor: 0.30
  power_take_factor: 1.5
  power_squeeze_factor: 0.40
  defensive_bunt_factor: 1.4
  defensive_shift_factor: 1.4
  defensive_coast_lead_earlier: 1
  defensive_sub_inning_earlier: 1        # 守り勝つ: 守備固めを早める
  small_ball_pinch_run_inning_earlier: 1 # 機動力: 代走を早める
  ace_dependent_defense_timeout_keep_prob: 0.45
  # ④ 監督傾向層（issue #55, 校風と別軸で0〜2個重なる采配の癖）
  bunt_heavy_bunt_factor: 1.5                 # 1) バント多用
  bunt_heavy_bunt_inning_earlier: 2
  run_and_gun_steal_factor: 1.6              # 2) 盗塁・エンドラン好き
  run_and_gun_hit_and_run_factor: 1.8
  run_and_gun_steal_min_success_relax: 0.06
  ace_overuse_relieve_margin_factor: 1.6     # 3) エース酷使（継投を引っ張る＝諸刃。ハードキャップ撤廃で margin だけで表現, issue #356）
  quick_hook_relieve_margin_factor: 0.45     # 4) 継投早め
  quick_hook_defensive_sub_inning_earlier: 1
  aggressive_pinch_hit_inning_earlier: 2     # 5) 代打積極
  aggressive_pinch_hit_ceiling_relax: 6
  aggressive_pinch_hit_improvement_relax: 4
  promoter_condition_weight: 9.0             # 6) 抜擢型（調子重み・起用判断）
  promoter_min_condition_step: 1
  squeeze_lover_squeeze_factor: 2.0          # 7) スクイズ好き
  aggressive_gear_push_innings_more: 1       # 8) 強気ギア
  aggressive_gear_push_diff_more: 1
  aggressive_gear_coast_lead_later: 2
  cautious_intentional_walk_prob: 0.55       # 9) 慎重（敬遠ためらわない）
  cautious_intentional_walk_min_power_relax: 4
  # ⑤ エース温存層: 先発選択（issue #42, 設計書11 §2/§3）🟡実測校正
  ace_rest_min_tier: 3                        # D: ローテ運用の基本判断（未満は常時エース先発）
  ace_rest_base: 0.05
  ace_rest_tier_gap_weight: 0.05              # 相手とのティア差1段あたり（自校が格上なほど加点）
  ace_rest_rounds_remaining_weight: 0.05      # この試合の後に残るラウンド数1つあたり（決勝は加点なし）
  ace_rest_fatigue_weight: 0.35               # エースの直近消耗負荷（0〜1正規化）
  ace_rest_fatigue_window_days: 7             # 消耗負荷を見る直近日数の窓（#41 台帳）
  ace_rest_fatigue_reference_pitches: 100.0   # 消耗負荷=1.0とみなす基準球数
  ace_rest_floor: 0.0
  ace_rest_cap: 0.85
  ace_rest_ace_dependent_factor: 0.2          # 豪腕依存: 打線は水物＝エースにほぼ常に頼る
  ace_rest_defensive_minded_factor: 1.6       # 守り勝つ野球: ローテ管理に積極的
  ace_rest_total_baseball_factor: 1.4         # 全員野球: 選手層を使い回す方針の一環
  # ⑦ 守備位置操作層（issue #255, 設計書09 §2.3/§6.2）🟡実測校正
  # AIが「守備位置の入替（交代回数を消費しない無料の手）」と「コンバート継投」を打てるようにする層。
  # ⑥ 高度な継投層と同じ2段運用（①既定オフで配線 → ②有効化して帯を実測 → 採否）で入れ、
  # 実測の結果このティアで採用した（オーナー決定 2026-07-26）。
  # 通るのは AiTacticsBrain（相手校・委任采配）だけ＝StandardTacticsBrain 駆動の
  # games_10k/tactics 帯・決定論baseline は動かない。
  defense_swap_min_tier: 3                    # A-2: 守備位置の入替（D＝守備固め defensive_sub_min_tier と同じ引き出し帯）
  defense_swap_from_inning: 7                 # A-2: 終盤限定（この回以降）
  defense_swap_max_score_diff: 2              # A-2: 僅差限定（守備側視点の点差の絶対値）
  defense_swap_min_gain: 4.0                  # 守備スコアの最小改善量（これ以下では動かさない）
  defensive_minded_swap_tier_bonus: 1         # 守り勝つ: 組み替えに積極的
  ace_dependent_swap_tier_penalty: 1          # 豪腕依存: 投手任せで守備を動かさない
  # 守備位置ごとの負担重み（守備スコア = Σ 重み × Fielding）。捕手・投手・DHは入替対象外なので持たない。
  defense_weight_shortstop: 1.00
  defense_weight_center_field: 0.90
  defense_weight_second_base: 0.80
  defense_weight_third_base: 0.70
  defense_weight_right_field: 0.55
  defense_weight_left_field: 0.45
  defense_weight_first_base: 0.30
  convert_relief_min_tier: 5                  # B-1: コンバート継投（B＝交代枠を1つ払う上級の運用）
  convert_relief_min_batting: 60.0            # 元投手の (ミート+パワー)/2 がこれ以上なら打順に残す

