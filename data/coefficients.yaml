records:
  qualified_plate_appearances_per_game: 2.0   # 規定打席＝チーム試合数×この係数（NPBは3.1）
  qualified_outs_per_game: 3.0                # 規定投球回＝チーム試合数×この係数[アウト]（3.0＝1試合1回）

# --- 練習試合（設計書03 §週ターン③・設計書04 §名声の効果） ---
practice_match:
