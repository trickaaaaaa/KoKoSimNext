  min_accept: 0.02
  max_accept: 0.98

# --- 監督キャリア（設計書04 §1） ---
career:
  coaching_growth_per_year: 3.0     # 采配経験による指導力上昇
  coaching_growth_per_win: 0.8
  coaching_cap: 99.0
  # 指導力→チーム力の押し上げ。0.78→0.88（issue prefecture-high-rank-distribution・2026-09-05）:
  # 母集団の strength_sd を 13→15 に広げると県1位が 80.1→85.5 に上がるので、プレイヤー側の上限も追従させる。
  # 据え置きだと 20年キャリアのセンバツ出場が 2.77→1.32回・生涯0回が 20%→49%（200シード実測）。0.88 で 2.23回・28%。
  # strength_sd を動かしたらここも見直すこと（世界とプレイヤーの相対位置を決める係数）。
  coaching_to_strength: 0.88
  free_koshien_threshold: 1         # 甲子園1回でフリー資格
  free_fame_threshold: 52.0         # または名声60
  min_tenure_years: 3               # 赴任してから強制転任の対象になるまでの最低在任年数（採った1年生の卒業年数）
  retain_trust_threshold: 60.0      # 残留確率ロジスティックの中点（この信頼度で残留確率＝上限の半分）
  retain_trust_spread: 10.0         # ロジスティックの傾き（信頼度の効き幅）
  retain_probability: 0.8           # 高信頼時の残留確率の上限
  # 2026-08-15（案2）: 甲22/勝1.5/減衰0.92 → 甲30/勝4.0/減衰0.80。旧値は時定数 1/(1−0.92)=12.5年で
  # 名声が「勝っても動かない」（年2勝で5年目12・10年目21）。新値は時定数5年・定常=勝数×20（旧18.75と同等）＝
  # 上がりも下がりも速い（100→年1勝で6年後41）。全国優勝は甲子園本戦の実プレイ接続まで実ゲームでは発火しない。
  fame_koshien_appearance: 30.0
  fame_national_champion: 45.0
  fame_per_win: 4.0
  fame_decay: 0.80
  # 2026-08-26（案C+D）: 加算だけだと ①名声のレンジが強さ60台で使い切られる（実ゲームの年間公式戦勝数は
  # 強さ65で約5勝＝定常99＝S に張り付く）②県大会を制した年は名声がいくつでも1年でSへ飛ぶ（+91.7）。
  # 上げ方の形で寝かせる（勝数の数え方は変えない）。out/issues-pending/fame-rises-too-fast.md
  fame_gain_ceiling: 100.0        # 逓減の基準（上昇側にだけ ×(1−名声/この値)。定常＝100g/(20+g)）
  fame_season_rise_cap: 12.0      # 1年に上がれる正味の名声（等級の帯幅10なので1年1段強。下降側には効かない）
  # 番狂わせ連動の名声変動（issue #170）。格上撃破=金星で↑、格下敗北=取りこぼしで↓。順当な結果には効かない。
  fame_upset_win_per_tier: 3.0    # 格上に勝った時のTier格差1段あたりの上昇（金星）
  fame_upset_loss_per_tier: 3.5   # 格下に負けた時のTier格差1段あたりの低下（取りこぼし・やや重く）
  fame_upset_season_cap: 8.0      # 1シーズンの金星上昇の頭打ち（短期で急上昇させない）
  trust_reset: 50.0                 # 転任で信頼度リセット
  trust_per_win: 4.0
  trust_koshien: 20.0
  trust_poor_season_penalty: 12.0
  annual_budget_base: 80.0
  budget_per_trust: 0.8
  # 年間固定支出（Issue #128, 万円）。年度替わりに予算から差し引く。0で従来一致。
  summer_camp_cost: 20.0            # 夏合宿費（設計書04 §4）
  winter_camp_cost: 25.0            # 冬合宿費（設計書04 §4・冬は長め）
  scout_cost: 30.0                  # スカウト年間費用（#127連動）。年契約カタログのスカウト網 Lv1 と同額に保つ
  # 施設基金（設計書04 §1.4「OB・後援会寄付」）。部費とは別会計で、建物だけに使う。
  # 現実の高校でも寮・室内練習場・ナイターは部費でなく学校の設備投資と後援会の寄付で建つ。
  facility_fund_school_base: 100.0        # 学校の設備投資[万円/年]（実績によらない土台。名声由来の寄付を主役にするため小さく）
  facility_fund_donation_per_fame: 20.0   # 後援会・OB寄付（名声1あたり[万円/年]。名声100で年2000万）
  facility_fund_koshien_bonus: 1000.0     # 甲子園出場の年の一時金[万円]
  facility_fund_national_title_bonus: 5000.0  # 全国優勝の年の一時金[万円]（出場ぶんに上乗せ）
  # 甲子園出場が決まった日にOB・卒業生から入る激励金（設計書05 §1.1a）。上の施設基金とは別の財布
  # ＝**部費**（遠征・宿泊・応援バス）で、その場でイベントとして見える形で入る。
  koshien_berth_donation_base: 120.0      # 土台[万円]（年間予算 80+0.8×信頼 の約1倍）
  koshien_berth_donation_per_fame: 1.5    # 名声1あたりの上乗せ[万円]
  new_school_strength_mean: 34.0    # 教員監督の赴任先は弱小
  new_school_strength_sd: 6.0
  free_choice_school_strength: 48.0 # フリー化後の本拠地
  # フリー監督のオファー（設計書04 §1.3「残留自由・他校オファーの選択制」）。残留はいつでも選べる。
  free_agent_offer_chance: 0.35     # 1年にオファーが届く確率
  free_agent_offer_count: 2         # 1回のオファーで並べる移籍先候補数（残留は別枠）
  free_agent_offer_spread: 10.0     # 候補校の強さの散らばり（free_choice_school_strength を中心）

# --- 施設（Issue #128・設計書03 §4 / 04 §4）: funds→施設購入の支出先。多軸（照明/室内/寮/トレ） ---
# 各系統は tiers[0]=施設なし（費用0・効果0）から並べる。全系統Lv0で従来一致（不変条件#2）。
# 全系統Lv3の合計で coef_add=+1.40 / budget_add=+400分 ＝ 基準(1.0/300)に足すと (2.40, 700分) で
# 旧 training.facility_tiers Lv4 と一致し #115 の校正を保つ。cost はたたき台（要バランス調整）。
# Unity実プレイは FacilityCatalog.Default（C#既定・本ブロックと同値）を使う。
facilities:
  - id: lighting          # 照明設備: 夜間練習で練習時間↑
    name: 照明設備
    tiers:
      - {}
      - { cost: 2000, budget_add: 80 }
      - { cost: 3000, budget_add: 80 }
      - { cost: 5000, budget_add: 90 }
  - id: indoor            # 室内練習場: 雨天でも練習（時間）＋設備（効率）
    name: 室内練習場
    tiers:
      - {}
      - { cost: 3000, coef_add: 0.15, budget_add: 50 }
      - { cost: 5000, coef_add: 0.15, budget_add: 50 }
      - { cost: 8000, coef_add: 0.15, budget_add: 50 }
  - id: dorm              # 寮: 生活・体調管理で効率↑。Lv1 で能動勧誘枠が2つ解禁（設計書04 §2.2・#588）
    name: 寮
    tiers:
      - {}
      - { cost: 5000,  coef_add: 0.15, recruit_slots: 2 }   # 枠は Lv1 だけ＝上げても「年最大2名」は変わらない
      - { cost: 8000,  coef_add: 0.15 }
      - { cost: 12000, coef_add: 0.15 }
  - id: weight            # トレーニング場: ウェイト・マシンで効率↑
    name: トレーニング場
    tiers:
      - {}
      - { cost: 500,  coef_add: 0.15 }
      - { cost: 1000, coef_add: 0.15 }
      - { cost: 2000, coef_add: 0.20 }
  # 医務室: 怪我が起きにくくなり復帰も早まる。coef_add / budget_add を持たないので
  # 全系統Lv3の (2.40 / 700分) は動かない（#115の校正を保つ）。累計Lv3で発生率0.61倍・全治週0.73倍。
  - id: clinic
    name: 医務室
    tiers:
      - {}
      - { cost: 150, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }
      - { cost: 300, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }
      - { cost: 500, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }

  # --- 練習道具（kind: equipment）: 効果小 Lv1 / 効果大 Lv2 の2段。
  # 施設の練習効率が全メニュー一律なのに対し、道具は振っているメニューの分野にだけ効く。
  # 累計 Lv2 で 1.05 × 1.07 ≒ +12%。
  - id: gear_batting
    name: 打撃の道具
    kind: equipment
    tiers:
