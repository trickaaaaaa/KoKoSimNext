# 表示層→物理層の変換係数（不変条件#1: 変換式はここに集約）。
# バランス調整はこのファイルの編集で行い、C# は書き換えない（不変条件#4）。
# 読込は KokoSim.Config が担い、純エンジンへ型付きオブジェクトとして注入する（不変条件#3: エンジンはIOを持たない）。

version: 1

# --- 空力・物理定数（弾道積分の係数, 設計書01 §2⑥） ---
aerodynamics:
  ball_mass_kg: 0.145
  ball_radius_m: 0.0365
  air_density: 1.225
  gravity: 9.81
  drag_coefficient: 0.35
  # 揚力係数 Cl = min(lift_coefficient_per_spin_factor × S, max_lift_coefficient), S = r|ω|/|v|
  lift_coefficient_per_spin_factor: 0.80
  max_lift_coefficient: 0.35

# --- マウンド幾何 ---
mound:
  # リリース〜本塁の実効距離[m]（18.44m − エクステンション約1.7m。本塁後端基準＝意図した値・#1252 項目7）
  release_to_plate_distance_m: 16.74

# --- 投球（表示層→物理層, 設計書02 §1.2） ---
pitching:
  # コントロール → 投球散布σ[cm]: σ = intercept − C×slope（例: C50→19cm, C100→8cm）
  control_to_sigma:
    intercept_cm: 30.0
    slope_cm_per_point: 0.22
    min_sigma_cm: 2.0
  # 死球（HBP, design-14 未決F・2026-07-20）: 散布結果が体側ウィンドウ（打者の内角側・高さ帯）へ入り
  # 回避に失敗した球。右打者はX負側・左打者（スイッチ含む）はX正側🟡
  hbp_body_edge_m: 0.45          # 体側ウィンドウの内縁|X|[m]（ゾーン半幅0.216+ボックス余白）
  hbp_body_bottom_m: 0.20        # 下端[m]（これ未満はワンバウンド＝ボール）
  hbp_body_top_m: 1.60           # 上端[m]（これ超は頭上抜け＝ボール）
  hbp_dodge_prob: 0.85           # ウィンドウ内の球を打者が避けられる確率
  # 毎球の球速ばらつき（設計書02 §1.1d）: 最速=天井、常時は−3〜5km/h、たまに最速付近 🟡
  velocity_drop_mean_kmh: 4.0
  velocity_drop_sigma_kmh: 1.8
  velocity_drop_max_kmh: 10.0
  # 配球（Phase 簡略。設計書09で采配・慣れ §2.3b に接続）
  straight_share: 0.55
  catcher_lead_stuff_per_point: 0.004   # 捕手リード→球威（設計書01 §2①）。(Lead−50)×これ。50=恒等
  lead_straight_share_max_shift: 0.10   # 捕手リード→配球のストレート比率シフト上限（符号あり・catcher_lead_stuff_per_pointと同じ対称設計）。(Lead−50)×投手の軸差(FB球威 vs 変化球キレ平均)で最大この幅。Lead50/軸互角は恒等
  lead_pitch_weight_max_exponent: 1.0   # 捕手リード→変化球の選び分け強さ上限。weight=Rank^exponent（exponent=leadFactor×これ、符号あり）。Lead50/変化球1本以下は一様抽選のまま
  pitcher_sense_lead_weight: 0.5        # 投手センス→配球の質（issue #1472）。選び分けの配球力＝捕手リード＋(投手センス−50)×これ（センスは効きPitching通し）。球威の上乗せには足さない。0で従来どおり
  # 回転数マッピング（設計書15 §0.1 Q12-5, Phase B観測専用の暫定式。判定には未接続＝帯に無関係）
  # Issue #274: 球種分岐。ストレート=球威(Power)軸、変化球=キレ(Sharpness)軸。
  spin_rpm_base: 2200.0            # 基準回転数[rpm]（能力=50のとき・145km/h・2200rpm）
  spin_rpm_per_power: 6.0          # ストレート: 球威(Power−50)あたりの傾き[rpm/能力1]（Issue #274）
  # 変化球: キレ＝ストレートからの回転の外れの大きさ（issue #911・2026-11-14 監督決定・PitchSpinModel）。
  # 回転ベクトル＝ストレート＋g×(球種の基準回転−ストレート)、g＝1＋(キレ−50)×これ（下限0）。球種の基準回転＝spin_rpm_base×rpm_scale・tilt_deg
  sharpness_deviation_per_level: 0.02   # 1000試合の能力感度（キレ20→80の相手得点）: 0.01→−0.29／0.015→−0.44／0.02→−0.45（打高寄せ後: 0.015→−0.29／0.02→−0.41）
  # 球種ごとの回転軸・実効回転数倍率（設計書02 §2.1・issue #835）。
  # 「全球種バックスピン固定」だった穴（issue #835）を塞ぐ。tilt_deg は回転軸角度（0=純バックスピン=ホップ、
  # 180=純トップスピン=落下方向を強める、±90=純サイドスピン）。横の向きは投げ手で反転する（issue #962）:
  # + ＝ 投げ腕の側（左投手の+x＝一塁側／右投手は反転して−x＝三塁側）。シュート系(+)は腕側へ、スライダー系(−)は反対側へ曲がる。反転は PitchSpinModel.ForThrower の1か所だけ。
  # rpm_scale は spin_rpm_base 系の基準回転数に対する実効回転数の倍率（グリップの生回転差＋ジャイロ無効成分を
  # 1つにまとめた実効値。2つの係数は式の上で完全に同じ効き方をするため不変条件#1に従って1つへ集約）。
  # speed_ratio は球速比（設計書02 §2.1）。実投球速度＝サンプリング球速×これ。反応球速・球威・変化量の割引にも直接効く。
  pitch_axis:
    - type: fastball    # バックスピンによるホップ成分
      tilt_deg: 0.0
      rpm_scale: 1.00
      speed_ratio: 1.00
    # issue #1016: 縦・横は能力50・最速140km/h・球種の球速比での誘発変化（PitchSimulator.Simulate）。+横＝投げ腕の側。
    #   シンカー・チェンジアップ・シュートは弱いバックスピン（ストレートより浮かない分だけ沈む）。カーブはスライダーと同じ側。
    - type: two_seam     # 微シュート＋微沈（縦+20/横+20cm）
      tilt_deg: 45.0
      rpm_scale: 0.62
      speed_ratio: 0.98
    - type: cutter       # 小さく横滑り（縦+20/横−10cm）
      tilt_deg: -27.0
      rpm_scale: 0.48
      speed_ratio: 0.96
    - type: slider       # 横の大きな変化（縦+5/横−30cm。生回転はストレート以上でもジャイロが多く実効は小さい）
      tilt_deg: -80.0
      rpm_scale: 0.62
      speed_ratio: 0.90
    - type: curve        # 縦の大変化＋スライダーと同じ側（縦−30/横−20cm）
      tilt_deg: -146.0
      rpm_scale: 0.64
      speed_ratio: 0.80
    - type: fork         # 低回転の縦落ち（issue #911: 弱いバックスピン＋大きく割り引いた実効回転数＝「ホップしない速球」。ストレートとの差はホップが無い分の落差で、トップスピンで下に曲げる球ではない）
      tilt_deg: 0.0
      rpm_scale: 0.45    # キレが高いほどストレートから離れる＝回転が減る（良いフォークほど回転が少ない）
      speed_ratio: 0.92
    - type: changeup     # 弱いバックスピン＋腕側＋緩急（縦+15/横+25cm）
      tilt_deg: 59.0
      rpm_scale: 0.56
      speed_ratio: 0.85
    - type: shuuto       # 打者の内側へ食い込む（縦+18/横+40cm）
      tilt_deg: 66.0
      rpm_scale: 0.94
      speed_ratio: 0.95
    - type: sinker       # 弱いバックスピン＋腕側（縦+20/横+30cm）
      tilt_deg: 56.0
      rpm_scale: 0.73
      speed_ratio: 0.90
  # 投手ギア「飛ばす/流す」（設計書02 §1.1f）🟡
  gear_push_velocity_bonus_kmh: 2.0
  gear_push_stamina_factor: 1.6
  gear_coast_velocity_penalty_kmh: 2.5
  gear_coast_stamina_factor: 0.7

# --- 表示能力→物理層の効き（設計書21・issue prefecture-dominance-physics, 2026-08-19） ---
# エンジンは「チーム全体が10Lv上＝勝率90%」と急で、AI校だけを生成で寝かせる圧縮（roster.tier_compression_*）は表示ランクと中身を
# 乖離させた。代わりに表示→物理の境界（Player.ToBatter/ToFielder・AbilityEffectCoefficients.Pitcher・PitchPlan.ReactionVelocityKmh）で
# 全員対称に effective = pivot + scale×(Lv−pivot) を掛ける。表示Lv・最速km/h・目安球数・3D表現は変えず、動くのは「Lv1あたりの結果の差」だけ。
# 正典はこの1ブロック。ローダが batting/fielding/baserunning の3ブロックへ同じ値を配る（食い違いは AbilityEffectConsistencyTests）。
# 実測（永続ロスター同士＝実ゲーム経路・スター lift 0.25・300試合×2方向）:
#   全部1.0: 80vs75 74.5%／80vs70 86%／80vs65 96%／60vs50 94%（10Lv差≈90%＝急すぎ）
#   投手1.0/打撃0.5/守備0.4/走力0.5: 65／78／89／85 だが 80vs80 が 1.3−1.3 の投手戦（投手だけ素の効きだと強豪戦が全部投手戦）
#   全員一律 0.55（守備0.45）: 65／82／88／81、80vs80 2.4−2.4 → 案A採用（オーナー決定 2026-08-19）。エースの突出はスター（roster.ai_star_*）で。
ability_effect:
  pivot: 50.0
  batting_scale: 0.50    # ミート/パワー/選球眼/バント
  fielding_scale: 0.41   # 守備/捕球/送球精度（守備+10 の得点価値が打撃+10 より大きいので少し深く）
  # 肩（地肩→送球速度 90+肩×0.5 km/h）は寝かせない（issue #764）。送球は km/h で語る量なので球速と同じく表示どおり＝
  # 肩20≈100／肩50=115／肩100=140km/h。0.45 で寝かせていた頃は肩100でも約126km/h・肩20との差18km/hで強弱が出なかった。
  arm_scale: 1.0
  running_scale: 0.50    # 走力/盗塁/走塁
  # 投手（制球/キレ/球威ランク/捕手リード）と球速の反応。球速は km/h が画面に出るので実球速は変えず、打者の反応
  # （球威・タイミング・打球質・バント難度）に使う反応球速だけを Lv50=132km/h 軸で寝かせる。スタミナ（目安球数）も据え置き。
  # 案A（オーナー決定 2026-08-19）: 投手を寝かせないと 80vs80 が 1.3−1.3 の投手戦（実測）。全員一律≈0.55 で 2.4−2.4。
  pitching_scale: 0.50
  # 外野手の守備の上位の頭打ち（issue #976 追補・オーナー決定 2026-11-15 ③）: 外野手の守備/捕球/送球精度は表示Lvが膝を超えた分を
  # 傾き倍に寝かせてから fielding_scale を掛ける（上位ほど伸びが逓減）。最強校の外野手（Lv85〜90）が壁際を一瞬で処理し甲子園の三塁打が
  # 0.03% だった。内野手（名手の握り替え #765）と肩（送球 km/h #764）は対象外。膝より下は1ビット不変。0＝無効。
  outfield_defense_top_knee: 70.0
  outfield_defense_top_slope: 0.5
  # issue #833（2026-11-09）: 0.55/0.45 → 0.50/0.41（全員一律のまま約1割寝かせ直し）。#835/#837 で変化球が効くようになり、
  # 低ティアの自校が2ティア上（C60）に得点1.54〜1.60・完封され率33〜36%と帯外だった。2000試合×seed42/2024 で
  # C60 得点 1.79/1.81・完封され率 29.0/29.6%・1ティアあたり得点比 0.571/0.589。投手だけ0.45も帯に入るが「投手も一律」に逆行。
  # 表示の物差しの下げ幅（issue #1080）。保存・表示する能力（表示Lv）は今の物差しより一律 delta 低く、能力の絶対値を読む所
  # （物理の入口・采配AIの閾値・総合・ドラフト・練習の必要exp）は表示Lv＋delta で読む＝物理・帯・km/h・勝率は不変。
  # 7が上限（専門外の下限 8−7=1 が表示の最小）。試合の外は定数 AbilityScale.Delta を読むので、この値は定数と一致必須
  # （違えば読み込みで弾く）。采配AIの閾値（*_min_* 等）・draft.yaml の境目は今の物差しの数字のまま。
  delta: 7.0

# --- 打撃（打席解決の確率・物理変換, Phase 1 統計回帰で調整済み） ---
# league-average 母集団で AVG≈.265 / K%≈19.6 / BB%≈8.6 / HR%≈3.1 に収まる初期値。
batting:
  aim_sigma_x_m: 0.10            # 投手の狙い散布σ（横）
  aim_sigma_y_m: 0.155           # 投手の狙い散布σ（縦）
  aim_spread_control_slope_per_point: 0.008  # 制球の高い投手ほど隅を狙う・低い投手は真ん中を狙う＝狙い散布σ×max(0.5, 1+これ×(Control−50))。C50で恒等（issue walk-rate-floor-vs-elite-pitcher）
  zone_swing_base: 0.68          # ゾーン内スイング率
  chase_base: 0.28               # ゾーン外追いかけ率
  chase_discipline_slope: 0.0045 # 選球眼→追いかけ抑制
  zone_swing_discipline_slope: 0.0015
  # 誘発変化合成量[m]（設計書15 Phase E-3）: ゾーン外+/ゾーン内−の対称係数（見え方と実軌道のズレの代理指標）
  chase_break_slope: 0.02
  chase_distance_slope: 0.15    # ゾーン外距離あたりのチェイス減衰（大外れが変化量だけで釣れる不自然を防ぐガード）
  # ゾーン内の縁への近さ（StrikeZone.EdgeProximity, 中心0〜縁上1）あたりのスイング率減衰（issue #403 案B）。
  # 「隅のいい球は見逃されやすい」。投手は隅を狙うため 0.02 でも見逃しKが増える＝atbat_10k 帯を再校正済み
  # （strikeout_rate 天井 0.220→0.230 / batting_average 床 0.240→0.235。実測は issue #403 のコメント参照）。
  zone_edge_swing_penalty: 0.02
  # カウント依存のスイング判断（設計書01 §2③「カウントで判定」、見逃し三振率の調査 第2便）。BatterDecisionは
  # カウントを一切見ない構造だったため、見逃し三振が全三振の6割超・3-0でのスイング率が45%（実野球はおよそ
  # 5〜7%）だった。旧 tactics.pitch_tactics_two_strike_force_swing_prob / pitch_tactics_three_zero_take_prob
  # （Brain依存の外付けパッチ）を無効化し、本則側へ統合。実測（10000打席×seed42/7/2024）: 見逃しK割合
  # 60%→14.5-16.6%（atbat_10k）/ 17.4-17.7%（games_10k_tactics）、3-0スイング率45%→7.0%（in-zone 10.2% /
  # 追いかけ 3.8%）。副作用でK%が下がるため atbat_10k/games_10k_tactics の strikeout_rate 床を再校正
  # （balance-targets.yaml 参照）。walk_rate/home_run_rate/slugging/2B/3B/2B÷HR/得点/失策/games_10kの
  # 全指標は帯内のまま非破壊。
  two_strike_swing_boost: 0.28
  three_zero_swing_factor: 0.15
  # 初球のスイング倍率・2ストライク後のファール加算（issue #683。早打ち是正）。値は実測で校正する。
  first_pitch_swing_factor: 0.65    # 初球の様子見・ゾーン内のみ（初球スイング率 46%→約34%）
  early_count_swing_factor: 0.82    # 0-1/1-0/1-1等も少し見る・ゾーン内のみ（打席あたり 3.26→約3.6球）
  two_strike_foul_bonus: 0.10     # 追い込まれてからファールで粘る（打席あたりファール 0.61→約0.68本）
  two_strike_foul_share_max: 0.90  # 追い込まれてのファール率の上限
  whiff_intercept: -2.52         # 空振り対数オッズ基準（Phase E-2で弾道由来モデルへ再校正。#578 で −2.40→−2.52＝stuff_per_kmh 倍化の平均中立化）
  whiff_contact_slope: 0.030     # ミート→空振り減
  whiff_out_of_zone_penalty: 0.85
  # 誘発変化合成量[m]（設計書15 Phase E-2）あたりの空振り加算。旧stuff_per_pitch_rank（球種ランク直参照）は
  # Sharpness→rpm→変化量の経路で弾道へ織り込み済みのため完全置換（二重計上回避）。校正ノブ。
  whiff_break_slope: 1.2   # issue #835: 球種ごとの回転軸で変化量が増えた分 1.5→1.2（P80 vs B30 被打率が帯下限 .120 を割ったため。キレの差は当時 spin_rpm_per_sharpness で付け直した。#911 以降は sharpness_deviation_per_level）
  # 投打差（球威−ミート項）の対数オッズ寄与の soft-cap（issue matchup-gap-saturation-k-rate）: cap×tanh(d/cap)。
  # 互角近傍は線形のまま、大差で ±cap に飽和＝A投手が格下打線から平均24三振を取るのを止める。0以下＝無効（従来の線形）。
  whiff_matchup_cap: 1.3   # issue #911（監督決定「打高に寄せる」）: 1.5→1.3。格下打者が格上投手から少し打てる側へ（MatchupGrid P80vsB30 被打率が帯下限 .120 に張り付いていた）
  # 誘発変化合成量[m]の欺瞞効果への実球速割引（issue #837・設計書21 §3.5「効きの入口」5つ目）。遅い球ほど
  # 打者が軌道を見る時間が長く、大きなホップに欺かれにくい＝球速の有利（反応球速で寝かせ済み）と変化量の有利
  # （従来は実球速のまま寝かせていなかった）を対称に扱う。基準球速以上は満額、未満は (実球速/基準)^指数 まで
  # 減衰（指数0以下＝無効）。実測（AbilitySweep の最速梯子100〜150km/h・LowTierRegressionTests の完封され率）で
  # 校正: 100km/hが150km/hと同じだけ抑える逆転を解消。基準はLv35格子投手（matchup_grid・125km/h）の変化球
  # （スライダー比0.90＝約112.5km/h）が割引を受けない水準に置く（average_p35_b75 の裾を動かさないため）＝
  # ストレート単体の基準(128)より更に低い108。
  break_deception_ref_kmh: 108.0
  break_deception_exponent: 1.5
  # 打者の「慣れ」（設計書02 §2.3b・issue times-through-order-familiarity）: 同一投手との試合内対戦回数（打席）が
  # 増えるほど空振り対数オッズと追いかけ率が控えめに下がる。継投でその投手に対して0から。変化量が大きい球ほど割引
  # （1 − break_discount_per_m × 変化量[m]・下限0）。1打席シム（atbat_10k）は対戦回数0＝不変。
  familiarity_whiff_per_pa: 0.08
  familiarity_chase_per_pa: 0.008
  familiarity_max_pa: 3
  familiarity_break_discount_per_m: 1.2
  # 球種の慣れ（設計書02 §2.3b 案A・issue #836）: 対戦回数の慣れ（上）とは別軸。配球で同じ球種が連投されると、
  # その球種だけ「見慣れ度」が指数移動平均（λ=decay）で溜まり、空振りにくく・打球の質も上がる。持ち球が
  # 少ない／偏った投手ほど同じ球種が連投されやすく、新しい特徴量なしで自然に強く効く。基準値(baseline)は
  # 「ストレート＋変化球2つ・均等配球」の定常値（見慣れ度の使用率加重平均≈2.7）に置き、平均的な持ち球構成の
  # 投手では効きが0＝得点環境の平均を動かさない。球種ランクが高い球ほど割引（慣れを万能にしない）。
  pitch_familiarity_decay: 0.85
  pitch_familiarity_baseline_level: 0.7
  pitch_familiarity_rank_discount_per_point: 0.01
  pitch_familiarity_whiff_per_level: 0.05
  pitch_familiarity_quality_per_level: 0.01
  # 対左投手経験（設計書02 §2.3「左のプレミア」・issue #1072）: §2.3bの試合内の慣れ（上）とは別レイヤーの
  # 恒久寄りの個人差。加重打席数（公式戦1.0／練習試合0.5）で蓄積し、同じ「ロジットへの加減算」の形で
  # 空振り・追いかけ率へ乗せる。右投手には常に0＝1ビットも変わらない（呼び出し側のゲート）。
  left_inexperience_whiff_per_deficit: 0.19
  left_inexperience_chase_per_deficit: 0.045
  left_experience_full_pa: 100.0
  left_experience_official_pa_weight: 1.0
  left_experience_practice_pa_weight: 0.5
  foul_share: 0.35               # コンタクト中のファウル割合（方位角±45°超の幾何ファウルは別枠, issue #262）
  # 球速→球威。基準はリーグ平均投手の平均リリース球速（最速132 − 平均ドロップ4）に置き、
  # 傾きは「球速1レベル ≈ ミート1レベル」になるよう 0.030 ÷ 0.47(km/h per level) ≈ 0.064 とする。
  # ⚠ 0.47 は Lv≦50 の傾き。Lv>50 は 0.36（issue velocity-kmh-mapping-flatten-top, 2026-08-18）＝上位では
  # 「球速Lv1 ≈ ミート約1.5Lv」に下がる（物理は km/h で効かせたまま。上位ティアの最速表示を現実に寄せた分の意図した副作用）。
  stuff_base_velocity_kmh: 128.0
  # issue #578 Step 2（オーナー方針 Q24-1「球速のバリューはもう少し高くてよい」）: 0.064→0.128 ＝
  # 球速1レベルの空振り価値をミート1レベル相当から**2レベル相当**へ倍化する。校正前は「制球の失点価値は
  # 球速の約4倍」だったのを2倍まで詰める。平均三振率は whiff_intercept 側（−2.40→−2.52）で据え置き＝
  # 動くのは球速の配分だけ（atbat_10k の K% 帯は 21.7/22.6/22.7 で校正前と同値・帯不変）。
  stuff_per_kmh: 0.128
  # 打球初速上限 = 切片 + パワー×傾き [km/h]。P50=166 を固定して上位を寝かせた（旧 125+0.82P は P90 で 199＝
  # MLB全史最速級・B/A校の試合が 5〜10 本塁打/試合。issue homerun-rate-explodes-at-high-power, 2026-08-18）。
  exit_velo_intercept_kmh: 141.0 # 打球初速上限の切片（P30 156／P70 176／P90 186）
  exit_velo_per_power: 0.50      # パワー1あたり初速上限
  quality_mean: 0.635            # コンタクト品質の平均（#262 で 0.62→0.60、本塁打判定の正しで 0.62、投手の品質寄与×3 で 0.63 へ 2026-08-18、#911 打高寄せで 0.635）
  quality_contact_slope: 0.0020
  quality_sigma: 0.17
  quality_max: 1.05  # コンタクト品質の上限（バレルで満初速を少し越える）
  launch_angle_at_lt1: -5.0      # 弾道1の平均打球角
  launch_angle_at_lt100: 26.0    # 弾道100の平均打球角
  launch_angle_sigma: 12.0
  # 芯を食った当たりの角度の上側の締まり（issue #976・2026-11-15 監督決定 案c）: 初速係数（満初速に対する比）が膝を
  # 超えた分だけ、角度の上側（平均より上へ振れた分）を (1−slope×超過) 倍に締める（下限 floor）。強い当たりは打ち上げ
  # 過ぎず同じ強さのままフェンス際・外野の間の長打に、弱い外野フライ（アウト）は不変＝打率を上げずに本塁打を削る。
  # 初速の膝（二塁打まで削れた）・全打球一律の上側の締め（フライのアウトが単打になり打率が上がった）は採らない。0＝無効。
  launch_angle_upper_hard_knee: 0.83
  launch_angle_upper_hard_slope: 6.0
  launch_angle_upper_hard_floor: 0.2
  # ミートによる打球角度σの締まり（issue ai-roster-power-top-tier-all-sluggers, 2026-08-18）: σ×(1−これ×(Contact−50))、下限 floor。
  # ミートが良いほどゴロ・ポップが減ってライナー帯（安打）に集まり、本塁打帯（25〜35°）からは外れる＝「パワーは本塁打・ミートは安打」の分業。
  # C90 で AVG .353→.380／HR 4.2→1.9%（P60・D投手）。母集団は AVG .249→.252・HR 1.67→1.60%。
  launch_angle_sigma_per_contact: 0.010
  launch_angle_sigma_contact_floor: 0.6
  # 球種の誘発縦変化による打球角度シフト（issue #835）: 縦に落ちる球（フォーク・チェンジアップ等）ほど角度が
  # 下がりゴロが増える。基準 launch_angle_break_ref_m はストレート単体(0.47)ではなく、既定配球
  # （ストレート比0.55・残りを変化球で等分）での誘発縦変化の打席加重平均に合わせてある（実測校正、2026-11-08）。
  # ストレート単体値のままだと変化球持ちの投手が多い母集団全体の平均打球角度が恒常的に下がり、本塁打率が
  # 校正前の帯（2.0–4.0%）を大きく割る。
  launch_angle_per_vertical_break_m: 15.0
  launch_angle_break_ref_m: 0.20
  # 変化球の判定は同じ投手のストレートからの外れで効かせる（issue #911・PitchDeception）。外れ＝本塁での
  # 縦（誘発縦変化の差＋球速差による重力落下の差）と横（誘発横変化の差）の合成。ストレート自身は従来どおり。
  launch_angle_per_relative_drop_m: 10.0   # 縦の外れ1mあたりの打球角度[deg]（沈む球ほどゴロ）
  relative_break_weight: 0.16              # 判定量＝ストレートの合成量＋これ×外れ[m]
  bearing_sigma: 19.0            # 打球方向の「残差」σ（引っ張り/流しを引いた後のばらつき）
  min_quality_velo_factor: 0.55
  # 芯を外した当たり（issue #759）: 品質がこれ未満の裾だけ初速カーブを下へ折る（品質0.05で満初速×floor）。
  # 直線のままだと最悪の当たりでも満初速の約57%（≈89km/h）残り、80km/h未満のゴロ＝ボテボテが1球も出なかった。
  # 引く乱数は増やさない＝消費順不変。実測（10万打席×seed42）: 80km/h未満のゴロ 0%→4.0%、
  # ボテボテ型（平均球足<15m/s）の内野安打 0.2%→6.2%、AVG .263→.259・HR%/K% 不変。0以下＝無効。
  mishit_quality_threshold: 0.40
  mishit_velo_factor_floor: 0.20
  # ポップフライ（issue #830 ②）。芯の下を叩いた打球。品質の低い当たりの一部を真上に近い遅い打球へ差し替える。
  # 判定は打席の本流から Fork した専用ストリーム＝本流の乱数順は不変。popup_share=0 で無効。
  # issue #1065（2026-11-17・オーナー承認済み目標「内野フライのアウトは1試合2〜4本・打球の4〜6%、外野フライの方が多い」）:
  # 0.45→0.10 ＝ #976（2026-11-15・本塁打を減らすため打球の上側を削った launch_angle_upper_hard_*）で質の低い
  # 当たりの元の角度・初速が既に外野まで届かない範囲へ寝ていたのに、この差し替えが追加で約半数を内野ポップへ
  # 送っていた分を削る。実測（実ゲームの相手校＝永続ロスター＋AI采配・400試合）: 内野フライのアウト 1試合7.3本・
  # 打球の12.2%→約3.5本・約5.8%、外野フライのアウトが内野を上回る。0.07 まで下げると内野フライは5.3%だが、
  # 外野へ抜けたぶんの得点で夏場の帯（games_10k_summer 上限5.80）を 5.83 で超える。0.11 は内野フライが目標の上限
  # （汎用母集団で1試合3.96本・6.2%）に張り付く。その間の 0.10 で両方の内側に置く。
  popup_share: 0.10   # 品質 popup_quality_max 未満・元の角度 popup_min_launch_deg 以上の当たりがポップフライになる割合（weakness_weight=0 で一律）。打球の約1〜2%（内野フライのアウト全体では自然な物理分含め約5〜6%）
  popup_quality_max: 0.65   # この品質未満の当たりだけポップフライになりうる
  popup_min_launch_deg: 20.0   # 元の打球角度がこれ以上の当たりだけ（球の下を叩いた当たり。ゴロ＝内野安打の源は差し替えない）
  popup_weakness_weight: 0.0   # 確率のうち品質の低さに比例させる割合（0＝一律・1＝比例。1 だと弱い打者に集中して格上との差を広げる）
  popup_launch_mean_deg: 64.0   # 打球角度の平均[度]
  popup_launch_sigma_deg: 7.0   # 打球角度の標準偏差[度]
  popup_launch_min_deg: 50.0  # ポップフライ打球角度の下限[度]
  popup_launch_max_deg: 85.0  # ポップフライ打球角度の上限[度]
  popup_exit_mean_kmh: 95.0   # 初速の平均[km/h]
  popup_exit_sigma_kmh: 15.0   # 初速の標準偏差[km/h]
  popup_exit_min_kmh: 45.0  # ポップフライ初速の下限[km/h]
  # ④タイミングのズレ →⑤打球方向（設計書01 §2④⑤, issue #262）🟡実測校正
  # 打者はスイング開始を投球に合わせる。速い球・変化の大きい球ほど遅れ（差し込まれ）、ミートが良いほどズレない。
  # ズレは無次元（正＝差し込まれ／負＝早い）。これが引っ張り/流しへ変換され、打者の左右が符号を与える。
  # 座標規約: −＝左翼（三塁側）／＋＝右翼（一塁側）。右打者の引っ張り＝負、左打者の引っ張り＝正。
  timing_sigma: 1.0                  # ズレの標準偏差（無次元。bearing_pull_per_timing の単位になる）
  timing_ref_kmh: 121.5              # ズレ寄与0の実投球速度
  timing_per_kmh: 0.010              # 実投球速度1km/hあたりの平均ズレ（正＝速い球は差し込まれる）
  timing_break_ref_m: 0.47           # ズレ寄与0の誘発変化合成量
  timing_per_break_m: 0.60           # 変化量[m]あたりの平均ズレ（正＝変化が大きいほど差し込まれる）
  timing_per_contact: 0.004          # ミート(−50)あたりのズレ縮小
  bearing_pull_per_timing: 14.0       # ズレ1あたりの引っ張り角[deg]
  bearing_pull_ground_deg: 28.0      # 純ゴロでの引っ張り角[deg]
  bearing_pull_fly_deg: -6.0         # 純フライでの引っ張り角[deg]（負＝流し）
  bearing_ground_angle_deg: 0.0      # 「純ゴロ」とみなす打球角（以下で頭打ち）
  bearing_fly_angle_deg: 25.0        # 「純フライ」とみなす打球角（以上で頭打ち）
  # コンタクト品質への投手側寄与（「打たせて取る」の土台）。3項とも基準値で寄与0＝リーグ平均投手で恒等。
  # 2026-08-18: 3項を ×3（旧 0.0010/-0.0010/-0.30）。旧値だとエースが本塁打を減らせるのは三振の分だけで、当てられれば
  # F投手と同じ本塁打率だった（issue pitcher-barely-affects-contact-quality）。
  contact_quality_velocity_ref_kmh: 121.5  # 平均的な配球の実投球速度（ストレート比0.55×球種の球速比込み）
  # 2026-08-19（設計書21・球速の価値）: +0.0030 では球速Lv 50→90 で打球あたり安打率 .323→.376・本塁打率 1.8→3.45% と「速い投手ほど
  # 打たれる」になり三振増と相殺＝球速+10 の得点差 ±0（Q24-1 の倍化が無効化されていた）。−0.0050 で打球の質を球速に対して平坦〜微減
  # （差し込まれ）にする＝球速+10 ≈ 制球+10（AVG −.017）。単一対戦の実測は OPEN-QUESTIONS Q24-5。
  contact_quality_per_kmh: -0.0050         # 速い球は差し込まれる（当たっても弱い）
  contact_quality_per_control: -0.0020     # 制球が良いほど芯を外させる（技巧派の武器）。issue #911（打高に寄せる）: −0.0030→−0.0020
  contact_quality_break_ref_m: 0.47        # 132km/h・2200rpm の誘発変化合成量
  contact_quality_per_break_m: -0.90       # 変化が大きいほど詰まる
  # 際の球は芯を外しやすい（issue #872）。実着弾の縁への近さ（StrikeZone.EdgeProximity: 中心0・縁上と外1）が基準より大きいほど
  # 品質が下がり、真ん中は強く打たれる。基準で寄与0。くさい所（縁狙い）の打席だけでなく全打席に効く。
  contact_quality_edge_ref: 0.73
  contact_quality_per_edge: -0.15

# --- 守備（弾道→捕球/送球判定） ---
fielding:
  fly_apex_threshold_m: 2.5
  catch_reach_factor: 0.895    # issue #740: 1.00→0.93（4秒上限撤去で増えたアウトを打率帯へ戻す）→0.92（#830: ファウルフライのアウト新設で下がった得点 4.37→4.51 を戻す）→0.895（#830②: ポップフライ新設で下がった得点を戻す。本塁打率を動かさない手段として）。#976 で一度 0.845 にしたが外野フライ全般が落ちて打率が上がったので戻した
  # フェンス際の捕りにくさ（issue #976・2026-11-15 監督決定 案c）: 落下点がフェンスから wall_catch_zone_m 以内だと、
  # 壁を探して減速するぶん空中捕球に使える時間が wall_catch_penalty_seconds×(1−距離/ゾーン) 減る（フェンス上で最大）。
  # 本塁打を削った大飛球を外野フライのアウトでなくフェンス際の長打へ振り替え、打率を上げずに得点を戻す。0＝無効。
  # 10m・3.0s: フェンス上で3秒・5m手前で1.5秒減る。catch_reach_factor を下げる案より同じ得点の戻しで打率の上がりが小さい。
  wall_catch_zone_m: 10.0
  wall_catch_penalty_seconds: 3.0
  throw_transfer_seconds: 0.70
  throw_transfer_fielding_slope: 0.004 # 握り替えの守備連動（Issue #36）: 倍率=max(min,1−(守備−50)×これ)。守備50で×1.0＝恒等
  throw_transfer_factor_min: 0.70      # トランスファー倍率の下限（最速側クランプ, Issue #36）
  infield_play_overhead_seconds: 0.10  # 内野ゴロ処理のオーバーヘッド（捕球姿勢づくり・ステップ, §4.1b）。issue #358で0.88→0.10へ引き戻し: 0.88は#261の得点環境の戻しを「内野手の処理時間」に載せた値で、握り替え0.70と合わせて捕ってから離すまで1.58秒＝実際(0.6〜0.9秒)の約2倍だった。実測値は0.10+0.70×守備係数＝守備90で約0.64s／50で0.80s／20で約0.92s（効き後の守備で計算。#1233 で C# 側と揃えた）
  runner_reaction_seconds: 0.45        # 実戦オフセット（設計書02 §4.1b: 走力50右で本塁→一塁≈4.2s）
  left_batter_first_step_bonus_seconds: 0.13  # 左打者は一塁が近く速い（§4.1b）
  infield_depth_m: 46.0
  force_out_margin_seconds: 0.0        # 一塁封殺の判定余裕。issue #358 で 0.0→0.60 とした校正項を 2026-08-14 に物理層（infield_handle_jitter_mean_seconds）へ移して 0 へ戻した＝判定は素のタイミング比較。判定の秒を動かすのに絵の秒に出ない項だったため「送球が先に届いた絵なのにセーフ」が構造的に出ていた（実測: 内野安打の83.5%）。0以外にすると再びその食い違いが戻る
  infield_handle_jitter_mean_seconds: 0.49  # 0.48→0.49（2026-08-18）: ミドル前進上限4→10m＋半径捕球の処理点を体到達へ（issue middle-infielder-charge-cap/fielder-body-far-from-ball-at-catch）の差し引き−0.4ptを戻す（実測60,000打席×seed 7/42/2024で 9.4/9.3/10.0%）。 内野の打球処理のもたつき[s]の平均（指数分布・下限0で右に裾）。捕ってから離すまでに余分にかかる時間で、引いた値が**そのままタイムラインの秒**になる＝絵と判定が一致する。守備力（transfer と同じ係数）で伸縮。0.43 は内野安打率から逆算（従来の定数0.60と**同じ**内野ゴロの帰結＝アウト82.8%/内野安打9.6%/失策7.6%になる平均は0.43。実測 2026-08-14・200,000打席・seed 7）。統合時に issue #630 の前進捕球で守備が速くなった分を戻して 0.43→0.48（実測60,000打席×seed 7/42/2024で内野安打9.5/9.1/9.8%＝#630の目標9.6〜9.7%と一致）
  infield_handle_jitter_max_factor: 3.0     # もたつきの上限＝平均の何倍で頭打ちにするか。指数の裾は無限に伸びるので「捕ってから4秒動かない内野手」が極稀に出る。絵に出る量なので実在しない値は切る（3.0＝0.49×3＝約1.47秒・上位5%が頭打ち）
  infield_transfer_fielding_slope: 0.014    # 内野ゴロ→一塁の握り替え倍率の守備傾き（issue #765）。倍率=max(min,1−(効き後の守備−50)×これ)。外野返球と共有の throw_transfer_fielding_slope(0.004)では守備90と20で捕ってから離すまで0.15秒差しかなく上手い内野手が機敏に見えなかった。守備50で×1.0＝帯不変
  infield_transfer_factor_min: 0.65        # 内野の握り替え倍率の下限。効きを通すと表示Lv100でも倍率は約0.713で下限0.65には届かない（死んだクランプ＝安全弁のみ）
