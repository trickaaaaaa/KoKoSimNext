  # 送球逸れの回収レース（design-12 §3.8, 2026-08-30）。悪送球確定後、逸れ幅→回収ロスを守備所要時間へ
  # 加算してもう一度同じMargin/logisticレースを評価する（拾い直しが間に合えばアウトのまま）。
  wild_throw_scatter_sigma_m: 3.0     # 逸れ幅の標準偏差[m]（半正規分布）。内野側とは独立値。issue #1260: 往復化に伴い 6.0→3.0
  recovery_reaction_seconds: 0.30     # 回収に動き出すまでの反応遅延[s]
  recovery_sprint_speed_mps: 6.5      # 回収に動く野手のスプリント速度[m/s]（平均的な値の定数）
  # 送球の逸れを本塁/中継・併殺・バント封殺へ一般化（issue #858）。HomePlayResolver.ResolveThrowPath/
  # DefenseTimeSeconds が併殺（BaserunningModel.ResolveDoublePlay）・タッチアップ・進塁打・バント封殺を
  # 含む全送球が通る単一経路＝ここの値を変えると全部に効く。relay_throw_error_base_prob は確率係数として
  # そのまま残し、判定の形だけ HomePlayResolver.IsWildThrow が閾値へ統合する。
  # 2026-11-10 issue #858: 盗塁送球(steal_throw_scatter_*)と同値の0.0015/0.0010/0.0030で導入したところ、
  # LowTierRegressionTests（C60完封され率、帯0.08-0.32）が32.3%で帯上限を僅かに超えた（上位ティアの送球精度が
  # 高く、全送球が通るこの経路の継続的な遅れ短縮ぶん守備が強くなり過ぎた）。半分の値へ校正して帯内に収めた。
  throw_scatter_lateral_sec_per_cm: 0.00075
  throw_scatter_high_sec_per_cm: 0.0005
  throw_scatter_short_hop_sec_per_cm: 0.0015
  throw_scatter_catching_relief_slope: 0.004
  throw_scatter_catching_relief_min_factor: 0.60
  home_tag_seconds: 0.28                      # issue #1139: 0.12→0.28（捕手ブロック込みでやや長め）。home_success_bias/tag_up_success_bias を増分(0.16)差し引いてmargin不変
  home_grounder_start_delay_seconds: 1.55    # ゴロ凡打の三塁走者は打球を読んでから走る＝遅い(G1)
  home_margin_scale: 0.25                    # margin→生還確率のlogistic幅
  home_success_bias: 1.41                    # #316: 走者の加速をモデル化した分(-0.43s)を引いて 2.00→1.57。issue #1139: home_tag_secondsの増分(+0.16)をさらに引いて 1.57→1.41
  # 本塁でのダブルタッチアウト（issue #984, OPEN-QUESTIONS Q27選択肢2, 監督決定2026-11-15）: 1人目を本塁で
  # 刺した直後、同じボールを持った捕手がそのまま2人目にもタッチできるかを物理層で解く。新しい送球は
  # 引かない＝守備所要は「1人目のタッチ完了時刻（送球到達＋タッチと1人目の到達の遅い方）＋切り替え秒」だけ
  # （margin→確率の幅は home_margin_scale を共有）。
  home_double_tag_seconds: 0.25               # タッチの切り替え秒[s]（同じボール・新しい送球なし）
  home_double_tag_success_bias: 0.0           # 校正項[s]。0.0＝物理のみ（home_success_bias は流用しない＝捕手が球を持って待つ絵と食い違うため）
  # 三塁への進塁レース（単打の一塁→三塁, Issue #89, 設計書12 §3.5/§4.6）: 本塁と同型で三塁ベースへ解く
  third_tag_seconds: 0.22                     # issue #1139: 0.10→0.22（フォースと区別。タッチ固有の遅れ）
  third_margin_scale: 0.45                    # margin→確率のlogistic幅（本塁より広め＝打球の深さ・外野の肩を効かせる）
  third_success_bias: 0.76                    # #316: 加速+回る損失をモデル化した分(-0.62s)を引いて 1.50→0.88。issue #1139: third_tag_secondsの増分(+0.12)をさらに引いて 0.88→0.76
  # ゴロ凡打の進塁打（二塁→三塁, Issue #318／issue productive-out-second-to-third-not-advancing, 設計書12 §3.5）:
  # 18%固定テーブルを「一塁送球到達→三塁への転送レース」へ。打者走者はこの場面に至った時点で一塁アウトが確定して
  # おり（実際の内野は確実な1アウトを捨てて三塁の走者を直接狙わない）、二塁走者は転送の脅威（P_relay）だけで
  # 進むか自重するかが決まる（采配でなく物理で決める）。
  grounder_advance_start_delay_seconds: 0.90 # ゴロを読んでから走り出す追加遅延[s]。本塁(1.55)より短い＝進塁は生還ほど慎重に見極めない
  advance_tag_seconds: 0.22                   # 進塁先でのタッチ[s]（third_tag_seconds と同軸）。issue #1139: 0.10→0.22
  advance_margin_scale: 0.45                  # margin→確率のlogistic幅（三塁レースと同軸）
  advance_success_bias: -0.12                 # 校正項[s]。帯校正はこの1本だけで行う（Issue #318）。issue #1139: advance_tag_secondsの増分(+0.12)を引いて 0.00→-0.12
  advance_relay_transfer_seconds: 0.55        # 一塁手の転送握り替え[s]（relay_transfer_seconds と同軸）
  # 併殺の物理レース（内野ゴロ×一塁走者, Issue #369, 設計書12 §2）: 13%固定テーブル（double_play_prob）を
  # 「捕球点→二塁の封殺（P_force2）／二塁→一塁の転送」の二段の秒勝負へ。守備は幾何で3分岐を純関数で選ぶ
  # （A=一塁のみ／B=野選／C=併殺）。方向性・深さ・打者/走者の脚は係数でなく幾何から創発する。
  # ※実ゲーム（Unity）は coefficients.yaml を読まず C#既定で動く（不変条件・NationService）。ここは sim/テスト用に
  #   C#既定と同値で追随させる（BaserunningCoefficients の既定と一致）。
  double_play_r1_start_delay_seconds: 0.30    # 一塁走者がゴロを読んでから二塁へ走り出す追加遅延[s]
  second_force_tag_seconds: 0.10              # 二塁封殺のタッチ/捕球[s]。フォースなので issue #1139 でタッチ固有に分離した third_tag_seconds(0.22) より短いまま
  second_force_margin_scale: 0.45            # 二塁封殺 margin→到達確率のlogistic幅（三塁・進塁と同軸）
  second_force_success_bias: 0.00           # 二塁封殺の校正項[s]
  double_play_force_max_runner_success: 0.60 # 一塁走者の二塁到達見込みがこれ超なら封殺自体が不可＝一塁を取る（分岐A-1・稀）
  double_play_attempt_min_relay_success: 0.65 # 二塁→一塁の転送で打者を刺せる見込みがこれ未満なら併殺を狙わず確実な一塁アウト（分岐A-2）。0.80→0.55（2026-08-18: 見込み6〜8割の併殺まで一塁へ逃げていた）→0.65（2026-08-30: 併殺/試合の帯を高校野球の失策率実測ベースへ再校正した際の追従。詳細はBaserunningCoefficients.csのXMLコメント）
  double_play_force_only_max_runner_success: 0.20 # 併殺の見込みが薄くても、先の走者の封殺が十分間に合う（走者の到達見込みがこれ以下）なら先の走者を封殺して打者を一塁に残す（issue #797・分岐A-3）。0で従来どおり一塁のみ
  double_play_pivot_transfer_seconds: 0.90   # 二塁ベース経由の転送（ピボット）握り替え[s]（relay_transfer_seconds とは別値）
  double_play_relay_margin_scale: 0.20       # 二塁→一塁の転送 margin→打者生存（野選）確率のlogistic幅
  double_play_relay_bias: 0.00               # 二塁→一塁の転送の校正項[s]（正で打者生存＝野選寄り）。併殺打/得点をHeavyで校正
  # 併殺の代替ルート（三塁/本塁の自己フォース, Q31）: 三塁手/捕手・投手が自打球を自分でベースへ運んで
  # フォース（送球なし）→一塁へ転送。実際にその塁を処理した野手だけが検討でき、二塁封殺より到達見込みが
  # 低い（守備に有利）ときだけ選ばれる（BaserunningModel.ResolveDoublePlay のゲート）。
  third_force_tag_seconds: 0.10              # 三塁での自己フォースのタッチ/捕球[s]（second_force_tag_seconds と同軸）
  third_force_margin_scale: 0.45             # 三塁での自己フォース margin→到達確率のlogistic幅
  third_force_success_bias: 0.00             # 三塁での自己フォースの校正項[s]
  home_force_tag_seconds: 0.10               # 本塁での自己フォースのタッチ/捕球[s]（second_force_tag_seconds と同軸）
  home_force_margin_scale: 0.45              # 本塁での自己フォース margin→到達確率のlogistic幅
  home_force_success_bias: 0.00              # 本塁での自己フォースの校正項[s]
  double_play_self_force_relay_transfer_seconds: 0.70  # 自己フォース側の一塁への転送握り替え[s]（受け取り動作が無いぶん double_play_pivot_transfer_seconds より短い）
  self_force_fielder_accel_mps2: 10.0  # 自己フォース一段目の走り出しの加速度[m/s²]（issue #1549）。止まった状態から最高速まで等加速＝長い距離は 最高速/(2×加速度)≈0.36秒遅れる。0以下で旧式（最初から最高速）
  self_force_fielder_sprint_speed_mps: 7.25  # 自己フォース一段目（処理野手が対象塁へ走り込む, issue #1273）の脚力[m/s]既定（SprintSpeedMps の Speed=50 相当）。旧実装は送球速度(≈30 m/s)で割っており走る時間がほぼゼロだった
  # 併殺の代替ルート（一塁手の自己フォース→二塁タッチ, issue 3-6-tag-double-play）: 一塁手が自打球を自分で
  # 一塁へ運んでフォース（送球なし）→二塁へ送球して一塁走者にタッチ。一塁を先に踏むと二塁のフォースが外れる
  # ため、二塁はタッチプレーになる。実際に一塁を処理した一塁手だけが検討でき、二塁封殺より到達見込みが
  # 低い（守備に有利）ときだけ選ばれる（BaserunningModel.ResolveDoublePlay のゲート）。
  first_force_tag_seconds: 0.10              # 一塁での自己フォースのタッチ/捕球[s]（second_force_tag_seconds と同軸）
  first_force_margin_scale: 0.45             # 一塁での自己フォース margin→到達確率のlogistic幅
  first_force_success_bias: 0.00             # 一塁での自己フォースの校正項[s]
  second_tag_seconds: 0.22                   # 二塁タッチのタッチ/捕球[s]（second_force_tag_seconds と同軸だがフォースでなくタッチ固有に分離）。issue #1139: 0.10→0.22
  second_tag_margin_scale: 0.45              # 二塁タッチ margin→到達確率のlogistic幅
  second_tag_success_bias: -0.12             # 二塁タッチの校正項[s]。issue #1139: second_tag_secondsの増分(+0.12)を引いて 0.00→-0.12
  # 犠飛のタッチアップ（Issue #90, 設計書12 §3.5）: 走者は捕球時刻にスタート（二次リードなし＝全塁間27.4mを走る）、
  # 守備も同じ捕球時刻から送球＝共通起点が捕球時刻。深い外野フライは送球が長く生還、浅いフライは自重/憤死。
  tag_up_margin_scale: 0.40                   # margin→生還確率のlogistic幅（本塁クロスプレーより広め＝深さ・肩を効かせる）
  tag_up_success_bias: 1.34                   # 生還率・本塁憤死頻度を現実値へ校正（Heavy実測, Issue #90。球質タイプ中立を維持）。issue #1139: home_tag_secondsの増分(+0.16)を引いて 1.50→1.34
  # 犠飛以外のタッチアップ（一塁→二塁 / 二塁→三塁, design-14 P3-11）: 置換前は両方とも
  # productive_out_advance_prob の18%固定で深さ・肩・走力を見ていなかった（浅いライトフライでも一塁走者が
  # 18%で二塁へ）。塁ごとに送球距離が大きく違うため、本塁用の tag_up_success_bias(1.34) は流用せず塁固有に持つ。
  tag_up_third_success_bias: 0.73             # 二塁→三塁の校正項[s]。実測 100mまで0%・105m 86%・115m 93%。1.30だと広い球場の得点が上がりStadium/Archetypeの僅差比較が割れる。issue #1139: third_tag_secondsの増分(+0.12)を引いて 0.85→0.73
  tag_up_second_success_bias: 1.20            # 一塁→二塁の校正項[s]。二塁への送球は最短＝実測 105mまで0%・115mから動く（最深部のフライでだけ走る）
  close_call_margin_seconds: 0.15            # 判定オーバーレイ（Issue #59）: |margin|がこれ未満なら「際どい」＝セーフ表示。アウトは常時表示のため無関係
  # ライナー併殺（コンタクト始動の一塁走者が捕られ戻れず, 設計書12 §4, G2）
  liner_break_reaction_seconds: 0.05         # 接触と同時に飛び出す＝ほぼ即時
  liner_commit_cap_seconds: 1.00             # 「盲目的に走る」時間の上限（長い滞空でもリードが伸び続けない）
  liner_reference_sprint_speed_mps: 7.25     # リード算出の基準走力（個人差は戻りの走力にだけ効く）
  doubled_off_reverse_seconds: 0.35          # 捕球を見て反転するまでの判断遅延
  doubled_off_transfer_seconds: 0.30         # 捕球野手の捕球→送球（内野寄りなので外野より短い）
  doubled_off_tag_seconds: 0.20              # issue #1139: 0.10→0.20
  doubled_off_margin_scale: 0.20             # margin→塁へ戻れる確率のlogistic幅
  doubled_off_success_bias: -0.10            # 校正前の暫定値（Heavy実測で調整）。issue #1139: doubled_off_tag_secondsの増分(+0.10)を引いて 0.0→-0.10
  steal_break_extra_lead_m: 6.0              # 盗塁で走っていた一塁走者が接触時点で稼いでいたリード（飛び出しの戻り距離に加算）
  steal_break_grounder_start_delay_seconds: 0.0 # 盗塁（三盗・重盗の本塁突入）で走っていた走者がゴロを打たれたときの追加スタート遅延[s]。既に走っているので読む遅れが無い＝接触と同時（issue #1138）
  doubled_off_retreat_speed_mps: 3.0         # コミット上限を過ぎてから捕球までに打球を見ながら塁へ戻る速さ（深いフライで刺されない）
  # フライの読み（issue #1130・設計書12 §4.10）: 2アウト未満のフライで、走者は捕球の余裕（際どさ）を見て走るか待つかを決める
  fly_read_scale_seconds: 0.20               # 「打った瞬間に走る」確率の logistic 幅[s]（捕球の余裕に対して）
  fly_read_go_bias_seconds: 0.25             # 走る／待つの境目の捕球の余裕[s]
  fly_read_ability_slope: 0.50               # 走塁能力（Running）で読みの幅を縮める傾き
  fly_read_scale_min_factor: 0.40            # 読みの幅の倍率の下限
  fly_read_certain_probability: 0.02         # これ未満／1−これ超は乱数を引かずに決める
  fly_read_resume_seconds: 0.30              # 待った走者が落ちたのを見て走り出すまでの反応[s]
  fly_halfway_lead_m: 9.0                    # ハーフウェーの位置の上限（元の塁からの距離[m]）。実際は打球ごとに「捕られても戻れる距離」
  fly_halfway_safety_seconds: 0.90           # ハーフウェーの位置を決める戻りの余裕[s]（戻し送球の秒−反転−これ）×脚力
  fly_halfway_min_range_m: 40.0              # これより浅い打球（内野のポップ・ライナー）は塁に付いて動かない＝読まない
  outfield_force_second_margin_scale: 0.30   # 外野ゴロ（二塁封殺）の logistic 幅[s]
  outfield_force_second_success_bias: 0.0    # 外野ゴロの到達確率バイアス[s]
  outfield_force_second_max_runner_success: 0.40 # 外野手が二塁へ投げるのは走者の見込みがこれ未満のときだけ
  # 守備の読み/ピッチアウト（設計書09 §1, 設計書12 §5, G3）: 捕手リード＋投手センス vs 状況の意外性
  steal_expectedness_intercept: 0.42         # 盗塁企図の基準「予想されやすさ」E
  steal_expectedness_steal_slope: 0.012      # Steal能力（効きRunning通し）→予想度（快足盗塁屋は読まれやすい）。#1210 で生Lv 0.006 → 効き0.5を通すので2倍
  gamble_unexpectedness_reduction: 0.28      # ギャンブル始動は意表＝予想度を下げる（G3b配線）
  steal_read_intercept: 0.15                 # 読み力の基準（捕手リード＋投手センス）。issue #838 で 0.50→0.15（盗塁屋が3割の確率でピッチアウトされていた）
  steal_read_catcher_lead_slope: 0.012       # 捕手リード（効きPitching通し）(Lead−50)あたり読み力加算。#1210 で生Lv 0.006 → 2倍
  steal_read_pitcher_sense_slope: 0.003      # 投手センス（効きPitching通し・issue #1472。旧は Mental で代用）(−50)あたり読み力加算
  max_pitchout_prob: 0.55                    # 読み切っても上限
  pitchout_defense_bonus_seconds: 0.35       # ピッチアウト成功で守備時間短縮（捕手優位）
  gamble_pitchout_extra_bonus_seconds: 0.20  # ギャンブル走者は無防備でさらに刺されやすい（G3b配線）
  gamble_jump_bonus_seconds: 0.15            # ギャンブルの好スタート（走者時間短縮, G3b配線）
  steal_gamble_start_delay_floor_seconds: 0.05  # ギャンブル始動のスタート遅延の下限[s]

# --- 投手疲労（設計書02 §1.1e: スタミナ＝目安投球数を超えた球数で減衰・継投） ---
# 目安投球数そのものは選手側（StaminaPitches）。Level→球数の変換は 63 + 0.75×Lv（PitcherAttributes.StaminaPitchesIntercept/PerLevel に集約。Lv100=138球）
fatigue:
  velocity_drop_per_over_pitch: 0.05
  control_drop_per_over_pitch: 0.12
  relieve_pitch_margin: 25.0
  # 目安の手前から徐々に効く消耗カーブ（issue fatigue-gradual-before-threshold・設計書02 §1.1e）。
  # 目安×onset_ratio から二次カーブで低下を始め、目安到達時に球速天井 −velocity_drop_at_guideline_kmh／
  # 制球 −control_drop_at_guideline、超過後は上の per_over_pitch 勾配で段差なく続く。onset_ratio ≥ 1.0 で旧階段型。
  onset_ratio: 0.6
  velocity_drop_at_guideline_kmh: 2.0
  control_drop_at_guideline: 5.0
  # hard_cap_pitches はハードキャップ撤廃（issue #356）で撤去。降板は目安投球数＋relieve_pitch_margin と
  # 疲労による能力低下だけで決まる。スタミナ自体も上限なし（伸ばした分だけ長く投げられる）。

# --- 試合ごとの天候（月別気温＋状態）モデル（Issue #120/#803/#971, design-05 大会単位の味付け） ---
# 気温を物理層（空気密度ρ・投手消耗）だけに効かせて「夏場は点が動きやすい」を創発させる（不変条件#1）。
# 気温は試合開始時に専用Forkストリームで1回引くだけ＝本体の乱数順・決定論は不変（不変条件#2）。
# 天気の状態（晴れ/曇り/雨）は気温と同じ専用ストリームで先に1回抽選し、雨・曇りは気温の平均を下げる
# （Issue #803 決定1・2026-11-09改定。表示専用＝決定2で物理には気温だけが効く）。
# 気温は「試合日の月」で引く（Issue #971・2026-11-15 監督決定。大会も練習試合も同じ入口＝WeatherModel.ForMonth・
# 1年を通して12か月の表・地域差なし）。平均は日最高気温の平年値（試合は日中）。8月（夏の甲子園）は従来の
# 32℃・σ2.5・28〜36℃のまま＝games_10k_summer の帯は動かさない。
# 実プレイ側は C#既定（WeatherModel.Base / DefaultMonths）がこの値と一致している（CoefficientsDefaultsConsistencyTests・不変条件#4）。
weather:
  base:     # 物理変換の定数（月に依らない）と、既定の分布（8月・夏の甲子園）。月別の表が無い月はこの分布になる
    enabled: true
    mean_temperature_c: 32.0
    temperature_std_dev_c: 2.5
    min_temperature_c: 28.0
    max_temperature_c: 36.0
    # 気温→空気密度（決定1=案B: ρ(T)=ρ0×(273.15+基準温)/(273.15+T) の基準差分に減衰係数 k=0.5 を掛け効きを半減）
    baseline_temperature_c: 15.0   # この気温で aerodynamics.air_density の既定値になる基準
    density_damping: 0.5           # k（0=無効, 1=物理そのまま）。極端な乱打戦を避けるため 0.5
    # 気温→投手消耗（issue #1071 オーナー決定2026-11-17: 「実効の目安球数」そのものを縮める方式に一本化）
    # 旧方式（目安超過後の落ち方の傾きに気温項）は体感で分からないほど小さく、二重取りを避けるため撤去。
    # 30℃以下は不変、36℃で実効目安を−10%（120球の投手なら108球）。縮めればバテ始め・継投判断も同じ式でついてくる
    fatigue_pitch_baseline_temperature_c: 30.0
    fatigue_pitch_reference_temperature_c: 36.0
    fatigue_pitch_reference_reduction_fraction: 0.10
    rain_prob: 0.15               # 天気の状態は試合ごとに別に1回抽選（#803 決定1・2026-11-09改定）
    cloudy_prob: 0.35
    rain_temperature_offset_c: -3.0  # 雨の日は気温の平均を下げる（暑い日の雨も低確率で出る）
    cloudy_temperature_offset_c: -1.0
  months:   # 月ごとに変わるのは気温の分布と雨の確率だけ。σ3の月は平均±8℃で切る。雨の確率は従来の季節値（春25%・夏15%・秋20%）のまま
    - {month: 1, mean_temperature_c: 10.0, temperature_std_dev_c: 3.0, min_temperature_c: 2.0, max_temperature_c: 18.0, rain_prob: 0.25}
    - {month: 2, mean_temperature_c: 11.0, temperature_std_dev_c: 3.0, min_temperature_c: 3.0, max_temperature_c: 19.0, rain_prob: 0.25}
    - {month: 3, mean_temperature_c: 14.0, temperature_std_dev_c: 3.0, min_temperature_c: 6.0, max_temperature_c: 22.0, rain_prob: 0.25}
    - {month: 4, mean_temperature_c: 19.0, temperature_std_dev_c: 3.0, min_temperature_c: 11.0, max_temperature_c: 27.0, rain_prob: 0.25}
    - {month: 5, mean_temperature_c: 23.0, temperature_std_dev_c: 3.0, min_temperature_c: 15.0, max_temperature_c: 31.0, rain_prob: 0.25}
    - {month: 6, mean_temperature_c: 26.0, temperature_std_dev_c: 3.0, min_temperature_c: 18.0, max_temperature_c: 34.0, rain_prob: 0.15}
    - {month: 7, mean_temperature_c: 30.0, temperature_std_dev_c: 2.5, min_temperature_c: 26.0, max_temperature_c: 34.0, rain_prob: 0.15}
    - {month: 8, mean_temperature_c: 32.0, temperature_std_dev_c: 2.5, min_temperature_c: 28.0, max_temperature_c: 36.0, rain_prob: 0.15}
    - {month: 9, mean_temperature_c: 27.0, temperature_std_dev_c: 3.0, min_temperature_c: 19.0, max_temperature_c: 35.0, rain_prob: 0.20}
    - {month: 10, mean_temperature_c: 22.0, temperature_std_dev_c: 3.0, min_temperature_c: 14.0, max_temperature_c: 30.0, rain_prob: 0.20}
    - {month: 11, mean_temperature_c: 17.0, temperature_std_dev_c: 3.0, min_temperature_c: 9.0, max_temperature_c: 25.0, rain_prob: 0.20}
    - {month: 12, mean_temperature_c: 12.0, temperature_std_dev_c: 3.0, min_temperature_c: 4.0, max_temperature_c: 20.0, rain_prob: 0.25}

# --- 試合間の回復モデル（設計書02 §1.1e・issue #41: 連戦で目安投球数が回復し切らない） ---
# 前登板からの休養日数 × 直近ウィンドウの球数 → 実効の目安投球数を減衰させる。🟡 実測校正前のプレースホルダ。
# 本流へ配線済み（PlayerMatchResolver／BackgroundMatchResolver が PitchRecoveryLookup 経由で台帳を読む）。
pitch_recovery:
  full_recovery_days: 7.0        # これ以上の休養（中6日相当）で完全回復＝実効＝目安投球数
  reference_pitches: 100.0       # 「重い登板」の基準球数（直近球数がこれ以上で負荷は最大に張り付く）
  max_reduction_fraction: 0.5    # 連投かつ重い登板が重なったときの最大減衰率（目安投球数比）

# --- 調子・試合限りの好不調（設計書02 §3.3/§3.3b）🟡「調子が支配的にならない」よう控えめ ---
form:
  # 調子（5段階, 1段階あたりの効果）
  contact_per_step: 2.5
  power_per_step: 2.0
  control_per_step: 2.5
  velocity_per_step_kmh: 0.6
  sharpness_per_step: 2.5    # キレ(PitchRank/球種Sharpness)への補正。Controlと同スケール（issue #49）
  # 試合限りの好不調（当日の出来。大半は微小・スパイクは十数試合に一度）
  day_form_base_sigma: 0.15
  day_form_clamp: 0.45
  day_form_spike_prob: 0.07
  day_form_spike_min: 0.6
  day_form_spike_max: 1.0
  contact_per_day_form: 3.0
  power_per_day_form: 2.0
  control_per_day_form: 5.0
  velocity_per_day_form_kmh: 1.5
  velocity_floor_kmh: 105.0  # 調子補正後の最高球速の床[km/h]
  sharpness_per_day_form: 5.0  # キレへの当日補正。Controlと同スケール（issue #49）
  # 週次の波（数日〜数週間続く。毎試合振り直さない）
  weekly_persistence: 0.75
  weekly_sigma: 0.28
  # 相手校の調子観測（監督の育成眼が高いほど正確、低いと誤認。issue #47）
  observe_sigma_base: 0.65          # 育成眼0時のノイズσ
  observe_sigma_per_talent_eye: -0.0063  # 育成眼1あたりのσ減少（TalentEye=100でσ下限）
  observe_sigma_min: 0.02           # σの下限（育成眼MAXでも僅かな誤差は残す）
  # 試合結果によるConditionValueフィードバック（自校の詳細シム1試合ぶん。issue #46）
  match_hit_bonus: 0.02             # 好打: 安打1本あたりの加点
  match_home_run_bonus: 0.03        # 好打: 本塁打1本あたりの追加加点
  match_hitless_min_at_bats: 3      # 不振判定: この打数以上で無安打なら減点対象
  match_hitless_penalty: 0.04       # 不振の減点
  match_quality_start_min_outs: 15  # 好投判定: 投球回(アウト数)がこれ以上（15=5回）
  match_quality_start_max_runs: 2   # 好投判定: 失点がこれ以下
  match_quality_start_bonus: 0.05   # 好投の加点
  match_rocked_runs_threshold: 5    # 被弾判定: 失点がこれ以上
  match_rocked_penalty: 0.05        # 被弾の減点
  match_blowout_loss_margin: 7      # 大敗判定: 点差がこれ以上
  match_blowout_loss_penalty: 0.03  # 大敗時、出場者全員への追加減点

# --- 特殊能力の効果量・出現率（設計書10）🟡 スキルなしの選手には作用しない（帯不変） ---
# スキルの定義（id・カテゴリ・説明）は data/skills.yaml。ここは効果の強さと生成率だけ。
skills:
  # 打撃系（試合内・行動特性）
  slow_starter_bat_contact_per_pa: 1.6   # 目慣れ（旧 尻上がり・野手）: 打席数あたりのミート増
  slow_starter_bat_max_bonus: 6.0
  opposite_field_pull_factor: 0.55       # 流し打ち（旧 広角打法 spray_pull_factor・issue #907）: 引っ張りバイアスの縮小倍率（issue #262）
  opposite_field_exit_bonus: 0.04        # 流し打ち: 逆方向へ飛んだ打球の初速 +4%
  opposite_field_min_bearing_deg: 10.0   # 流し打ち: 中堅からこれ以上逆方向へ寄った打球を「逆方向」とみなす[deg]
  fastball_hitter_contact_bonus: 6.0     # 速球打ち: ストレート系（ストレート・ツーシーム）へのミート加算
  breaking_ball_hitter_contact_bonus: 5.0    # 変化球打ち: 変化球へのミート加算（空振り減）
  breaking_ball_hitter_discipline_bonus: 6.0 # 変化球打ち: 変化球への選球眼加算（ボール球振り減）
  team_batting_bearing_shift_deg: 5.0   # つなぎの打撃: 走者ありで打球方向を右方向へ[deg]
  team_batting_launch_shift_deg: -2.0    # つなぎの打撃: 走者ありで打球角を低く[deg]（ゴロ寄り）
  team_batting_quality_shift: -0.005     # つなぎの打撃: 走者ありでコンタクト品質を下げる（ヒットになりにくい）
  first_pitch_swing_prob: 0.62           # 初球から振る
  grinder_foul_factor: 1.30              # 粘り打ち: ファウル率拡大（球数を吐かせる）
  streaky_variance_factor: 1.7           # ムラっけ: 当日の出来の振れ幅拡大
  # 投手系（試合内・非線形）
  slow_starter_pitch_control_per_bf: 0.45
  slow_starter_pitch_max_bonus: 8.0
  second_time_through_batters_faced: 9  # 打者一巡: 2巡目（10人目）〜崩れる
  second_time_through_control_penalty: 6.0
  second_time_through_stuff_penalty: 0.10
  effectively_wild_control_penalty: 7.0  # 荒れ球: 制球↓（四球増）だが…
  effectively_wild_stuff_bonus: 0.13     # …打ちにくい
  deceptive_ball_stuff_bonus: 0.18       # クセ球: 球速に依らない空振り誘発
  shaky_start_innings: 2                 # 立ち上がり難: 1〜2回は…
  shaky_start_control_penalty: 6.0       # …制球↓
  shaky_start_stuff_penalty: 0.08        # …球威↓
  quick_delivery_seconds: 0.10           # クイック○: 盗塁の守備側の秒を短縮[s]
  slow_delivery_seconds: 0.10            # クイック×: 盗塁の守備側の秒を延長[s]
  fireman_batters: 3                     # 火消し: 途中登板から対戦打者3人まで…
  fireman_control_bonus: 6.0             # …制球↑
  fireman_stuff_bonus: 0.08              # …球威↑
  fireman_relief_score_bonus: 12.0       # 火消し: 継投AIのリリーフ選びで比較値（4能力の和）へ加算
  # チャンス○×・ピンチ○×（設計書10 §0.1）: プレッシャー倍率の振れ raw＝(精神力−50)/50×slope×P に掛かる側
  clutch_floor_per_pressure: 0.004       # ○: raw の下限 +0.004×P（圧による低下を消し、わずかにプラス）
  choke_negative_amplify: 2.0            # ×: raw<0 を2倍に拡大
  choke_ceiling_per_pressure: 0.008      # ×: raw の上限 −0.008×P（精神力が高くても圧で少し落ちる）
  # チーム系
  spiritual_pillar_captain_factor: 1.4   # 精神的支柱: 主将の緩和量拡大（設計書09 §8）
  moodmaker_mitigation_bonus: 0.06       # ムードメーカー: 出場中なら緩和量へ加算（主将とは別枠、複数人でも重複しない）
  practice_leader_exp_factor: 1.05       # 練習リーダー: 保有者が居ると他の全部員の週間経験値へ乗る倍率
  role_model_exp_factor: 1.08            # お手本: 先輩・同ポジション保有者が居るとその後輩の週間経験値へ乗る倍率
  # 体質・成長系
  diligent_exp_factor: 1.15
  lazy_exp_factor: 0.85
  durable_injury_factor: 0.55
  injury_prone_injury_factor: 1.8
  # 目玉（怪物: 複数分野に確かな上乗せ）
  monster_contact_bonus: 4.0
  monster_power_bonus: 4.0
  monster_control_bonus: 4.0
  monster_stuff_bonus: 0.10
  # 生成（0〜数個、目玉は極稀、一部は隠し）
  max_skills_per_player: 3
  common_skill_prob: 0.16                # チーム系・体質系1種の付与確率
  play_skill_prob: 0.10                  # 打撃系・投手系1種の付与確率（投手寄せ重みで振り分け・負スキルは半分。issue #907 でプール拡充に合わせて別立て）
  hidden_share: 0.22
  marquee_skill_prob: 0.008
  pillar_leadership_threshold: 68
  pillar_bonus_prob: 0.35

# --- 性格の4軸（設計書23 §1・issue #932）🟡 母集団平均の効きを旧8タイプ表の重み付き平均と一致させる（Season/PersonalityTests.cs） ---
# 4軸: ①統率 Leadership（既存）②素直さ Receptiveness ③勤勉さ Diligence ④試合での姿勢 Selflessness（1〜99・50が中立）。
# タイプは4軸の導出ラベル（16タイプ）。効きは d=(軸−50)/50 の片側ごとの一次式（d≥0 は *_high、d<0 は *_low。50で恒等・端で旧表の幅）。
# ④の犠打とチャンスは旧表で献身側／目立ち側の幅が非対称なので、単一傾きでは旧表の母集団平均を同時に満たせない（OPEN-QUESTIONS Q41）。
personalities:
  axis_sd: 12                # 生成: 種タイプの代表値の周りに②③④を引くσ（設計書23 §1.4）
  factor_min: 0.75           # 自主成長（③勤勉さ）の下限・上限
  factor_max: 1.25
  self_growth_jitter_sd: 0.055     # 自主成長の隠れた個人差（勤勉さとは別・Q47 決着）。同タイプ内の自主成長σ≈0.06（旧 PersonalityFactor 相当）
  receptiveness_slope_high: 0.10   # ②→指導の入りやすさ 素直側（端 1.10）
  receptiveness_slope_low: 0.12    #                     頑固側（端 0.88）
  diligence_slope_high: 0.10       # ③→自主成長 コツコツ側（端 1.10）
  diligence_slope_low: 0.08        #             気分屋側（端 0.92）
  bunt_slope_high: 0.05            # ④→犠打の成功加算 献身側（端 +0.05）
  bunt_slope_low: 0.06             #                   目立ち側（端 −0.06）
  chance_slope_high: 0.03          # ④→チャンスの長打質 献身側（端 0.97）
  chance_slope_low: 0.10           #                     目立ち側（端 1.10）
  messenger_slope: 0.06            # ④→伝令役の得意場面（#716）: 投手へ +d×slope／打者へ −d×slope
  # 生成の種（今の8タイプ＋出にくいマスの5タイプ・出やすさは spawn_weight＝Q36/Q44）。代表値は旧表の効きを軸の式で再現する位置（マスの側にある）。
  profiles:
    #                  weight            ①統率ずらし                ②素直             ③勤勉          ④献身
    - { type: HotBlood,     spawn_weight: 1.0, leadership_mean_offset:  25, receptiveness: 45, diligence: 80, selflessness: 95 }
    - { type: Hardworker,   spawn_weight: 1.4, leadership_mean_offset:  -6, receptiveness: 80, diligence: 85, selflessness: 95 }
    - { type: Genius,       spawn_weight: 0.5, leadership_mean_offset:  -6, receptiveness:  5, diligence: 95, selflessness:  5 }
    - { type: HonorStudent, spawn_weight: 1.0, leadership_mean_offset:  25, receptiveness: 95, diligence: 52, selflessness: 95 }
    - { type: MyPace,       spawn_weight: 1.4, leadership_mean_offset:  -6, receptiveness: 30, diligence: 28, selflessness: 88 }
    - { type: MoodMaker,    spawn_weight: 1.2, leadership_mean_offset:  -6, receptiveness: 58, diligence: 12, selflessness:  5 }
    - { type: LoneWolf,     spawn_weight: 0.8, leadership_mean_offset: -16, receptiveness: 18, diligence: 42, selflessness:  8 }
    - { type: Introvert,    spawn_weight: 1.2, leadership_mean_offset: -14, receptiveness: 88, diligence: 28, selflessness: 93 }
    # 新しいマスの種（Q44 決着: 16タイプがそれぞれ3%以上出るように。既存8タイプの重み・統率のずらしは据え置き）
    - { type: Star,         spawn_weight: 0.55, leadership_mean_offset:  25, receptiveness: 70, diligence: 60, selflessness: 22 }
    - { type: Ambitious,    spawn_weight: 0.6,  leadership_mean_offset: -12, receptiveness: 70, diligence: 60, selflessness: 22 }
    - { type: Craftsman,    spawn_weight: 0.55, leadership_mean_offset:  -8, receptiveness: 30, diligence: 60, selflessness: 92 }
    - { type: GangLeader,   spawn_weight: 0.2,  leadership_mean_offset:  25, receptiveness: 30, diligence: 60, selflessness: 22 }
    - { type: Rowdy,        spawn_weight: 0.25, leadership_mean_offset:  25, receptiveness: 30, diligence: 35, selflessness: 20 }

# --- バッテリーの相性（設計書23 §2・issue #933）🟡 K = wS×S0 + wB×B。K=0 で効き先はすべて恒等。乱数不使用 ---
# S0 = a1×d捕手① + a2×d投手② − a3×min(d投④,0)×min(d捕④,0) + a4×max(−d投④,0)×max(d捕④,0)（−1〜+1）
# B = 1 − exp(−イニング/τ)。自校は組ごとの記録（公式戦1・練習試合0.5）、AI校は同じ学校の年数×ai_innings_per_year で近似（Q38/Q39）
battery_chemistry:
  leadership_weight: 0.35       # a1 捕手の統率
  receptiveness_weight: 0.35    # a2 投手の素直さ
  clash_weight: 0.30            # a3 2人とも目立ちたがり＝ぶつかる
  wife_role_weight: 0.30        # a4 目立ちたがりの投手×献身的な捕手＝女房役
  start_weight: 0.5             # wS
  bond_weight: 0.5              # wB
  bond_tau_innings: 60          # τ（エース級が1シーズン組んで0.7前後）
  official_inning_weight: 1.0
  practice_inning_weight: 0.5
  ai_innings_per_year: 30       # AI校: 同じ学校で過ごした1年＝30イニングぶん
  lead_factor_per_k: 0.30       # 捕手のリードの効き 1 + k1×K（Q52 決着で 0.15→0.30）
  rattled_recovery_min_k: 0.6   # K≥これで動揺の自然回復に要るアウト−1
  pinch_control_per_k: 0.20     # ピンチの制球 1 + k2×K×(圧/最大圧)（Q52 決着で 0.03→0.20。K=±1 で相手得点 ∓0.13点/試合）
  pinch_pressure_from: 2        # この指数以上の場面だけ（Q52 決着で 3→2）

# --- チームの結束（設計書23 §3・issue #934）🟡 U = U0 + ΔU（0〜100・50がふつう）。効き先は精神面だけ。U=50 で恒等。乱数不使用 ---
# U0 = 50 + b1×(主将の統率力−基準) + b2×(引っ張る割合−基準) − b3×(目立ちたがりの割合−基準) − b4×(一匹狼の割合−基準)（Q54 決着で各項を「ふつうの部」との差で測る形へ。人数の上限は無い）
# ΔU は自校だけ（合宿・選手間イベント）。週ごとに10%ずつ0へ戻す（Q40）。チームの勢い（#863）とは別物で二重に効かせない
cohesion:
  # U0（顔ぶれの土台）＝50＋各項の「ふつうの部」からの差（Q54 決着: 顔ぶれだけで U0≥70 が上位約15%・U0<30 が下位約15%）。
  # 基準（*_neutral）は全国の AI校のベンチ入りメンバーの平均。割合の分母はベンチ入り全員・性格を持たない手組みの選手は数えない。
  captain_power_weight: 0.9     # b1: 主将の統率力（統率傾向×精神力/100）の基準からの差1あたり
  captain_power_neutral: 49
  leader_threshold: 65          # 「引っ張る」＝統率傾向がこれ以上
  leader_share_weight: 80       # b2: 引っ張る選手の割合の基準からの差（1人/20人ぶん＝+4）
  leader_share_neutral: 0.267
  selfish_share_weight: 70      # b3: 目立ちたがり（④<50）の割合の基準からの差（1人/20人ぶん＝−3.5）
  selfish_share_neutral: 0.385
  lone_wolf_share_weight: 120   # b4: 一匹狼の割合の基準からの差（1人/20人ぶん＝−6）
  lone_wolf_share_neutral: 0.064
  summer_camp_delta: 6          # 夏合宿（通常）
  winter_camp_delta: 10         # 冬合宿（強化）
  # issue #1599（オーナー決定2026-11-25）: 選手間イベントの振れ幅は対応ごとに持つ（#945の一律+3/−5を置き換え）。
  #   叱る＝大きく振れる／話を聞く＝小さく安全／主将に任せる＝主将の統率力次第（d主将＝(統率力−49)/幅・主将不在は−1）
  #   任せるの振れ幅 = captain_*_delta_base + captain_*_delta_per_power×d主将
  scold_improve_delta: 5
  scold_worsen_delta: -7
  listen_improve_delta: 2
  listen_worsen_delta: -2
  captain_improve_delta_base: 4
  captain_improve_delta_per_power: 3
  captain_worsen_delta_base: -5
  captain_worsen_delta_per_power: 3
  # 選択肢つき選手間イベントの好転の確率（#945・設計書23 §3.3。d軸＝(軸−50)/50、式は EventChoiceResolver）
  #   叱る = scold_base + scold_receptiveness_weight×d素直 ／ 聞く = listen_base + …×d素直 + …×d姿勢
  #   任せる = captain_base + captain_power_slope×d主将 + captain_subject_leadership_weight×d統率
  #   全対応に choice_diligence_weight×d勤勉 を足し、[choice_prob_min, choice_prob_max] に丸める
  # issue #1599: 話を聞く・主将に任せるの効きを強化（叱るは据え置き＝元から合う/合わない対応の差が出ていた）。
  #   合う対応で好転7〜8割・合わない対応で2〜3割、平均的な部員でも「話を聞く」の期待値が0以上になるよう校正。
  choice_prob_min: 0.10
  choice_prob_max: 0.90
  choice_diligence_weight: 0.10
  scold_base: 0.50
  scold_receptiveness_weight: 0.35
  listen_base: 0.52
  listen_receptiveness_weight: -0.18
  listen_selflessness_weight: -0.16
  captain_base: 0.50
  captain_power_slope: 0.26
  choice_captain_power_scale: 25
  captain_subject_leadership_weight: -0.11
  weekly_decay: 0.10
  high_threshold: 70            # U≥これで動揺の発生閾値 +1
  low_threshold: 30             # U<これで −1
  messenger_per_cohesion: 0.10  # 伝令の効き 1 + c1×(U−50)/50（U=80 で+6%）
  # --- issue #1601: チーム状態の効き先を足す（オーナー決定 2026-11-25） ---
  error_streak_cap: 1.5         # 効き先②: エラー後その回終わりまでの失策倍率の上限（U=15で×1.5まで。U=50で恒等）
  error_streak_floor_u: 15.0    # 効き先②: 上の上限に丁度達するU（対称に100−この値以上は底打ち）
  training_per_cohesion: 0.07142857142857142  # 効き先④: 練習の伸び 1+k×(U−50)/50 のk（U=85で+5%。k=0.05×50/35）
  event_weight_cap: 2.0         # 効き先⑤: 悪いイベントの抽選重みの倍率の上限（U=15で×2で頭打ち。U≥50で恒等）
  event_weight_floor_u: 15.0    # 効き先⑤: 上の上限に丁度達するU

# --- プレッシャー指数×精神力（設計書02 §3.1-3.2）🟡 精神力50は常に恒等（帯不変） ---
pressure:
  late_inning_from: 8        # 8回以降 +1
  close_score_diff: 2        # 2点差以内 +1
  risp_point: 1              # 得点圏 +1
  bases_loaded_point: 2      # 満塁 +2
  retirement_point: 1        # 負けたら引退（3年夏）+1
  max_index: 8
  multiplier_slope: 0.02     # 倍率 = 1 + (精神力−50)/50 × slope × P（精神力100・P8で+16%）
  fatigue_negative_amplify: 1.5   # 疲労閾値超過時は負側のみ増幅（終盤の失点劇）
  # 士気（＝チーム状態＝結束 U・#1270 M1／#1603・2026-11-23 オーナー決定で連続）: 負側の緩和の土台 ＝ (士気−morale_neutral)/50 × morale_mitigation
  # （結束50で0・0で−0.10＝負側を強める・100で+0.10）。精神力50は恒等・AI校/裏試合は士気を持たない＝帯不変
  morale_neutral: 50.0
  morale_mitigation: 0.10

# --- チームの勢い（issue #863）🟡 自校だけ大会中に保持・計算（Unity側）。段階0（AI校・裏試合・統計シム）は恒等＝帯不変 ---
momentum:
  max_level: 3                   # 勢いの段階上限
  upset_tier_gap1_bonus: 1       # 格上撃破: ティア差1段で+1
  upset_tier_gap2_bonus: 2       # 格上撃破: ティア差2段以上で+2
  walkoff_bonus: 1               # サヨナラ勝ちで+1
  comeback_bonus: 1              # 終盤の逆転勝ちで+1
  comeback_from_inning: 7        # 「終盤」の開始イニング
  comeback_min_deficit: 3        # 逆転判定の最小点差
  multiplier_per_level: 0.02     # 倍率 = 1 + 段階×この値（打者=ミート/投手=制球。最大段階で+6%）

# --- 采配（設計書09: サイン/守備指示/伝令/主将）🟡 判断閾値と効果量 ---
tactics:
  # 攻撃サイン判断（StandardTacticsBrain＝委任・敵AIの土台）
  sac_bunt_from_inning: 7
  sac_bunt_prob: 0.55
  sac_bunt_tie_break_prob: 0.90    # タイブレークでは犠打価値が跳ね上がる（§7）
  sac_bunt_max_power: 58
  sac_bunt_min_skill: 40
  sac_bunt_max_behind: 2
  sac_bunt_max_ahead: 1
  squeeze_from_inning: 8
  squeeze_prob: 0.28
  squeeze_max_diff_abs: 1
  squeeze_min_bunt: 55
  # issue steal-thresholds-unreachable（2026-08-27）: 旧0.72は実ロスター実測の到達可能上限（p99=60.7%・
  # max=65.8%）を超えていて原理的に一度も通らない死にコードだった。当時の引き直し先 0.50 は概ねp70相当（詳細は
  # TacticsCoefficients.StealMinSuccess のコメント参照）。現行値は下の 0.65（issue #838 で再校正）。
  steal_min_success: 0.65          # 読まれる確率込みの成功見込みがこの値以上で仕掛ける（issue #838: 0アウトの損益分岐の近似）。
  steal_prob: 0.45
  # issue #838: 損益分岐のアウト数別オフセット（セイバーメトリクス近似）と、閾値直上の崖をなだらかにする傾き。
  steal_min_success_one_out_offset: -0.03
  steal_min_success_two_out_offset: 0.10
  steal_attempt_logistic_steepness: 40.0
  # 三盗（issue #67, design-14 未決A）: 二塁のみ在塁でのみ判定（本盗は issue #788 で廃止）。塁状況が排他のため
  # 一・三塁の重盗（baserunning.double_steal_third_break_prob）とは競合しない。
  # 三盗: issue #949（2026-11-14）で三盗を物理だけで決める形にし（二塁走者のリード6.0m・補正−0.35撤去）、
  # 成功見込みが二盗の少し下まで上がったので 0.045→0.45 に引き直した。企図は main の約2.3倍
  # （10000試合 --tactics seed42: 379→870、成功率 11.3%→58.5%）。監督決定「mainの2〜3倍まで」の範囲。
  # 0.40=1574回（4.2倍）・0.50=437回（1.2倍）・0.60=34回＝閾値に敏感（詳細は TacticsCoefficients のコメント）。
  steal_third_min_success: 0.45
  steal_third_prob: 0.25
  steal_third_max_outs: 0          # 無死のみ
  steal_third_max_diff_abs: 3      # 大差では狙わない
  # 単独の本盗は採用しない（issue #788・2026-11-08 監督決定）＝本盗の判断係数は持たない
  hit_and_run_prob: 0.07
  hit_and_run_min_contact: 55
  hit_and_run_max_power: 65
  # ギャンブル始動（設計書12 §5, G3b）: 際どい盗塁ほど好ジャンプ・意表に賭ける
  gamble_start_max_success: 0.82   # 見込みがこの値未満の盗塁でギャンブルを検討
  gamble_start_prob: 0.40          # 際どい盗塁でギャンブル始動に賭ける確率
  take_max_control: 40
  take_prob: 0.30
  # 本塁への送り判定（設計書12 §3/§4, F2）: 生還推定確率がこの閾値以上なら還す
  send_home_min_success: 0.50        # 中立采配の送り閾値（Slice C校正: 憤死を目標帯へ）
  send_home_two_out_relax: 0.30      # 2アウトは緩和（積極的に還す）
  send_home_aggression_span: 0.50    # aggression(0..1)で閾値を±動かす幅
  # 三塁への送り判定（単打の一塁→三塁, Issue #89）: 三塁は失うものが小さく閾値は本塁より低め
  send_third_min_success: 0.60       # 中立采配で三塁へ回す閾値
  send_third_two_out_relax: 0.25     # 2アウトは緩和
  send_third_aggression_span: 0.45   # aggression(0..1)で閾値を±動かす幅
  # ゴロ凡打の進塁打の送り判定（二塁→三塁, Issue #318）: アウト数を取らない（2アウト緩和なし）。
  # ゴロ凡打は currentOuts>=2 で ApplyInPlayOut が即 return するため 2アウト緩和は死にコードになる。
  # issue #1418: 遊撃・三塁方向（走者の前）のゴロは必ず自重、一塁手・二塁手のゴロは必ず進む（BaserunningModel）。
  # この閾値が効くのは残り（投手ゴロ・三盗始動の走者など）だけ。
  send_advance_min_success: 0.35     # 中立采配で進塁を狙う閾値
  send_advance_aggression_span: 0.40 # aggression(0..1)で閾値を±動かす幅
  # 犠飛以外のタッチアップの送り判定（design-14 P3-11）。静止から出るぶん博打の分が悪く、実物の三塁コーチも
  # 「ほぼ確実な時だけ行かせる」＝他の送り閾値より高い。進塁打の0.35を流用すると送った試行の3〜4割が走塁死になる。
  send_tag_up_min_success: 0.85      # 中立采配でタッチアップを行かせる閾値
  send_tag_up_aggression_span: 0.20  # aggression(0..1)で閾値を±動かす幅
  # 内野深さ×ゴロ×本塁（G1, 設計書12 §4/§5）は深さで本塁プレーの有無を分岐（前進=勝負/後退=献上/通常=テーブル）。
  # 送りバイアスは baserunning.home_grounder_start_delay_seconds で調整。
  # 守備指示判断
  bunt_shift_prob: 0.50
  infield_in_from_inning: 8
  infield_in_max_lead: 1
  outfield_deep_min_power: 72
  # 外野後退の相対基準（issue #976 追補・オーナー決定 2026-11-15 ①）: パワー≥上の値 かつ 打線の平均＋これ 以上の打者だけに外野を下げる。
  # 各県の最強校は打者の81%がパワー72以上で、全打席で外野が下がり三塁打がほぼ消えていた（甲子園 0.03%）。0以下＝相対基準なし。
  outfield_deep_above_lineup_mean: 10.0
  control_first_max_control: 38
  keep_low_min_power: 75
  gear_push_innings_left: 1
  gear_push_max_diff_abs: 1
  gear_coast_min_lead: 5
  # 敬遠（design-14 P1-3）: 一塁空き・得点圏・強打者・僅差終盤で次打者と勝負。intentional_walk_prob 0.6 で有効
  intentional_walk_min_power: 70
  intentional_walk_from_inning: 6
  intentional_walk_max_diff_abs: 3
  intentional_walk_prob: 0.6
  # 伝令判断（攻守各3回, §3）
  defense_timeout_min_pressure: 3
  offense_timeout_min_pressure: 5
  offense_timeout_max_mental: 42
  # 選手交代判断（設計書09 §6, C-2。決定論=能力の極値を選ぶ）
  pinch_hit_from_inning: 7
  pinch_hit_contact_ceiling: 46      # この打者ミート以下を代打候補に
  pinch_hit_improvement: 12          # 控えがこれだけミート上なら送る
  pinch_hit_min_diff: -3             # 代打を出す得失点差レンジ（僅差〜小ビハインド）
  pinch_hit_max_diff: 2
  pinch_hit_power_weight: 0.0        # 代打評価にパワーを混ぜる重み（0=ミートのみ・素の挙動。設計書11 §4）
  pinch_hit_platoon_bonus: 0.0       # 左右の相性ボーナス（0=相性を見ない・素の挙動）
  pinch_hit_risp_ceiling_bonus: 0    # 得点圏でミート上限を緩める幅（0=場面を見ない・素の挙動）
  pinch_run_from_inning: 8
  pinch_run_speed_ceiling: 44        # この走力以下の走者を代走候補に
  pinch_run_improvement: 22          # 控えがこれだけ走力上なら送る
  pinch_run_min_diff: -2             # 1点を取りにいく場面（ビハインドこの点以内〜+1）
  pinch_run_max_diff: 1  # 代走を出す点差の上限（リード側）
  defensive_sub_from_inning: 8
  defensive_sub_min_lead: 1          # このリード以上で守備固め
  defensive_sub_fielding_ceiling: 44 # この守備以下を交代候補に
  defensive_sub_improvement: 12      # 控えがこれだけ守備上なら固める
  # サイン効果（補正係数。パイプライン不変）
  hit_and_run_contact_boost: 0.10
  hit_and_run_power_penalty: 0.15
  hit_and_run_launch_penalty: 0.20
  hit_and_run_caught_penalty: 0.15
  hit_and_run_caught_safe_min: 0.02  # エンドラン空振り時の走者の生存確率の下限
  hit_and_run_caught_safe_max: 0.98  # エンドラン空振り時の走者の生存確率の上限
  # 打撃姿勢（采配カード。プレイヤーが選んだ打席にだけ載る＝AI駆動のシムは不変）
  ground_ball_launch_penalty: 0.30 # 転がせ
  ground_ball_contact_boost: 0.05
  ground_ball_power_penalty: 0.10
  slug_power_boost: 0.12           # 長打狙い
  slug_launch_boost: 0.20
  slug_contact_penalty: 0.12
  put_in_play_contact_boost: 0.14  # 当てに行け
  put_in_play_power_penalty: 0.18
  squeeze_read_base: 0.08          # ウエスト（バッテリー察知）
  squeeze_read_per_lead: 0.002
  squeeze_read_obvious_bonus: 0.05
  squeeze_read_max: 0.60  # ウエストを読まれる確率の上限
  # 陣形→初期守備位置（効果は幾何＝物理から出る, §2.1）
  infield_in_factor: 0.82
  infield_deep_factor: 1.12
  outfield_in_factor: 0.88
  outfield_deep_factor: 1.05   # issue #976 追補（オーナー決定 ②）: 1.10→1.05
  bunt_shift_corner_charge_factor: 0.60
  # 配球方針の重み（§2.2）
  fastball_heavy_share_delta: 0.25
  breaking_heavy_share_delta: -0.25
  control_first_aim_sigma_factor: 0.72
  keep_low_aim_y_offset_m: -0.18
  inside_aim_x_offset_m: 0.15
  # くさい所（issue #872）: 縁を重みつきで1本選び、縁の上をわずかに外へ狙う（打席単位の守備指示）
  pitch_around_overshoot_m: 0.02
  pitch_around_weight_low: 0.40
  pitch_around_weight_outside: 0.35
  pitch_around_weight_high: 0.10
  pitch_around_weight_inside: 0.15
  # 伝令効果・動揺・主将（§3/§8）
  timeout_mitigation: 0.60
  timeout_duration_pa: 3
  # 伝令の「落ち着き」（issue #714）: 効果窓のあいだ 守備=制球／攻撃=ミート に 1+(base+per_pressure×P)×采配係数×素直さ。
  # 精神力に関係なく効く。P5で+6%。采配係数=1+(采配−neutral)×sense_slope（20→×0.79／90→×1.28）
  timeout_calm_base: 0.01
  timeout_calm_per_pressure: 0.01
  timeout_sense_slope: 0.007
  timeout_sense_neutral: 50
  # 伝令役の人選（issue #716）: 落ち着きの上乗せ分に 伝令役の係数 を掛ける。
  # 係数 = clamp(min,max, 1+(統率傾向−neutral)×slope + 3年+/1年− + 同学年+ + 性格の得意場面(personalities の messenger_to_*))
  messenger_leadership_slope: 0.006
  messenger_leadership_neutral: 50
  messenger_senior_bonus: 0.08
  messenger_freshman_penalty: 0.08
  messenger_same_grade_bonus: 0.06
  messenger_factor_min: 0.7
  messenger_factor_max: 1.4
  ai_messenger_pick_min_sense: 60    # AI監督の采配がこれ以上なら最適な伝令役、未満ならベンチの先頭を走らせる
  # 主将を伝令役に走らせたときの上乗せ（issue #860 B）。統率力（captain_presence_per_powerと同じLeadership×Mental/100）
  # 1あたり係数へ加算し、通常上限（messenger_factor_max=1.4）を超えて captain_messenger_factor_max まで伸びる。
  captain_messenger_bonus_per_power: 0.015
  captain_messenger_factor_max: 2.4
  rattled_consecutive_baserunners: 3
  rattled_negative_amplify: 1.4
  rattled_control_penalty: 0.10        # 動揺中は精神力に関係なく制球×(1−これ)（issue #714。守備伝令で解く価値）
  rattled_threshold_mental_offset: 1   # 精神力50で従来同値・100で+1しにくく・0で-1しやすく（issue #73）
  rattled_recovery_outs: 2             # 動揺後、無失点でこの数アウトを重ねると自然回復（issue #73）
  # 主将（issue #860 A・設計書09 §8.1）: 在場中チーム全員へ常時かける底上げ倍率 = 1 + 統率力 ×
  # captain_presence_per_power ×（在場1.0／ベンチcaptain_bench_factor）。統率力=統率傾向×精神力/100。
  # 旧「プレッシャー負補正の緩和」(captain_mitigation_per_power)を置き換えた（2026-11-10 監督決定）。
  captain_presence_per_power: 0.0003
  captain_bench_factor: 0.30   # ベンチの主将でも底上げの3割は残る（Bの伝令ボーナスと両取り可）
  # 1球采配（設計書15 §2.3, Phase C）
  pitch_tactics_two_strike_force_swing_prob: 0.0   # 追い込まれ矯正はbatting.two_strike_*（本則）へ統合済み・無効化
  pitch_tactics_two_strike_min_contact: 50
  pitch_tactics_three_zero_take_prob: 0.0          # 3-0待てはbatting.three_zero_swing_factor（本則）へ統合済み・無効化
  pitch_tactics_three_zero_swing_away_min_power: 80
  pitch_tactics_three_zero_swing_away_from_inning: 7
  pitch_tactics_three_zero_swing_away_max_diff_abs: 1
  pitch_tactics_put_away_prob: 0.50                # 守備: 2ストライク後の決め球切替
  pitch_tactics_inside_attack_prob: 0.0            # 守備: 有利カウントで内角攻め（素の采配は0＝使わない。上級AIだけ ai_inside_attack_prob）
  pitch_tactics_control_first_min_balls: 3         # 守備: 不利カウントでゾーンに集める

# --- 敵AI（設計書11: 三層＝能力値ミス率×ティア引き出し×校風）🟡 別途の難易度補正は持たない ---
# プレイヤーとAIは同じ采配システム（tactics:）を使い、選び方だけがこの三層で変わる。
enemy_ai:
  # ① 能力値層: 最適解選択率 = base + 采配能力 × per_sense
  optimal_base: 0.55
  optimal_per_sense: 0.004
  optimal_floor: 0.50
  optimal_cap: 0.98
  reckless_on_miss_prob: 0.18       # 正着を外したとき無謀な盗塁に走る確率
  # ② ティア層: 各戦術の最低ティア（0=G 〜 7=S）
  safety_bunt_min_tier: 2           # E: 状況セーフティ
  steal_min_tier: 2                 # E: 状況盗塁
  steal_third_min_tier: 4            # C: issue #67 三盗は状況を見極めた上位校のみ
  gamble_start_min_tier: 4          # C: ギャンブル始動（好ジャンプ・意表, G3b）
  squeeze_min_tier: 5               # B: 上級
  hit_and_run_min_tier: 5           # B: 上級
  depth_min_tier: 2                 # E: 守備位置調整
  bunt_shift_min_tier: 5            # B: 守備シフト
  advanced_policy_min_tier: 2       # E: カウント別配球
  inside_policy_min_tier: 5         # B: 内角・釣り球
  gear_min_tier: 4                  # C: ギア先読み
  timeout_min_tier: 2              # E: 伝令運用
  pinch_hit_min_tier: 0             # G: 代打は初級校も持つ基本の引き出し（設計書11 §2・#1046）
  pinch_run_min_tier: 2             # E: 代走の使いどころ（#1046 で C→E へ緩和＝G/F だけ据え置き）
  defensive_sub_min_tier: 3         # D: 守備固め
  pitch_tactics_min_tier: 2        # E: 1球采配（カウント別の基本判断, 設計書15 §2.3）
  # ③ 校風層: 采配傾向の重み
  small_ball_steal_factor: 1.7
  small_ball_bunt_factor: 1.4
  small_ball_bunt_inning_earlier: 2
  small_ball_hit_and_run_factor: 1.8
  small_ball_steal_min_success_relax: 0.08 # issue #838 やること#3: 実測で確認済み。損する盗塁の増加要因ではない（内訳は三盗の既知クランプ＋無謀な盗塁の別メカニズム）
  small_ball_gamble_start_factor: 1.8   # 機動力校はギャンブル始動を多用（G3b）
  power_bunt_factor: 0.30
  power_take_factor: 1.5
  power_squeeze_factor: 0.40
  defensive_bunt_factor: 1.4
  defensive_shift_factor: 1.4
  defensive_coast_lead_earlier: 1
  defensive_sub_inning_earlier: 1        # 守り勝つ: 守備固めを早める
  small_ball_pinch_run_inning_earlier: 1 # 機動力: 代走を早める
  ace_dependent_defense_timeout_keep_prob: 0.45
  # ④ 監督傾向層（issue #55, 校風と別軸で0〜2個重なる采配の癖）
  bunt_heavy_bunt_factor: 1.5                 # 1) バント多用
  bunt_heavy_bunt_inning_earlier: 2
  run_and_gun_steal_factor: 1.6              # 2) 盗塁・エンドラン好き
  run_and_gun_hit_and_run_factor: 1.8
  run_and_gun_steal_min_success_relax: 0.06 # issue #838 やること#3: 実測で確認済み。強肩相手では企図0件で問題なし
  ace_overuse_relieve_margin_factor: 1.6     # 3) エース酷使（継投を引っ張る＝諸刃。ハードキャップ撤廃で margin だけで表現, issue #356）
  quick_hook_relieve_margin_factor: 0.45     # 4) 継投早め
  quick_hook_defensive_sub_inning_earlier: 1
  aggressive_pinch_hit_inning_earlier: 2     # 5) 代打積極
  aggressive_pinch_hit_ceiling_relax: 6
  aggressive_pinch_hit_improvement_relax: 4
  promoter_condition_weight: 9.0             # 6) 抜擢型（調子重み・起用判断）
  promoter_min_condition_step: 1
  squeeze_lover_squeeze_factor: 2.0          # 7) スクイズ好き
  aggressive_gear_push_innings_more: 1       # 8) 強気ギア
  aggressive_gear_push_diff_more: 1
  aggressive_gear_coast_lead_later: 2
  cautious_intentional_walk_prob: 0.7        # 9) 慎重（基準 intentional_walk_prob 0.6 より上でないと Math.Max に埋もれる）
  cautious_intentional_walk_min_power_relax: 4
  # ⑤ エース温存層: 先発選択（issue #42, 設計書11 §2/§3）🟡実測校正
  ace_rest_min_tier: 3                        # D: ローテ運用の基本判断（未満は常時エース先発）
  ace_rest_base: 0.05
  ace_rest_tier_gap_weight: 0.05              # 相手とのティア差1段あたり（自校が格上なほど加点）
  ace_rest_rounds_remaining_weight: 0.05      # この試合の後に残るラウンド数1つあたり（決勝は加点なし）
  ace_rest_fatigue_weight: 0.35               # エースの直近消耗負荷（0〜1正規化）
  ace_rest_fatigue_window_days: 7             # 消耗負荷を見る直近日数の窓（#41 台帳）
  ace_rest_fatigue_reference_pitches: 100.0   # 消耗負荷=1.0とみなす基準球数
  ace_rest_floor: 0.0
  ace_rest_cap: 0.85
  ace_rest_ace_dependent_factor: 0.2          # 豪腕依存: 打線は水物＝エースにほぼ常に頼る
  ace_rest_defensive_minded_factor: 1.6       # 守り勝つ野球: ローテ管理に積極的
  ace_rest_total_baseball_factor: 1.4         # 全員野球: 選手層を使い回す方針の一環
  # ⑥ 高度な継投層（issue #209 で配線 → #1046 で実戦投入）。疲労/球数上限以外の継投トリガー。
  # 通るのは AiTacticsBrain（相手校・委任・裏試合フルシム）だけ＝StandardTacticsBrain 駆動の
  # games_10k/games_10k_tactics は高度トリガーを持たないので不変。C#既定と一致させる（不変条件#4）。
  blowup_relief_min_tier: 0                    # 崩れ（大量失点の火消し）: G-F も持つ基本の引き出し
  close_late_relief_min_tier: 2               # 僅差終盤の早め継投: E（状況判断）
  rattled_relief_min_tier: 2                  # 動揺（連続出塁）の投手切替: E（状況判断）
  blowup_runs_in_inning: 5                    # この失点数以上で火消し候補
  close_late_from_inning: 7                   # 僅差終盤とみなす回（この回以降）
  close_late_max_score_diff: 2               # 僅差とみなす得失点差の絶対値（守備側視点）
  close_late_relief_margin_factor: 0.6       # 疲労margin をこの倍率まで前倒しして早発火（<1.0=早め）
  ace_dependent_relief_tier_penalty: 2       # 豪腕依存: 高度継投の実効ティアをこの段下げる（引っ張る）
  defensive_minded_relief_tier_bonus: 1      # 守り勝つ: 高度継投の実効ティアをこの段上げる（厚め・早め）
  # ⑥b 相手校の代打・代走 baseline（issue #1046）。素の StandardTacticsBrain は現実より控えめなので、
  # 相手校（AiTacticsBrain）だけ全校一律で条件を現実並みへ引き上げる。校風・監督傾向はこの上に掛かる。
  # games_10k(_tactics) 帯の素の采配はこの baseline を通らないので不変。C#既定と一致させる（不変条件#4）。
  ai_pinch_hit_inning_earlier: 1             # 代打を考え始める回を前倒し（7→6）
  ai_pinch_hit_ceiling_relax: 28             # 代打候補の打者ミート上限を上げる（46→74＝強豪の不調打者も候補に）
  ai_pinch_hit_improvement_relax: 4          # 控えに求める上積みを下げる（12→8）
  ai_pinch_hit_power_weight: 0.6             # 代打評価にパワーを混ぜる重み（打力の総合, 設計書11 §4）
  ai_pinch_hit_platoon_bonus: 6.0            # 代打評価の左右の相性ボーナス（設計書11 §4）
  ai_pinch_hit_risp_ceiling_bonus: 8         # 得点圏（場面）でミート上限をさらに緩める幅（設計書11 §4）
  ai_pinch_run_inning_earlier: 1             # 代走を考え始める回を前倒し（8→7）
  ai_pinch_run_speed_ceiling_relax: 8        # 代走候補にする走者の走力上限を上げる（44→52）
  ai_pinch_run_improvement_relax: 10         # 代走に求める走力の上積みを下げる（22→12）
  # ⑧ 上級差の層（issue #1295, 設計書11 §2・§4）
  ai_inside_attack_prob: 0.30                # 有利カウントでの内角攻め（釣り球）の確率。inside_policy_min_tier 以上だけ
  timeout_reserve_min_tier: 4                # C: 伝令の温存（残回数管理）を使うティア
  timeout_reserve_keep: 1                    # 残りがこの回数以下なら終盤まで取っておく
  timeout_reserve_from_inning: 7             # 温存を解く回
  # ⑦ 守備位置操作層（issue #255, 設計書09 §2.3/§6.2）🟡実測校正
  # AIが「守備位置の入替（交代回数を消費しない無料の手）」と「コンバート継投」を打てるようにする層。
  # ⑥ 高度な継投層と同じ2段運用（①既定オフで配線 → ②有効化して帯を実測 → 採否）で入れ、
  # 実測の結果このティアで採用した（オーナー決定 2026-07-26）。
  # 通るのは AiTacticsBrain（相手校・委任采配）だけ＝StandardTacticsBrain 駆動の
  # games_10k/tactics 帯・決定論baseline は動かない。
  defense_swap_min_tier: 3                    # A-2: 守備位置の入替（D＝守備固め defensive_sub_min_tier と同じ引き出し帯）
  defense_swap_from_inning: 7                 # A-2: 終盤限定（この回以降）
  defense_swap_max_score_diff: 2              # A-2: 僅差限定（守備側視点の点差の絶対値）
  defense_swap_min_gain: 4.0                  # 守備スコアの最小改善量（これ以下では動かさない）
  defensive_minded_swap_tier_bonus: 1         # 守り勝つ: 組み替えに積極的
  ace_dependent_swap_tier_penalty: 1          # 豪腕依存: 投手任せで守備を動かさない
  # 守備位置ごとの負担重み（守備スコア = Σ 重み × Fielding）。捕手・投手・DHは入替対象外なので持たない。
  defense_weight_shortstop: 1.00
  defense_weight_center_field: 0.90
  defense_weight_second_base: 0.80
  defense_weight_third_base: 0.70
  defense_weight_right_field: 0.55
  defense_weight_left_field: 0.45
  defense_weight_first_base: 0.30
  convert_relief_min_tier: 5                  # B-1: コンバート継投（B＝交代枠を1つ払う上級の運用）
  convert_relief_min_batting: 60.0            # 元投手の (ミート+パワー)/2 がこれ以上なら打順に残す

# --- 怪我（設計書03 §3.5: 段階制・常に可視・押して出場は悪化リスク）🟡 ---
injury:
  weekly_base_prob: 0.004
  resistance_slope: 0.010
  minor_share: 0.70
  moderate_share: 0.25
  minor_recovery_weeks: 2
  moderate_recovery_weeks: 4
  severe_recovery_weeks: 8
  minor_performance_factor: 0.95
  moderate_performance_factor: 0.85
  severe_performance_factor: 0.70
  play_through_worsen_prob: 0.30
  worsen_extra_weeks: 3
  play_through_extra_weeks: 1    # 悪化しなくても出場1試合ごとに全治が延びる週（0で従来挙動）
  medical_recovery_factor: 1.0   # 医療施設で短縮（設計書04の備品, 未接続時1.0）
  # --- 試合中の場面駆動の受傷（設計書03 §3.5・設計書12）。傷病の種類は data/injuries.yaml。
  # 判定は Fork した専用ストリームで引くため、ここを動かしても試合結果・統計帯は動かない（観測データ）。
  match_hit_by_pitch_prob: 0.010        # 死球1回あたり
  match_home_collision_prob: 0.020      # 本塁クロスプレー憤死1回あたり
  match_home_collision_catcher_share: 0.35  # うち捕手側が負傷する割合（残りは走者）
  match_fence_crash_prob: 0.030         # フェンス際の飛球を捕った外野手1回あたり
  match_fence_crash_margin_m: 2.5       # 「フェンス際」と見なす着地点〜フェンス距離[m]
  match_sliding_prob: 0.0035            # 盗塁企図1回あたり
  match_overuse_prob: 0.008             # 投球過多の投手が1打席ごとに
  match_overuse_over_pitches: 25        # 投球過多と見なすスタミナ目安球数の超過分[球]

# --- 選手成長イベント（設計書03 §5.5: 覚醒/開眼/スランプ/伸び悩み/イップス）🟡 ---
# 原則: 上昇はレアな福音、下降は文脈必須（理不尽回避）。覚醒率・恒久ダウン率は設計書07で検証
growth:
  awakening_weekly_prob: 0.007        # #694: 0.0015→0.007（1校あたり年0.4回→約2回。SeasonEngine 40年で実測）
  awakening_growth_threshold: 1.15
  awakening_condition_min: 0.2
  awakening_gain: 4
  awakening_condition_boost: 0.15    # 覚醒発生時の調子押し上げ（イベント→ConditionValue, issue #46）
  breakthrough_weekly_prob: 0.003
  breakthrough_gain: 3
  slump_weekly_prob: 0.0025
  slump_condition_max: -0.2
  slump_weeks_min: 3
  slump_weeks_max: 6
  slump_performance_factor: 0.93
  slump_condition_drop: 0.15         # スランプ発生時の調子押し下げ（イベント→ConditionValue, issue #46）
  plateau_cap_proximity: 3.0
  plateau_weekly_prob: 0.004
  plateau_growth_factor: 0.6
  yips_weekly_prob: 0.0008
  yips_ability_drop: 5
  yips_overcome_weekly_prob: 0.03
  # --- issue #694 で足した上昇イベント（2026-10-28 監督決定: 4系統すべて）---
  # 大覚醒: 1能力が大きく跳ね、その能力の才能上限も少し上がる。極レア（好調＋伸びしろの上に起きる）
  grand_awakening_weekly_prob: 0.0006
  grand_awakening_condition_min: 0.4
  grand_awakening_gain: 10
  grand_awakening_cap_lift: 5
  # 伸びしろアップ: 分野の伸びしろ×factor（max で頭打ち）＋分野の才能上限+cap_lift。能力はその場で動かない
  growth_surge_weekly_prob: 0.0015
  growth_surge_condition_min: 0.1
  growth_surge_factor: 1.25
  growth_surge_max: 1.8
  growth_surge_cap_lift: 3
  # 新球種のコツ（投手のみ）: 変化球が max 本未満なら覚え（キレ+offset で入る）、達していれば最弱の球種を磨く
  new_pitch_weekly_prob: 0.0025
  new_pitch_max_breaking: 4
  new_pitch_offset: -6
  pitch_refine_gain: 5
  # 大舞台での化け: 公式戦の好投・好打の直後に、大会の格ごとの確率で精神力＋分野の能力2つ
  big_stage_prob_koshien: 0.4
  big_stage_prob_regional: 0.25
  big_stage_prob_prefectural: 0.1
  # 相手係数（相手Tier−自校Tier。確率 = 大会の格 × 係数・上限1。issue #862）
  big_stage_opp_lower2: 0.1
  big_stage_opp_lower1: 0.4
  big_stage_opp_even: 1.0
  big_stage_opp_upper1: 1.6
  big_stage_opp_upper2: 2.2
  big_stage_mental_gain: 5
  big_stage_gain: 3
  big_stage_min_hits: 3
  big_stage_min_rbi: 4
  big_stage_min_outs: 21
  big_stage_max_runs: 2
  big_stage_min_strike_outs: 10

# --- 気づきイベント（設計書03 §5.6: 育成眼→頻度/精度）🟡 ---
insight:
  base_weekly_prob: 0.006
  prob_per_talent_eye: 0.00008
  accuracy_base: 0.55
  accuracy_per_talent_eye: 0.004
  accuracy_max: 0.97
  # 効果2「見極め」（#702・設計書03 §3.3）: 個別指導に指名中の選手だけ発生率×factor・精度+add（上限は accuracy_max）。
  # 2026-10-31 監督決定: 頻度×5・精度+15%。
  nominated_prob_factor: 5.0
  nominated_accuracy_add: 0.15
  recent_growth_condition_min: 0.2  # 気づき: 成長中の兆しを話題にしうる調子の下限
  recent_growth_topic_prob: 0.4  # 気づき: 成長中の兆しを話題にする確率
  personality_topic_prob: 0.30  # 気づき: 性格の兆しを話題にする確率
  growth_type_topic_prob: 0.25  # 気づき: 成長タイプの兆しを話題にする確率
  high_growth_domain_prob: 0.5  # 気づき: 伸びしろの話題で高い分野を選ぶ確率
  hidden_skill_topic_prob: 0.5  # 気づき: 隠しスキルを持つ選手に正しく気づいたとき、それを開示する確率（即開示・#1471）
  pitcher_sense_topic_prob: 0.25  # 気づき: 投手センス（隠し能力・#1472）の見立てを話題にする確率（新しい見立てで上書き）
  pitcher_sense_misread_offset: 15  # 気づき: 読み違えたとき投手センスの見立てがずれる幅（表示Lv・上下どちらか）
  # 投手の素質の見出し（issue #1523）: 隠しの投手センスと見える投手能力（球速・制球・キレの平均）の差で、見立て→外部コーチの2段。肩書きは見ない
  pitcher_talent_sense_min: 42.0    # 見立ての対象: 投手センス（物理Lv）の下限
  pitcher_talent_gap_min: 15.0      # 見立ての対象: 投手センス − 見える投手能力（物理Lv）の下限
  pitcher_talent_hint_prob: 0.015   # 対象の選手に見立てが出る週次の確率
  pitcher_talent_discover_prob: 0.04  # 見立て済みの選手が外部コーチに見出される（覚醒する）週次の確率
  pitcher_talent_cap_bonus: 15      # 見出された選手の投手系能力の才能上限に足す値（表示Lv・99で止める）

# --- 特殊能力の後天習得・克服（設計書10 §3・issue #1471）（OPEN-QUESTIONS Q58 決着 2026-11-23）---
# 1.0 の道は3つ（オーナー判断 2026-11-23）: 覚醒で有益スキル／公式戦の活躍（実戦経験）／負スキルの克服（学年・実戦）。
# 練習の積み重ねでの習得は入れない。乱数は専用ストリーム（育成・試合の乱数列は動かない）。
skill_acquisition:
  awakening_skill_prob: 0.15        # 覚醒（打撃・投球。守備・走塁には付けない）でその分野の有益スキルが付く確率
  grand_awakening_skill_prob: 0.5   # 大覚醒で同上
  match_skill_prob: 0.04            # 公式戦で活躍した選手に有益スキルが付く確率（1試合）
  match_overcome_prob: 0.10         # 公式戦で活躍した選手が同じ分野の負スキル（チャンス×・ピンチ×・立ち上がり難等）を克服する確率
  match_min_hits: 3                 # 活躍の基準（打者）: 3安打以上 または…
  match_min_rbi: 4                  #   …4打点以上
  match_min_outs: 21                # 活躍の基準（先発）: 7回以上かつ…
  match_max_runs: 2                 #   …2失点以内、または…
  match_min_strike_outs: 10         #   …10奪三振以上
  relief_min_outs: 6                # 活躍の基準（救援）: 2回以上を無失点
  grade_overcome_prob: 0.20         # 年度替わりに2・3年がサボり癖・ケガしやすい（見えているもの）を克服する確率（1年・1つあたり・勤勉さ50）
  grade_overcome_diligence_span: 0.10  # 勤勉さ（性格③）への連動: +(勤勉さ−50)/49×幅＝勤勉さ1で10%・99で30%（Q58 決着③）
  max_skills: 4                     # 後天習得はこの数（怪物を除く）を超えては付けない

# --- 週次イベントの発火（設計書03 §5 / 04 §3.2・issue #609）---
# 従来 EventScheduler にハードコードされていた「同一週最大1件・発火率50%」をここへ出したもの。
# 固定イベント（カレンダー連動）は weekly_fire_probability を通さず必ず発火する。
events:
  weekly_fire_probability: 0.5   # ランダム/選択イベントを1件でも引く確率（毎週は起きない）
  max_random_per_week: 1         # 1週に提示するランダム/選択イベントの上限

# --- 入部予定者の事前開示（設計書04 §2.1 効果2・issue #587）---
# スカウト網の契約段が渡す開示精度 0〜1 を「推定誤差σ」と「隠しパラメータの判明確率」へ写す。
# 表示専用＝選手そのものには触れないので帯に影響しない。
scouting:
  estimate_sd_max: 20.0   # 開示0（未契約）のときの推定誤差σ（カテゴリ強さ0〜100スケール）
  estimate_sd_min: 4.0    # 開示1でもσは0にしない＝最上位でも「見立て」の域を出ない
  reveal_min: 0.05        # 開示0のとき隠し1項目が判明する確率
  reveal_max: 0.85        # 開示1でも1.0にしない＝全部は見えない

# --- スカウト（設計書04 §2・issue #867）---
# 枠の数自体は年契約「スカウト網」の段（contracts.scouting の scout_slots）が持つ。ここは
# 候補リストの作り方・入部成否・訪問費用・見立ての当たりやすさの係数だけを持つ。
# 進路希望の重み・見立てノイズの具体値は issue 本文に数値指定が無いため無難な初期値（要調整）。
scout:
  candidates_per_slot: 3            # 候補リストの人数＝枠×これ（オーナー決定「候補は枠の約3倍」）
  candidate_talent_center_add: 10.0 # 受動枠の中心(32)より上振れ＝わざわざ名前が挙がる子
  field_bias_oversample: 3.0        # 分野指定時に生成するプールの倍率（選抜前）
  field_bias_jitter_sd: 10.0        # 選抜の順位付けに乗せるジッタσ（機械的な固定選抜を避ける）
  out_of_prefecture_ratio: 0.65     # 県外から来る割合（残りは自県＝距離0）
  # 成功率 = base + 進路希望の相性項 - 距離の減点(寮で緩和) - 競合校の格の減点 + 訪問の積み上げ
  # base は遠方(penalty_far=0.24)でも相性項0の志向が床に落ちきらない水準に置く（0.24を上回らせる）。
  base_probability: 0.30
  prob_per_fame: 0.0035             # 名門志向: 名声100で +0.35
  prob_per_opportunity: 0.35        # 出場機会志向: 空き(0〜1)の傾き
  prob_per_local: 0.35              # 地元志向: 近さ(0〜1。同県=1.0〜遠方=0.0)の傾き
  prob_per_visit: 0.09
  visit_gain_max: 0.36              # 通い詰めても確実にはしない
  prob_per_rival_tier: 0.08         # 自校より上の段だけ効く
  probability_min: 0.02
  probability_max: 0.92
  penalty_same_region: 0.06
  penalty_neighbor_region: 0.14
  penalty_far: 0.24
  closeness_same_region: 0.67  # 近さ: 同地方（同県=1.0・遠方=0.0）
  closeness_neighbor_region: 0.33  # 近さ: 隣接地方
  rival_tier_same_cutoff: 0.35  # 競合校ティア抽選: これ未満なら同ティア
  rival_tier_plus1_cutoff: 0.65  # 同: これ未満なら+1ティア
  rival_tier_plus2_cutoff: 0.85  # 同: これ未満なら+2ティア
  rival_tier_plus3_cutoff: 0.95  # 同: これ未満なら+3ティア（以上は−1）
  blurb_high_min: 60.0  # 寸評の水準: これ以上なら高
  blurb_mid_min: 40.0  # 寸評の水準: これ以上なら中（未満は低）
  dorm_distance_relief: 0.6         # 寮が距離の減点を打ち消す割合（オーナー決定8）
  # 訪問費用[万円]（部費から。設計書04 §1.4）
  visit_cost_same_prefecture: 5.0
  visit_cost_same_region: 10.0
  visit_cost_neighbor_region: 20.0
  visit_cost_far: 30.0
  # 争奪戦
  rival_event_prob: 0.22            # 訪問1回あたりに競合校が動く確率
  rival_event_tier_step: 1          # 動くと競合校の格が1段上がる
  # 訪問の手応え（成功率を4段の言葉へ丸める境目。数値は監督に見せない）
  response_lukewarm_min: 0.25       # これ以上で「反応は薄い」・未満は「心ここにあらず」
  response_warm_min: 0.45           # これ以上で「悪くない反応」
  response_eager_min: 0.65          # これ以上で「目を輝かせる」
  # 入部の条件（約束）。設計書04 §2.4
  promise_ask_prob: 0.15            # 訪問1回あたりに条件を出してくる確率（候補1人につき一度きり＝たまに）
  promise_bonus: 0.18               # 約束したときの成功率の上乗せ（訪問2回ぶん）
  promise_weight_fit: 3.0           # 進路希望に合う条件の重み
  promise_weight_neutral: 1.0       # 進路希望と関係ない条件の重み（矛盾する条件は出さない）
  promise_captain_leadership_min: 70  # 「主将にしてほしい」を言い出す統率傾向の下限
  promise_broken_trust: 5.0         # 破ったときの信頼度の下げ幅（1回だけ・オーナー決定 2026-11-24）
  promise_broken_fame: 5.0          # 破ったときの名声の下げ幅（1回だけ・同上）
  promise_kept_trust: 2.0           # 守り切ったときの信頼度の上げ幅（同上）
  # 進路希望の分布（重みの比。等分が初期値）
  preference_prestige_weight: 1.0
  preference_playing_time_weight: 1.0
  preference_local_weight: 1.0
  # 段ごとの見立てノイズσ（寸評の軸選び・ランク表示の両方。段を上げるほど小さい＝当たりやすい）
  report_noise_sd_tier1: 18.0
  report_noise_sd_tier2: 10.0
  report_noise_sd_tier3: 4.0

# --- 監督成長イベント（設計書04 §1.1b: 節目の跳ね）🟡 ---
manager_growth:
  koshien_tactical_boost: 5.0
  famous_rival_prob: 0.15
  famous_rival_boost: 3.0
  big_loss_prob: 0.35
  big_loss_boost: 3.0
  seminar_prob: 0.25
  seminar_boost: 2.0
  seminar_cost: 20.0
  pro_ob_visit_base_prob: 0.08
  pro_ob_visit_fame_slope: 0.001
  pro_ob_visit_boost: 2.0
  mentor_prob: 0.02
  mentor_boost: 2.0
  cap: 99.0

# --- 育成（練習→能力, 設計書02 §5.1） ---
training:
  # 2026-08-15: 85→130（案D）。旧値では中核能力+4〜5/3年で「新入生の質＝チームの質」になりすぎた。
  # 2026-11-12（issue #865・監督決定）: 130→290。施設なし・お任せ練習の3年の伸びを+7→+16.4へ。
  # level_up_growth は意図的に変更していない（Mental/Lead/Baserunningの実戦成長・個別指導の信頼関係exp・
  # 守備位置適性も同じ曲線を共有しており、そこを寝かせると関係ない系統まで一緒に加速する）。
  # roster.intake_drop（練習で伸びる能力だけ入学時を下げる）とセット。定常のチーム総合は改定前と±0.8以内。
  base_main_exp: 290.0
  sub_factor: 0.4
  # 副効果の倍率の個別指定（メニュー×能力。載っていない組は sub_factor）。C#既定（TrainingCoefficients）と一致させる。
  # issue #1409（オーナー決定 2026-11-22）: 守備練習→捕球だけ 0.4→0.7。守備の主効果・他メニューの副効果は不変。
  sub_factor_overrides:
    - { menu: Defense, ability: Catching, factor: 0.7 }
  facility_coef: 1.0          # 施設レベル0（施設なし）の基準施設係数。facility_tiers で上位を注入（#115）
  # 基準指導力（中立点, #115）。監督メタ（分野別指導力）を注入しないときの既定＝この指導力で従来と1ビット一致。
  # 監督指導力を注入すると 投手系←Coaching.Pitching / 守備・走塁系←Coaching.Defense / 打撃系←Coaching.Batting で駆動。
  coaching_level: 20.0
  coaching_slope: 0.005       # 1+指導力×slope×素直さ。名将(指導力90)→factor≈1.45（設計書02）
  # 個別指導3枠（#126・#693・OPEN-QUESTIONS Q7(a)）: 指名選手の主効果expだけに掛かる追加倍率。
  # 追加倍率=base_multiplier+(coachingFactor比−1)×bonus_scale（下限1.0）。指名なしなら1.0で従来一致。
  # 旧式は base 無し（=1）で、新任監督（指導力20＝中立点）では指名しても倍率ちょうど1.0だった（#693）。
  # 2026-10-28 監督決定: 新任でも×1.5、名将（指導力90）で×2.5程度。
  individual_coaching_slots: 3
  individual_coaching_base_multiplier: 1.5
  individual_coaching_bonus_scale: 3.0
  # 効果3「信頼関係」（#702・設計書03 §3.3）: 指名中の週ごとに精神力へ足すexp（成長段階・練習倍率は掛けない）。
  # 必要expは能力と同じ曲線（精神力55で約865）。2026-10-31 監督決定「1年指名し続けて+5相当」。
  individual_coaching_mental_exp: 90.0
  # 施設レベル→(係数, 週練習時間[分])（#115・設計書03 §4 / 04）。index=施設レベル。Lv0=現状(1.0/300)で従来一致。
  # 資金/名声からレベルを上げる接続は将来（OPEN-QUESTIONS Q6）。現状は SeasonContext.FacilityLevel の注入口のみ。
  # 「豪腕素質×名将＋フル施設(Lv4)で3年+15〜20km/h」が成立するよう据える（out/overnight/issue-115 で実測）。
  facility_tiers:
    - { coef: 1.00, budget_minutes: 300 }   # Lv0 施設なし（現状・従来一致）
    - { coef: 1.12, budget_minutes: 335 }   # Lv1
    - { coef: 1.25, budget_minutes: 370 }   # Lv2
    - { coef: 1.37, budget_minutes: 405 }   # Lv3
    - { coef: 1.49, budget_minutes: 440 }   # Lv4 フル施設（名門・強豪）
  level_up_base: 100.0        # 必要exp = base × growth^level
  # 2026-08-15: 1.05→1.04（案D）。1.05だと Lv70台の必要expがLv32の7.8倍で成長がほぼ止まり、名声で入る
  # B/Aの新入生が「入学時が完成形」になる。1.04で Lv74 でも3年+2〜3（施設フルで+10）は base_main_exp 130 の頃の実測で、290 へ上げた issue #865 以降は未再測（要再測）。
  # 2026-11-10（issue #865）: 検討したが変更していない。Mental/Lead/Baserunningの実戦成長・個別指導の
  # 信頼関係exp・守備位置適性もこの曲線を共有しており、寝かせると本issueの範囲外のそれらまで一緒に
  # 加速してしまう（実測: 1.017へ緩めただけで3年のリード成長が旧期待値レンジの2倍超に膨らんだ）。
  # base_main_exp 側だけで +15〜20 を作る方を選んだ（out/overnight/issue-865 実測）。
  level_up_growth: 1.04
  aptitude_required_exp_factor: 0.6   # 守備位置適性は能力より緩い必要exp（<1.0で速く伸びる, 守備適性 未決1）
  # 能力別 trainability（伸ばしやすさ, Issue #114）: 能力の素質の形（内在特性）。exp加算時に乗算する。
  # GrowthMultiplier（分野別の伸びしろ・個体差）や環境倍率（監督指導力・施設 #115）とは直交する。
  # 既定は全1.0で従来と1ビットも変わらない。未指定の能力は1.0。
  # 方針（会話 2026-07-22）: 足=素質固定でフラット／技術系=相対的に伸びやすい／球速=1.0固定（環境が担う）／弾道=触らない。
  # 値はたたき台（要統計回帰校正・出力レポートは out/overnight/issue-114/）。
  trainability:
    speed: 0.4            # 足＝素質固定。ほぼ伸びない（足の速い子／遅い子の手触り）
    # 技術で決まる能力＝相対的に伸びやすい
    fielding: 1.25
    catching: 1.25
    throw_accuracy: 1.25
    discipline: 1.20
    control: 1.20
    pitch_rank: 1.20
    bunt: 1.30
    contact: 1.15
    # 以下は現状維持（1.0固定・明示）: 肩/球速/スタミナ/パワー/盗塁/走塁判断
    arm_strength: 1.0
    velocity: 1.0        # 球速は素質で伸ばさない。「+20km/h」は環境倍率が担う（#115）
    stamina: 1.0
    power: 1.0
    steal: 1.0
    baserunning: 1.0
    # 弾道は型属性だが issue #1166 で専用メニューから両方向に少し動けるようにした。
    # 「そんなには伸びない」監督方針のため0.5に絞る（他の技術系より低い）。たたき台（PRで確認）。
    launch_tendency: 0.5
  summer_camp_mult: 2.0       # 設計書04 §4
  winter_camp_mult: 2.5
  tournament_practice_mult: 0.5   # 大会モード中は練習効果が落ちる（設計書03/05）。<1.0で低下
  # 練習時間配分（設計書03 §3.1）: 基準週=1メニュー満額の基準、default_budget=施設0の週練習時間
  reference_week_minutes: 300
  default_budget_minutes: 300  # 照明/寮などの施設導入で増やす（設計書03 §4, 今回は口だけ）
  # 実戦成長（設計書02 §5.3a, Q8・2026-07-20）: 精神力/走塁判断/捕手リードは試合出場でのみ伸びる。
  # 1試合出場あたりのexp（成長段階係数を乗算）。必要expは能力値と同じ曲線（100×level_up_growth^v）🟡
  match_mental_exp: 260.0
  match_lead_exp: 400.0        # 捕手として出場した試合のみ
  match_baserunning_exp: 300.0
  # 投手センス→投手系能力（球速/制球/スタミナ/キレ/球威）の伸びやすさ（設計書01 §1.3・issue #1472）。
  # 倍率 = clamp(1 + (投手センス物理Lv − neutral) × slope, min, max)。打撃の才能とは独立＝投手転向で覚醒が起きる
  pitcher_sense_growth_neutral: 30.0   # 倍率1.0の投手センス（物理Lv）。既定の新入生の投手役の平均（実測30.8）
  pitcher_sense_growth_slope: 0.03     # オーナー判断 2026-11-23: 0.012→0.03・倍率 0.5〜1.0（上乗せをやめ、下だけ効かせる）
  pitcher_sense_growth_min: 0.5
  pitcher_awakened_growth_factor: 2.0  # 外部コーチに見出された選手（issue #1523）の倍率。通常の上限 1.0 が外れてこれに置き換わる（見出されるのは見える投手能力がセンスに追いついていない選手だけ）
  pitcher_sense_growth_max: 1.0        # 上乗せしない（2.0→1.2→1.0。2.0 だと豪腕＋名将＋施設フルの3年で +31.9km/h・1.2 でも +29.6km/h で帯 ≤28 の外）

# --- 全国（架空校生成・AI校進化, 設計書05） ---
# --- チーム総合力6指標（設計決定 2026-07-18）: 打撃/投手/守備/機動/選手層/精神の加重平均 ---
# たたき台の重み。総合を加重平均へ切替（実装③）時に統計回帰で再校正する。
team_strength:
  # 6指標→総合（投手力が王様）。総和は Compute 側で正規化する。
  pitching_weight: 0.28
  batting_weight: 0.24
  defense_weight: 0.18
  depth_weight: 0.12
  mobility_weight: 0.10
  mental_weight: 0.08
  # 打撃合成（1野手, 合計1.0）
  contact_weight: 0.35
  power_weight: 0.35
  launch_weight: 0.15
  discipline_weight: 0.15
  # 投手合成（1投手, 合計1.0）
  velocity_weight: 0.40
  control_weight: 0.25
  stamina_weight: 0.15
  pitch_rank_weight: 0.20
  # 守備合成（1野手, 合計1.0）
  fielding_weight: 0.40
  catching_weight: 0.30
  arm_weight: 0.30
  # 機動力合成（1野手, 合計1.0）
  speed_weight: 0.70
  steal_weight: 0.30
  # 投手力: エース偏重（ace/2番手/3番手以降平均, 合計1.0）
  ace_weight: 0.50
  second_pitcher_weight: 0.30
  rest_pitcher_weight: 0.20
  # 選手層: 控え野手平均＋2枚目以降投手（合計1.0）
  bench_batter_weight: 0.60
  backup_pitcher_weight: 0.40
  lineup_size: 9
  bench_sample_size: 6
  # 総合のリーグ標準化（③）: 6指標加重平均(raw)を旧AverageLevel/AI校Strength尺度へ写す線形較正。
  # 実測フィット（TeamOverallCalibrationTests, 残差<0.6）。表示・シードとも同一値になる。
  overall_scale: 1.037
  overall_offset: -6.6

nation:
  strength_mean: 44.0
  # 母集団のσ（issue prefecture-high-rank-distribution・2026-09-05）: 13→15。
  # 13 だと 80 が +2.8σ ＝ 全国4000校でAランク以上が 13校（0.33%）しか出ず、校数最多の神奈川ですら
  # 期待 0.66 校・「Aが1校もない年」が 49%。校数と高ランク数の相関自体は 0.99 と強いのに、
  # ランク帯（Tiers.FromStrength）に対して母集団が低すぎて県差が表示に出ていなかった。
  # 15 で 全国A 37校／神奈川 期待 2.0校・P(A≥2) 57%。県1位vs2位の勝率は 0.649→0.666 でほぼ動かない
  # （σを広げると1位も2位も一緒に上がるため）＝ nation_dominance 帯 0.55–0.78 の内側。
  # 17 まで上げると全国Sが 15.7 で NationTests の S≤15 に触るので 15〜16 が上限。
  strength_sd: 15.0
  strength_min: 8.0
  strength_max: 99.0
  storied_fame_bonus: 20.0
  # 古豪の強さボーナス（issue prefecture-dominance・2026-08-18）: 8→4。8だと県1位−2位の差が最大22ポイントに開き
  # （宮崎 seed2026 は 81.8 vs 65.6）、その県は生成時点で一強が確定していた。
  storied_strength_bonus: 4.0
  emerging_fame_penalty: -5.0
  # 強さ差→勝率のロジスティック尺度。フルシム（実ゲーム経路＝永続ロスター同士）へ校正: 4.0→7.2（2026-08-19・設計書21）。
  # 圧縮撤去＋効き ability_effect ≈0.55 の世界で 差5→63%／10→77〜84%／15→88%／20→95%／30→99% を fit すると 6〜9（平均 7.1）。
  # 旧 4.0 は圧縮0.55の差で引いていた（＝raw 差なら 4/0.55≈7.3）ので、実質据え置き。Heavy AggregateModel_MatchesGameEngineWinRate が固定する。
  aggregate_scale: 7.2
  # 年次進化（issue prefecture-dominance・2026-08-18）: 旧 rev 0.10 / churn 5.5 / per_win 0.12 だと強さ82の校の期待ドリフトが
  # −2/年＝一度覇権を取った校が10年近く落ちず、集計20年×49地区で最多優勝校の中央値 9/20・10回以上が15地区。
  # rev 0.15 / churn 6.5 / per_win 0.06 で中央値 5〜7/20・10回以上 4〜7地区（現実の県の分布に近い）。
  # 定常sd＝churn/√(1−(1−rev)²)＝churn/0.527 なので、churn_sd は strength_sd と必ずセットで動かす。
  # 片方だけ変えると進化が初期σを打ち消す＝「新規ゲームは正しいが数年で元へ戻る」という気づきにくい壊れ方をする
  # （実測: sd15・churn6.5 据え置きだと 10年後に sd 13.0・全国A 13.5 へ回帰した。2026-09-05）。
  # sd 15 に対して churn 7.9（=15×0.527）。実測: 10年後 sd 15.3・全国A 44.9・神奈川A 2.30 で保つ。
  mean_reversion: 0.15        # 平均回帰（全国統計の安定化）
  churn_sd: 7.9               # 世代交代の揺らぎ（勢力変動）。定常sd≈初期sdを保つ（strength_sd 連動）
  strength_per_win: 0.06
  fame_to_strength: 0.015
  fame_decay: 0.90
  fame_champion: 40.0
  fame_per_win: 2.5

# --- 大会モード日程（設計書03/05, 抽象日カウント） ---
tournament:
  # 大会日程（issue #583）。ラウンド番号でなく「残りラウンド数」で引く＝ラウンド数は県の出場校数で
  # 5〜9と変わるのに対し、決勝・準決勝・準々決勝は決勝から数えた位置で決まるため。
  # 既定（A案）で8ラウンド県は全18日・5ラウンド県は9日。試合日は AceRestSelector の温存抽選シードに
  # 入るので**帯に効く**（旧 round_gap_days=2 の等差は本 issue が置き換え。OPEN-QUESTIONS Q23）。
  first_round_day: 1                # 開幕(0日目)から初戦までの日数
  early_round_spread_days: 3        # 序盤ラウンドのカードを分散させる日数（1回戦は1日で消化しきれない）
  middle_round_spread_days: 2       # 中盤ラウンドの分散日数
  late_round_spread_days: 1         # 準々決勝以降は同日開催
  early_rounds_threshold: 6         # 残りこのラウンド数以上を序盤とする
  late_rounds_threshold: 3          # 残りこのラウンド数以下を終盤とする（準々決勝・準決勝・決勝）
  rest_days_after_quarterfinal: 1   # 準々決勝の後の休養日
  rest_days_after_semifinal: 1      # 準決勝の後の休養日
  # 秋季地区予選のブロックリーグ戦（神奈川・issue #772）の節と節の間隔[日]。4校ブロックは3節＝初戦・3日目・5日目
  league_round_spread_days: 2
  # 1日に消化できる試合数の上限（全国一律・issue #723）。序盤・中盤は「試合数÷これ」日より詰めない
  # ＝出場校の多い県ほど1回戦・2回戦が長くなる（神奈川200校: 1回戦72試合→5日・2回戦64試合→4日）。
  # 小さい県（〜100校）は従来の分散日数のまま。0で上限なし。
  max_games_per_day: 16
  # 実開幕月日（表示専用）。週暦は50週×7日＝350日で実暦と一致しないので、大会期間だけ実カレンダーで数える。
  summer_open_month: 7
  summer_open_day: 10
  autumn_open_month: 9
  autumn_open_day: 12
  # 夏の甲子園（設計書05 §1.1）。暦の週では始まらず夏の県大会の後始末から直接つなぐので、
  # ここは「表示する実月日」だけを決める（週インデックスとは独立）。
  koshien_open_month: 8
  koshien_open_day: 6
  # 秋季地区大会・明治神宮大会・春のセンバツ本戦（設計書05 §1.5b）。地区大会・神宮大会は
  # 前段の後始末から即座連鎖、センバツ本戦は選考発表週から即座連鎖＝ここも表示専用。
  regional_open_month: 10
  regional_open_day: 18
  jingu_open_month: 11
  jingu_open_day: 15
  senbatsu_open_month: 3
  senbatsu_open_day: 19

# --- 記録室の規定（issue #600・設計書06 §3.9） ---
# 高校野球は試合数が少なく、閾値が無いと「1打数1安打＝打率1.000」が校歴代1位に出る。
# NPB と同じくチーム試合数に比例させる（絶対値だと大会が短い年と長い年で意味が変わる）。
# 基準のチーム試合数は「選手の最大出場試合数」で代用する（チーム試合数のカウンタが無いため）。
# 表示専用＝乱数も物理層も通らないので、ここを動かしても統計帯は動かない。
records:
  qualified_plate_appearances_per_game: 2.0   # 規定打席＝チーム試合数×この係数（NPBは3.1）
  qualified_outs_per_game: 3.0                # 規定投球回＝チーム試合数×この係数[アウト]（3.0＝1試合1回）

# --- コールドゲーム（マーシールール。設計書05 §1.3, OPEN-QUESTIONS Q18）---
# 「early_inning 回以降で early_diff 点差以上」または「late_inning 回以降で late_diff 点差以上」で成立。
# 有効かどうかは現代ルールのトグル（GameContext.MercyRuleEnabled）が決める。
mercy_rule:
  early_inning: 5
  early_diff: 10
  late_inning: 7
  late_diff: 7

# --- センバツ（選抜）の地区別一般選考枠（設計書05 §4）---
# 合計31＋神宮枠1（神宮優勝地区へ+1。コード側）＝32校規模。21世紀枠は非採用。
# 基準は2024年（第96回）以降の実数＝一般選考29（北海道1・東北3・関東東京6・北信越2・東海3・近畿6・中国2・四国2・九州4）
# ＋神宮1＋21世紀2＝32。21世紀枠2つぶんは、中国（実2→3）と九州（実4→5）へ1校ずつ上乗せして32に合わせる
# （枠の増やし先は、いずれも一般枠で次点の層が厚い西日本の地区としたゲーム側の簡略化）。
# 関東・東京は計6を融通（現実の「関東・東京6」に対応）。
senbatsu_berths:
  general_by_region:
    hokkaido: 1
    tohoku: 3
    kanto: 5
    tokyo: 1
    hokushinetsu: 2
    tokai: 3
    kinki: 6
    chugoku: 3
    shikoku: 2
    kyushu: 5

# --- 在フィールド野手の緊急登板 backfill 経路（issue #209 Phase C path②, 設計書11 §4）---
# ① 投野交代を既定とし、ベンチ野手が空いた守備位置を旧投手より明確に上手く守れ、かつ旧投手を残す打撃的価値が
# 低い時だけ ② （旧投手退場＋ベンチ野手補充）に倒す。AI の在フィールド野手登板でのみ走る＝帯・決定論baselineに影響しない。
relief_backfill:
  base_fielding_margin: 10.0        # ② に倒す守備値の基準差（ベンチ野手が旧投手をこれ以上上回れば②）
  batting_retention_weight: 0.3     # 旧投手の打力による基準差の補正重み（0＝守備値だけで判定）
  league_average_batting: 50.0      # 打力（ミート・パワー平均）の基準点

# --- 練習試合（設計書03 §週ターン③・設計書04 §名声の効果） ---
practice_match:
  cost: 1.0                 # 1試合あたりの費用[万円]
  base_accept: 0.80         # 同格・名声0での受諾確率
  tier_gap_penalty: 0.20    # 相手が1ティア格上になるごとの減点
  fame_weight: 0.40         # 名声100あたりの受諾確率加点
  min_accept: 0.02
  max_accept: 0.98

# --- 監督キャリア（設計書04 §1） ---
career:
  coaching_growth_per_year: 3.0     # 采配経験による指導力上昇
  coaching_growth_per_win: 0.4      # 2026-11-15 0.8→0.4（trust_per_win と同じ理由＝実ゲームは秋の勝ちも数える）
  coaching_cap: 99.0
  # 指導力→チーム力の押し上げ。0.78→0.88（issue prefecture-high-rank-distribution・2026-09-05）:
  # 母集団の strength_sd を 13→15 に広げると県1位が 80.1→85.5 に上がるので、プレイヤー側の上限も追従させる。
  # 据え置きだと 20年キャリアのセンバツ出場が 2.77→1.32回・生涯0回が 20%→49%（200シード実測）。0.88 で 2.23回・28%。
  # strength_sd を動かしたらここも見直すこと（世界とプレイヤーの相対位置を決める係数）。
  coaching_to_strength: 0.88
  free_koshien_threshold: 1         # 甲子園1回でフリー資格
  free_fame_threshold: 40.0         # または名声40（#981: 上限110で実測・名声ルートが生きる値。2026-11-15 監督決定）
  min_tenure_years: 3               # 赴任してから強制転任の対象になるまでの最低在任年数（採った1年生の卒業年数）
  retain_trust_threshold: 60.0      # 残留確率ロジスティックの中点（この信頼度で残留確率＝上限の半分）
  retain_trust_spread: 10.0         # ロジスティックの傾き（信頼度の効き幅）
  retain_probability: 0.8           # 高信頼時の残留確率の上限
  # 2026-08-15（案2）: 甲22/勝1.5/減衰0.92 → 甲30/勝4.0/減衰0.80。旧値は時定数 1/(1−0.92)=12.5年で
  # 名声が「勝っても動かない」（年2勝で5年目12・10年目21）。新値は時定数5年・定常=勝数×20（旧18.75と同等）＝
  # 上がりも下がりも速い（100→年1勝で6年後41）。全国優勝は実ゲームでも発火する（ManagerService が夏の甲子園の優勝を判定して national_title_bonus 等へ接続済み）。
  fame_koshien_appearance: 30.0
  fame_national_champion: 45.0
  fame_per_win: 4.0
  fame_decay: 0.80
  # 2026-08-26（案C+D）: 加算だけだと ①名声のレンジが強さ60台で使い切られる（実ゲームの年間公式戦勝数は
  # 強さ65で約5勝＝定常99＝S に張り付く）②県大会を制した年は名声がいくつでも1年でSへ飛ぶ（+91.7）。
  # 上げ方の形で寝かせる（勝数の数え方は変えない）。out/issues-pending/fame-rises-too-fast.md
  fame_gain_ceiling: 110.0        # 逓減の基準（上昇側にだけ ×(1−名声/この値)。定常＝110g/(22+g)。2026-11-15 100→110＝漸近値を上へ開けてSが出る余地を作る。名声自体の上限は100のまま）
  fame_season_rise_cap: 12.0      # 1年に上がれる正味の名声（等級の帯幅10なので1年1段強。下降側には効かない）
  # 2026-11-10（issue #868）: 名声は「上げるより維持するのが難しい」。60を超えた分は保持率0.70（以下は fame_decay）。
  fame_decay_high_threshold: 60.0
  fame_decay_high: 0.70
  # 番狂わせ連動の名声変動（issue #170）。格上撃破=金星で↑、格下敗北=取りこぼしで↓。順当な結果には効かない。
  fame_upset_win_per_tier: 3.0    # 格上に勝った時のTier格差1段あたりの上昇（金星）
  fame_upset_loss_per_tier: 3.5   # 格下に負けた時のTier格差1段あたりの低下（取りこぼし・やや重く）
  fame_upset_loss_fame_scale: 50.0 # 取りこぼしの低下に ×(1+名声/この値)（名声0で×1・50で×2・100で×3。上昇側の逓減は受けず別枠で引く）
  fame_upset_season_cap: 8.0      # 1シーズンの金星上昇の頭打ち（短期で急上昇させない）
  trust_reset: 50.0                 # 転任で信頼度リセット
  trust_per_win: 2.0                # 2026-11-15 4.0→2.0（実ゲームは秋の大会の勝ちも数えるので想定の約2倍で伸びていた）
  trust_koshien: 20.0
  trust_poor_season_penalty: 12.0
  annual_budget_base: 80.0
  budget_per_trust: 0.8
  # 年間固定支出（Issue #128, 万円）。年度替わりに予算から差し引く。0で従来一致。
  summer_camp_cost: 20.0            # 夏合宿費（設計書04 §4）
  winter_camp_cost: 25.0            # 冬合宿費（設計書04 §4・冬は長め）
  scout_cost: 100.0                 # スカウト年間費用（#127連動）。年契約カタログのスカウト網 Lv1 と同額に保つ（#1299: 30→100）
  # 寄付・一時金（設計書04 §1.4）。年度末に部費へ入る（issue #1082 で施設基金を部費へ統合）。
  # 統合前の施設基金の額の半分（オーナー決定 2026-11-17・案A）。そのまま流すと道具・合宿・年契約が実質タダになる。
  school_investment: 50.0                 # 学校の設備投資[万円/年]（実績によらない土台。名声由来の寄付を主役にするため小さく）
  booster_donation_per_fame: 10.0         # 後援会寄付（名声1あたり[万円/年]。名声100で年1000万。プロ入りOBの寄付は pro_donation_*・#1469）
  koshien_year_bonus: 500.0               # 甲子園出場の年の一時金[万円]
  national_title_bonus: 2500.0            # 全国優勝の年の一時金[万円]（出場ぶんに上乗せ）
  prize_per_official_win: 10.0   # 大会報奨（#1469 T1）: 公式戦1勝ごと[万円]（夏秋の県・地区・神宮）
  prize_per_national_stage_win: 30.0   # 同・甲子園/センバツの1勝ごと[万円]
  pro_donation_first_round: 100.0   # OB寄付（#1469 O2）: 指名の年の一時金[万円]。1位
  pro_donation_upper_round: 70.0   # 2〜3位
  pro_donation_middle_round: 50.0   # 4〜7位
  pro_donation_lower_round: 30.0   # 8位（下位・育成）
  transfer_funds_carry_over_ratio: 0.3    # 転任したときに持ち越せる部費の割合（残りは前の学校に残る）
  # 甲子園出場が決まった日にOB・卒業生から入る激励金（設計書05 §1.1a）。これも部費に入る。
  # 上の一時金（年度末に無言で入る）と違い、その場でイベントとして見える形で入る。
  koshien_berth_donation_base: 120.0      # 土台[万円]（年間予算 80+0.8×信頼 の約1倍）
  koshien_berth_donation_per_fame: 1.5    # 名声1あたりの上乗せ[万円]
  fame_per_draft_pick: 2.0   # プロ入りで名声（#1270 D1）: 1人ぶん（年度末の総括の上昇側＝逓減・年上限を通す）
  fame_first_round_pick: 4.0   # 1位指名
  fame_draft_season_cap: 6.0   # プロ入りぶんの年上限
  trust_play_through_worsened: 3.0   # 怪我を押して出場させて悪化したときの信頼度の低下（#1270 E1・1件ごと）
  new_school_strength_mean: 34.0    # 教員監督の赴任先は弱小
  new_school_strength_sd: 6.0
  free_choice_school_strength: 48.0 # フリー化後の本拠地
  # フリー監督のオファー（設計書04 §1.3「残留自由・他校オファーの選択制」）。残留はいつでも選べる。
  free_agent_offer_chance: 0.35     # 1年にオファーが届く確率
  free_agent_offer_count: 2         # 1回のオファーで並べる移籍先候補数の下限（残留は別枠）。名声が低いときの数
  free_agent_offer_max_count: 10    # 候補数の上限（名声が高いほど増える）
  free_agent_offer_fame_base: 50.0  # 候補数が下限から増え始める名声
  free_agent_offer_fame_step: 4.0   # 候補が1校増えるのに要る名声の幅
  free_agent_offer_spread: 10.0     # 候補校の強さの散らばり（free_choice_school_strength を中心）

# --- 施設（Issue #128・設計書03 §4 / 04 §4）: funds→施設購入の支出先。多軸（照明/室内/寮/トレ） ---
# 各系統は tiers[0]=施設なし（費用0・効果0）から並べる。全系統Lv0で従来一致（不変条件#2）。
# 全系統Lv3の合計は coef_add=+0.49（室内0.15＋寮0.15＋トレーニング場0.19）/ budget_add=+140分（照明90＋室内50）
# ＝ 基準(1.0/300)に足すと (1.49, 440分) ＝ training.facility_tiers Lv4 と一致。当初（#115）は (2.40, 700分) だったが
# 後の再校正で下げた。cost はたたき台（要バランス調整）。
# Unity実プレイは FacilityCatalog.Default（C#既定・本ブロックと同値）を使う。
facilities:
  - id: lighting          # 照明設備: 夜間練習で練習時間↑
    name: 照明設備
    tiers:
      - {}
      - { cost: 2000, budget_add: 30 }
      - { cost: 3000, budget_add: 30 }
      - { cost: 5000, budget_add: 30 }
  - id: indoor            # 室内練習場: 雨天でも練習（時間）＋設備（効率）
    name: 室内練習場
    tiers:
      - {}
      - { cost: 3000, coef_add: 0.05, budget_add: 15 }
      - { cost: 5000, coef_add: 0.05, budget_add: 15 }
      - { cost: 8000, coef_add: 0.05, budget_add: 20 }
  - id: dorm              # 寮: 生活・体調管理で効率↑。能動勧誘枠（旧2名）はスカウトへ一本化（issue #867）。
                          # 寮は「スカウト候補の距離の減点を打ち消す」効果として残る（scout.dorm_distance_relief）。
    name: 寮
    tiers:
      - {}
      - { cost: 5000,  coef_add: 0.05 }
      - { cost: 8000,  coef_add: 0.05 }
      - { cost: 12000, coef_add: 0.05 }
  - id: weight            # トレーニング場: ウェイト・マシンで効率↑
    name: トレーニング場
    tiers:
      - {}
      - { cost: 500,  coef_add: 0.05 }
      - { cost: 1000, coef_add: 0.05 }
      - { cost: 2000, coef_add: 0.09 }
  # 医務室: 怪我が起きにくくなり復帰も早まる。coef_add / budget_add を持たないので
  # 全系統Lv3の合計（+0.49 / +140分）は動かない。累計Lv3で発生率0.61倍・全治週0.73倍。
  - id: clinic
    name: 医務室
    tiers:
      - {}
      - { cost: 150, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }
      - { cost: 300, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }
      - { cost: 500, injury_prob_factor: 0.85, injury_recovery_factor: 0.90 }

  # --- 練習道具（kind: equipment）: 効果小 Lv1 / 効果大 Lv2 の2段。
  # 施設の練習効率が全メニュー一律なのに対し、道具は振っているメニューの分野にだけ効く。
  # 累計 Lv2 で 1.12 × 1.12 ≒ +25%（issue #865: 1.05×1.07≒+12%→1.08×1.10≒+19%→現行の +25% へ引き上げ）。
  # 才能上限（roster.cap_gap_mean等）が育成期間に対して相対的に狭く、ここをさらに強めても
  # 才能上限で頭打ちの選手が増えるだけで実測効果は小さい（out/overnight/issue-865）。
  - id: gear_batting
    name: 打撃の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 30, batting_factor: 1.12 }       # バッティングティー・ネット
      - { cost: 70, batting_factor: 1.12 }       # ピッチングマシン
  - id: gear_defense
    name: 守備の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 30, defense_factor: 1.12 }       # ノックバット・防具一式
      - { cost: 70, defense_factor: 1.12 }       # 守備マシン
  - id: gear_baserunning
    name: 走塁の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 10, base_running_factor: 1.12 }  # ラダー・ミニハードル
      - { cost: 70, base_running_factor: 1.12 }  # タイム計測システム
  - id: gear_pitching
    name: 投手の道具
    kind: equipment
    tiers:
      - {}
      - { cost: 15, pitching_factor: 1.12 }      # 重量球・練習球一式
      - { cost: 70, pitching_factor: 1.12 }      # スピードガン＋ブルペン整備

  # --- 備品（kind: gear）: 買い切り1段 ---
  - id: video             # ビデオ・分析機材: 気づきが増え、読み違えも減る
    name: ビデオ・分析機材
    kind: gear
    tiers:
      - {}
      - { cost: 50, insight_prob_factor: 1.5, insight_accuracy_add: 0.05 }

# --- 年契約（設計書04 §1.4a）: 毎年部費から払い、いつでも解約できる継続契約 ---
# 施設・練習道具（facilities:）が「買い切り・効果が累積」なのに対し、年契約は
# 「いま何段で契約しているか」だけが効く＝Lv2 の年額と効果は Lv1 を置き換える（累積しない）。
# tiers[0] は未契約（年額0・効果なし）。
#
# スカウト網 Lv1（100万/年・質への効果0）は career.scout_cost と同額。新規ゲームは全部未契約から始まる。
#
# 年額の決め方（2026-11-23 オーナー決定・issue #1299 案B＝旧額の約3倍）: 収入は 予算80+0.8×信頼度＋設備投資50
# ＋後援会10×名声＋大会報奨（1勝10万・甲子園/センバツの勝ち30万）＋イベント（期待値 年+140）。合宿45万を引いた
# 「自由に使える額」は 新任約300／弱小約380／中堅約620／強豪約940／名門約1,600（out/economy-proposal-1299.md 実測）。
# 全部を最上段にすると 420+60+160×3＝960万/年＝強豪の定常でも全部は取れず（甲子園に出た年だけ届く）、
# 目安は 新任=Lv1かコーチ1人／弱小=Lv1＋コーチ1人／中堅=Lv3＋コーチ1人 か Lv2＋コーチ2人／名門=全部。
# 施設（全系統Lv3で計5万超）と同じ財布を取り合う。
contracts:
  - id: scouting
    name: スカウト網
    tiers:
      - {}
      # 効果1=新入生の質(scout_talent_add) / 効果2=入部予定者の事前開示精度(prospect_disclosure, #587)
      # 効果3=スカウト枠・候補の開示段（scout_slots, issue #867）: 未契約0/Lv1=2/Lv2=3/Lv3=4
      #   （Lv1=寸評だけ／Lv2=打・守・走・投の4分野ランク／Lv3=個別能力のランク、オーナー決定2026-11-09）
      # 年額は 2026-11-23 issue #1299 案B（旧 30/80/140 の約3倍）。目安の段階は上の見出しのコメント
      - { annual_cost: 100, scout_talent_add: 0, prospect_disclosure: 0.15, scout_slots: 2 }   # 県内を回る（新任から）
      - { annual_cost: 250, scout_talent_add: 3, prospect_disclosure: 0.45, scout_slots: 3 }   # 近隣県まで（中堅から）
      - { annual_cost: 420, scout_talent_add: 6, prospect_disclosure: 0.75, scout_slots: 4 }   # 全国に網を張る（中堅でコーチ1人と併せて）
  - id: expedition
    name: 遠征
    tiers:
      - {}
      - { annual_cost: 60, out_of_prefecture_opponents: true }   # 県外の学校と練習試合が組める（#1299: 20→60）
  # 専門コーチ: 分野別指導力の実効値だけを底上げする（監督自身の指導力は変えない＝解約で元に戻る）
  - id: coach_batting
    name: 打撃コーチ
    tiers:
      - {}
      - { annual_cost: 160, coaching_batting_add: 50 }   # 効果は issue #865（+50＝該当分野の3年の伸び +3 前後）・年額は #1299: 50→160
  - id: coach_pitching
    name: 投手コーチ
    tiers:
      - {}
      - { annual_cost: 160, coaching_pitching_add: 50 }   # 効果は issue #865（+50＝該当分野の3年の伸び +3 前後）・年額は #1299: 50→160
  - id: coach_defense
    name: 守備走塁コーチ
    tiers:
      - {}
      - { annual_cost: 160, coaching_defense_add: 50 }   # 効果は issue #865（+50＝該当分野の3年の伸び +3 前後）・年額は #1299: 50→160

# --- 新入生生成（設計書04 §2.1・設計書01 §1.1b-c）: 名声→総合力→凸凹配分 ---
roster:
  intake_mean: 10.0
  intake_sd: 1.5
  intake_min: 8
  intake_max: 13
  # 投手適性→投手能力の創発（#174）: 生成時決め打ちを廃し投手も適性から創発させる。
  pitcher_aptitude_bias: 8.0       # 投手適性への供給バイアス（創発投手率を狙い値へ。帯校正で決める）
  pitcher_aptitude_weight_span: 6.0 # 投手寄せ重みwのロジスティック幅（小=二極化/大=なだらか）
  # 捕手供給の下限（#589・設計書04 §2.3）: 捕手として読める下限適性。50=適性補正が付かない点(×1.0)。
  # これ未満しか居ないコホートで最も惜しい1人をここまで引き上げる（実測発動率 0.122%）。
  catcher_aptitude_floor: 50.0
  # 総合力（名声由来。既定は一般校相当。名声接続後は talentCenter を上書き）
  # issue #865 の「入学時を下げる」はこの値ではなく intake_drop（下）で行う（中心値・名声の傾きは改定前のまま）。
  talent_center_default: 32.0
  # 入学時の下げ（issue #865・監督決定「入学時を下げて3年夏は同じ」）。練習で伸びる能力だけを intake_drop 下げて
  # 入学させ、強めた育成式（training.base_main_exp）で取り戻す。お任せ練習で伸びない能力（盗塁・送球精度・走塁・
  # 球速・キレ・球威・バント）は下げない＝下げると卒業まで戻らず定常のチーム総合だけが落ちる（実測: 無名校 38.0→36.0）。
  # 下げ幅は中心値 talent_center_default で満額、名声で届く上限（fame_talent_center_cap＝knee＋span）で0（線形）。
  # 高い能力ほど伸びにくい育成式なので、強豪の入学時を一律に下げると3年で取り戻せない（実測: 名声60 63.0→58.5）。
  # 出典: ProspectGenerator.IntakeDropFor（issue #1031 で写像を再校正した後も、下げ幅の物差し自体は変えていない）。
  intake_drop: 12.0
  talent_sd: 8.0
  talent_min: 10.0
  talent_max: 90.0
  # 名声→talentCenterフィードバック（issue #127・#1031・設計書04 §2.1）: 監督の名声が高いほど良い新入生が集まる。
  # knee（65）以下は恒等＝center=fame（名声のランク≒新入生の中心のランクが一致する）。knee超だけ指数飽和カーブで
  # cap（knee+span=78）へ頭打ち＝「勝つ→怪物→また勝つ」の暴走ループ防止（2026-08-15案Dのオーナー決定）は
  # 上側だけに残す。2026-11-15（issue #1031）改定前は Default(32)基準の指数飽和（span50/tau50）で、
  # 低〜中名声帯の立ち上がりが速すぎ、名声D(50〜59)の学校にAI B校相当（1〜2段強い）の新入生が入っていた。
  # 名声は fame_decay(0.80) で自己制限するので、勝ち続けないと中心も落ちる。
  fame_talent_center_knee: 65.0
  fame_talent_center_span: 13.0
  fame_talent_center_tau: 20.0
  # ティア→能力の圧縮（issue #578・OPEN-QUESTIONS Q24 の確定2）。AI校の「強度→能力中心」だけを寝かせ、
  # 格差マッチの一方的さを緩める。#536 の実測では実力差10ポイントごとに得点が約0.4倍になっていた。
  # 自校（ProspectGenerator）は対象外なので、ピボットを平均帯(50)に置くと自校との差が縮まらず効果が出ない
  # ＝自校の実力域（≒35〜40）に置く。表示ランク（School.Strength）は圧縮しない（確定4＝表示は直さない）。
  tier_compression_pivot: 40.0
  # 2026-08-19（設計書21・案C）: 0.55 → 1.0（圧縮なし）。AI校だけを寝かせる圧縮は表示ランクと中身を乖離させるので撤去し、
  # 代わりに ability_effect:（表示→物理の効き）を全員対称に寝かせる＝raw が中身。式は比較・実験用に残す（slope=1・knee=100 は恒等）。
  tier_compression_slope: 1.0
  # 膝（issue prefecture-dominance・2026-08-18 で 60→100＝膝なし・一様圧縮）: 膝60は「上を100で元尺度へ戻す」勾配1.225で
  # 上位帯の差を raw より拡大し（80→75.5 / 65→57.1）、県1位 vs 2位（差15）が単試合 99%＝同じ校が毎年優勝する主因だった。
  # 一様0.55: 80vs75 63% / 80vs70 75% / 80vs65 86% / 80vs60 92% / 80vs50 98%（フルシム実測）。代償として強度85の校の
  # 能力中心は 64.75（表示A・中身B−）まで落ちる＝オーナー承認済み（表示ランクは raw のまま。展望の能力バーとは乖離する）。
  tier_compression_knee: 100.0

  # 凸凹配分（総ポイントをランダム重みで配分・偏り自体もばらつく＝金太郎飴回避）
  concentration_mean: 0.35    # 偏り強度σ。大きいほど内訳が凸凹
  concentration_sd: 0.15
  specialty_floor: 14         # 専門能力の下限（「できない」を作らない）
  off_specialty_factor: 0.55  # 専門外能力の中心係数（総合力×これ）。パワプロ型特化を禁止
  off_specialty_floor: 8
  # 投打の両立素質（#684）: 専用乱数 z2 がゲートを超えた分だけ専門外の中心係数(0.55)が上がる＝投打とも高い選手が
  # 分布の裾に出る。ゲート未満（大多数）は従来と同じ。corr は総合力との相関。
  dual_talent_corr: 0.3
  dual_talent_gate_z: 0.5
  dual_talent_ratio_slope: 0.30
  # 運動能力ベースライン（走力・地肩・スタミナ, §1.1b-2）。physical_mean は名声0（talentCenter=talent_center_default）
  # のときの中心。physical_talent_slope は talentCenter が上がったぶんの何割を身体系中心に乗せるか
  # （2026-08-15 案D: 0.75。0 なら旧来の名声独立）。SD は据え置き＝弱小校の俊足・強肩は残る。
  # 0 のままだと名声で入るB/Aの新入生が「打撃Aで走力E」になり、機動力・肩・球速の天井でチームがCで頭打ちになる。
  # AI校（StrengthTeamFactory）は身体系が強度連動なので、これで自校だけ天井が低い非対称が消える。
  physical_mean: 45.0
  physical_sd: 12.0
  physical_talent_slope: 0.75
  # スタミナLevel→目安投球数の変換（切片・傾き, 設計書02 §1.1e / issue #408）。#356の上限撤廃に伴い水準を引き上げ。
  # Lv10→70.5 / Lv45→96.75（生成平均）/ Lv50→100.5（D帯）/ Lv92→132（完投上限域）。傾きを 0.9→0.75 に寝かせて
  # 下限を持ち上げつつ上限が高校野球の完投域(120〜140)を外れないよう解いた。順変換・逆変換・生成が同じ定数で動く。
  stamina_pitches_intercept: 63.0
  stamina_pitches_per_level: 0.75
  # 精神力・統率傾向（設計書02 §3 / 09 §8。才能・身体と独立）
  # 実戦成長ループ接続（Q8・2026-07-20）: 「新入生は未熟（中心46）→3年間の実戦で開花」へ初期分布を引き下げ
  mental_mean: 46.0
  mental_sd: 12.0
  leadership_mean: 50.0
  leadership_sd: 15.0
  # 捕手リード（設計書01 §2①）: 野球脳(Mental)相関＋個体差。中心は当初50（統計帯を保つ・不変条件#5）だったが、Q8 で下の lead_mean 46 へ引き下げた
  lead_mean: 46.0                # Q8: 未熟→捕手出場で伸びる時間アークへ引き下げ（旧50）
  lead_sd: 8.0
  lead_mental_corr: 0.30
  lead_cap_mental_corr: 0.15     # Q8(c): リードcapの野球脳相関（名捕手の天井）
  # AI校の精神力・統率・捕手リード（issue ai-school-mental-fixed-50, 2026-08-18）: 旧実装は全員50固定・主将なし。
  # 自校と同じ分布（mental_mean/sd・leadership_*・lead_*）を学校の強さ・校風・学年で寄せて引く（専用Fork＝他の能力ロール不変）
  ai_mental_strength_slope: 0.25   # 精神力中心 = mental_mean + (School.Strength − 50)×これ（圧縮前の強度。G≈40／D≈47／S≈56）
  ai_mental_per_grade: 4.0         # 進級ごとに精神力 +これ（3年で +8＝自校の実戦成長の平均像）
  ai_style_mental_bonus: 3.0       # 校風「守り勝つ」「全員野球」の精神・統率の上乗せ
  # AI校の打撃プロフィール（issue ai-roster-power-top-tier-all-sluggers, 2026-08-18）: 旧実装は全能力を同じ中心で独立に引き
  # 成長も一律なので B/A校は先発全員がスラッガーだった。パワーを希少側にしてミートへ振り替え（打撃指標不変）＋5能力の凸凹配分。
  ai_power_skew: 8.0               # パワー中心 −これ／ミート中心 +これ（.35C+.35P の打撃指標を保つ）
  ai_arm_sd: 12.0                  # 肩の個人差σ（issue #767。旧は全能力と同じ6＝自校の身体系 physical_sd 12 の半分で、強肩の遊撃手が中位校に出なかった）
  ai_concentration: 0.15           # ミート/パワー/選球眼/守備/捕球の凸凹配分σ（総和不変。自校 concentration_mean 0.35 より控えめ）
  # AI校の上位集中＝スター型（issue prefecture-dominance-star, 2026-08-18）: ティア圧縮を一様に掛けると上位校のエースが平凡になる
  # （A校のエース最速 138km/h）。圧縮で削った分（raw−圧縮後）をエース＋主軸へ戻し、脇役は圧縮後の中心のまま＝現実の強豪の形。
  # チーム総合（6指標）は圧縮後の尺度に留める（Create は脇役を lift×cast_drop 下げる／永続ロスターは逆算配分が自動で寄せる）。
  ai_star_share: 1.0               # スターの上乗せの割合（1.0＝既定量／0＝スター無し）
  # 2026-08-19: 圧縮撤去に伴い lift の定義を「圧縮で削った分」から (強さ−40)×これ へ。raw 80 でエース/主軸 +10（Lv 90＝146km/h）
  ai_star_lift_per_point: 0.25
  ai_star_hitters: 3               # 使い捨て生成（Create）: 先発野手8人のうち主軸の人数
  ai_star_hitters_per_cohort: 1    # 永続ロスター: 1学年あたりの主軸打者（3学年で Create と同数）
  ai_star_pitchers_per_cohort: 1   # 永続ロスター: 1学年あたりのエース格（投手適性順）
  ai_star_cast_drop: 0.30          # 使い捨て生成: 脇役の中心を lift×これ 下げてチーム総合を圧縮後の尺度に留める（実測: 0.25で+0.7・0.35で−0.6）
  # AI校の球速の天井（issue #908）: 99 での切り詰め（＝上限 149.6km/h への張り付き）をやめ、膝から上を2本の線分＋100への漸近で寝かせる。
  # 強豪は逆算配分で毎年最大 +40 を積むので素の値は 190 前後まで伸びる。3年生で最速150km/h以上が年10〜15人・1位154〜158km/h
  # （現実の実数）に合うよう実測で決めた（seed2026・3/5/7年目: 150km/h以上 11/12/13人・1位 154.8〜158.0km/h。158 は怪物）。
  ai_velocity_cap_knee: 90.0         # 膝（これ以下は恒等）
  ai_velocity_cap_mid_raw: 165.0     # 1本目の終点の素の値（全国の3年生でおよそ12位）
  ai_velocity_cap_mid_level: 92.5    # 同・球速Lv（149.3km/h）
  ai_velocity_cap_top_raw: 185.0     # 2本目の終点の素の値（およそ1〜3位）
  ai_velocity_cap_top_level: 97.0    # 同・球速Lv（154.5km/h）。この先は 100（158km/h）へ漸近
  # AI校の打者能力の天井（issue #1066）: 球速と同じ「膝から2本の線分＋100への漸近」。打者は Level 空間そのもの
  # （km/h変換不要）なので1本の曲線を12能力（BatterAttribute）全部で共有する。上端は球速より低め（96→100漸近）
  # に取り、整数丸めで99に達する入力をごく僅かにする（「99に張り付く能力は数%まで」）。
  ai_batter_cap_knee: 85.0
  ai_batter_cap_mid_raw: 120.0
  ai_batter_cap_mid_level: 92.0
  ai_batter_cap_top_raw: 165.0
  ai_batter_cap_top_level: 96.0
  # 投打の利き（§1.1c・式は HandednessModel。自校・AI校の永続ロスター・試合用AI校の3経路で共有）
  # 左のプレミア（issue #1475）: 左投げ ＝ throw_left_prob ＋ 投手らしさ(RoleWeight 0〜1)
  #   ×(left_throw_pitcher_bonus ＋ left_throw_strength_slope×(新入生の能力中心 − left_throw_strength_pivot))、上限 left_throw_max。
  # 野手（投手らしさ≈0）は素の確率のまま。投手ほど・強豪ほど左腕が多い。
