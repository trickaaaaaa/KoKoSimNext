          - who: manager
            say: "いいね。日程を合わせよう。"
          - who: team_manager
            say: "はい。まず来月の第一週で。"
      - requires_ob: true
        lines:
          - who: team_manager
            say: "監督、OBの方が、しばらく手伝わせてほしいそうです。現役の頃、ここで拾ってもらった恩があると。"
          - who: manager
