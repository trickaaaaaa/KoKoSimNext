        lines:
          - who: player
            name: "{player}"
            say: "すんません。ちょっと先輩風、吹かしすぎました。"
          - who: player
            name: "{other}"
            say: "自分も、言い方が悪かったです。"
          - who: team_manager
            say: "帰りにコンビニで、二人が同じアイス買ってるの見ました。仲良しか。"
      - stance: scold
        result: worsened
        effects:
          trust: -2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: player
            name: "{player}"
            say: "なんで俺まで怒られるんですか。"
          - who: player
            name: "{other}"
            say: "自分、何も悪くないっす。"
          - who: narration
            say: "二人そろって不満顔。叱られた不満だけは、仲良く分け合っていた。"
          - who: team_manager
            say: "キャッチボールの相手、今日もお互い避けてます。"
      - stance: listen
        result: improved
        effects:
