        lines:
          - who: player
            name: "{other}"
            say: "{player} さん、自分のこと嫌いなんだと思ってました。"
          - who: player
            name: "{player}"
            say: "いや、お前がうまいから焦ってただけだって。言わせんなよ。"
          - who: team_manager
            say: "はい、言わせました。仲直りです。"
      - stance: listen
        result: worsened
