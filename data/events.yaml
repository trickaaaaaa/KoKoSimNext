            say: "主将はどっちの味方なんすか。"
          - who: player
            name: "{other}"
            say: "そうですよ、はっきりしてください。"
          - who: narration
            say: "なぜか最後は、主将が二人から責められて終わった。"

  - id: selfish_clash
    kind: Choice
    weight: 1.0
    cooldown_weeks: 12
    text: "チャンスでの打撃をめぐって、部員同士が言い合いになった。"
    cast:
      subject: selfish
      other: selfless
    variants:
      - lines:
          - who: narration
            say: "紅白戦の7回、一死三塁。サインはスクイズ。{player} はフルスイングで空振りした。"
          - who: player
            name: "{other}"
            say: "なんで振るんだよ！ バントのサイン出てただろ！"
