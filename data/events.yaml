# イベントテーブル（設計書04 §3）。発火は EventScheduler、提示はノベル画面（issue #609）。
# 追加・調整はこのファイル編集だけで完結させる（データ駆動）。
#
# ■ 書き方
#   text:     通知フィードに残る1行の要約。**バリエーションを持たせない**（後から一覧で追う行なので固定）。
#   variants: ノベル画面で見せる会話。**会話まるごと**でN通り書き、発火時に1つだけ選ばれる
#             （行ごとに独立抽選すると前後が噛み合わない文が出るため。2026-08-13 オーナー決定）。
#             同じ (イベント, 通算週) なら常に同じ会話＝開き直しても文が変わらない。
#   lines:    会話の中身。who=役割ID（立ち絵スロット＋既定の話者名）、say=本文、name=話者名の上書き。
#             who: manager 監督 / player 部員 / team_manager マネージャー / ob OB / scout スカウト /
#                  local 地域の人 / captain 主将 / narration 地の文（立ち絵なし）
#
# ■ 監督の書き方（2026-08-19 監督指示・issue event-dialogue-manager-too-cool）
#   プレイヤー＝監督なので、**監督に語らせすぎない**。旧版は109通り中104通りが監督の決め台詞で締まり、
#   独白（……）26本で自分の哲学を語る「ナルシスト監督」になっていた。以下を守る
#   （EventTableTests の RepositoryTable_ManagerDoesNotPreach で機械的に固定している）:
#     1. 監督の発話は **1会話に1本まで**。指示・質問・相槌の短い実務の言葉（「分かった」「室内でやろう」）
#     2. 監督の（……）独白は書かない（プレイヤーの内面を勝手に決めない）
#     3. 監督の行で会話を締めるのは全体の 1/3 まで。締めは地の文・部員・マネージャー・主将に渡す
#     4. 名言・比喩・逆説・格言・一般化（「〜で夏に差が出る」「〜な奴ほど〜」）を書かない
#     5. 「……」は1会話に1回まで。溜めで格好をつけない
#     6. 出来事の情報（何が起きたか・誰が主役か）は部員／マネージャー／地の文で伝える＝監督の行を消しても意味が通る
#   結果（誰の・何が・いくつ動いたか）は会話の**最終行に結果行**として提示層が足す（who: result。
#   yaml には書かない＝呼び出し元が実際の数値で組む）。会話は雰囲気だけでよい。
#
# ■ 差し込み語（EventTextFormat が展開。未知の語はそのまま残る＝データ側の書き間違いが絵に出る）
#   {player} 主役の部員名 ／ {school} 自校名 ／ {manager} 監督名 ／ {count} 1年生の人数（新入部員）
#   {injury} 故障名の話し言葉（「足首の捻挫」）／ {weeks} 全治までの週数 …… injury_occurred だけが渡す（issue #695）
#   ※ {player} はいまは「在籍部員から暦で決まる1人」。System イベント（issue #610〜）では
#     実際に起きた出来事の主役が渡される。
#
# ■ バリエーションを足すとき
#   variants: の下に `- lines:` を1ブロック足すだけでよい（コード変更は不要）。
#   発火の乱数は Fork で引くので、**通数を増やしても「いつ何が起きるか」は1語もずれない**。

events:
  # --- 固定イベント（カレンダー連動, calendar_week: 0〜49） ---
  - id: entrance_ceremony
    kind: Fixed
    calendar_week: 0
    text: "入学式。新入部員が加わった。"
    variants:
      - lines:
          - who: narration
            say: "校門の桜はもう散りかけている。新しい部員が、少し大きすぎる制服で並んでいた。"
          - who: captain
            say: "監督、今年の一年、声だけは立派です。"
          - who: team_manager
            say: "{count}名。今日から部室が狭くなりますね。"
      - lines:
          - who: narration
            say: "入学式。グラウンドの土はまだ湿っていて、真新しいスパイクの跡がくっきり残る。"
          - who: player
            say: "あの、自分、中学では外野で……いえ、どこでもやります！"
          - who: manager
            say: "分かった。まず名前を教えてくれ。"
      - lines:
          - who: team_manager
            say: "新入部員、{count}名です。少ないですが、体つきは悪くないですよ。"
          - who: captain
            say: "俺らのときより多いですよ。ちゃんと面倒みます。"
      - lines:
          - who: narration
            say: "{school}野球部、新年度。部室の名簿にまた行が増えた。"
          - who: player
            say: "よろしくお願いします！"
          - who: narration
            say: "揃わない声が、グラウンドの端まで届いた。"

  - id: summer_camp
    kind: Fixed
    calendar_week: 18
    text: "夏合宿。全体の経験値が跳ね上がる。"
    variants:
      - lines:
          - who: narration
            say: "夏合宿。日が落ちてもアスファルトは熱を持ったままで、ノックの音だけが響いていた。"
          - who: team_manager
            say: "監督、そろそろ切り上げますか。倒れられたら元も子もない。"
          - who: manager
            say: "あと五本で上がろう。"
      - lines:
          - who: player
            say: "もう無理です……。"
          - who: captain
            say: "無理って言えるうちは大丈夫だ。俺なんか声も出ねえ。"
          - who: narration
            say: "誰かが笑った。それでまた、次の一本が始まった。"
      - lines:
          - who: narration
            say: "合宿最終日の夜。誰も口を利かず、それでも誰も先に寝ようとしなかった。"
          - who: team_manager
            say: "よくやりました。明日は昼から、軽くだけにしましょう。"
          - who: manager
            say: "そうしよう。"
          - who: narration
            say: "翌朝、いつもより静かなグラウンドに、それでも全員が揃っていた。"

  - id: culture_festival
    kind: Fixed
    calendar_week: 28
    text: "文化祭。束の間の休息。"
    variants:
      - lines:
          - who: narration
            say: "文化祭。グラウンドの脇に模擬店が並び、バットの音がしない土曜日。"
          - who: player
            say: "監督、焼きそば食べていきませんか。俺たちの店なんで。"
          - who: manager
            say: "二つもらおう。"
          - who: player
            say: "まいど！"
      - lines:
          - who: captain
            say: "一日くらい、部活のこと忘れてもバチは当たらないですよね。"
          - who: team_manager
            say: "当たりませんよ。ほら、行った行った。"
      - lines:
          - who: narration
            say: "教室から笑い声が漏れてくる。部員たちの、野球以外の顔が見えた。"
          - who: player
            say: "監督も見に来てくれたんですね。あとで出し物あるんで、ぜひ。"

  - id: winter_camp
    kind: Fixed
    calendar_week: 38
    text: "冬合宿。鍛錬期の山場。"
    variants:
      - lines:
          - who: narration
            say: "冬。吐く息が白い。打球音が乾いて、遠くまで届く。"
          - who: team_manager
            say: "今日は走り込みを長めに入れます。"
          - who: manager
            say: "頼む。"
      - lines:
          - who: player
            say: "監督、指の感覚がないんですけど……。"
          - who: team_manager
            say: "カイロなら部室にあります。ちゃんと使ってくださいね。"
          - who: narration
            say: "手をこすり合わせながら、列に戻っていった。"
      - lines:
          - who: captain
            say: "夏に負けた分、冬でやり返します。"
          - who: manager
            say: "その意気だ。じゃあ、まず一本目。"

  - id: draft_meeting
    kind: Fixed
    calendar_week: 30
    text: "ドラフト会議。教え子に指名がかかるか。"
    variants:
      - lines:
          - who: narration
            say: "ドラフト会議。部室の小さなテレビの前に、全員が座り込んでいる。"
          - who: player
            say: "監督、始まりますよ。"
      - lines:
          - who: team_manager
            say: "監督、電話は繋がるようにしてありますか。"
          - who: manager
            say: "ああ、机の上だ。"
          - who: narration
            say: "誰も、その電話のほうを見ないようにしていた。"
      - lines:
          - who: scout
            say: "今年はどこも即戦力を欲しがっています。高校生は下位まで残るかと。"
          - who: team_manager
            say: "順位はどうでも、行けるかどうかですね。"

  - id: graduation
    kind: Fixed
    calendar_week: 49
    text: "卒業式。3年生を送り出す。"
    variants:
      - lines:
          - who: narration
            say: "卒業式。三年生が、最後にグラウンドへ寄っていった。"
          - who: player
            say: "……監督。ありがとうございました。"
          - who: manager
            say: "こちらこそ。元気でな。"
      - lines:
          - who: captain
            say: "この土、持って帰っていいですか。"
          - who: team_manager
            say: "好きなだけ持っていっていいですよ。来週には均されちゃいますから。"
      - lines:
          - who: narration
            say: "背番号を返しに来た三年生の手が、少しだけ震えていた。"
          - who: team_manager
            say: "三年間、よく続けましたね。"
          - who: narration
            say: "返事の代わりに、深く頭を下げた。"

  # --- ランダムイベント（重み付き抽選） ---
  - id: rain_week
    kind: Random
    weight: 3.0
    cooldown_weeks: 2
    text: "雨天でグラウンドが使えない。"
    variants:
      - lines:
          - who: narration
            say: "朝から雨。水たまりに映る空は、当分晴れそうにない。"
          - who: team_manager
            say: "室内に切り替えますか。"
          - who: manager
            say: "そうしよう。"
          - who: player
            say: "うわ、室内かあ。"
      - lines:
          - who: player
            say: "監督、今日は中止ですよね？"
          - who: team_manager
            say: "グラウンドは使えません。走るのは大丈夫です。"
          - who: player
            say: "……ですよね。"
      - lines:
          - who: captain
            say: "雨、恵みだと思うことにします。脚がもう限界だったんで。"
          - who: manager
            say: "じゃあ今日はビデオでも見るか。"

  - id: media_coverage
    kind: Random
    weight: 1.5
    cooldown_weeks: 8
    text: "マスコミの取材が入った。名声が上がる。"
    variants:
      - lines:
          - who: narration
            say: "地元紙の記者がグラウンドに来ている。カメラを向けられた部員が急に固くなった。"
          - who: manager
            say: "普段どおりでいいぞ。見られて困る練習はしてない。"
      - lines:
          - who: local
            name: "記者"
            say: "監督、今年のチームの手応えは？"
          - who: manager
            say: "夏に見てください。"
          - who: local
            name: "記者"
            say: "そうですか。では、写真を一枚。"
      - lines:
          - who: team_manager
            say: "写真、{player} ばかり撮られていましたね。"
          - who: captain
            say: "明日の練習であいつが浮かれてたら、俺が締めときます。"

  - id: ob_donation
    kind: Random
    weight: 1.0
    cooldown_weeks: 10
    text: "OB会から寄付があった。"
    effects:
      funds: 30            # 部費＝運営費の財布（道具・備品・合宿・スカウト）
    variants:
      - lines:
          - who: ob
            say: "監督、少ないですが部で使ってください。私も、ここで三年間転がされた口です。"
          - who: manager
            say: "ありがたく。道具に回します。"
      - lines:
          - who: narration
            say: "OB会の封筒が部室の机に置かれていた。添えられた紙には「がんばれ」の四文字だけ。"
          - who: team_manager
            say: "毎年、律儀に。ありがたいですね。"
      - lines:
          - who: ob
            say: "うちの代は一回戦負けでしてね。だから、あなたたちに託すんです。"
          - who: captain
            say: "……はい。ありがとうございます。"

  # 設備・資金イベント（設計書04 §1.4・issue #613）。
  # **財布は2つ**＝部費（運営費）と施設基金（建物にしか使えない）。イベントもその区別を守る
  # （後援会・OB寄付は建物へ、備品の破損は運営費から）。効果は effects: に書くだけで足せる。
  - id: booster_club_fund
    kind: Random
    weight: 1.0
    cooldown_weeks: 16
    text: "後援会が施設基金に寄付してくれた。"
    effects:
      facility_fund: 120
    variants:
      - lines:
          - who: local
            name: "後援会長"
            say: "監督、みんなで少しずつ出し合いました。建物に使ってください。"
          - who: manager
            say: "ありがとうございます。無駄にはしません。"
      - lines:
          - who: narration
            say: "職員室に呼ばれると、後援会名義の書類が机に置いてあった。"
          - who: team_manager
            say: "施設基金ですね。部費では建たないものに使えます。"
      - lines:
          - who: ob
            say: "室内が無いと、雪の日に何もできんでしょう。少しですが。"
          - who: team_manager
            say: "助かります。設備の相談、また来ますね。"

  - id: gear_broken
    kind: Random
    weight: 1.2
    cooldown_weeks: 8
    text: "練習道具が壊れた。買い替えに部費を使った。"
    effects:
      funds: -18
    variants:
      - lines:
          - who: team_manager
            say: "監督、ネットが裂けました。あれではフリー打撃が回せません。"
          - who: manager
            say: "買うしかないな。安いのを頼む。"
          - who: team_manager
            say: "了解です。カタログ持ってきます。"
      - lines:
          - who: player
            say: "すみません、バットが折れました。自分のじゃなくて、部の……。"
          - who: team_manager
            say: "道具は消耗品です。折れるまで振ったなら文句はありません。"
      - lines:
          - who: narration
            say: "マシンが止まった。分解した部員たちが、そろって首を横に振る。"
          - who: team_manager
            say: "修理じゃ無理ですね。部費から出すしかないです。"

  - id: local_company_support
    kind: Random
    weight: 0.8
    cooldown_weeks: 20
    text: "地元企業が用具を支援してくれた。"
    effects:
      funds: 45
    variants:
      - lines:
          - who: local
            name: "地元企業の人"
            say: "うちの社長、ここのOBでしてね。毎年やらせてもらってます。"
          - who: manager
            say: "いつも、ありがとうございます。"
      - lines:
          - who: narration
            say: "段ボールが三箱、部室の前に積まれている。伝票の差出人は町の工場だった。"
          - who: captain
            say: "監督、これ全部ボールです。……新品の。"

  # 練習効率イベント（issue #615）。**期間つき**の倍率で、部全体か本人ひとりに効く。
  #   training_mult   1.10＝＋10%
  #   training_weeks  効く週数（0＝補正なし）
  #   training_target team（既定・部全体）／player（会話の主役ひとり）
  - id: outside_coach_visit
    kind: Random
    weight: 1.0
    cooldown_weeks: 14
    text: "外部コーチが指導に来てくれることになった。"
    effects:
      training_mult: 1.10
      training_weeks: 4
    variants:
      - lines:
          - who: team_manager
            say: "監督、県の指定を受けました。月に一度、外部の方が来てくれるそうです。"
          - who: manager
            say: "いいね。日程を合わせよう。"
          - who: team_manager
            say: "はい。まず来月の第一週で。"
      - lines:
          - who: ob
            say: "しばらく手伝わせてください。現役の頃、ここで拾ってもらった恩がある。"
          - who: manager
            say: "助かります。守備をお願いできますか。"
          - who: ob
            say: "任せてください。"
      - lines:
          - who: narration
            say: "見慣れない大人がノックバットを持って立っている。打球が、明らかに速い。"
          - who: captain
            say: "監督、あの人……プロですか。"

  - id: self_practice_awakened
    kind: Random
    weight: 1.2
    cooldown_weeks: 10
    text: "自主練に目覚めた部員がいる。"
    effects:
      training_mult: 1.20
      training_weeks: 6
      training_target: player
    variants:
      - lines:
          - who: narration
            say: "全体練習が終わって一時間。まだ素振りの音がしている。"
          - who: team_manager
            say: "{player} ですね。ここのところ毎日です。"
      - lines:
          - who: team_manager
            say: "{player}、朝も来ています。鍵を開けるのが自分より早い。"
          - who: manager
            say: "怪我だけ気をつけて見ておいてくれ。"
      - lines:
          - who: player
            say: "監督、あと三十分だけいいですか。今日、掴めそうな気がして。"
          - who: manager
            say: "三十分だけな。"
          - who: player
            say: "はい！"

  - id: exam_week_slump
    kind: Random
    weight: 1.0
    cooldown_weeks: 12
    text: "テスト週間で練習時間が削られる。"
    effects:
      training_mult: 0.85
      training_weeks: 2
    variants:
      - lines:
          - who: team_manager
            say: "監督、今週から試験前です。全体練習は短縮になります。"
          - who: manager
            say: "分かった。赤点だけは出すなと伝えてくれ。"
          - who: team_manager
            say: "もう三回言いました。"
      - lines:
          - who: player
            say: "監督、正直……バットより教科書のほうが重いです。"
          - who: captain
            say: "俺のノート貸してやるから、赤点だけは取るなよ。"

  # 地域イベント（issue #616）。`requires_region:` の地方でだけ発火する。
  # 地方名は engine の JapanRegion（HokkaidoTohoku / Kanto / Chubu / Kinki / Chugoku / Shikoku / Kyushu）。
  # **綴りを間違えるとパースで落ちる**（黙って全国に出さない）。
  - id: region_snow_indoor
    kind: Random
    weight: 1.4
    cooldown_weeks: 20
    requires_region: HokkaidoTohoku
    text: "雪で外の練習ができない日が続く。"
    effects:
      training_mult: 0.90
      training_weeks: 3
    variants:
      - lines:
          - who: narration
            say: "朝、グラウンドは白一色だった。線を引く場所も分からない。"
          - who: team_manager
            say: "監督、除雪だけで午前が終わります。"
          - who: manager
            say: "体育館を借りよう。"
          - who: team_manager
            say: "バレー部と交渉してきます。"
      - lines:
          - who: player
            say: "監督、雪かきも練習に入りますか。"
          - who: captain
            say: "入るに決まってんだろ。ほら、スコップ。"

  - id: region_local_festival
    kind: Random
    weight: 1.0
    cooldown_weeks: 24
    requires_region: Kyushu
    text: "地域の祭りに部員が駆り出された。"
    effects:
      funds: 12
    variants:
      - lines:
          - who: local
            name: "町内会の人"
            say: "監督、今年も神輿の担ぎ手が足りんとです。三年生だけでも貸してもらえんですか。"
          - who: manager
            say: "分かりました。行かせます。"
      - lines:
          - who: narration
            say: "揃いの法被を着た部員たちが、慣れない手つきで綱を握っている。"
          - who: captain
            say: "監督、これ、明日の練習より疲れます。"

  - id: region_urban_ground_share
    kind: Random
    weight: 1.2
    cooldown_weeks: 18
    requires_region: Kanto
    text: "グラウンドが他部と重なり、使える面積が減った。"
    effects:
      training_mult: 0.92
      training_weeks: 2
    variants:
      - lines:
          - who: team_manager
            say: "監督、今週はサッカー部と半面ずつです。ノックは飛ばせません。"
          - who: manager
            say: "ケースバッティングに切り替えよう。"
      - lines:
          - who: narration
            say: "同じ校庭に三つの部が並んでいる。打球が隣の陣地へ飛ぶたび、声が上がる。"
          - who: player
            say: "すみませーん！　ボール取ってくださーい！"

  # 争奪戦（能動勧誘・設計書04 §2.2・issue #588）。
  # 発火のタイミングは週次の抽選ではなく「訪問1回ごと」なので、確率は
  # coefficients.yaml recruiting.rival_event_prob が持つ（週次イベントの weight は使わない）。
  # ここはイベント表としての登録と文言の正典で、UI もこの言い回しに合わせる。
  - id: recruit_rival_move
    kind: Random
    weight: 0.0
    text: "訪問した。だが競合校も動いたようだ。"

  # --- システムイベント（issue #610〜）---
  # 週次抽選には載せず（kind: System）、実際に起きた出来事から**主役つき**で呼ばれる。
  # 発生元が誰に何が起きたかを知っているので {player} は必ず実在の部員になる。
  # クールダウンは効かない（起きたら必ず出す）。通知フィードの行は発生元が出すので text は控えに留める。
  # 数値（診断名・全治週・上がった能力）は発生元が**結果行**として会話の最後に足す＝ここには書かない。
  - id: injury_occurred
    kind: System
    text: "選手が故障した。"
    # 故障はマネージャーの一言で言い切る（issue #695・2026-10-28 監督決定）。誰が・何で・何週離脱かだけ。
    # 小芝居は挟まず、結果行も足さない（この1行が結果そのもの）。{injury}/{weeks} は発生元が渡す。
    # 主役で会話を分けるので（同じ週に2人故障しても別の文）言い回しは2通り以上置く。
    variants:
      - lines:
          - who: team_manager
            say: "大変です！{player} 君が{injury}で全治{weeks}週間です！"
      - lines:
          - who: team_manager
            say: "監督、大変です！{player} 君、{injury}で全治{weeks}週間だそうです！"
      - lines:
          - who: team_manager
            say: "大変です！{player} 君が{injury}です。全治{weeks}週間と言われました！"

  - id: injury_returned
    kind: System
    text: "選手が怪我から復帰した。"
    variants:
      - lines:
          - who: player
            say: "監督。……戻りました。"
          - who: manager
            say: "おかえり。まず走ってこい。"
          - who: narration
            say: "軽いジョグの足取りが、少しずつ元に戻っていく。"
      - lines:
          - who: team_manager
            say: "{player}、今日から全体に合流させます。動きは戻っています。"
          - who: captain
            say: "待ってたぞ。遅れた分、俺が付き合う。"
      - lines:
          - who: narration
            say: "久しぶりに、その背番号がノックの列に並んでいる。"
          - who: player
            say: "お願いします！"

  # 選手成長イベント（設計書03 §5.5・issue #611）。
  # 上げは「兆しの上に起きた」、下げは**理不尽にしない**（「ここが限界だった」と納得できる言い方）。
  - id: growth_awakening
    kind: System
    text: "選手が覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "打球音が、今週だけ違う。"
          - who: narration
            say: "{player}のスイングが、先週までとは別人になっていた。"
      - lines:
          - who: player
            say: "監督、なんか……分かった気がします。うまく言えないんですけど。"
          - who: manager
            say: "いいぞ。その感じを忘れるな。"
      - lines:
          - who: captain
            say: "{player}、化けましたね。夏前にこれは大きい。"
          - who: manager
            say: "ああ。本人が一番驚いてる顔してるよ。"

  - id: growth_breakthrough
    kind: System
    text: "選手がコツを掴んだ。"
    variants:
      - lines:
          - who: narration
            say: "{player}のフォームの詰まりが取れ、素直な回り方になっていた。"
          - who: manager
            say: "そのまま行かせよう。"
      - lines:
          - who: player
            say: "監督、今のもう一回いいですか。……今のが一番しっくり来ました。"
          - who: manager
            say: "覚えとけ、今の形。"
      - lines:
          - who: narration
            say: "同じ練習をしているのに、ひとりだけ音が変わる日がある。"
          - who: captain
            say: "{player}、今日いいじゃん。何変えた？"

  - id: growth_slump
    kind: System
    text: "選手がスランプに入った。"
    variants:
      - lines:
          - who: player
            say: "……なんで当たらないんですかね。やってること、変えてないのに。"
          - who: manager
            say: "変えるな。三週間はフォームに手を入れるな。"
      - lines:
          - who: narration
            say: "{player}の数字が落ちてきていた。素振りのたびに、手首をいじり始めている。"
          - who: manager
            say: "止めてくれ。今いじると戻らなくなる。"
          - who: team_manager
            say: "分かりました。声をかけてきます。"
      - lines:
          - who: narration
            say: "バットは同じ、フォームも同じ。それでも打球が上がらない時期がある。"
          - who: captain
            say: "{player}、気にすんな。俺も去年やった。"

  - id: growth_plateau
    kind: System
    text: "選手の伸びが頭打ちになった。"
    variants:
      - lines:
          - who: narration
            say: "{player}は、ここから先はもう、大きくは伸びないかもしれなかった。"
          - who: manager
            say: "なら、伸ばす場所を変えよう。"
      - lines:
          - who: narration
            say: "測っても、去年の数字とほとんど変わらない。"
          - who: narration
            say: "{player}は、ここが上限かもしれなかった。"
      - lines:
          - who: player
            say: "自分、もう頭打ちですかね。"
          - who: manager
            say: "そこはな。でも他はまだ伸びる。使い方を考えよう。"

  - id: growth_yips
    kind: System
    text: "選手が送球・制球を崩した。"
    variants:
      - lines:
          - who: player
            say: "……投げられないんです。近い距離ほど、手が言うことを聞かなくて。"
          - who: manager
            say: "今日は遠投だけにしよう。"
      - lines:
          - who: narration
            say: "{player}は、山なりでしか投げられなくなっていた。"
          - who: captain
            say: "みんなの前で投げさせるの、しばらくやめませんか。"

  - id: growth_yips_overcome
    kind: System
    text: "選手が送球・制球の不調を克服した。"
    variants:
      - lines:
          - who: player
            say: "監督。……さっきの、普通に投げられました。"
          - who: manager
            say: "見てたよ。よかったな。"
      - lines:
          - who: narration
            say: "何でもない送球が、何でもないように一塁へ収まった。"
          - who: team_manager
            say: "{player}、戻りましたね。長かった。"

  # 監督成長イベント（設計書04 §1.1b・issue #612）。年度の終わり（3月の総括）に出る。
  # 主役は監督なので {player} は使わない（{manager} と {school} だけ）。
  # 監督の内面を独白で語らせない＝周りが「変わった」と言う形で書く。
  - id: mgr_koshien_experience
    kind: System
    text: "甲子園の経験が采配に返ってきた。"
    variants:
      - lines:
          - who: narration
            say: "あの夏、ベンチから見た景色は、まだ部員たちの話題に上る。"
          - who: team_manager
            say: "監督、あれから采配の切り替えが早くなりましたね。"
      - lines:
          - who: team_manager
            say: "監督、去年とサインの出し方が変わりましたね。速くなった。"
          - who: manager
            say: "そうか？"
          - who: team_manager
            say: "ええ。甲子園のあとからです。"

  - id: mgr_rival_lesson
    kind: System
    text: "名将との練習試合で学びがあった。"
    variants:
      - lines:
          - who: team_manager
            say: "完敗でしたね。点差以上に、やられた感じがします。"
          - who: manager
            say: "同じ場面で、向こうはもう一枚代えていたな。"
          - who: team_manager
            say: "ええ。ノートに書いておきます。"
      - lines:
          - who: narration
            say: "試合後、相手の監督と長く立ち話をしていた。部員たちは片付けの手を止めて眺めていた。"
          - who: captain
            say: "監督、何話してたんですか。"

  - id: mgr_big_loss
    kind: System
    text: "大敗から学んだ。"
    variants:
      - lines:
          - who: narration
            say: "勝てないまま一年が終わった。ノートには反省ばかりが並んでいる。"
          - who: team_manager
            say: "監督、来年の練習メニュー、一度全部見直しませんか。"
          - who: manager
            say: "そうしよう。"
      - lines:
          - who: captain
            say: "監督。……来年は、勝ちましょう。"
          - who: manager
            say: "ああ。まず俺が直す。"

  - id: mgr_seminar
    kind: System
    text: "指導者講習会に参加した。"
    variants:
      - lines:
          - who: narration
            say: "オフの週末、他校の監督たちに混じって、また生徒の側に座っている。"
          - who: team_manager
            say: "講習、どうでしたか。"
          - who: manager
            say: "半分は知っていた。残り半分が収穫だ。"
          - who: team_manager
            say: "その半分、今度教えてください。"
      - lines:
          - who: team_manager
            say: "監督、講習の資料、部室に置いてありましたよ。読んでいいですか。"
          - who: manager
            say: "もちろん。"

  - id: mgr_pro_ob
    kind: System
    text: "プロOBが訪ねてきた。"
    variants:
      - lines:
          - who: ob
            say: "監督、久しぶりです。……この子ら、いい体になってきましたね。"
          - who: manager
            say: "どこを見てそう思う？　あとで教えてくれ。"
          - who: ob
            say: "いいですよ。まず下半身です。"
      - lines:
          - who: ob
            say: "現役の頃は、こうやって見られる側だったんですけどね。"
          - who: captain
            say: "監督、あの人、本当にプロだった人ですか。"

  - id: mgr_mentor
    kind: System
    text: "名伯楽との出会いがあった。"
    variants:
      - lines:
          - who: narration
            say: "全国の常連校を三度率いた老将が、ふらりとグラウンドに現れた。"
          - who: team_manager
            say: "監督、二時間も話し込んでましたね。"
      - lines:
          - who: ob
            name: "老監督"
            say: "教えられることは何もない。ただ、私が間違えたことなら話せます。"
          - who: manager
            say: "それが一番聞きたい話です。"

  # 気づき: 成長タイプの見立て（設計書03 §5.6・issue #614）。
  # **断定しない**（育成眼が低いと読み違える）。会話も「かもしれない」の温度で書く。
  - id: insight_growth_type
    kind: System
    text: "選手の成長タイプに見当がついた。"
    variants:
      - lines:
          - who: narration
            say: "{player}が、冬に入ってから急に伸びてきていた。"
          - who: manager
            say: "去年の測定と並べてみてくれ。"
      - lines:
          - who: narration
            say: "同じ練習をしていても、伸びる時期は選手ごとに違う。"
          - who: narration
            say: "{player}の測定値を去年から辿ると、形が見えてきていた。"
      - lines:
          - who: team_manager
            say: "{player} の見立て、当たってますかね。"
          - who: manager
            say: "半分は勘だ。"
          - who: team_manager
            say: "その半分が当たるようになりましたよ。"

  # ドラフト（設計書20・issue #617）。候補入り・スカウト視察（評価上昇）・指名確定。
  # 主役は3年の選手。指名の可否そのものは engine が決めており、ここは提示だけ。
  - id: draft_candidate
    kind: System
    text: "選手がドラフト候補に挙がった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、{player} の名前が候補に載っています。地元紙にも出ていました。"
          - who: manager
            say: "本人には俺から言う。"
      - lines:
          - who: narration
            say: "部室の壁に貼られた新聞の切り抜きに、見慣れた名前が混じっている。"
          - who: captain
            say: "{player}、お前これ、見た？"
      - lines:
          - who: player
            say: "監督、自分……候補って、本当ですか。"
          - who: manager
            say: "本当だ。今日の練習は昨日と同じだぞ。"
          - who: player
            say: "はい！"

  - id: draft_scout_visit
    kind: System
    text: "スカウトが視察に来た。"
    variants:
      - lines:
          - who: scout
            say: "今日はお邪魔します。……いい体してますね、あの子。"
          - who: team_manager
            say: "本人には言わないでやってください。まだ夏が残ってるんで。"
      - lines:
          - who: scout
            say: "{player} 君、去年の秋から見ています。肩の強さは高校で上位です。"
          - who: manager
            say: "本人の前では控えめにお願いします。"
          - who: scout
            say: "承知しています。"
      - lines:
          - who: narration
            say: "ネット裏に、明らかに保護者ではない大人がひとり座っている。"
          - who: team_manager
            say: "……三人目ですね、今週。"

  - id: draft_nominated
    kind: System
    text: "教え子に指名がかかった。"
    variants:
      - lines:
          - who: narration
            say: "電話が鳴った。部室の全員が、一斉に振り向いた。"
          - who: player
            say: "……監督。呼ばれました。"
          - who: narration
            say: "部員たちの声で、あとの言葉は聞こえなかった。"
      - lines:
          - who: player
            say: "監督。……行ってきます。"
          - who: manager
            say: "ああ。よくやった。"
      - lines:
          - who: team_manager
            say: "うちから指名者が出るなんて。監督、泣かないでくださいよ。"
          - who: captain
            say: "マネージャーのほうが泣いてますって。"

  - id: draft_missed
    kind: System
    text: "教え子の指名は無かった。"
    variants:
      - lines:
          - who: narration
            say: "最後の名前が読み上げられて、テレビが野球以外の話題に移った。"
          - who: team_manager
            say: "……よく三年、続けましたね。"
      - lines:
          - who: player
            say: "監督、すみません。……呼ばれませんでした。"
          - who: manager
            say: "謝ることじゃない。"
          - who: captain
            say: "そうだぞ。呼ばれるところまで来たんだ。"

  # 夏の甲子園（設計書05 §1.1a）。県大会を勝ち抜いた直後に、激励金 → 抽選会 の順で出る。
  # どちらも効果の数値は yaml に書かない＝呼び出し元（KoshienEntry）が実際に動いた額・
  # 実際に決まった相手で結果行を組む。
  - id: koshien_berth_donation
    kind: System
    text: "OB会と卒業生から甲子園の激励金が届いた。"
    variants:
      - lines:
          - who: ob
            say: "監督、遠征も宿も金がかかるでしょう。同期で集めました。"
          - who: manager
            say: "ありがたく使わせてもらいます。"
          - who: team_manager
            say: "封筒、思ったより厚いですよ。数えるの手伝ってください。"
      - lines:
          - who: narration
            say: "部室の机に、名前の並んだ紙が一枚と封筒がいくつも積まれていた。卒業生の名簿だった。"
          - who: captain
            say: "……知らない先輩の名前ばっかりです。"
          - who: team_manager
            say: "この学校で三年やった人たちですね。全員。"
      - lines:
          - who: local
            name: "後援会長"
            say: "商店街も出しますよ。うちの店、あの夏のポスターまだ貼ってますからね。"
          - who: team_manager
            say: "何年前のですか、それ。"
          - who: local
            name: "後援会長"
            say: "十七年前。今年、貼り替えられる。"
      - lines:
          - who: ob
            say: "私は補欠で終わりました。だから、行く奴の靴代くらいは出したい。"
          - who: manager
            say: "必ず届けます。"
          - who: narration
            say: "封筒には、背番号も何も書かれていなかった。"

  - id: koshien_draw
    kind: System
    text: "甲子園の組み合わせ抽選会が行われた。"
    variants:
      - lines:
          - who: narration
            say: "抽選会場の壇上で、主将が箱に手を入れる。会場のざわめきが一段落ちた。"
          - who: captain
            say: "……引きました。"
          - who: team_manager
            say: "監督、番号が出ます。"
      - lines:
          - who: team_manager
            say: "組み合わせ、出ましたよ。"
          - who: manager
            say: "山はどうだ。"
          - who: team_manager
            say: "厳しいほうです。でも、どこと当たっても同じでしょう。"
      - lines:
          - who: captain
            say: "監督、俺、手が震えて箱の中でくじを二回落としました。"
          - who: narration
            say: "笑い声が起きて、それから全員が黙って掲示板を見上げた。"
      - lines:
          - who: narration
            say: "宿舎に戻ると、部員たちが新聞の組み合わせ表を囲んで頭を突き合わせていた。"
          - who: player
            say: "マネージャー、この学校ってどんなチームですか。"
          - who: team_manager
            say: "明日、映像を用意します。今日はもう休んでくださいね。"

  - id: senbatsu_berth_donation
    kind: System
    text: "OB会と卒業生からセンバツの激励金が届いた。"
    variants:
      - lines:
          - who: ob
            say: "冬の遠征は寒いでしょう。少ないですが足しにしてください。"
          - who: manager
            say: "助かります。"
          - who: team_manager
            say: "毛布代も出そうですね、これは。"
      - lines:
          - who: narration
            say: "年明けの部室に、振込明細の束が届いていた。差出人は卒業生の会だった。"
          - who: captain
            say: "……去年出た先輩たちもいますね。"
          - who: team_manager
            say: "選ばれた後輩に賭けたんでしょうね。"
      - lines:
          - who: local
            name: "後援会長"
            say: "選抜出場、街の掲示板に貼りましたよ。"
          - who: team_manager
            say: "気が早いですね。"
          - who: local
            name: "後援会長"
            say: "毎年これくらいでちょうどいい。"

  - id: senbatsu_draw
    kind: System
    text: "センバツの組み合わせ抽選会が行われた。"
    variants:
      - lines:
          - who: narration
            say: "抽選会場のモニターに、地区名と校名が順に映し出されていく。"
          - who: captain
            say: "……出ました。"
          - who: team_manager
            say: "監督、初戦の相手です。"
      - lines:
          - who: team_manager
            say: "組み合わせ出ましたよ、監督。"
          - who: manager
            say: "初戦はどこだ。"
          - who: team_manager
            say: "去年の秋、県で当たった相手です。"
      - lines:
          - who: player
            say: "マネージャー、相手の映像ってもうありますか。"
          - who: team_manager
            say: "冬の間に集めておきました。明日から見ましょう。"

  - id: senbatsu_not_selected
    kind: System
    text: "センバツの選考発表があった。今年は選ばれなかった。"
    variants:
      - lines:
          - who: narration
            say: "発表の紙に、自分たちの校名は無かった。部室はしばらく静かだった。"
          - who: captain
            say: "……夏で見返します。"
          - who: team_manager
            say: "その言葉、忘れないでくださいね。"
      - lines:
          - who: team_manager
            say: "監督、選外でした。"
          - who: manager
            say: "次で取り返す。"
          - who: player
            say: "はい。"
      - lines:
          - who: narration
            say: "掲示板の前で部員が肩を落としている横を、他校の歓声が通り過ぎていった。"
          - who: captain
            say: "悔しいです、正直。"
          - who: team_manager
            say: "悔しいうちは伸びますよ。次の練習からです。"

