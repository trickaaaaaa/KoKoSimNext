# イベントテーブル（設計書04 §3）。発火は EventScheduler、提示はノベル画面（issue #609）。
# 追加・調整はこのファイル編集だけで完結させる（データ駆動）。
#
# ■ 書き方
#   text:     通知フィードに残る1行の要約。**バリエーションを持たせない**（後から一覧で追う行なので固定）。
#   variants: ノベル画面で見せる会話。**会話まるごと**でN通り書き、発火時に1つだけ選ばれる
#             （行ごとに独立抽選すると前後が噛み合わない文が出るため。2026-08-13 オーナー決定）。
#             同じ (イベント, 通算週) なら常に同じ会話＝開き直しても文が変わらない。
#   lines:    会話の中身。who=役割ID（立ち絵スロット＋既定の話者名）、say=本文、name=話者名の上書き。
#             who: manager 監督 / player 部員 / team_manager マネージャー / scout スカウト /
#                  captain 主将 / narration 地の文（立ち絵なし）
#             ※ OB（ob）と地域の人（local）は使わない（issue #1425）。立ち絵を作らず、OB・後援会・町内会・記者の言葉は
#               マネージャーが監督に伝える形（「監督、OBの方が〜だそうです」）で書く。EventTableTests が残っていないことを固定する
#
# ■ 監督の書き方（2026-08-19 監督指示・issue event-dialogue-manager-too-cool）
#   プレイヤー＝監督なので、**監督に語らせすぎない**。旧版は109通り中104通りが監督の決め台詞で締まり、
#   独白（……）26本で自分の哲学を語る「ナルシスト監督」になっていた。以下を守る
#   （EventTableTests の RepositoryTable_ManagerDoesNotPreach で機械的に固定している）:
#     1. 監督の発話は **1会話に1本まで**。指示・質問・相槌の短い実務の言葉（「分かった」「室内でやろう」）
#     2. 監督の（……）独白は書かない（プレイヤーの内面を勝手に決めない）
#     3. 監督の行で会話を締めるのは全体の 1/3 まで。締めは地の文・部員・マネージャー・主将に渡す
#     4. 名言・比喩・逆説・格言・一般化（「〜で夏に差が出る」「〜な奴ほど〜」）を書かない
#     5. 「……」は1会話に1回まで。溜めで格好をつけない
#     6. 出来事の情報（何が起きたか・誰が主役か）は部員／マネージャー／地の文で伝える＝監督の行を消しても意味が通る
#   結果（誰の・何が・いくつ動いたか）は会話の**最終行に結果行**として提示層が足す（who: result。
#   yaml には書かない＝呼び出し元が実際の数値で組む）。会話は雰囲気だけでよい。
#
# ■ 差し込み語（EventTextFormat が展開。未知の語はそのまま残る＝データ側の書き間違いが絵に出る）
#   {player} 主役の部員名 ／ {school} 自校名 ／ {manager} 監督名 ／ {count} 1年生の人数（新入部員）
#   {injury} 故障名の話し言葉（「足首の捻挫」）／ {weeks} 全治までの週数 …… injury_occurred だけが渡す（issue #695）
#   {other} 選手間イベントの相手（cast: other: で選ぶ。issue #945）
#   {koshien} {senbatsu} {jingu} ほか 大会名（data/display-names.yaml の表から入る。issue #1319）。
#     実在の大会名は文に直接書かない＝表を替えると全部の文が替わる。「甲子園の土」も {koshien}の土 と書く
#   ※ {player} はいまは「在籍部員から暦で決まる1人」。System イベント（issue #610〜）では
#     実際に起きた出来事の主役が渡される。
#
# ■ バリエーションを足すとき
#   variants: の下に `- lines:` を1ブロック足すだけでよい（コード変更は不要）。
#   発火の乱数は Fork で引くので、**通数を増やしても「いつ何が起きるか」は1語もずれない**。

events:
  # --- 固定イベント（カレンダー連動, calendar_week: 0〜49） ---
  - id: entrance_ceremony
    kind: Fixed
    calendar_week: 0
    text: "入学式。新入部員が加わった。"
    variants:
      - lines:
          - who: narration
            say: "校門の桜はもう散りかけている。新しい部員が、少し大きすぎる制服で並んでいた。"
          - who: captain
            say: "監督、今年の一年、声だけは立派です。"
          - who: team_manager
            say: "{count}名。今日から部室が狭くなりますね。"
      - lines:
          - who: narration
            say: "入学式。グラウンドの土はまだ湿っていて、真新しいスパイクの跡がくっきり残る。"
          - who: player
            say: "あの、自分、中学では外野で……いえ、どこでもやります！"
          - who: manager
            say: "分かった。まず名前を教えてくれ。"
      - lines:
          - who: team_manager
            say: "新入部員、{count}名です。少ないですが、体つきは悪くないですよ。"
          - who: captain
            say: "俺らのときより多いですよ。ちゃんと面倒みます。"
      - lines:
          - who: narration
            say: "{school}野球部、新年度。部室の名簿にまた行が増えた。"
          - who: player
            say: "よろしくお願いします！"
          - who: narration
            say: "揃わない声が、グラウンドの端まで届いた。"

  - id: summer_camp
    kind: Fixed
    calendar_week: 18
    text: "夏合宿。全体の経験値が跳ね上がる。"
    variants:
      - lines:
          - who: narration
            say: "夏合宿。日が落ちてもアスファルトは熱を持ったままで、ノックの音だけが響いていた。"
          - who: team_manager
            say: "監督、そろそろ切り上げますか。倒れられたら元も子もない。"
          - who: manager
            say: "あと五本で上がろう。"
      - lines:
          - who: player
            say: "もう無理です……。"
          - who: captain
            say: "無理って言えるうちは大丈夫だ。俺なんか声も出ねえ。"
          - who: narration
            say: "誰かが笑った。それでまた、次の一本が始まった。"
      - lines:
          - who: narration
            say: "合宿最終日の夜。誰も口を利かず、それでも誰も先に寝ようとしなかった。"
          - who: team_manager
            say: "よくやりました。明日は昼から、軽くだけにしましょう。"
          - who: manager
            say: "そうしよう。"
          - who: narration
            say: "翌朝、いつもより静かなグラウンドに、それでも全員が揃っていた。"

  # 10月第3週。第28週（指名の週）は draft_meeting が使う＝同じ週に Fixed が2本出ないよう1週前に置く（EventTableTests が固定）。
  - id: culture_festival
    kind: Fixed
    calendar_week: 27
    text: "文化祭。束の間の休息。"
    variants:
      - lines:
          - who: narration
            say: "文化祭。グラウンドの脇に模擬店が並び、バットの音がしない土曜日。"
          - who: player
            say: "監督、焼きそば食べていきませんか。俺たちの店なんで。"
          - who: manager
            say: "二つもらおう。"
          - who: player
            say: "まいど！"
      - lines:
          - who: captain
            say: "一日くらい、部活のこと忘れてもバチは当たらないですよね。"
          - who: team_manager
            say: "当たりませんよ。ほら、行った行った。"
      - lines:
          - who: narration
            say: "教室から笑い声が漏れてくる。部員たちの、野球以外の顔が見えた。"
          - who: player
            say: "監督も見に来てくれたんですね。あとで出し物あるんで、ぜひ。"

  - id: winter_camp
    kind: Fixed
    calendar_week: 38
    text: "冬合宿。鍛錬期の山場。"
    variants:
      - lines:
          - who: narration
            say: "冬。吐く息が白い。打球音が乾いて、遠くまで届く。"
          - who: team_manager
            say: "今日は走り込みを長めに入れます。"
          - who: manager
            say: "頼む。"
      - lines:
          - who: player
            say: "監督、指の感覚がないんですけど……。"
          - who: team_manager
            say: "カイロなら部室にあります。ちゃんと使ってくださいね。"
          - who: narration
            say: "手をこすり合わせながら、列に戻っていった。"
      - lines:
          - who: captain
            say: "夏に負けた分、冬でやり返します。"
          - who: manager
            say: "その意気だ。じゃあ、まず一本目。"

  # 指名の確定と同じ週（SeasonCalendar.DraftWeek＝28）。EventTableTests が DraftWeek との一致を固定している
  # ＝片方だけ動かすと赤になる。同じ週の中では、会議の場面が指名結果のノベルより先に並ぶ（HomeState.AdvanceWeek）。
  - id: draft_meeting
    kind: Fixed
    calendar_week: 28
    text: "ドラフト会議。教え子に指名がかかるか。"
    variants:
      - lines:
          - who: narration
            say: "ドラフト会議。部室の小さなテレビの前に、全員が座り込んでいる。"
          - who: player
            say: "監督、始まりますよ。"
      - lines:
          - who: team_manager
            say: "監督、電話は繋がるようにしてありますか。"
          - who: manager
            say: "ああ、机の上だ。"
          - who: narration
            say: "誰も、その電話のほうを見ないようにしていた。"
      - lines:
          - who: scout
            say: "今年はどこも即戦力を欲しがっています。高校生は下位まで残るかと。"
          - who: team_manager
            say: "順位はどうでも、行けるかどうかですね。"

  # 卒業式＝「送り出す」場面（issue #954）。引退の場面（土の持ち帰り・背番号の返上・最後のミーティング）は
  # 夏の敗退直後の summer_retirement_* へ移した＝背番号は夏に返上済みなので、ここで返しに来ない。
  - id: graduation
    kind: Fixed
    calendar_week: 49
    text: "卒業式。3年生を送り出す。"
    variants:
      - lines:
          - who: narration
            say: "卒業式のあと、三年生がグラウンドへ寄っていった。引退してから半年ぶりのグラウンドだ。"
          - who: player
            name: "三年生"
            say: "……監督。ありがとうございました。"
          - who: player
            name: "一年生"
            say: "先輩、第二ボタンください！"
          - who: player
            name: "三年生"
            say: "野球部の第二ボタンって、もらってどうするの？"
      - lines:
          - who: team_manager
            say: "卒業おめでとうございます。花束は部費で買いました。領収書もあります。"
          - who: player
            name: "三年生"
            say: "それ今言わなくてよくない？"
          - who: captain
            say: "先輩方、一列に並んでください。在校生から一言ずつあります。"
          - who: narration
            say: "一言のはずが、だいたい三言になった。"
      - lines:
          - who: narration
            say: "卒業式の日の放課後。三年生が、後輩の練習をネット裏から眺めていた。"
          - who: player
            name: "三年生"
            say: "キャッチボール、俺らの頃よりうまくない？"
          - who: team_manager
            say: "先輩方が見てないところで、ずっと練習してましたから。"
          - who: player
            name: "三年生"
            say: "見てるところでやってよ。"
          - who: narration
            say: "春から、それぞれ別の場所へ行く。グラウンドの声は、いつもどおりだった。"

  # --- ランダムイベント（重み付き抽選） ---
  - id: rain_week
    kind: Random
    weight: 3.0
    cooldown_weeks: 2
    text: "雨天でグラウンドが使えない。"
    variants:
      - lines:
          - who: narration
            say: "朝から雨。水たまりに映る空は、当分晴れそうにない。"
          - who: team_manager
            say: "室内に切り替えますか。"
          - who: manager
            say: "そうしよう。"
          - who: player
            say: "うわ、室内かあ。"
      - lines:
          - who: player
            say: "監督、今日は中止ですよね？"
          - who: team_manager
            say: "グラウンドは使えません。走るのは大丈夫です。"
          - who: player
            say: "……ですよね。"
      - lines:
          - who: captain
            say: "雨、恵みだと思うことにします。脚がもう限界だったんで。"
          - who: manager
            say: "じゃあ今日はビデオでも見るか。"

  - id: media_coverage
    kind: Random
    weight: 1.5
    cooldown_weeks: 8
    text: "マスコミの取材が入った。部員の笑顔が、ぎこちない。"
    variants:
      - lines:
          - who: narration
            say: "地元紙の記者がグラウンドに来ている。カメラを向けられた部員が急に固くなった。"
          - who: manager
            say: "普段どおりでいいぞ。見られて困る練習はしてない。"
      - lines:
          - who: team_manager
            say: "監督、記者の方が、今年のチームの手応えを聞きたいそうです。"
          - who: manager
            say: "夏に見てください。"
          - who: team_manager
            say: "「そうですか。では、写真を一枚」とのことです。もう部員を並べてますよ。"
      - lines:
          - who: team_manager
            say: "写真、{player} ばかり撮られていましたね。"
          - who: captain
            say: "明日の練習であいつが浮かれてたら、俺が締めときます。"

  - id: ob_donation
    kind: Random
    weight: 1.0
    cooldown_weeks: 10
    text: "OB会から寄付があった。"
    effects:
      funds: 30            # 部費＝運営費の財布（道具・備品・合宿・スカウト）
    variants:
      - lines:
          - who: team_manager
            say: "監督、OBの方が寄付を持ってきてくださいました。「少ないですが、部で使ってください」と。"
          - who: manager
            say: "ありがたく。道具に回します。"
          - who: team_manager
            say: "ご自分もここで三年間転がされた口だそうですよ。"
      - lines:
          - who: narration
            say: "OB会の封筒が部室の机に置かれていた。添えられた紙には「がんばれ」の四文字だけ。"
          - who: team_manager
            say: "毎年、律儀に。ありがたいですね。"
      - lines:
          - who: team_manager
            say: "監督、OBの方が寄付を。「うちの代は一回戦負けでしてね。だから、あなたたちに託すんです」だそうです。"
          - who: captain
            say: "……はい。ありがとうございますと、伝えておいてください。"

  # 設備・資金イベント（設計書04 §1.4・issue #613）。
  # 財布は部費1つ（issue #1082 で施設基金を統合）。寄付も破損の出費も部費で動く。効果は effects: に書くだけで足せる。
  - id: booster_club_fund
    kind: Random
    weight: 1.0
    cooldown_weeks: 16
    text: "後援会が部費に寄付してくれた。"
    effects:
      funds: 60
    variants:
      - lines:
          - who: team_manager
            say: "監督、後援会長さんが、みんなで少しずつ出し合ったお金を届けてくださいました。"
          - who: manager
            say: "無駄にはしない。"
          - who: team_manager
            say: "建物に使ってほしいそうです。お礼状、書いておきますね。"
      - lines:
          - who: narration
            say: "職員室に呼ばれると、後援会名義の書類が机に置いてあった。"
          - who: team_manager
            say: "部費に入れておきますね。道具にも設備にも使えます。"
      - lines:
          - who: team_manager
            say: "監督、OBの方からも寄付をいただきました。「室内が無いと、雪の日に何もできんでしょう」と。設備のこと、また相談しましょうね。"

  - id: gear_broken
    kind: Random
    weight: 1.2
    cooldown_weeks: 8
    text: "練習道具が壊れた。買い替えに部費を使った。"
    effects:
      funds: -18
    variants:
      - lines:
          - who: team_manager
            say: "監督、ネットが裂けました。あれではフリー打撃が回せません。"
          - who: manager
            say: "買うしかないな。安いのを頼む。"
          - who: team_manager
            say: "了解です。カタログ持ってきます。"
      - lines:
          - who: player
            say: "すみません、バットが折れました。自分のじゃなくて、部の……。"
          - who: team_manager
            say: "道具は消耗品です。折れるまで振ったなら文句はありません。"
      - lines:
          - who: narration
            say: "マシンが止まった。分解した部員たちが、そろって首を横に振る。"
          - who: team_manager
            say: "修理じゃ無理ですね。部費から出すしかないです。"

  - id: local_company_support
    kind: Random
    weight: 0.8
    cooldown_weeks: 20
    text: "地元企業が用具を支援してくれた。"
    effects:
      funds: 45
    variants:
      - lines:
          - who: team_manager
            say: "監督、地元企業の方が用具を届けてくださいました。社長さんがここのOBで、毎年やらせてもらっているそうです。"
          - who: manager
            say: "いつも、ありがたい。"
      - lines:
          - who: narration
            say: "段ボールが三箱、部室の前に積まれている。伝票の差出人は町の工場だった。"
          - who: captain
            say: "監督、これ全部ボールです。……新品の。"

  # 練習効率イベント（issue #615）。**期間つき**の倍率で、部全体か本人ひとりに効く。
  #   training_mult   1.10＝＋10%
  #   training_weeks  効く週数（0＝補正なし）
  #   training_target team（既定・部全体）／player（会話の主役ひとり）
  - id: outside_coach_visit
    kind: Random
    weight: 1.0
    cooldown_weeks: 14
    text: "外部コーチが指導に来てくれることになった。"
    effects:
      training_mult: 1.10
      training_weeks: 4
    variants:
      - lines:
          - who: team_manager
            say: "監督、県の指定を受けました。月に一度、外部の方が来てくれるそうです。"
          - who: manager
            say: "いいね。日程を合わせよう。"
          - who: team_manager
            say: "はい。まず来月の第一週で。"
      - lines:
          - who: team_manager
            say: "監督、OBの方が、しばらく手伝わせてほしいそうです。現役の頃、ここで拾ってもらった恩があると。"
          - who: manager
            say: "助かる。守備をお願いできるか聞いてくれ。"
          - who: team_manager
            say: "「任せてください」とのことです。もうグラブを出してますよ。"
      - lines:
          - who: narration
            say: "見慣れない大人がノックバットを持って立っている。打球が、明らかに速い。"
          - who: captain
            say: "監督、あの人……プロですか。"

  - id: self_practice_awakened
    kind: Random
    weight: 1.2
    cooldown_weeks: 10
    text: "自主練に目覚めた部員がいる。"
    effects:
      training_mult: 1.20
      training_weeks: 6
      training_target: player
    variants:
      - lines:
          - who: narration
            say: "全体練習が終わって一時間。まだ素振りの音がしている。"
          - who: team_manager
            say: "{player} ですね。ここのところ毎日です。"
      - lines:
          - who: team_manager
            say: "{player}、朝も来ています。鍵を開けるのが自分より早い。"
          - who: manager
            say: "怪我だけ気をつけて見ておいてくれ。"
      - lines:
          - who: player
            say: "監督、あと三十分だけいいですか。今日、掴めそうな気がして。"
          - who: manager
            say: "三十分だけな。"
          - who: player
            say: "はい！"

  # 学業配慮（選択肢つき・issue #1270 E1・設計書03 §5.4）。kind は Random のまま（抽選の乱数列を変えない）。
  # 練習を軽くする＝効率 ×0.85・2週・信頼 +2（従来の効果のまま）／いつも通り＝効率 ×0.95・2週・信頼 −1。
  - id: exam_week_slump
    kind: Random
    weight: 1.0
    cooldown_weeks: 12
    text: "テスト週間で練習時間が削られる。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、今週から試験前です。練習、どうしましょう。"
          - who: captain
            say: "赤点が出たら試合に出られないぞって、もう三回言いました。"
      - lines:
          - who: player
            say: "監督、正直……バットより教科書のほうが重いです。"
          - who: captain
            say: "俺のノート貸してやるから、赤点だけは取るなよ。"
    choices:
      - stance: ease
        label: "練習を軽くして、勉強の時間をつくる"
        improve_prob: 1.0
      - stance: as_usual
        label: "いつも通り練習する"
        improve_prob: 1.0
    outcomes:
      - stance: ease
        result: improved
        effects:
          training_mult: 0.85
          training_weeks: 2
          trust: 2
        lines:
          - who: team_manager
            say: "全体練習は一時間で切り上げます。部室で勉強会をやるそうですよ。"
          - who: player
            name: "{player}"
            say: "数学、主将が教えてくれるらしいです。……スパルタらしいです。"
      - stance: as_usual
        result: improved
        effects:
          training_mult: 0.95
          training_weeks: 2
          trust: -1
        lines:
          - who: team_manager
            say: "練習はいつも通りです。……担任の先生から、ちょっと渋い顔をされました。"
          - who: player
            name: "{player}"
            say: "単語帳、ポケットに入れてノック受けてます。"

  # 地域イベント（issue #616）。`requires_region:` の地方でだけ発火する。
  # 地方名は engine の JapanRegion（HokkaidoTohoku / Kanto / Chubu / Kinki / Chugoku / Shikoku / Kyushu）。
  # **綴りを間違えるとパースで落ちる**（黙って全国に出さない）。
  - id: region_snow_indoor
    kind: Random
    weight: 1.4
    cooldown_weeks: 20
    requires_region: HokkaidoTohoku
    text: "雪で外の練習ができない日が続く。"
    effects:
      training_mult: 0.90
      training_weeks: 3
    variants:
      - lines:
          - who: narration
            say: "朝、グラウンドは白一色だった。線を引く場所も分からない。"
          - who: team_manager
            say: "監督、除雪だけで午前が終わります。"
          - who: manager
            say: "体育館を借りよう。"
          - who: team_manager
            say: "バレー部と交渉してきます。"
      - lines:
          - who: player
            say: "監督、雪かきも練習に入りますか。"
          - who: captain
            say: "入るに決まってんだろ。ほら、スコップ。"

  - id: region_local_festival
    kind: Random
    weight: 1.0
    cooldown_weeks: 24
    requires_region: Kyushu
    text: "地域の祭りに部員が駆り出された。"
    effects:
      funds: 12
    variants:
      - lines:
          - who: team_manager
            say: "監督、町内会の方が、今年も神輿の担ぎ手が足りないそうです。三年生だけでも貸してもらえないか、と。"
          - who: manager
            say: "分かった。行かせよう。"
          - who: team_manager
            say: "法被はもう用意してあるそうですよ。"
      - lines:
          - who: narration
            say: "揃いの法被を着た部員たちが、慣れない手つきで綱を握っている。"
          - who: captain
            say: "監督、これ、明日の練習より疲れます。"

  - id: region_urban_ground_share
    kind: Random
    weight: 1.2
    cooldown_weeks: 18
    requires_region: Kanto
    text: "グラウンドが他部と重なり、使える面積が減った。"
    effects:
      training_mult: 0.92
      training_weeks: 2
    variants:
      - lines:
          - who: team_manager
            say: "監督、今週はサッカー部と半面ずつです。ノックは飛ばせません。"
          - who: manager
            say: "ケースバッティングに切り替えよう。"
      - lines:
          - who: narration
            say: "同じ校庭に三つの部が並んでいる。打球が隣の陣地へ飛ぶたび、声が上がる。"
          - who: player
            say: "すみませーん！　ボール取ってくださーい！"

  # --- システムイベント（issue #610〜）---
  # 週次抽選には載せず（kind: System）、実際に起きた出来事から**主役つき**で呼ばれる。
  # 発生元が誰に何が起きたかを知っているので {player} は必ず実在の部員になる。
  # クールダウンは効かない（起きたら必ず出す）。通知フィードの行は発生元が出すので text は控えに留める。
  # 数値（診断名・全治週・上がった能力）は発生元が**結果行**として会話の最後に足す＝ここには書かない。
  - id: injury_occurred
    kind: System
    text: "選手が故障した。"
    # 故障はマネージャーの一言で言い切る（issue #695・2026-10-28 監督決定）。誰が・何で・何週離脱かだけ。
    # 小芝居は挟まず、結果行も足さない（この1行が結果そのもの）。{injury}/{weeks} は発生元が渡す。
    # 主役で会話を分けるので（同じ週に2人故障しても別の文）言い回しは2通り以上置く。
    variants:
      - lines:
          - who: team_manager
            say: "大変です！{player} 君が{injury}で全治{weeks}週間です！"
      - lines:
          - who: team_manager
            say: "監督、大変です！{player} 君、{injury}で全治{weeks}週間だそうです！"
      - lines:
          - who: team_manager
            say: "大変です！{player} 君が{injury}です。全治{weeks}週間と言われました！"

  - id: injury_returned
    kind: System
    text: "選手が怪我から復帰した。"
    variants:
      - lines:
          - who: player
            say: "監督。……戻りました。"
          - who: manager
            say: "おかえり。まず走ってこい。"
          - who: narration
            say: "軽いジョグの足取りが、少しずつ元に戻っていく。"
      - lines:
          - who: team_manager
            say: "{player}、今日から全体に合流させます。動きは戻っています。"
          - who: captain
            say: "待ってたぞ。遅れた分、俺が付き合う。"
      - lines:
          - who: narration
            say: "久しぶりに、その背番号がノックの列に並んでいる。"
          - who: player
            say: "お願いします！"

  # 選手成長イベント（設計書03 §5.5・issue #611）。
  # 上げは「兆しの上に起きた」、下げは**理不尽にしない**（「ここが限界だった」と納得できる言い方）。
  # 覚醒は分野で会話を分ける（issue #694）。投手が覚醒して打撃の話になっていた。
  - id: growth_awakening_batting
    kind: System
    text: "選手が打撃で覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "打球音が、今週だけ違う。"
          - who: narration
            say: "{player}のスイングが、先週までとは別人になっていた。"
      - lines:
          - who: player
            say: "監督、なんか……分かった気がします。うまく言えないんですけど。"
          - who: manager
            say: "いいぞ。その感じを忘れるな。"
      - lines:
          - who: captain
            say: "{player}、化けましたね。夏前にこれは大きい。"
          - who: team_manager
            say: "本人が一番驚いてる顔してますよ。"

  - id: growth_awakening_pitching
    kind: System
    text: "選手が投球で覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "ブルペンのミットの音が、ひとりだけ重い。"
          - who: team_manager
            say: "{player}君、今日の球、受けてる子が手を振ってました。"
      - lines:
          - who: player
            say: "監督、指にかかる感じが全然違うんです。"
          - who: manager
            say: "もう何球か見せてくれ。"
          - who: narration
            say: "続けて投げた球も、同じ軌道でミットに収まった。"
      - lines:
          - who: captain
            say: "{player}の球、打撃投手に入ってもらったら誰も前に飛ばせませんでした。"
          - who: team_manager
            say: "記録、つけておきますね。"

  - id: growth_awakening_defense
    kind: System
    text: "選手が守備で覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "ノックの打球に、{player}の一歩目が先に動いていた。"
          - who: captain
            say: "今の、捕れる位置にもう居ましたよ。"
      - lines:
          - who: player
            say: "監督、打った瞬間にどこへ来るか見えるようになりました。"
          - who: manager
            say: "そうか。続けてみよう。"
          - who: narration
            say: "その日のノックで、{player}は一度も球をこぼさなかった。"
      - lines:
          - who: team_manager
            say: "{player}君の送球、全部胸に来てるって一塁の子が言ってました。"
          - who: captain
            say: "あいつの後ろなら安心して投げられますね。"

  - id: growth_awakening_running
    kind: System
    text: "選手が走塁で覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "ベースランニングのタイムを測った{player}が、ストップウォッチを二度見していた。"
          - who: team_manager
            say: "測り間違いじゃないです。自己ベストです。"
      - lines:
          - who: player
            say: "監督、スタートの切り方、やっと分かった気がします。"
          - who: manager
            say: "牽制にも気をつけてな。"
          - who: captain
            say: "あの一歩目なら、二塁はもらったようなもんですね。"
      - lines:
          - who: narration
            say: "紅白戦で{player}が一塁から一気に本塁まで還ってきた。"
          - who: captain
            say: "あの打球で還ってくるのかよ。"

  - id: growth_breakthrough
    kind: System
    text: "選手がコツを掴んだ。"
    variants:
      - lines:
          - who: narration
            say: "{player}のフォームの詰まりが取れ、素直な回り方になっていた。"
          - who: manager
            say: "そのまま行かせよう。"
      - lines:
          - who: player
            say: "監督、今のもう一回いいですか。……今のが一番しっくり来ました。"
          - who: manager
            say: "覚えとけ、今の形。"
      - lines:
          - who: narration
            say: "同じ練習をしているのに、ひとりだけ音が変わる日がある。"
          - who: captain
            say: "{player}、今日いいじゃん。何変えた？"

  # issue #694 で足した上昇イベント。数値（上がった能力・球種）は結果行で言い切る＝ここは雰囲気だけ。
  - id: growth_grand_awakening
    kind: System
    text: "選手が大覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "その日のグラウンドで、{player}だけが別の競技をしているように見えた。"
          - who: team_manager
            say: "監督、見ましたか。私、鳥肌立ちました。"
          - who: captain
            say: "あいつ、本物になりましたね。"
      - lines:
          - who: player
            say: "監督、今までで一番、体が思ったとおりに動きました。"
          - who: manager
            say: "見てた。とんでもないな。"
          - who: narration
            say: "周りで練習していた部員たちが、いつの間にか手を止めて見ていた。"
      - lines:
          - who: captain
            say: "{player}、去年までと完全に別人ですよ。何があったんですか。"
          - who: team_manager
            say: "スカウトの人が来たら、真っ先に見せたいですね。"

  - id: growth_surge
    kind: System
    text: "選手に伸びしろが見えた。"
    variants:
      - lines:
          - who: narration
            say: "{player}は、まだ自分の限界の手前にもいないようだった。"
          - who: team_manager
            say: "最近、伸び方が変わってきましたね。"
      - lines:
          - who: player
            say: "監督、最近練習が楽しくて仕方ないんです。"
          - who: captain
            say: "{player}、まだまだ伸びますよ。"
      - lines:
          - who: team_manager
            say: "{player}君、毎週の記録がずっと右肩上がりなんです。"
          - who: manager
            say: "どこまで行くか楽しみだな。"
          - who: narration
            say: "記録ノートの数字は、まだ上を向いていた。"

  - id: growth_new_pitch
    kind: System
    text: "投手が新しい球種を覚えた。"
    variants:
      - lines:
          - who: player
            say: "監督、握りを変えたら、曲がるようになりました。"
          - who: manager
            say: "受けてもらおう。"
          - who: narration
            say: "キャッチャーのミットが、思ったよりずっと外で鳴った。"
      - lines:
          - who: narration
            say: "{player}がブルペンで、見慣れない握りを試していた。"
          - who: captain
            say: "それ、試合で使えますよ。"
      - lines:
          - who: team_manager
            say: "{player}君、新しい球をずっと練習してたんです。今日、形になりました。"
          - who: captain
            say: "打席に立ったら絶対嫌な球ですね。"

  - id: growth_pitch_refined
    kind: System
    text: "投手の球種が良くなった。"
    variants:
      - lines:
          - who: narration
            say: "{player}の持ち球のひとつが、今週は低めにきっちり決まっていた。"
          - who: team_manager
            say: "あの球、前より曲がりが鋭くなりましたね。"
      - lines:
          - who: player
            say: "監督、あの球、やっと自信を持って投げられます。"
          - who: captain
            say: "ブルペンで見ました。キレが全然違う。"

  - id: growth_big_stage_batting
    kind: System
    text: "選手が大舞台で化けた。"
    variants:
      - lines:
          - who: narration
            say: "スタンドの歓声を背に、{player}の打球は外野の頭を越えていった。"
          - who: team_manager
            say: "あの場面で打てる子、なかなかいませんよ。"
      - lines:
          - who: player
            say: "監督、打席に立ったら、不思議と落ち着いてました。"
          - who: captain
            say: "あの打席で、あいつ一段上に行きましたね。"
      - lines:
          - who: narration
            say: "試合後のロッカーで、{player}は誰よりも静かだった。"
          - who: team_manager
            say: "顔つきが変わりましたね。"

  - id: growth_big_stage_pitching
    kind: System
    text: "投手が大舞台で化けた。"
    variants:
      - lines:
          - who: narration
            say: "マウンドの{player}は、回を追うごとに球が走っていった。"
          - who: team_manager
            say: "最後の回が一番速かったです。"
      - lines:
          - who: player
            say: "監督、大観衆の前のほうが、腕が振れました。"
          - who: captain
            say: "あの投球、一生忘れないと思います。"
      - lines:
          - who: narration
            say: "試合が終わっても、{player}はしばらくマウンドのほうを見ていた。"
          - who: captain
            say: "あいつ、今日で本物のエースになりましたね。"

  - id: growth_slump
    kind: System
    text: "選手がスランプに入った。"
    variants:
      - lines:
          - who: player
            say: "……なんで当たらないんですかね。やってること、変えてないのに。"
          - who: manager
            say: "変えるな。三週間はフォームに手を入れるな。"
      - lines:
          - who: narration
            say: "{player}の数字が落ちてきていた。素振りのたびに、手首をいじり始めている。"
          - who: manager
            say: "止めてくれ。今いじると戻らなくなる。"
          - who: team_manager
            say: "分かりました。声をかけてきます。"
      - lines:
          - who: narration
            say: "バットは同じ、フォームも同じ。それでも打球が上がらない時期がある。"
          - who: captain
            say: "{player}、気にすんな。俺も去年やった。"

  - id: growth_plateau
    kind: System
    text: "選手の伸びが頭打ちになった。"
    variants:
      - lines:
          - who: narration
            say: "{player}は、ここから先はもう、大きくは伸びないかもしれなかった。"
          - who: manager
            say: "なら、伸ばす場所を変えよう。"
      - lines:
          - who: narration
            say: "測っても、去年の数字とほとんど変わらない。"
          - who: narration
            say: "{player}は、ここが上限かもしれなかった。"
      - lines:
          - who: player
            say: "自分、もう頭打ちですかね。"
          - who: manager
            say: "そこはな。でも他はまだ伸びる。使い方を考えよう。"

  - id: growth_yips
    kind: System
    text: "選手が送球・制球を崩した。"
    variants:
      - lines:
          - who: player
            say: "……投げられないんです。近い距離ほど、手が言うことを聞かなくて。"
          - who: manager
            say: "今日は遠投だけにしよう。"
      - lines:
          - who: narration
            say: "{player}は、山なりでしか投げられなくなっていた。"
          - who: captain
            say: "みんなの前で投げさせるの、しばらくやめませんか。"

  - id: growth_yips_overcome
    kind: System
    text: "選手が送球・制球の不調を克服した。"
    variants:
      - lines:
          - who: player
            say: "監督。……さっきの、普通に投げられました。"
          - who: manager
            say: "見てたよ。よかったな。"
      - lines:
          - who: narration
            say: "何でもない送球が、何でもないように一塁へ収まった。"
          - who: team_manager
            say: "{player}、戻りましたね。長かった。"

  # 監督成長イベント（設計書04 §1.1b・issue #612）。年度の終わり（3月の総括）に出る。
  # 主役は監督なので {player} は使わない（{manager} と {school} だけ）。
