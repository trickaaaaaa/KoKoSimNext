# イベントテーブル（設計書04 §3）。発火は EventScheduler、提示はノベル画面（issue #609）。
# 追加・調整はこのファイル編集だけで完結させる（データ駆動）。
#
# ■ 書き方
#   scene:    ノベル画面の背景になる場所（issue #1516・表示専用）。ground グラウンド / bench 球場 / school 教室 /
#             clubroom 部室 / office 監督室 / camp 合宿所 / hall 体育館 / night 夜のグラウンド。
#             全イベントに書く（EventTableTests が省略を弾く）。未知の語はパーサが例外にする
#   text:     通知フィードに残る1行の要約。**バリエーションを持たせない**（後から一覧で追う行なので固定）。
#   variants: ノベル画面で見せる会話。**会話まるごと**でN通り書き、発火時に1つだけ選ばれる
#             （行ごとに独立抽選すると前後が噛み合わない文が出るため。2026-08-13 オーナー決定）。
#             同じ (イベント, 通算週) なら常に同じ会話＝開き直しても文が変わらない。
#   lines:    会話の中身。who=役割ID（立ち絵スロット＋既定の話者名）、say=本文、name=話者名の上書き。
#             who: manager 監督 / player 部員 / team_manager マネージャー / scout スカウト /
#                  captain 主将 / narration 地の文（立ち絵なし）
#             ※ OB（ob）と地域の人（local）は使わない（issue #1425）。立ち絵を作らず、OB・後援会・町内会・記者の言葉は
#               マネージャーが監督に伝える形（「監督、OBの方が〜だそうです」）で書く。EventTableTests が残っていないことを固定する
#
# ■ 監督の書き方（2026-08-19 監督指示・issue event-dialogue-manager-too-cool）
#   プレイヤー＝監督なので、**監督に語らせすぎない**。旧版は109通り中104通りが監督の決め台詞で締まり、
#   独白（……）26本で自分の哲学を語る「ナルシスト監督」になっていた。以下を守る
#   （EventTableTests の RepositoryTable_ManagerDoesNotPreach で機械的に固定している）:
#     1. 監督の発話は **1会話に1本まで**。指示・質問・相槌の短い実務の言葉（「分かった」「室内でやろう」）
#     2. 監督の（……）独白は書かない（プレイヤーの内面を勝手に決めない）
#     3. 監督の行で会話を締めるのは全体の 1/3 まで。締めは地の文・部員・マネージャー・主将に渡す
#     4. 名言・比喩・逆説・格言・一般化（「〜で夏に差が出る」「〜な奴ほど〜」）を書かない
#     5. 「……」は1会話に1回まで。溜めで格好をつけない
#     6. 出来事の情報（何が起きたか・誰が主役か）は部員／マネージャー／地の文で伝える＝監督の行を消しても意味が通る
#   結果（誰の・何が・いくつ動いたか）は会話の**最終行に結果行**として提示層が足す（who: result。
#   yaml には書かない＝呼び出し元が実際の数値で組む）。会話は雰囲気だけでよい。
#
# ■ 差し込み語（EventTextFormat が展開。未知の語はそのまま残る＝データ側の書き間違いが絵に出る）
#   {player} 主役の部員名 ／ {school} 自校名 ／ {manager} 監督名 ／ {count} 1年生の人数（新入部員）
#   {injury} 故障名の話し言葉（「足首の捻挫」）／ {weeks} 全治までの週数 …… injury_occurred だけが渡す（issue #695）
#   {other} 選手間イベントの相手（cast: other: で選ぶ。issue #945）
#   {koshien} {senbatsu} {jingu} ほか 大会名（data/display-names.yaml の表から入る。issue #1319）。
#     実在の大会名は文に直接書かない＝表を替えると全部の文が替わる。「甲子園の土」も {koshien}の土 と書く
#   ※ {player} はいまは「在籍部員から暦で決まる1人」。System イベント（issue #610〜）では
#     実際に起きた出来事の主役が渡される。
#
# ■ バリエーションを足すとき
#   variants: の下に `- lines:` を1ブロック足すだけでよい（コード変更は不要）。
#   発火の乱数は Fork で引くので、**通数を増やしても「いつ何が起きるか」は1語もずれない**。

events:
  # --- 固定イベント（カレンダー連動, calendar_week: 0〜49） ---
  - id: entrance_ceremony
    kind: Fixed
    scene: hall
    calendar_week: 0
    text: "入学式。新入部員が加わった。"
    variants:
      - lines:
          - who: narration
            say: "校門の桜はもう散りかけている。新しい部員が、少し大きすぎる制服で並んでいた。"
          - who: captain
            say: "監督、今年の一年、声だけは立派です。"
          - who: team_manager
            say: "{count}名。今日から部室が狭くなりますね。"
      - lines:
          - who: narration
            say: "入学式。グラウンドの土はまだ湿っていて、真新しいスパイクの跡がくっきり残る。"
          - who: player
            say: "あの、自分、中学では外野で……いえ、どこでもやります！"
          - who: manager
            say: "分かった。まず名前を教えてくれ。"
      - lines:
          - who: team_manager
            say: "新入部員、{count}名です。少ないですが、体つきは悪くないですよ。"
          - who: captain
            say: "俺らのときより多いですよ。ちゃんと面倒みます。"
      - lines:
          - who: narration
            say: "{school}野球部、新年度。部室の名簿にまた行が増えた。"
          - who: player
            say: "よろしくお願いします！"
          - who: narration
            say: "揃わない声が、グラウンドの端まで届いた。"

  - id: summer_camp
    kind: Fixed
    scene: camp
    calendar_week: 18
    text: "夏合宿。全体の経験値が跳ね上がる。"
    variants:
      - lines:
          - who: narration
            say: "夏合宿。日が落ちてもアスファルトは熱を持ったままで、ノックの音だけが響いていた。"
          - who: team_manager
            say: "監督、そろそろ切り上げますか。倒れられたら元も子もない。"
          - who: manager
            say: "あと五本で上がろう。"
      - lines:
          - who: player
            say: "もう無理です……。"
          - who: captain
            say: "無理って言えるうちは大丈夫だ。俺なんか声も出ねえ。"
          - who: narration
            say: "誰かが笑った。それでまた、次の一本が始まった。"
      - lines:
          - who: narration
            say: "合宿最終日の夜。誰も口を利かず、それでも誰も先に寝ようとしなかった。"
          - who: team_manager
            say: "よくやりました。明日は昼から、軽くだけにしましょう。"
          - who: manager
            say: "そうしよう。"
          - who: narration
            say: "翌朝、いつもより静かなグラウンドに、それでも全員が揃っていた。"

  # 10月第3週。第28週（指名の週）は draft_meeting が使う＝同じ週に Fixed が2本出ないよう1週前に置く（EventTableTests が固定）。
  - id: culture_festival
    kind: Fixed
    scene: school
    calendar_week: 27
    text: "文化祭。束の間の休息。"
    variants:
      - lines:
          - who: narration
            say: "文化祭。グラウンドの脇に模擬店が並び、バットの音がしない土曜日。"
          - who: player
            say: "監督、焼きそば食べていきませんか。俺たちの店なんで。"
          - who: manager
            say: "二つもらおう。"
          - who: player
            say: "まいど！"
      - lines:
          - who: captain
            say: "一日くらい、部活のこと忘れてもバチは当たらないですよね。"
          - who: team_manager
            say: "当たりませんよ。ほら、行った行った。"
      - lines:
          - who: narration
            say: "教室から笑い声が漏れてくる。部員たちの、野球以外の顔が見えた。"
          - who: player
            say: "監督も見に来てくれたんですね。あとで出し物あるんで、ぜひ。"

  - id: winter_camp
    kind: Fixed
    scene: ground
    calendar_week: 38
    text: "冬合宿。鍛錬期の山場。"
    variants:
      - lines:
          - who: narration
            say: "冬。吐く息が白い。打球音が乾いて、遠くまで届く。"
          - who: team_manager
            say: "今日は走り込みを長めに入れます。"
          - who: manager
            say: "頼む。"
      - lines:
          - who: player
            say: "監督、指の感覚がないんですけど……。"
          - who: team_manager
            say: "カイロなら部室にあります。ちゃんと使ってくださいね。"
          - who: narration
            say: "手をこすり合わせながら、列に戻っていった。"
      - lines:
          - who: captain
            say: "夏に負けた分、冬でやり返します。"
          - who: manager
            say: "その意気だ。じゃあ、まず一本目。"

  # 指名の確定と同じ週（SeasonCalendar.DraftWeek＝28）。EventTableTests が DraftWeek との一致を固定している
  # ＝片方だけ動かすと赤になる。同じ週の中では、会議の場面が指名結果のノベルより先に並ぶ（HomeState.AdvanceWeek）。
  - id: draft_meeting
    kind: Fixed
    scene: clubroom
    calendar_week: 28
    text: "ドラフト会議。教え子に指名がかかるか。"
    variants:
      - lines:
          - who: narration
            say: "ドラフト会議。部室の小さなテレビの前に、全員が座り込んでいる。"
          - who: player
            say: "監督、始まりますよ。"
      - lines:
          - who: team_manager
            say: "監督、電話は繋がるようにしてありますか。"
          - who: manager
            say: "ああ、机の上だ。"
          - who: narration
            say: "誰も、その電話のほうを見ないようにしていた。"
      - lines:
          - who: scout
            say: "今年はどこも即戦力を欲しがっています。高校生は下位まで残るかと。"
          - who: team_manager
            say: "順位はどうでも、行けるかどうかですね。"

  # 3月の転任判定（総括週＝第46週・ManagerTransferModel）の前に、校長が学校の見方を匂わせる（issue #1606・設計書04 §1.3）。
  # 出るのは「教員監督で、この年度末に残留の抽選がある」年だけ（requires_transfer_draw。判定は engine の TransferHint.TierFor）。
  # 文は信頼度の段で出し分ける（transfer_hint: high/mid/low＝残留確率の式の中点±傾き）。**数字・確率・「信頼度」の語は出さない**。
  # 高い段でも異動はありうる（残留の上限は0.8）ので「確約」の文にしない。第45週は年契約の更新の会話があるので1週前に置く。
  - id: principal_talk
    kind: Fixed
    scene: office
    calendar_week: 44
    requires_transfer_draw: true
    text: "校長に呼ばれた。年度末の人事の前に、少し話をした。"
    variants:
      - transfer_hint: high
        lines:
          - who: narration
            say: "校長室に呼ばれた。机の上には、まだ封を切っていない人事の書類が積んである。"
          - who: principal
            say: "来年度も野球部は先生にお願いしたいと、上には伝えてありますから。"
          - who: manager
            say: "ありがとうございます。"
          - who: principal
            say: "まあ、人事は私の一存では決まりませんがね。"
      - transfer_hint: high
        lines:
          - who: principal
            say: "先生のところは、保護者の方からも評判がいいんですよ。うちの学校の顔です。"
          - who: narration
            say: "湯のみのお茶が、いつもより熱かった。"
          - who: principal
            say: "春の辞令が出るまでは、何とも言えませんが。この調子でお願いします。"
      - transfer_hint: high
        lines:
          - who: narration
            say: "廊下で校長に呼び止められた。手には、なぜか野球部の新聞記事の切り抜きがある。"
          - who: principal
            say: "これ、職員室に貼っておきました。皆さん読んでましたよ。"
          - who: team_manager
            say: "校長先生、監督のこと、教育委員会にも褒めておいてくださいね。"
          - who: principal
            say: "言ってはあります。言っては。"
      - transfer_hint: mid
        lines:
          - who: narration
            say: "校長室に呼ばれた。窓の外では、野球部の一年生が雪かきをしている。"
          - who: principal
            say: "人事のことは私にもわかりませんが……まあ、頑張っておられるのは見ています。"
          - who: manager
            say: "恐れ入ります。"
          - who: principal
            say: "見ているだけで、決めるのは私じゃないんですよ。"
      - transfer_hint: mid
        lines:
          - who: principal
            say: "先生、今年の野球部はどうですか。いえ、世間話です。ただの世間話。"
          - who: team_manager
            say: "校長先生、さっきから三回目の世間話ですよ。"
          - who: narration
            say: "校長はお茶を一口飲んで、窓の外を見た。"
      - transfer_hint: mid
        lines:
          - who: narration
            say: "年度末の校長室は、書類の山で机が見えない。"
          - who: principal
            say: "春は人が動く季節ですからね。先生のところも、どうなるか。"
          - who: manager
            say: "そうですね。"
          - who: principal
            say: "悪い話は聞いていませんよ。良い話も、聞いていませんが。"
      - transfer_hint: low
        lines:
          - who: narration
            say: "校長室に呼ばれた。いつもは出るお茶が、今日は出なかった。"
          - who: principal
            say: "教育委員会から、野球部のことで少し問い合わせがありましてね。"
          - who: manager
            say: "どういった内容でしょうか。"
          - who: principal
            say: "いえ、私のほうで答えておきました。ただ、春の人事は少し覚悟しておいてください。"
      - transfer_hint: low
        lines:
          - who: principal
            say: "先生、来年度のことなんですがね。まだ何も決まっていません。決まっていませんが。"
          - who: team_manager
            say: "校長先生、その「が」の続きを聞かせてください。"
          - who: narration
            say: "校長は書類を揃え直して、それ以上は何も言わなかった。"
      - transfer_hint: low
        lines:
          - who: narration
            say: "職員室で、校長が電話を切ってから監督のほうを見た。"
          - who: principal
            say: "教育委員会の方が、近いうちにグラウンドを見に来るそうです。普段どおりで結構ですよ。"
          - who: team_manager
            say: "普段どおりって、普段どおりにしていたらまずいんじゃ……。"

  # 卒業式＝「送り出す」場面（issue #954）。引退の場面（土の持ち帰り・背番号の返上・最後のミーティング）は
  # 夏の敗退直後の summer_retirement_* へ移した＝背番号は夏に返上済みなので、ここで返しに来ない。
  - id: graduation
    kind: Fixed
    scene: ground
    calendar_week: 49
    requires_graduating_class: true   # 3年生（夏に引退した者を含む）が居ない年は出さない（issue #1609）
    text: "卒業式。3年生を送り出す。"
    variants:
      - lines:
          - who: narration
            say: "卒業式のあと、三年生がグラウンドへ寄っていった。引退してから半年ぶりのグラウンドだ。"
          - who: player
            name: "三年生"
            say: "……監督。ありがとうございました。"
          - who: player
            name: "一年生"
            say: "先輩、第二ボタンください！"
          - who: player
            name: "三年生"
            say: "野球部の第二ボタンって、もらってどうするの？"
      - lines:
          - who: team_manager
            say: "卒業おめでとうございます。花束は部費で買いました。領収書もあります。"
          - who: player
            name: "三年生"
            say: "それ今言わなくてよくない？"
          - who: captain
            say: "先輩方、一列に並んでください。在校生から一言ずつあります。"
          - who: narration
            say: "一言のはずが、だいたい三言になった。"
      - lines:
          - who: narration
            say: "卒業式の日の放課後。三年生が、後輩の練習をネット裏から眺めていた。"
          - who: player
            name: "三年生"
            say: "キャッチボール、俺らの頃よりうまくない？"
          - who: team_manager
            say: "先輩方が見てないところで、ずっと練習してましたから。"
          - who: player
            name: "三年生"
            say: "見てるところでやってよ。"
          - who: narration
            say: "春から、それぞれ別の場所へ行く。グラウンドの声は、いつもどおりだった。"

  # --- ランダムイベント（重み付き抽選） ---
  - id: rain_week
    kind: Random
    scene: clubroom
    weight: 3.0
    cooldown_weeks: 2
    text: "雨天でグラウンドが使えない。"
    variants:
      - lines:
          - who: narration
            say: "朝から雨。水たまりに映る空は、当分晴れそうにない。"
          - who: team_manager
            say: "室内に切り替えますか。"
          - who: manager
            say: "そうしよう。"
          - who: player
            say: "うわ、室内かあ。"
      - lines:
          - who: player
            say: "監督、今日は中止ですよね？"
          - who: team_manager
            say: "グラウンドは使えません。走るのは大丈夫です。"
          - who: player
            say: "……ですよね。"
      - lines:
          - who: captain
            say: "雨、恵みだと思うことにします。脚がもう限界だったんで。"
          - who: manager
            say: "じゃあ今日はビデオでも見るか。"

  # 取材（設計書03 §5.2・issue #1467 P2・#1270 E1）: 名声 +1、次の公式戦1試合だけ自校側のプレッシャー指数 +1。
  - id: media_coverage
    kind: Random
    scene: ground
    weight: 1.5
    cooldown_weeks: 8
    text: "マスコミの取材が入った。部員の笑顔が、ぎこちない。"
    effects:
      fame: 1
      pressure_next_match: 1
    variants:
      - lines:
          - who: narration
            say: "地元紙の記者がグラウンドに来ている。カメラを向けられた部員が急に固くなった。"
          - who: manager
            say: "普段どおりでいいぞ。見られて困る練習はしてない。"
      - lines:
          - who: team_manager
            say: "監督、記者の方が、今年のチームの手応えを聞きたいそうです。"
          - who: manager
            say: "夏に見てください。"
          - who: team_manager
            say: "「そうですか。では、写真を一枚」とのことです。もう部員を並べてますよ。"
      - lines:
          - who: team_manager
            say: "写真、{player} ばかり撮られていましたね。"
          - who: captain
            say: "明日の練習であいつが浮かれてたら、俺が締めときます。"

  - id: ob_donation
    kind: Random
    scene: clubroom
    weight: 1.0
    cooldown_weeks: 10
    requires_ob: true      # OB（野球部の卒業生）が居ない新設校では出さない（issue #1615）
    text: "OB会から寄付があった。"
    effects:
      funds: 30            # 部費＝運営費の財布（道具・備品・合宿・スカウト）
    variants:
      - lines:
          - who: team_manager
            say: "監督、OBの方が寄付を持ってきてくださいました。「少ないですが、部で使ってください」と。"
          - who: manager
            say: "ありがたく。道具に回します。"
          - who: team_manager
            say: "ご自分もここで三年間転がされた口だそうですよ。"
      - lines:
          - who: narration
            say: "OB会の封筒が部室の机に置かれていた。添えられた紙には「がんばれ」の四文字だけ。"
          - who: team_manager
            say: "毎年、律儀に。ありがたいですね。"
      - lines:
          - who: team_manager
            say: "監督、OBの方が寄付を。「うちの代は一回戦負けでしてね。だから、あなたたちに託すんです」だそうです。"
          - who: captain
            say: "……はい。ありがとうございますと、伝えておいてください。"

  # 設備・資金イベント（設計書04 §1.4・issue #613）。
  # 財布は部費1つ（issue #1082 で施設基金を統合）。寄付も破損の出費も部費で動く。効果は effects: に書くだけで足せる。
  - id: booster_club_fund
    kind: Random
    scene: office
    weight: 1.0
