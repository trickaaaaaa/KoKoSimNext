          - who: player
            say: "はい！"

  # 学業配慮（選択肢つき・issue #1270 E1・設計書03 §5.4）。kind は Random のまま（抽選の乱数列を変えない）。
  # 練習を軽くする＝効率 ×0.85・2週・信頼 +2（従来の効果のまま）／いつも通り＝効率 ×0.95・2週・信頼 −1。
  - id: exam_week_slump
    kind: Random
    scene: school
    weight: 1.0
    cooldown_weeks: 12
    text: "テスト週間で練習時間が削られる。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、今週から試験前です。練習、どうしましょう。"
          - who: captain
            say: "赤点が出たら試合に出られないぞって、もう三回言いました。"
      - lines:
          - who: player
            say: "監督、正直……バットより教科書のほうが重いです。"
          - who: captain
            say: "俺のノート貸してやるから、赤点だけは取るなよ。"
    choices:
      - stance: ease
        label: "練習を軽くして、勉強の時間をつくる"
        improve_prob: 1.0
      - stance: as_usual
        label: "いつも通り練習する"
        improve_prob: 1.0
    outcomes:
      - stance: ease
        result: improved
        effects:
          training_mult: 0.85
          training_weeks: 2
          trust: 2
        lines:
          - who: team_manager
            say: "全体練習は一時間で切り上げます。部室で勉強会をやるそうですよ。"
          - who: player
            name: "{player}"
            say: "数学、主将が教えてくれるらしいです。……スパルタらしいです。"
      - stance: as_usual
        result: improved
        effects:
          training_mult: 0.95
          training_weeks: 2
          trust: -1
        lines:
          - who: team_manager
            say: "練習はいつも通りです。……担任の先生から、ちょっと渋い顔をされました。"
          - who: player
            name: "{player}"
            say: "単語帳、ポケットに入れてノック受けてます。"

