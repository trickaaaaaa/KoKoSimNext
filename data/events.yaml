            say: "{player}のスイングが、先週までとは別人になっていた。"
      - lines:
          - who: player
            say: "監督、なんか……分かった気がします。うまく言えないんですけど。"
          - who: manager
            say: "いいぞ。その感じを忘れるな。"
      - lines:
          - who: captain
            say: "{player}、化けましたね。夏前にこれは大きい。"
          - who: team_manager
            say: "本人が一番驚いてる顔してますよ。"

  - id: growth_awakening_pitching
    kind: System
    scene: ground
    text: "選手が投球で覚醒した。"
    variants:
      - lines:
          - who: narration
            say: "ブルペンのミットの音が、ひとりだけ重い。"
          - who: team_manager
            say: "{player}君、今日の球、受けてる子が手を振ってました。"
      - lines:
          - who: player
            say: "監督、指にかかる感じが全然違うんです。"
          - who: manager
            say: "もう何球か見せてくれ。"
          - who: narration
            say: "続けて投げた球も、同じ軌道でミットに収まった。"
      - lines:
          - who: captain
            say: "{player}の球、打撃投手に入ってもらったら誰も前に飛ばせませんでした。"
          - who: team_manager
            say: "記録、つけておきますね。"

