            say: "監督、来年の練習メニュー、一度全部見直しませんか。"
          - who: manager
            say: "そうしよう。"
      - lines:
          - who: captain
            say: "監督。……来年は、勝ちましょう。"
          - who: manager
            say: "ああ。まず俺が直す。"

  - id: mgr_seminar
    kind: System
    text: "指導者講習会に参加した。"
    variants:
      - lines:
          - who: narration
            say: "オフの週末、他校の監督たちに混じって、また生徒の側に座っている。"
          - who: team_manager
            say: "講習、どうでしたか。"
          - who: manager
            say: "半分は知っていた。残り半分が収穫だ。"
          - who: team_manager
            say: "その半分、今度教えてください。"
      - lines:
          - who: team_manager
            say: "監督、講習の資料、部室に置いてありましたよ。読んでいいですか。"
          - who: manager
            say: "もちろん。"

  - id: mgr_pro_ob
    kind: System
    text: "プロOBが訪ねてきた。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、プロにいらしたOBの方が見えています。「この子ら、いい体になってきましたね」と。"
          - who: manager
            say: "どこを見てそう思う？　あとで教えてくれ。"
          - who: team_manager
            say: "お願いしたら、まず下半身だそうです。"
      - lines:
          - who: team_manager
            say: "監督、プロだったOBの方が、「現役の頃は、こうやって見られる側だったんですけどね」と笑っていました。"
          - who: captain
            say: "監督、あの人、本当にプロだった人ですか。"

  - id: mgr_mentor
    kind: System
    text: "名伯楽との出会いがあった。"
    variants:
      - lines:
          - who: narration
            say: "全国の常連校を三度率いた老将が、ふらりとグラウンドに現れた。"
          - who: team_manager
            say: "監督、二時間も話し込んでましたね。"
      - lines:
          - who: team_manager
            say: "監督、老監督が、「教えられることは何もない。ただ、私が間違えたことなら話せます」と。"
          - who: manager
            say: "それが一番聞きたい。そう伝えてくれ。"

  # 気づき: 成長タイプの見立て（設計書03 §5.6・issue #614）。
  # **断定しない**（育成眼が低いと読み違える）。会話も「かもしれない」の温度で書く。
  - id: insight_growth_type
    kind: System
    text: "選手の成長タイプに見当がついた。"
    variants:
      - lines:
          - who: narration
            say: "{player}が、冬に入ってから急に伸びてきていた。"
          - who: manager
            say: "去年の測定と並べてみてくれ。"
      - lines:
          - who: narration
            say: "同じ練習をしていても、伸びる時期は選手ごとに違う。"
          - who: narration
            say: "{player}の測定値を去年から辿ると、形が見えてきていた。"
      - lines:
          - who: team_manager
            say: "{player} の見立て、当たってますかね。"
          - who: manager
            say: "半分は勘だ。"
          - who: team_manager
            say: "その半分が当たるようになりましたよ。"

  # 特殊能力の変化（issue #1471・設計書10 §3）。何のスキルかは結果行（SkillChangeText）が言い切る＝会話は雰囲気だけ。
  # 気づき（育成眼）で隠しスキルを即開示／覚醒で身につく／公式戦の活躍で身につく／負スキルの克服（実戦・学年）。
  - id: skill_insight_revealed
    kind: System
    text: "選手の隠れた持ち味に気づいた。"
    variants:
      - lines:
          - who: narration
            say: "練習を眺めていて、{player}の動きに引っかかるものがあった。"
          - who: team_manager
            say: "{player} の、あれって前からですか？"
      - lines:
          - who: team_manager
            say: "監督、{player} のスコア付けてて気づいたんですけど。"
          - who: team_manager
            say: "ほら、ここ。同じことが何度も起きてるんです。"
      - lines:
          - who: narration
            say: "ビデオを止めては戻す。{player}だけ、他の部員と違うところがあった。"
          - who: player
            say: "え、俺そんなことしてます？"

  - id: skill_awakening
    kind: System
    text: "覚醒した選手が新しい持ち味を身につけた。"
    variants:
      - lines:
          - who: narration
            say: "伸びただけではなかった。{player}のプレーに、新しい色が加わっていた。"
          - who: player
            say: "なんか、急に分かったんです。"
      - lines:
          - who: captain
            say: "{player}、最近ちょっと別人だよな。"
          - who: player
            say: "自分でもびっくりしてる。"

  - id: skill_match_acquired
    kind: System
    text: "公式戦の活躍で選手が新しい持ち味を身につけた。"
    variants:
      - lines:
          - who: narration
            say: "公式戦の緊張の中でつかんだものは、練習では手に入らない。"
          - who: player
            say: "あの試合で、何かつかめた気がします。"
      - lines:
          - who: team_manager
            say: "{player}、試合のあとずっとニヤニヤしてますよ。"
          - who: narration
            say: "大一番での手応えが、{player}の中に残っていた。"

  - id: skill_overcome_match
    kind: System
    text: "公式戦の活躍で選手が弱点を克服した。"
    variants:
      - lines:
          - who: narration
            say: "苦手だった場面を、{player}は自分の力で越えてみせた。"
          - who: player
            say: "もう、あれは怖くないです。"
      - lines:
          - who: captain
            say: "{player}、今日は堂々としてたな。"
          - who: player
            say: "前の自分なら崩れてたと思う。"

  - id: skill_overcome_grade
    kind: System
    text: "学年が上がり、選手が弱点を克服した。"
    variants:
      - lines:
          - who: narration
            say: "学年が上がって、{player}の顔つきが変わった。"
          - who: team_manager
            say: "{player}、去年とは別人みたいですね。"
      - lines:
          - who: narration
            say: "冬を越えて、{player}は体も心もひと回り大きくなっていた。"
          - who: player
            say: "去年の自分には戻りたくないです。"

  # ドラフト（設計書20・issue #617）。候補入り・スカウト視察（評価上昇）・指名確定。
  # 主役は3年の選手。指名の可否そのものは engine が決めており、ここは提示だけ。
  - id: draft_candidate
    kind: System
    text: "選手がドラフト候補に挙がった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、{player} の名前が候補に載っています。地元紙にも出ていました。"
          - who: manager
            say: "本人には俺から言う。"
      - lines:
          - who: narration
            say: "部室の壁に貼られた新聞の切り抜きに、見慣れた名前が混じっている。"
          - who: captain
            say: "{player}、お前これ、見た？"
      - lines:
          - who: player
            say: "監督、自分……候補って、本当ですか。"
          - who: manager
            say: "本当だ。今日の練習は昨日と同じだぞ。"
          - who: player
            say: "はい！"

  - id: draft_scout_visit
    kind: System
    text: "スカウトが視察に来た。"
    variants:
      - lines:
          - who: scout
            say: "今日はお邪魔します。……いい体してますね、あの子。"
          - who: team_manager
            say: "本人には言わないでやってください。まだ夏が残ってるんで。"
      - lines:
          - who: scout
            say: "{player} 君、去年の秋から見ています。肩の強さは高校で上位です。"
          - who: manager
            say: "本人の前では控えめにお願いします。"
          - who: scout
            say: "承知しています。"
      - lines:
          - who: narration
            say: "ネット裏に、明らかに保護者ではない大人がひとり座っている。"
          - who: team_manager
            say: "……三人目ですね、今週。"

  # スカウトの節目（issue #1035）。操作が要る場面を見落とさせないための強制イベント。
  # 出すかどうかと週は ScoutMilestones（engine）が1箇所で決める。
  # IDは ScoutMilestones / ScoutPitch の定数と一致させる（EventTableTests が固定）。
  #
  # スカウトの一年の入口（issue #1064）。夏の大会後に、会話の中で①スカウト網の契約 → ②探す分野、の順に選ぶ。
  # 選択肢（契約の段・分野）は ScoutPitch（engine）が持ち、ここには会話だけを書く。画面は移らない。
  # 監督には台詞を持たせない（選ぶだけ）。
  # scout_choose_field＝契約済みの学校への入口（契約を続けるか）／scout_contract_offer＝未契約の学校への入口。
  - id: scout_choose_field
    kind: System
    text: "スカウトが、今年の契約を聞きに来た。"
    variants:
      - lines:
          - who: scout
            say: "監督、今年もうちに任せてもらえます？ 去年の領収書は、見ないでおきましょう。"
          - who: team_manager
            say: "見てください。部費の話です。"
      - lines:
          - who: narration
            say: "スカウトが、ぶ厚い手帳を机に広げた。ページの半分は、去年の言い訳だった。"
          - who: scout
            say: "今年こそ当てます。……その前に、契約はどうします？ 続けるなら、段も選べます。"
      - lines:
          - who: scout
            say: "夏も終わりましたし、そろそろ今年の話をしましょう。まずは契約からです。"
          - who: team_manager
            say: "お金の話を、いちばん最初にするんですね。"
          - who: scout
            say: "大事なことは、先に言っておく主義です。"

  - id: scout_contract_offer
    kind: System
    text: "スカウトが、契約の相談に来た。"
    variants:
      - lines:
          - who: scout
            say: "監督、うちもそろそろスカウトを雇いませんか。いい子は、待っていても来てくれません。"
          - who: team_manager
            say: "営業トークが、急に上手くなりましたね。"
      - lines:
          - who: narration
            say: "スカウトが、知らない中学校の名前でびっしり埋まった手帳を机に置いた。"
          - who: scout
            say: "契約してもらえたら、ここを回ります。契約しませんか。"
      - lines:
          - who: scout
            say: "今年こそ、スカウトを付けませんか。段は選べます。安い順に、足も短くなりますけど。"
          - who: team_manager
            say: "足の長さで、値段が決まるんですね。"

  - id: scout_contract_declined
    kind: System
    text: "スカウト網は、今年は契約しないことになった。"
    variants:
      - lines:
          - who: scout
            say: "了解です。今年は、いつもどおり入ってくる子を待ちましょう。"
          - who: team_manager
            say: "いつもどおり、一番ありがたいやつですね。"
      - lines:
          - who: scout
            say: "分かりました。リストは作りません。手帳は、しまっておきます。"
          - who: narration
            say: "手帳は、鞄の底へ戻っていった。"
      - lines:
          - who: scout
            say: "そうですか。……来年、また聞きますからね。"
          - who: team_manager
            say: "しつこいですね。"

  - id: scout_field_ask
    kind: System
    text: "スカウトが、探す分野を聞きに来た。"
    variants:
      - lines:
          - who: scout
            say: "契約、ありがとうございます。どんな子を探しましょう。投球でも、打撃でも、足でも。"
          - who: team_manager
            say: "うちに足りない所から、でいいんじゃないでしょうか。"
          - who: scout
            say: "それが分かれば、苦労しないんですけどね。"
      - lines:
          - who: scout
            say: "では、どの分野を中心に見るか決めてください。"
          - who: team_manager
            say: "決めないと、全部見ることになります。つまり、全部が浅くなります。"
      - lines:
          - who: scout
            say: "分野を決めてもらえれば、そこを重点的に回ります。決めなければ、おまかせです。"
          - who: team_manager
            say: "おまかせって、スカウトさんの好みですよね。"
          - who: scout
            say: "……否定はしません。"

  - id: scout_field_done
    kind: System
    text: "スカウトが、10月にリストを持ってくることになった。"
    variants:
      - lines:
          - who: scout
            say: "承知しました。10月にリストを持ってきます。それまでは、足で稼ぎます。"
      - lines:
          - who: scout
            say: "では、10月に。リストは、封筒に入れて持ってきます。"
          - who: team_manager
            say: "封筒じゃなくても、いいですよ。"
      - lines:
          - who: scout
            say: "10月です。10月には、リストをお見せします。……たぶん。"
          - who: team_manager
            say: "たぶん、ですか。"

  - id: scout_list_arrived
    kind: System
    text: "スカウトが候補のリストを持ってきた。"
    variants:
      - lines:
          - who: narration
            say: "スカウトが、封筒の束を抱えて部室に駆け込んできた。"
          - who: scout
            say: "監督、リストが届きました。今年の候補です。"
          - who: team_manager
            say: "誰から会いに行くか、決めないといけませんね。"
      - lines:
          - who: scout
            say: "お待たせしました。中学生のリスト、ここに全部あります。"
          - who: manager
            say: "多いな。"
          - who: team_manager
            say: "全員は口説けませんからね。枠があるので。"
      - lines:
          - who: narration
            say: "机に置かれたリストの端に、コーヒーのしみがついている。"
          - who: scout
            say: "しみのところの子は、たぶん大丈夫です。"
          - who: team_manager
            say: "たぶん、ですか。"

  - id: scout_deadline
    kind: System
    text: "スカウトが、訪問の期限を知らせに来た。"
    variants:
      - lines:
          - who: scout
            say: "監督、そろそろ決めないと、三月に間に合いません。"
          - who: team_manager
            say: "三月は、思っているより早く来ます。"
      - lines:
          - who: narration
            say: "カレンダーの三月に、スカウトが赤丸をつけた。丸は三重だった。"
          - who: scout
            say: "訪問できる時間も、あとわずかです。"
          - who: manager
            say: "今日、決める。"
      - lines:
          - who: scout
            say: "口説き残しはありませんか。中学生は待ってくれても、三月は待ってくれません。"
          - who: team_manager
            say: "どっちも待ってくれない気がします。"

  # 年契約の更新（issue #1034）。年額が引かれる年度の総括の前週に、契約中の年契約の段を選び直させる。
  # 出すかどうかと週は ContractRenewal（engine）が1箇所で決める。会話の後は更新の画面（段を1枚ずつ選ぶ）へ。
  # IDは ContractRenewal.EventId と一致させる（EventTableTests が固定）。
  - id: contract_renewal
    kind: System
    text: "年契約の更新の季節になった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、今年も契約の更新の時期です。去年の領収書、見ましたか。"
          - who: scout
            say: "見ない方が、幸せなことも世の中にはあります。"
          - who: team_manager
            say: "見てください。部費の話です。"
      - lines:
          - who: narration
            say: "マネージャーが、年契約の書類をクリアファイルごと机に置いた。ファイルの角が少し折れている。"
          - who: team_manager
            say: "続けるのも、見直すのも、今日決められます。何も決めなければ、今のまま続きます。"
          - who: scout
            say: "つまり、黙っていても払うってことですね。"
      - lines:
          - who: scout
            say: "更新ですか。うちは今のままで、お願いしたいところですが。"
          - who: manager
            say: "順番に見ていく。"
          - who: team_manager
            say: "お願いする相手は、スカウトさんじゃなくて部費です。"

  - id: draft_nominated
    kind: System
    text: "教え子に指名がかかった。"
    variants:
      - lines:
          - who: narration
            say: "電話が鳴った。部室の全員が、一斉に振り向いた。"
          - who: player
            say: "……監督。呼ばれました。"
          - who: narration
            say: "部員たちの声で、あとの言葉は聞こえなかった。"
      - lines:
          - who: player
            say: "監督。……行ってきます。"
          - who: manager
            say: "ああ。よくやった。"
      - lines:
          - who: team_manager
            say: "うちから指名者が出るなんて。監督、泣かないでくださいよ。"
          - who: captain
            say: "マネージャーのほうが泣いてますって。"

  - id: draft_missed
    kind: System
    text: "教え子の指名は無かった。"
    variants:
      - lines:
          - who: narration
            say: "最後の名前が読み上げられて、テレビが野球以外の話題に移った。"
          - who: team_manager
            say: "……よく三年、続けましたね。"
      - lines:
          - who: player
            say: "監督、すみません。……呼ばれませんでした。"
          - who: manager
            say: "謝ることじゃない。"
          - who: captain
            say: "そうだぞ。呼ばれるところまで来たんだ。"

  # プロ入りOBの挨拶訪問（設計書03 §5.1・issue #1469 O2）。指名された年に一時金が部費へ入る
  # （1位100／2〜3位70／4〜7位50／育成30万。額は coefficients.yaml career.pro_donation_*）。
  # 結果行（部費 ＋N 万）は提示層が足す。指名1人につき1回、draft_nominated の後に出る。
  - id: draft_ob_greeting
    kind: System
    text: "プロ入りの挨拶とともに、OB会から祝い金が届いた。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、{player} くんの指名のお祝いだって、OB会の方が見えています。"
          - who: narration
            say: "差し出された封筒には「後輩たちの道具に」と書き添えてあった。"
          - who: player
            say: "……俺、まだ何もしてないんですけど。"
      - lines:
          - who: narration
            say: "{player} が契約の挨拶に部室へ顔を出した。後ろにOB会長が、のし袋を持って立っていた。"
          - who: team_manager
            say: "「プロを出した部には、OBも張り切るんですよ」だそうです。"
      - lines:
          - who: captain
            say: "監督、{player} 先輩のプロ入りで、OBの方々から寄付が集まったそうです。"
          - who: team_manager
            say: "電話が鳴りっぱなしでしたよ。今日だけで三回、同じ話を聞きました。"

  # 夏の敗退直後の3年引退（issue #954）。終わり方の3通りで会話を分ける（優勝の年に敗戦の台詞を出さない）。
  # 呼び出し元は大会の後始末（HomeState.DismissResult）。この会話を読んだあとに主将指名 → 背番号決定へ進む。
  - id: summer_retirement_prefecture
    kind: System
    text: "夏の県予選で敗退。3年生が引退した。"
    variants:
      - lines:
          - who: narration
            say: "最後のミーティング。三年生が一人ずつ、背番号を返しに来た。"
          - who: player
            name: "三年生"
            say: "アイロンはかけてきました。ほつれも自分で直しました。"
          - who: team_manager
            say: "直したところ、ガタガタですね。……三年分の味ってことにしておきます。"
          - who: player
            name: "二年生"
            say: "先輩、明日も練習来ていいですからね。"
          - who: player
            name: "三年生"
            say: "受験生にそれ言う？"
          - who: narration
            say: "最後のミーティングは、だいたい笑って終わった。"
      - lines:
          - who: narration
            say: "球場から戻ったグラウンド。三年生が、誰に言われるでもなくトンボを手に取った。"
          - who: player
            name: "二年生"
            say: "今日くらい、俺らがやりますよ。"
          - who: player
            name: "三年生"
            say: "最後くらいやらせてよ。"
          - who: player
            name: "二年生"
            say: "……先輩、トンボの跡がまっすぐじゃないです。"
          - who: player
            name: "三年生"
            say: "最後の日まで言われるのか。"

  - id: summer_retirement_koshien
    kind: System
    text: "{koshien}で敗退。3年生が引退した。"
    variants:
      - lines:
          - who: narration
            say: "{koshien}のベンチの前。三年生がしゃがみこんで、黒い土をかき集めている。"
          - who: player
            name: "三年生"
            say: "これ、どのくらい持って帰っていいんですかね。"
          - who: team_manager
            say: "袋一つまでです。ポケットに入れてるのも見えてますよ。"
          - who: player
            name: "三年生"
            say: "……ばれてた。"
          - who: narration
            say: "宿舎へ戻るバスの中、三年生の靴からは、ずっと{koshien}の砂がこぼれていた。"
      - lines:
          - who: narration
            say: "宿舎での最後のミーティング。背番号が一枚ずつ、机の上に戻ってきた。"
          - who: player
            name: "三年生"
            say: "{koshien}の土がしみ込んでるんで、このまま返していいですか。"
          - who: team_manager
            say: "きれいにしてから返してください。"
          - who: player
            name: "二年生"
            say: "先輩たちの続き、来年もここでやりますから。"
          - who: narration
            say: "背番号は結局、全部きれいになってから返ってきた。"

  - id: summer_retirement_champion
    kind: System
    text: "{koshien}で優勝。3年生が最後まで勝って引退した。"
    variants:
      - lines:
          - who: narration
            say: "閉会式のあと。三年生が、ベンチの前で土を袋に詰めている。"
          - who: player
            name: "三年生"
            say: "勝った年も、土って持って帰っていいんでしたっけ。"
          - who: team_manager
            say: "いいと思います。負けた人より堂々と持って帰ってください。"
          - who: player
            name: "二年生"
            say: "先輩、来年の分も少し残しておいてください。"
          - who: narration
            say: "最後まで一度も負けなかった夏が、こうして終わった。"
      - lines:
          - who: narration
            say: "宿舎での最後のミーティング。三年生が、優勝した背番号を一枚ずつ返しに来た。"
          - who: player
            name: "三年生"
            say: "これ、額に入れて飾るとかじゃないんですか。"
          - who: team_manager
            say: "来年も使うんです。次に着る子が泣いて喜びますよ。"
          - who: player
            name: "二年生"
            say: "プレッシャーしかないです。"
          - who: narration
            say: "負けずに引退した三年生たちは、最後まで少し落ち着かない顔をしていた。"

  # マネージャーの引き継ぎ（design-04 §1.3a・issue #1430）。3年の夏の引退の会話（summer_retirement_*）の
  # 直後に続けて積まれる。引退する側（who: team_manager_outgoing）と新しい側（who: team_manager）の両方が話す。
  - id: team_manager_succession
    kind: System
    text: "マネージャーが引退し、新しいマネージャーに引き継がれた。"
    variants:
      - lines:
          - who: narration
            say: "引退したマネージャーが、得点板の鍵と分厚いノートを机に置いた。"
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "鍵は三番目の引き出し。アイシングは多めに頼むこと。"
          - who: team_manager
            name: "新しいマネージャー"
            say: "多めに、ですね。メモします。"
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "ノートの最後のページ、まだ何も書いてないから好きに使って。"
          - who: narration
            say: "新しいマネージャーは、まず自分の名前をそこに書いた。"
      - lines:
          - who: narration
            say: "部室の棚で、ボール拾いの籠と記録用紙の束が引き継がれていく。"
          - who: player
            name: "主将"
            say: "三年間、ありがとうございました。"
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "泣かないので、今は。"
          - who: team_manager
            name: "新しいマネージャー"
            say: "……よろしくお願いします。"
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "声、もう少し大きく。グラウンドじゃ届かない。"
      - lines:
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "スコアの付け方、最初は誰でも間違える。気にしないで。"
          - who: team_manager
            name: "新しいマネージャー"
            say: "先輩も間違えましたか。"
          - who: team_manager_outgoing
            name: "引退するマネージャー"
            say: "初日、全員の出塁を三振って書いた。"
          - who: narration
            say: "新しいマネージャーは、記録用紙をもう一度だけ丁寧に見直した。"

  # --- 赴任イベントとチュートリアル（issue #1496・design-04 §3.4） ---
  # どれも System。出すかどうかと順番は engine の Tutorial（KokoSim.Engine.Career）が1箇所で決める。
  # 赴任イベント: 「はじめから」で新設校を作った直後（1年のマネージャー）と、転任の直後（2年か3年のマネージャー）。
  # チュートリアル: 「はじめから」の進行だけ。場面が初めて来たときにマネージャーが一言ずつ教える。
  # 会話の最後に「分かった／もう説明はいらない」を提示層が足す（yaml の choices: ではない＝監督の対応ではないため）。
  # 監督は聞き役（台詞は持たないか短い相槌まで）。画面の名前（「今週を進める」「練習」など）は実際のボタン・タブの文字に合わせる。
  - id: arrival_new_school
    kind: System
    text: "監督として新設の野球部に着任した。"
    variants:
      - lines:
          - who: narration
            say: "{school}野球部、創部の初日。グラウンドの隅に、真新しいベンチがひとつだけ置かれている。"
          - who: team_manager
            say: "監督！お待ちしていましたよ！"
          - who: team_manager
            say: "マネージャーをやります、1年です。部員もみんな1年なので、先輩はひとりもいません！"
          - who: manager
            say: "よろしく頼む。"
          - who: narration
            say: "ベンチの上に、まだ何も書かれていないスコアブックが一冊、置いてあった。"
      - lines:
          - who: team_manager
            say: "監督！お待ちしていましたよ！"
          - who: narration
            say: "部室の鍵はまだ新しく、回すと固い音がした。"
          - who: team_manager
            say: "ボールは段ボール三箱ぶん、バットは十二本。部員は全員1年生です。"
          - who: team_manager
            say: "何もないところからですけど、{koshien}、目指しましょうね！"
      - lines:
          - who: narration
            say: "創部の初日。グラウンドには、部員と同じくらいの数の石が転がっていた。"
          - who: team_manager
            say: "あ、監督！お待ちしていましたよ！ いま、みんなで石拾いをしてて。"
          - who: player
            say: "監督、よろしくお願いします！ これ、どこに捨てればいいですか！"
          - who: team_manager
            say: "最初の指示が、それになっちゃいましたね。"

  - id: arrival_transfer
    kind: System
    text: "監督として新しい学校に着任した。"
    variants:
      - lines:
          - who: narration
            say: "{school}野球部の部室。壁の寄せ書きには、歴代の部員の名前がびっしり並んでいる。"
          - who: team_manager
            say: "{manager}監督ですね。お噂はかねがね…"
          - who: team_manager
            say: "マネージャーです。部のことで分からないことがあれば、何でも聞いてください。"
          - who: captain
            say: "監督、よろしくお願いします！"
      - lines:
          - who: team_manager
            say: "お噂はかねがね。今日からよろしくお願いします、{manager}監督。"
          - who: team_manager
            say: "部員の名簿と、去年のスコアブックは机の上にまとめておきました。"
          - who: manager
            say: "助かる。"
          - who: narration
            say: "名簿の最後のページに、付箋で「新しい監督へ」と書いてあった。"
      - lines:
          - who: narration
            say: "グラウンドに入ると、ノックの音がぴたりと止んだ。"
          - who: team_manager
            say: "全員、集合！ 新しい監督がいらっしゃいました！"
          - who: team_manager
            say: "お噂はかねがね、です。みんな、ちょっと緊張してます。"
          - who: player
            say: "どんな練習するんだろうな。"
          - who: narration
            say: "誰かの小声が、静かなグラウンドに思ったより大きく響いた。"

  # 赴任直後の説明。最初に要ることだけ（週の送り方・練習の決め方）。
  - id: tutorial_basics
    kind: System
    text: "マネージャーから、部の進め方を教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、部の進め方を少しだけ説明させてください。"
          - who: team_manager
            say: "画面の上の「今週を進める」を押すと、1週間が進みます。練習も試合も、出来事も、全部この1週間ごとです。"
          - who: team_manager
            say: "その週に何を練習するかは「練習」で決めます。部員ひとりずつ、どの練習に何分使うか割り当てられます。"
          - who: team_manager
            say: "特に伸ばしたい子は、個別指導に指名すると伸びが良くなります。枠は限られてますけど。"
          - who: team_manager
            say: "決めた練習は毎週続きます。まずは練習を決めて、今週を進めてみましょう！"

  # 初めての公式戦の前（大会の開幕）。
  - id: tutorial_first_tournament
    kind: System
    text: "マネージャーから、大会の流れを教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、いよいよ公式戦です！ 大会の流れを説明しますね。"
          - who: team_manager
            say: "大会中は週ではなく1日ずつ進みます。試合の日が来たら、試合をするか確認が出ます。"
          - who: team_manager
            say: "試合に出られるのは、背番号をもらったベンチ入りの選手だけです。背番号は「メンバー」で決められます。"
          - who: team_manager
            say: "試合の前にはスタメンと打順を決める画面が出ます。誰をどこで使うかは、監督が決めてください。"
          - who: team_manager
            say: "負けたらそこで大会は終わりです。一戦ずつ、いきましょう！"

  # 初めての試合の前。公式戦・練習試合を問わず最初の1試合で出す（公式戦は開始確認の前、練習試合はスタメン設定の前にホームで）。
  - id: tutorial_first_match
    kind: System
    text: "マネージャーから、試合での采配を教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "試合の前に、采配のことを少しだけ。"
          - who: team_manager
            say: "攻撃のときは、打者ごとにサインを出せます。バント、盗塁、エンドラン……何も出さなければ打たせます。"
          - who: team_manager
            say: "ピンチや流れの悪いときは「タイム」から伝令を送れます。回数に限りがあるので、使いどころが大事です。"
          - who: team_manager
            say: "選手交代もタイムからです。疲れた投手の交代や、代打、守備固めができます。"
          - who: team_manager
            say: "全部任せたいときは「スキップ（委任）」で、残りの采配をお任せにできます。最初は気楽にどうぞ！"

  # 初めてのスカウトの時期（夏の後・スカウトの契約の会話の前）。
  - id: tutorial_scouting
    kind: System
    text: "マネージャーから、スカウトと新入生のことを教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、来年の新入生の話です。"
          - who: team_manager
            say: "毎年4月には新入生が入ってきます。何もしなくても来てくれますけど、どんな子が来るかは運次第です。"
          - who: team_manager
            say: "スカウトさんと契約すると、10月に中学生の候補のリストを持ってきてくれます。"
          - who: team_manager
            say: "リストの中から、会いに行く子を「スカウト」で選んで口説きます。口説けた子が4月に入ってきます。"
          - who: team_manager
            say: "契約にはお金がかかります。部費と相談して決めてくださいね。"

  # 初めて部費で何か買えるようになった週。
  - id: tutorial_purchases
    kind: System
    text: "マネージャーから、部費の使い方を教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、部費の使い道の話です。"
          - who: team_manager
            say: "部費は「経営」で使えます。施設、練習道具、備品が買えます。"
          - who: team_manager
            say: "施設は部全体の練習の効率が上がります。練習道具は、その分野の練習にだけ効きます。"
          - who: team_manager
            say: "部費は毎年3月に、学校の予算や寄付で入ってきます。勝って名前が売れると、寄付も増えますよ。"
          - who: team_manager
            say: "使いすぎると合宿やスカウトの分が足りなくなるので、そこだけ気をつけてくださいね。"

  # 初めての夏の引退（引退の会話の後・主将指名の前）。
  - id: tutorial_summer_retirement
    kind: System
    text: "マネージャーから、新チームのことを教わった。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、毎年、夏の大会が終わると3年生は引退して、1・2年生の新チームになります。"
          - who: team_manager
            say: "まずは新チームの主将を決めます。主将がスタメンにいると、チーム全体が少しずつ締まります。ベンチに置いて、伝令で走らせる手もありますよ。"
          - who: team_manager
            say: "そのあと背番号を決め直します。秋の大会は、この新チームで戦います。"
          - who: team_manager
            say: "3年生は卒業まで部に籍がありますけど、もう試合には出ません。"

  # 「もう説明はいらない」を選んだときの返事（チュートリアルの会話の後ろに足す）。
  - id: tutorial_dismissed
    kind: System
    text: "これからは説明なしで進めることにした。"
    variants:
      - lines:
          - who: team_manager
            say: "分かりました！ これからは説明なしでいきますね。困ったら、いつでも聞いてください。"
      - lines:
          - who: team_manager
            say: "了解です。もう口うるさく言いません。……たぶん。"

  # 夏の甲子園（設計書05 §1.1a）。県大会を勝ち抜いた直後に、激励金 → 抽選会 の順で出る。
  # どちらも効果の数値は yaml に書かない＝呼び出し元（KoshienEntry）が実際に動いた額・
  # 実際に決まった相手で結果行を組む。
  - id: koshien_berth_donation
    kind: System
    text: "OB会と卒業生から{koshien}の激励金が届いた。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、OBの方が封筒を届けてくださいました。「遠征も宿も金がかかるでしょう。同期で集めました」だそうです。"
          - who: manager
            say: "ありがたく使わせてもらう。"
          - who: team_manager
            say: "封筒、思ったより厚いですよ。数えるの手伝ってください。"
      - lines:
          - who: narration
            say: "部室の机に、名前の並んだ紙が一枚と封筒がいくつも積まれていた。卒業生の名簿だった。"
          - who: captain
            say: "……知らない先輩の名前ばっかりです。"
          - who: team_manager
            say: "この学校で三年やった人たちですね。全員。"
      - lines:
          - who: team_manager
            say: "監督、後援会長さんが、商店街からも出してくださるそうです。十七年前のあの夏のポスターを、まだ店に貼っているからと。"
          - who: captain
            say: "十七年も貼ってあるんですか。"
          - who: team_manager
            say: "今年、貼り替えるそうですよ。"
      - lines:
          - who: team_manager
            say: "監督、OBの方が封筒を置いていかれました。「私は補欠で終わりました。だから、行く奴の靴代くらいは出したい」と。"
          - who: manager
            say: "必ず選手に届ける。"
          - who: narration
            say: "封筒には、背番号も何も書かれていなかった。"

  # 秋季地区予選のブロックリーグ戦（issue #772）を通過したとき、マネージャーが知らせる（issue #1133）。
  # 呼び出し元（HomeState.DismissResult）が結果行（ブロック順位つき）を組む。通過のときだけ出る。
  - id: district_league_qualified
    kind: System
    text: "秋季地区予選を通過した。県大会へ進む。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、通過しました！県大会です！"
          - who: captain
            say: "最終節の結果、間違いないんですか。"
          - who: team_manager
            say: "三回確認しました。四回目を今から確認します。"
      - lines:
          - who: team_manager
            say: "監督、ブロック突破です。表、何回見ても同じでした。"
          - who: captain
            say: "もう一回見せてください。"
          - who: team_manager
            say: "いいですけど、順位は逃げませんよ。"
      - lines:
          - who: narration
            say: "最終節が終わって、順位表が貼り出された。部員が壁の前に集まって動かない。"
          - who: player
            name: "二年生"
            say: "……上から数えたほうが早いですよね、これ。"
          - who: team_manager
            say: "早いです。県大会、行けます。"
      - lines:
          - who: team_manager
            say: "通過です、監督。県大会の出場校に、うちの名前が入りました。"
          - who: captain
            say: "ここからが本番ですね。"
          - who: team_manager
            say: "はい。でも今日の夕飯は少しだけ豪華にしていいですか。"

  - id: koshien_draw
    kind: System
    text: "{koshien}の組み合わせ抽選会が行われた。"
    variants:
      - lines:
          - who: narration
            say: "抽選会場の壇上で、主将が箱に手を入れる。会場のざわめきが一段落ちた。"
          - who: captain
            say: "……引きました。"
          - who: team_manager
            say: "監督、{koshien}の初戦の番号が出ます。"
      - lines:
          - who: team_manager
            say: "組み合わせ、出ましたよ。"
          - who: manager
            say: "山はどうだ。"
          - who: team_manager
            say: "厳しいほうです。でも、どこと当たっても同じでしょう。"
      - lines:
          - who: captain
            say: "監督、俺、手が震えて箱の中でくじを二回落としました。"
          - who: narration
            say: "笑い声が起きて、それから全員が黙って掲示板を見上げた。"
      - lines:
          - who: narration
            say: "宿舎に戻ると、部員たちが新聞の組み合わせ表を囲んで頭を突き合わせていた。"
          - who: player
            say: "マネージャー、この学校ってどんなチームですか。"
          - who: team_manager
            say: "明日、映像を用意します。今日はもう休んでくださいね。"

  - id: senbatsu_berth_donation
    kind: System
    text: "OB会と卒業生から{senbatsu}の激励金が届いた。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、OBの方が「冬の遠征は寒いでしょう。少ないですが足しにしてください」と。"
          - who: manager
            say: "助かります。"
          - who: team_manager
            say: "毛布代も出そうですね、これは。"
      - lines:
          - who: narration
            say: "年明けの部室に、振込明細の束が届いていた。差出人は卒業生の会だった。"
          - who: captain
            say: "……去年出た先輩たちもいますね。"
          - who: team_manager
            say: "選ばれた後輩に賭けたんでしょうね。"
      - lines:
          - who: team_manager
            say: "監督、後援会長さんが、{senbatsu}出場を街の掲示板に貼ってくださったそうです。"
          - who: captain
            say: "もう貼ったんですか。"
          - who: team_manager
            say: "気が早いですよね。でも「毎年これくらいでちょうどいい」だそうです。"

  - id: senbatsu_draw
    kind: System
    text: "{senbatsu}の組み合わせ抽選会が行われた。"
    variants:
      - lines:
          - who: narration
            say: "抽選会場のモニターに、地区名と校名が順に映し出されていく。"
          - who: captain
            say: "……出ました。"
          - who: team_manager
            say: "監督、{senbatsu}の初戦の相手です。"
      - lines:
          - who: team_manager
            say: "組み合わせ出ましたよ、監督。"
          - who: manager
            say: "初戦はどこだ。"
          - who: team_manager
            say: "去年の秋、県で当たった相手です。"
      - lines:
          - who: player
            say: "マネージャー、相手の映像ってもうありますか。"
          - who: team_manager
            say: "冬の間に集めておきました。明日から見ましょう。"

  - id: senbatsu_not_selected
    kind: System
    text: "{senbatsu}の選考発表があった。今年は選ばれなかった。"
    variants:
      - lines:
          - who: narration
            say: "{senbatsu}の出場校の発表。紙に、自分たちの校名は無かった。部室はしばらく静かだった。"
          - who: captain
            say: "……夏で見返します。"
          - who: team_manager
            say: "その言葉、忘れないでくださいね。"
      - lines:
          - who: team_manager
            say: "監督、{senbatsu}は選外でした。"
          - who: manager
            say: "次で取り返す。"
          - who: player
            say: "はい。"
      - lines:
          - who: narration
            say: "{senbatsu}の選考発表。掲示板の前で部員が肩を落としている横を、他校の歓声が通り過ぎていった。"
          - who: captain
            say: "悔しいです、正直。"
          - who: team_manager
            say: "悔しいうちは伸びますよ。次の練習からです。"

  # 「エースの違和感」（ace_hidden_injury）は選択肢も効果も無いまま出ていたので削除（2026-11-23 作らないと決定・#1477）。

  # --- 選手間イベント（選択肢つき・issue #945・設計書23 §3.3） ---
  # 会話の最後に監督の対応を3択で出す（choices:）。監督は選ぶだけで、台詞は持たない。
  # 好転か悪化かは「選んだ対応×当事者（{player}）の性格4軸×主将の統率力」の確率で引き
  # （EventChoiceResolver・係数は coefficients.yaml cohesion:）、outcomes: の会話を続けて結束を上下させる
  # （好転 +3／悪化 −5）。結果行（結束が動いた1文）は yaml に書かない＝提示層が足す。
  # cast: は当事者 {player} と相手 {other} の選び方。条件に合う部員が居ない週は抽選に載らない。
  # 主将は当事者にも相手にもならない（「主将に任せる」の相手が本人になる会話を作らない）。
  - id: skipping_practice
    kind: Choice
    weight: 1.0
    cooldown_weeks: 12
    text: "主力が練習をサボっているらしい。"
    variants:
      - lines:
          - who: team_manager
            say: "監督、{player} くんがまた練習の途中で消えました。今週3回目です。"
          - who: player
            say: "さっき裏門のほうに走っていくの見ましたよ。めっちゃいいフォームで。"
          - who: team_manager
            say: "その足、ベースランニングで使ってほしいんですけどね。"
      - lines:
          - who: captain
            say: "監督、{player} なんですけど、最近ずっと『腹が痛い』って言って帰るんです。"
          - who: captain
            say: "でも昨日、駅前のラーメン屋に並んでました。大盛りの食券握って。"
          - who: team_manager
            say: "お腹、むしろ強いじゃないですか。"
      - lines:
          - who: narration
            say: "全体練習の輪に {player} の姿が無い。ベンチにグラブだけが置いてある。"
          - who: player
            say: "あいつ、グラブ置いとけば居ることになると思ってるんすよ。"
          - who: team_manager
            say: "出席を取りたいのは、グラブじゃなくて本人なんですけどね。"
    choices:
      - stance: scold
        label: "呼び出して、きっちり叱る"
      - stance: listen
        label: "まずはサボる理由を聞いてみる"
      - stance: captain
        label: "主将に任せる"
    outcomes:
      - stance: scold
        result: improved
        effects:
          trust: 2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: player
            name: "{player}"
            say: "……すみませんでした。明日から、ちゃんと来ます。"
          - who: narration
            say: "翌朝、{player} は誰よりも早くグラウンドにいた。トンボがけまで終わっていた。"
          - who: team_manager
            say: "え、こわ。急にどうしたんですか。"
      - stance: scold
        result: worsened
        effects:
          trust: -2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: player
            name: "{player}"
            say: "はいはい、分かりましたよ。"
          - who: narration
            say: "返事だけは良かった。次の日、{player} は来なかった。"
          - who: player
            say: "あいつ、部室で『めっちゃ怒られた』ってずっと言ってます。それだけ言って帰りました。"
          - who: team_manager
            say: "練習より先に、部室の空気が重くなりましたね。"
      - stance: listen
        result: improved
        effects:
          trust: 2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: player
            name: "{player}"
            say: "実は、バイトのシフトが勝手に増やされてて。店長に言えなくて……。"
          - who: team_manager
            say: "それ、言えばいいだけじゃないですか！ 一緒に言いに行きましょう。"
          - who: narration
            say: "次の週から、{player} は最後まで練習に残るようになった。店長は意外と話の分かる人だった。"
      - stance: listen
        result: worsened
        effects:
          trust: -2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: player
            name: "{player}"
            say: "別に、理由とかないっす。なんとなくっす。"
          - who: narration
            say: "30分話して、分かったのは「なんとなく」だけだった。"
          - who: team_manager
            say: "今日も『なんとなく』で帰りました。ブレないですね、あの子。"
      - stance: captain
        result: improved
        effects:
          trust: 2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: captain
            say: "おい {player}、明日から朝練は俺と行くぞ。家まで迎えに行くから。"
          - who: player
            name: "{player}"
            say: "え、家まで？ ちょっと怖いんですけど。"
          - who: narration
            say: "主将は本当に毎朝迎えに来た。{player} はそれから一度もサボっていない。"
      - stance: captain
        result: worsened
        effects:
          trust: -2          # 監督への信頼（issue #1270 E1: 好転 +2／悪化 −2）
        lines:
          - who: captain
            say: "{player}、頼むから来てくれよ。な？ な？"
          - who: player
            name: "{player}"
            say: "主将、それ毎日言ってますよね。"
          - who: narration
            say: "主将の頼み方は日に日に弱くなり、最後はジュースをおごる話になっていた。"
          - who: team_manager
            say: "交渉、完全に負けてますね。"

  - id: grade_friction
    kind: Choice
    weight: 1.0
    cooldown_weeks: 12
    text: "上級生と1年生がもめているらしい。"
    cast:
      subject: upper_grade
      other: first_year
    variants:
      - lines:
          - who: team_manager
            say: "監督、1年の {other} くん、毎日 {player} くんのスパイクを磨かされてるみたいです。"
          - who: player
            name: "{other}"
            say: "いえ、自分は全然大丈夫です。磨くの、ちょっと楽しくなってきたんで。"
          - who: team_manager
            say: "楽しくなっちゃダメなんですよ、それ。"
      - lines:
          - who: player
            name: "{player}"
            say: "監督、1年の {other} が、俺のことを先輩って呼ばないんですよ。"
          - who: player
            name: "{other}"
            say: "だって {player} さん、ノックで俺より捕ってないじゃないですか。"
          - who: captain
            say: "どっちもやめろ。部室の酸素が薄くなる。"
      - lines:
          - who: narration
            say: "部室の冷蔵庫に紙が貼ってある。『2年生以上専用』。その下に小さく『1年も金出してます』。"
          - who: team_manager
            say: "{player} くんと {other} くん、冷蔵庫の件で3日口きいてないです。"
          - who: player
            say: "麦茶ひとつでここまで揉めるの、うちくらいですよ。"
    choices:
      - stance: scold
        label: "二人まとめて叱る"
      - stance: listen
        label: "両方から言い分を聞く"
      - stance: captain
        label: "主将に収めてもらう"
    outcomes:
      - stance: scold
