# 苗字重みの圧縮指数（0<e<=1。issue #819）。語彙1,267種の生の占率を e 乗して上位偏重を平坦化し、
# たくさんの苗字が出るようにする（2026-11-08 監督指示）。0.6 で上位10姓の占有率 7.4%・上位50姓 22.9%・
# 2人の苗字が一致する確率 0.19%（30人の部で同姓の組は平均0.8組）。
# 旧語彙222種・圧縮なしは 26.8% / 63.9% / 1.26% / 5.5組。
family_weight_exponent: 0.6

# 名前重みの圧縮指数（0<e<=1）。小さいほど人気名の偏りが平坦になる。
# 語彙を377件→247件に絞った際、圧縮指数も見直しが必要か検討した（issue #530）。実測の合成順位
# 由来の生重みは、Zipfを合成して作った旧377件版より上位が僅差で並ぶ形状になり（複数年トップ100に
# 載り続ける名前が多数あるため）、指数0.5のままでも1位の実効出現率は約1%（40000回抽選シミュレーション
# で0.9〜1.0%、既存の0.5〜1.5%の許容帯を維持）に収まることを確認した。よって指数は0.5を据え置く
# （377件版と同じ値だが、語彙を絞ってもなお現実の男子名分布相当を保てたのは偶然ではなく、実測データ
# は人気上位の名前が僅差で並ぶ実相を反映しているため）。
given_weight_exponent: 0.5

