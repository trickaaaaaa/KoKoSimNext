# 選手フルネーム生成の語彙（設計書06 / 氏名生成, 不変条件#4）。
# engine/KokoSim.Engine/Season/PlayerNameData.cs のベイク既定と同内容のミラー。
# family_names: 全国名字ランキング上位1,267種（issue #819で222種から拡充。重み=全国占率%の近似）。
#               上位222種は公表値ベースの近似、以降は順位 r に対し 0.03×222/r（200位→1000位で占率が
#               約1/5になる実分布の傾きに合わせた順位減衰）。表示幅（姓3文字。#297）を超える4文字姓は入れない。
#               family_weight_exponent で圧縮してから抽選する。
# given_names : 2007〜2011年生まれ（＝2026年時点で15〜19歳）の男子名247種（issue #530で実測ベースに
#               組み直し）。明治安田生命「生まれ年別の名前調査」各年（2007/2008/2009/2010/2011）の
#               名前ベスト100の和集合を土台に、各年の合成順位（101-順位、複数年に載る名前ほど加点）
#               を重みとする。年代を跨いで実在した名前だけが残る＝昭和50年代〜平成一桁限定の名前
#               （誠・大介・学・剛・拓也・直樹・哲也・和也 等）や2018年以降に流行した名前
#               （律・碧・凪 等、湊の急伸も反映済み）は出典データに存在しないため自然に含まれない。
#               健太・翔太・翼・大樹・翔・大輝は世代をまたいで2007〜2011年にも実在するため残る。
#               given_weight_exponent で圧縮してから抽選する＝上位偏重の平坦化。
#               同一チーム内では下の名前が重複しないようリロールする（苗字の重複はOK）。
# KokoSim.Config.PlayerNamesLoader が読み込む。欠けたキーはエンジン既定にフォールバック。

