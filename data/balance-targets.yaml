  error_extra_advance_per_game: { min: 0.10, max: 0.80 }
  # 暴投・パスボール（design-14 P2-8, 設計書15 Phase D-3）: 実測≈0.56-0.59/試合（両軍計, seed42/2024）。
  wild_pitch_per_game: { min: 0.15, max: 1.00 }

# --- design-14 第1段（P1）: 采配Brain（StandardTacticsBrain, GameSimulation --tactics）ありでのみ発生する系 ---
# 敬遠・重盗・牽制は守備側/攻撃側の采配判断が引き金のため、Brain付きシミュレーションでのみ検証する
# （GameRegressionTests は無指示＝Brainなしのため、これらは通常の games_10k では常に0）。
# --- 低ティア・非対称マッチ（issue #536 / #578 Step 4） ---
# 既存4帯は「平均的なチーム同士」しか測っていない（games_10k の入力は N(50,12)・ティアも非対称も入力に無い）。
# そのため「開始直後の自校が格上に一方的にやられる」は**帯が全部緑のまま**起きた（#536 の実測）。
# ここは実プレイと同じ組み合わせ＝自校（ProspectGenerator 才能中心32・開始直後）を先攻に置き、
# 相手校（StrengthTeamFactory の強度指定）と当てて測る。守るのは「体験」＝完封され率と得点の勾配。
#
# 実測（400試合/マス × seed 42/7/2024・#578 Step 3 完了時点）:
#   E(40) 得点 6.61–6.97 ／ D(50) 4.07–4.43・完封され 7.0–9.0% ／ C(60) 2.62–2.69・完封され 17.7–20.5%
# 校正前（#578 着手前）は D(50) 2.50・21.2% ／ C(60) 1.39・40.3% で、下の帯を3指標とも外れる
# ＝勾配が元に戻ったら赤くなる。帯幅は seed 間のばらつき（±0.2点・±2%）の数倍を取った warn 相当。
tiers_low:
  manager_runs_vs_e40: { min: 5.5, max: 8.0 }          # 自校の得点（ほぼ互角の相手）
  manager_runs_vs_d50: { min: 3.2, max: 5.4 }          # 自校の得点（1ティア上）
  manager_runs_vs_c60: { min: 1.9, max: 3.6 }          # 自校の得点（2ティア上）
  manager_shutout_rate_vs_d50: { min: 0.02, max: 0.14 }  # 完封され率（1ティア上）。校正前 0.212
  manager_shutout_rate_vs_c60: { min: 0.08, max: 0.28 }  # 完封され率（2ティア上）。校正前 0.403
  # 表示1ティア（強度10ポイント）ごとの得点比＝勾配そのもの。校正前 0.42 → 校正後 0.61–0.67。
  # 上限は「差が出なさすぎ」の検出（育成しても勝敗に反映されない世界になっていないか）。
  runs_ratio_per_tier: { min: 0.52, max: 0.80 }

# --- 投打差の格子（issue matchup-gap-saturation-k-rate・2026-08-16） ---
# atbat_10k は平均同士（N(50,12)）しか測らず、Aランク投手が格下打線から平均24三振・四球ゼロを取る裾が帯を全部緑の
# まま通っていた。Balance `simulate --matchup-grid`（各マス6,000打席・投手=球速/制球/キレ同レベル・打者=ミート/
# 選球眼同レベル・パワー50）で検収する。機構は whiff_matchup_cap（投打差の対数オッズを cap×tanh(d/cap) で飽和）。
# 実測（cap=1.5・seed 42/7/2024）: P80vsB30 K% 44% ／ P80vsB45 41–43% ／ P90vsB30 46% ／ P50vsB45 22–23%（不変）／
# P35vsB75 被打率 .298–.309 ／ P80vsB30 被打率 .160–.171。校正前（線形）は P80vsB30 65%・P90vsB30 77%＝帯外。
# 四球率（P80vsB30 1%）は本 issue では動かしていない（ゾーン率×追いかけ率で決まり空振り飽和とは別軸＝OPEN-QUESTIONS）。
matchup_grid:
  strikeout_rate_p80_b30: { min: 0.30, max: 0.48 }   # A投手 vs F打者。線形時 0.65
  strikeout_rate_p80_b45: { min: 0.28, max: 0.46 }   # A投手 vs E打者。線形時 0.54
  strikeout_rate_p90_b30: { min: 0.32, max: 0.52 }   # S投手 vs F打者（裾の天井）。線形時 0.77
  strikeout_rate_p50_b45: { min: 0.17, max: 0.28 }   # 互角近傍は不変（0.22–0.23）
  average_p35_b75:        { min: 0.260, max: 0.360 } # 逆側の裾（F投手 vs B打者・パワー50）
  average_p80_b30:        { min: 0.120, max: 0.220 } # 格下でも当たれば飛ぶ余地。線形時 .098
  # 四球率の下限（issue walk-rate-floor-vs-elite-pitcher・2026-08-18）: 空振りの飽和とは別軸で、A/S投手は制球σが縮む一方
  # 「隅を狙う」が無くゾーン率 68% まで上がり四球が 1% に消えていた。制球連動の狙い散布（aim_spread_control_slope_per_point 0.008・
  # 高制球は隅へ散らし低制球は真ん中を狙う対称形）で P80/B30 3%・P90/B75 7%・互角 P50/B45 は 8% のまま（6,000打席×seed42/2024）。
  # 0.010 だと母集団（atbat_10k）の BB% が seed42 で 10.1% と天井を超えるので 0.008。
  walk_rate_p80_b30:      { min: 0.025, max: 0.08 }  # A投手 vs F打者。修正前 0.01
  walk_rate_p90_b75:      { min: 0.03, max: 0.13 }   # S投手 vs B打者。修正前 0.01
  walk_rate_p50_b45:      { min: 0.06, max: 0.10 }   # 互角近傍は不変（0.08）

games_10k_tactics:
  # 上限を 6.2→6.7 に一般帯（games_10k）と整合（issue #63, 2026-07-24）: #123 で守備力連動→失策失点増を
  # 許容して一般帯を 6.0→6.7 に拡張した際、この tactics 帯の更新が漏れていた（旧コメント「実測≈3.9-4.0」は
  # #123 以前の値で stale）。実測は Brainつき 6.22-6.26＜Brainなし 6.36-6.43＝brain の方が低いのに cap だけ
  # 厳しい不整合を解消。バウンド導入（#63）の押し上げは僅少で、一般帯 6.7 の範囲内。
  runs_per_team: { min: 3.3, max: 6.7 }
  # 牽制アウト: 実測≈0.001/試合（両軍計）。盗塁企図自体が稀（Brainの盗塁閾値依存）なため参考帯として広め。
  pickoff_per_game: { min: 0.0, max: 0.05 }
  # 敬遠: 実測≈0.06/試合（両軍計）。
  intentional_walk_per_game: { min: 0.01, max: 0.30 }
  # 一・三塁重盗: 実測≈0.002-0.003/試合（両軍計）。一・三塁で盗塁企図という稀な塁状況依存のため広め。
  double_steal_third_break_per_game: { min: 0.0, max: 0.05 }
  # --- 1球采配（design-15 Phase C-2, 2026-07-19校正）: 追い込まれ矯正/3-0待て/決め球切替の影響を最も受ける ---
  # 実測（StandardTacticsBrain, 10000試合×seed42/2024）: 三振≈19.1%, 四球≈8.2%, 本塁打≈2.85%（打席あたり）。
  # 天井 0.22→0.23（issue #525・監督承認 2026-08-08）。暴投・捕逸・振り逃げを着弾コースで抽選する
  # ようにした結果、これらが**別の球で**発生して下流の rng が再整列し、seed2024 が 22.03% と
  # 天井を +0.0003 だけ超えた（seed42 は 21.91% で帯内）。三振率は本修正と因果を持たない
  # （wild 0.035→0.033 で 22.03 のまま／drop 0.39→0.30 で 22.01 と、本修正の係数にほぼ非感応）＝
  # 係数では収められず、動かせるのは打撃/投球係数だけ＝本修正の範囲外。もともと両seedとも
  # 21.9〜22.0% で天井に張り付いており、境界のノイズを吸収する余裕が無かった。
  # 新しい天井は承認済みの atbat_10k.strikeout_rate.max（0.230・issue #403）と**同じ値**で、
  # tactics も同じ打撃/投球モデルなので整合する（#403 は「games 帯は緑なので据え置き」とした経緯）。
  strikeout_rate: { min: 0.16, max: 0.23 }
  walk_rate: { min: 0.06, max: 0.10 }
  # 本塁打率 0.020–0.036→0.010–0.022（issue homerun-rate-explodes-at-high-power, 2026-08-18。実測 1.48/1.54%）
  home_run_rate: { min: 0.010, max: 0.022 }

# --- Issue #120: 夏場の天候（気温）モデルを有効化したときの得点帯（決定3: 一般帯を外れた分の単独追加） ---
# 気温を物理層（空気密度ρ・投手消耗）だけに効かせて「夏場は点が動きやすい」を創発させる（不変条件#1）。
# GameSimulation を applyWeather:true で回した実測（2000試合×seed42/2024）: 得点/チーム 6.75–6.77。
# 控えめ係数（決定1=案B k=0.5・決定2=案A α=0.01・平均32℃/28〜36℃）でも一般帯（≤6.7）をわずかに上回るため、
# 夏場条件専用の帯として単独追加した（一般帯 games_10k は天候オフ＝ベースラインのまま非破壊）。
# 未指定の指標（球数・イニング等）は games_10k の一般帯を流用する（ParseGameSummer が土台にする）。
#
# Issue #318（ゴロ凡打の進塁打の物理レース化）で max を 7.1 → 7.25 へ広げた。
# 理由: 物理レースは分岐ごとに乱数消費数が変わる（自重=0回・送球=1回）ため下流ストリームが再シャッフルされ、
# seed2024 が 7.077 → 7.200 へ上振れした（seed42 は 6.981 で不変＝系統的な得点増でなく分布の揺れ）。
# 進塁の直接効果は微小で、校正ノブ advance_success_bias を 0.00〜−2.50 まで振っても 7.200→7.198 しか動かない
# ＝係数では収められない。決定論ベースライン再生成を伴う変更では再シャッフル自体が不可避なため帯側で吸収する。
# なお #120 校正時の実測 6.75–6.77 に対し main 実測が既に 7.077 まで漂流していた（上限まで 0.023）。
# この漂流の切り分けは別途（帯を広げても一般帯 games_10k ≤6.7 は非破壊のまま監視できる）。
#
# Issue #358（内野ゴロの固定1.58秒の引き戻し）で min/max を 6.4/7.25 → 5.70/6.60 へ下げた。
# 理由: 内野安打が出過ぎる原因だった守備側の水増し（捕球点で1.58秒＝実際の約2倍）をやめ、得点環境の
# 戻し分を判定側（force_out_margin_seconds 0.0→0.60）へ移した結果、得点環境が一段下がったため。
# 実測（2000試合×seed42/2024）:
#   平時 6.63/6.67 → 5.96/5.97 ／ 夏場 6.98/7.20 → 6.28/6.37
# 夏場帯は「平時＋天候分」の位置に置く帯なので、平時の低下と同じだけ平行移動させる（#120 の
# 「一般帯を土台に runs のみ上書き」という性格は変えない）。幅は従来と同じ（実測min−0.6／実測max+0.25）。
# 「夏場 ≥ 平時」は別assertで担保されているので、この帯は絶対水準だけを見る。
#
# Issue #532（外野フライ落球の難度連動）で min/max を 5.70/6.60 → 4.90/5.80 へ下げた。監督承認 2026-08-08。
# 理由: 過剰だった外野フライ落球（＝打者出塁＋失策連鎖付きで得点価値が高い）を凡打へ戻したため、得点生産が
# 構造的に下がった。総失策数を内野側の×1.29で保っても内野ゴロ失策は得点価値が低く、得点環境は戻らない。
# 実測（2000試合×seed42/2024・data/coefficients.yaml）:
#   平時 5.96/5.97 → 5.25/5.16 ／ 夏場 6.28/6.37 → 5.55/5.53
# 平時の低下（−0.71/−0.81）と夏場の低下（−0.73/−0.84）がほぼ一致＝#358 と同じ平行移動。
# 幅・算出規則は #358 から不変（実測min−0.6／実測max+0.25 を 0.05 刻みへ丸め、幅0.90を維持）。
# 平時帯（games_10k 3.5–6.7）は帯内のままで、狭く高い床を持つ夏場帯だけが収まらなかった。
# 2026-08-16（issue matchup-gap-saturation-k-rate ＋ fatigue-gradual-before-threshold・**要オーナー承認**）:
# 投打差の soft-cap（whiff_matchup_cap=1.5）で平時が −0.2（5.51→5.32/5.28）、消耗カーブ（目安の60%から効く）で
# 平時 +0.11/+0.14・夏場 +0.19/+0.10。実測（2000試合×seed42/2024）: 平時 5.43/5.42 ／ 夏場 5.87/5.80。
# 夏場は旧天井 5.80 を 0.07 だけ超えるので、同じ規則（実測min−0.6／実測max+0.25・幅0.90）で 5.20–6.10 へ平行移動。
# 平時帯（3.5–6.7）は帯内のまま。
# 2026-08-18（issue fly-out-legacy-double-play-table ＋ middle-infielder-charge-cap/fielder-body-far-from-ball-at-catch・
# **要オーナー承認**）: フライアウトを13%固定の併殺/野選テーブルから外した（守備側の"タダのアウト"が消える）ぶんが
# 平時 +0.21〜+0.28・夏場 +0.22〜+0.28、内野の前進上限4→10m＋処理点を体到達へ（内野安打率はもたつき0.49で水準維持）が
# 夏場 +0.06。実測（2000試合×seed42/2024・data/coefficients.yaml）: 平時 5.52/5.45 → 5.80/5.81 ／ 夏場 5.90/5.81 → 6.18/6.16。
# 同じ規則（実測min−0.6／実測max+0.25・幅0.90・0.05刻み）で 5.55–6.45 へ平行移動。平時帯（3.5–6.7）は帯内のまま。
# 2026-08-18（issue homerun-rate-explodes-at-high-power・監督方針「本塁打は高校の平均くらいに」）: 本塁打判定の正し＋
# 初速上限の上位圧縮（quality_mean 0.62 で打率は据え置き）で得点環境が一段下がった。実測（2000試合×seed42/2024）:
# 平時 5.80/5.81 → 5.14/5.23 ／ 夏場 6.18/6.16 → 5.51/5.56。同じ規則で 4.90–5.80 へ平行移動（前便の 5.55–6.45 承認待ちは
# この改定で消える）。平時帯（3.5–6.7）は帯内のまま。
games_10k_summer:
  runs_per_team: { min: 4.90, max: 5.80 }

# --- 県内の寡占（issue prefecture-dominance・2026-08-18） ---
# 帯4本＋tiers_low は大会も勢力図も測っていないので「同じ校が27大会連続優勝」は帯が全部緑のまま起きた。
# 実ゲームの他県裏試合と同じ部品（NationalTournamentEngine.RunSummer ChampionsOnly＋AiSchoolEvolution.ApplyYear）で
# 全国4000校を20年回し、49地区の「最多優勝校の優勝回数」の分布を固定する（AiSchoolEvolutionTests の Heavy）。
# 校正前（膝60・rev 0.10・churn 5.5・per_win 0.12・古豪+8, seed 2026/7/42）: 中央値 8〜9・10回以上 15〜17地区・最大 19〜20。
# 校正後（膝なし一様0.55・rev 0.15・churn 6.5・per_win 0.06・古豪+4）: 中央値 4〜5・10回以上 1〜2地区・最大 11〜13・1位vs2位 0.66。
# 現実の県（20年）は典型 5〜7回、聖光学院/明徳義塾級の一強でも 13〜16。
nation_dominance:
  max_champion_count_median: { min: 3, max: 7 }      # 49地区の最多優勝校の回数の中央値（20年）
  regions_with_ten_plus:     { min: 0, max: 8 }      # 最多校が10回以上の地区数
  max_champion_count_max:    { min: 0, max: 17 }     # 一強の尾（20年全部＝20 は不可）
  top_two_win_probability_mean: { min: 0.55, max: 0.78 }  # 初期の県1位 vs 2位の単試合勝率（集計モデル・49地区平均）。校正前 ≈0.85
