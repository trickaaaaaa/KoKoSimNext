# 統計回帰テストの許容帯（不変条件#5: 変更後は必ずこの帯を満たすこと）。
# Phase 1 DoD: 1万打席の各指標が下記レンジに収まること。数値は設計確定時に調整する。
# 帯の性格（2026-07-21 確定・OPEN-QUESTIONS Q2 クローズ）: この帯は「ゲームとしての正」であり、
# 高校野球の実統計との一致は要件としない（2026年ルール固定・低反発バット不採用の爆打寄り設計と整合）。

version: 0

# --- Phase 1: 打席解決（プレースホルダの目標帯） ---
atbat_10k:
  # issue #403（2026-08-04）: zone_edge_swing_penalty=0.02（隅は見逃されやすい）導入で見逃しKが増える分、
  # strikeout_rate 天井 0.220→0.230・batting_average 床 0.240→0.235 へ再校正（オーナー承認済み）。
  # 実測（10000打席×seed 42/7/2024）: K% 21.7〜22.7 / AVG 0.238〜0.251。games 帯は現状のまま緑。
  # issue homerun-rate-explodes-at-high-power（2026-08-18・監督方針「本塁打は高校の試合の平均くらいに」）:
  # ①本塁打判定を「フェンス上での高さ≥フェンス高」へ正した（旧判定は柵の0〜6m先へ落ちる低い当たりも本塁打
  # ＝本塁打の41%）②初速上限を 125+0.82P→141+0.50P（P50固定・上位圧縮）③安打から抜けた分を quality_mean
  # 0.60→0.62 で戻す。実測（10000打席×seed 42/7/2024）: AVG .242–.253 / HR% 1.60–1.74 / SLG .372–.387 /
  # 2B% 5.29–5.82 / 3B% 0.57–0.63 / 2B÷HR 3.04–3.64。本塁打帯 0.020–0.040→0.010–0.024、SLG .380→.340、
  # 2B÷HR 2.60→4.50（本塁打が二塁打に化けるので比が上がる。実野球はおよそ2〜4）、2B% 上限 .058→.065。
  batting_average: { min: 0.235, max: 0.290 }   # 打率
  strikeout_rate:  { min: 0.150, max: 0.230 }   # 三振率
  walk_rate:       { min: 0.060, max: 0.100 }   # 四球率
  home_run_rate:   { min: 0.010, max: 0.024 }   # 本塁打率
  # --- 長打の量と配分（Issue #24, 2026-07-21校正）: 塁打数を距離しきい値ではなく
  # 「着地後の転がり→回収→送球 vs 打者走者」の幾何で決めるようにした結果の帯。
  # 実測（10000打席×seed 42/7/2024・#24 当時）: SLG .421–.432 / 2B% 4.46–4.77 / 3B% 0.46–0.50 / 2B÷HR 1.55–1.83。
  slugging:            { min: 0.340, max: 0.480 }  # 長打率
  double_rate:         { min: 0.035, max: 0.065 }  # 二塁打率（打席あたり）
  triple_rate:         { min: 0.002, max: 0.009 }  # 三塁打率（打席あたり）
  doubles_per_homerun: { min: 2.00,  max: 4.50 }   # 二塁打÷本塁打（長打の種類の配分。実野球はおよそ2〜4）

# --- Phase 2: 試合エンジン（得点分布・試合時間） ---
games_10k:
  # 平均得点/チーム。上限を 6.0→6.7 に拡張（issue #123, 2026-07-23）: 守備力連動を強めて弱小同士の失策を
  # 大量化した副作用で失策失点が増える分を許容（「得点の分布が変わってもよい」＝オーナー方針）。この平均は
  # 乱数生成(Catching平均50・σ12)の母平均で、弱小裾の大量失策に引き上げられた値。標準的な試合(C50同士)は≈5.8。
  runs_per_team:   { min: 3.5, max: 6.7 }
  pitches_per_game: { min: 210, max: 330 }      # 平均球数/試合（両軍）
  minutes_per_game: { min: 90, max: 160 }       # 推定試合時間[分]
  innings_per_game: { min: 9.0, max: 9.8 }      # 平均イニング
  # 本塁クロスプレー憤死/試合（設計書12 §3 F2, Q9）。実測≈0.26。広め＝得点帯と競合させない warn 相当。
  # 上限を 0.42→0.50 に拡張（issue #123, 2026-07-23）: 守備力連動強化で失策→出塁増→本塁クロスプレー増の分。
  home_play_outs_per_game: { min: 0.12, max: 0.50 }
  # 三塁憤死/試合（単打の一塁→三塁レース, Issue #89, 設計書12 §3.5）。広め＝warn 相当。
  third_play_outs_per_game: { min: 0.02, max: 0.40 }
  # 併殺打/試合（両軍計。GIDP, Issue #369）: 13%固定テーブルを「捕球点→二塁の封殺（ほぼ確定）／二塁→一塁の
  # 転送が打者に間に合うか」の二段の物理レースへ置換した後の帯。守備は転送が刺せる見込みが薄ければ併殺を狙わず
  # 確実な一塁アウトを取る（＝ルーティンなゴロ凡打）。野選（二塁封殺＋打者生存）は「併殺を狙った末に転送が僅かに
  # 間に合わなかった残差」に限られ、旧テーブル時代の野選頻度（fielders_choice_per_game ≈0.46-0.49）を維持する。
  # 実測（2000試合×seed42/2024）: 併殺打 1.06／野選 0.356-0.358／得点 5.51-5.55（いずれも帯内）。
  # 旧 attempt_min_relay=0.80 は「見込み6〜8割の併殺まで一塁へ逃げる」守備判断で、一塁走者あり内野ゴロの半分で
  # 走者を二塁へ進めていた（issue double-play-attempt-threshold, 2026-08-18）。0.55 へ下げ（実物の内野は封殺が
  # 取れる限りまず二塁へ投げる）、実測 併殺打 1.88-1.89／野選 0.50-0.52／得点 5.46-5.49（seed42/2024・帯内）。
  # 得点は −0.33（走者を二塁へ進める進塁打が併殺・FC に置き換わった分）。球質タイプの中立性はしきい値で
  # 取らず archetype_* 側で取る（Archetypes_AreBalanceNeutral は本変更後も緑）。
  # 高得点環境ゆえ MLB の GIDP ≈1.5/試合（両軍計）よりやや上＝出塁が多いぶん併殺機会も多い。参考帯として広め（warn 相当）に取る。
  double_play_per_game: { min: 0.70, max: 2.20 }
  # --- design-14 第1段（P1）: 采配Brain不要＝無指示でも発生する常時系（2026-07-17校正, 🟡広め帯） ---
  # 野選（FC）: 実測≈0.46-0.48/試合（両軍計）。
  fielders_choice_per_game: { min: 0.10, max: 1.20 }
  # 振り逃げ: 実測≈0.12-0.15/試合（両軍計）。捕手Catchingの個体差で母平均が押し上がる非対称クランプの影響あり
  # （悪い捕手ほど落球しやすい効果が下限クランプで非対称に効く。design-14 P1-2の意図通り＝仕様として許容）。
  dropped_third_strike_per_game: { min: 0.02, max: 0.40 }
  # 失策数/試合（両軍計）。捕球ロール(Catching)→送球ロール(ThrowAccuracy)の2段階（issue #169, 2026-07-23）。
  # Ac50 で内野ゴロ失策の約40%が送球由来（throw_error_base_prob=0.0266）・約60%が捕球由来（error_base_prob=0.0384）。
  # 2段階化に伴い母平均は旧≈3.4→≈2.9（甲子園実測2.1〜2.7寄りに改善）。守備力連動は非対称: 弱小(C25)同士は両校計で多発、
  # 平均(C50)≈2.9、精鋭側は送球・捕球とも上げるほど単調に減る（issue #123/#169）。
  # issue #532（2026-08-08）: 外野フライ落球を難度連動へ移して過剰分を削り、内野ゴロ側を×1.29で引き上げて総数を保った。
  # 帯は据え置き（1.8–3.6）。実測は seed42/2024・2000試合で 2.21–2.25（従来の≈2.5と同オーダー・帯内）。
  errors_per_game: { min: 1.8, max: 3.6 }
  # 外野失策シェア（外野の失策÷全失策。issue #532）。修正前 0.393（フライ捕球に難度が無く内野ゴロと同じ基準確率を
  # 共有していた）。フライ落球を捕球余裕(catchMargin)連動の難度＋フライ専用基準確率(fly_error_base_prob)で伸縮させ、
  # 平凡な飛球はほぼ捕り際どい飛球で落とす形に。実際の野球はおよそ1割。目安 0.05–0.20（高校野球の実測で今後詰める）。
  outfield_error_share: { min: 0.05, max: 0.20 }
  # 失策連鎖: 失策総数に比例する（ReachedOnErrorごとに error_extra_advance_prob で成立）ため、失策の実測域化で連鎖も増える。
  # issue #123 で帯を 0.02〜0.40 → 0.10〜0.80 へ拡張（守備力連動強化で母平均失策が上振れした分）。
