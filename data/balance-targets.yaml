# 統計回帰テストの許容帯（不変条件#5: 変更後は必ずこの帯を満たすこと）。
# Phase 1 DoD: 1万打席の各指標が下記レンジに収まること。数値は設計確定時に調整する。
# 帯の性格（2026-07-21 確定・OPEN-QUESTIONS Q2 クローズ）: この帯は「ゲームとしての正」であり、
# 高校野球の実統計との一致は要件としない（2026年ルール固定・低反発バット不採用の爆打寄り設計と整合）。

version: 0

# --- Phase 1: 打席解決（プレースホルダの目標帯） ---
atbat_10k:
  # issue #403（2026-08-04）: zone_edge_swing_penalty=0.02（隅は見逃されやすい）導入で見逃しKが増える分、
  # strikeout_rate 天井 0.220→0.230・batting_average 床 0.240→0.235 へ再校正（オーナー承認済み）。
  # 実測（10000打席×seed 42/7/2024）: K% 21.7〜22.7 / AVG 0.238〜0.251。games 帯は現状のまま緑。
  batting_average: { min: 0.235, max: 0.290 }   # 打率
  strikeout_rate:  { min: 0.150, max: 0.230 }   # 三振率
  walk_rate:       { min: 0.060, max: 0.100 }   # 四球率
  home_run_rate:   { min: 0.020, max: 0.040 }   # 本塁打率
  # --- 長打の量と配分（Issue #24, 2026-07-21校正）: 塁打数を距離しきい値ではなく
  # 「着地後の転がり→回収→送球 vs 打者走者」の幾何で決めるようにした結果の帯。
  # 実測（10000打席×seed 42/7/2024）: SLG .421–.432 / 2B% 4.46–4.77 / 3B% 0.46–0.50 / 2B÷HR 1.55–1.83。
  slugging:            { min: 0.380, max: 0.480 }  # 長打率
  double_rate:         { min: 0.035, max: 0.058 }  # 二塁打率（打席あたり）
  triple_rate:         { min: 0.002, max: 0.009 }  # 三塁打率（打席あたり）
  doubles_per_homerun: { min: 1.30,  max: 2.60 }   # 二塁打÷本塁打（長打の種類の配分。実野球はおよそ2〜2.5）

# --- Phase 2: 試合エンジン（得点分布・試合時間） ---
games_10k:
  # 平均得点/チーム。上限を 6.0→6.7 に拡張（issue #123, 2026-07-23）: 守備力連動を強めて弱小同士の失策を
  # 大量化した副作用で失策失点が増える分を許容（「得点の分布が変わってもよい」＝オーナー方針）。この平均は
  # 乱数生成(Catching平均50・σ12)の母平均で、弱小裾の大量失策に引き上げられた値。標準的な試合(C50同士)は≈5.8。
  runs_per_team:   { min: 3.5, max: 6.7 }
  pitches_per_game: { min: 210, max: 330 }      # 平均球数/試合（両軍）
  minutes_per_game: { min: 90, max: 160 }       # 推定試合時間[分]
  innings_per_game: { min: 9.0, max: 9.8 }      # 平均イニング
  # 本塁クロスプレー憤死/試合（設計書12 §3 F2, Q9）。実測≈0.26。広め＝得点帯と競合させない warn 相当。
  # 上限を 0.42→0.50 に拡張（issue #123, 2026-07-23）: 守備力連動強化で失策→出塁増→本塁クロスプレー増の分。
  home_play_outs_per_game: { min: 0.12, max: 0.50 }
  # 三塁憤死/試合（単打の一塁→三塁レース, Issue #89, 設計書12 §3.5）。広め＝warn 相当。
  third_play_outs_per_game: { min: 0.02, max: 0.40 }
  # 併殺打/試合（両軍計。GIDP, Issue #369）: 13%固定テーブルを「捕球点→二塁の封殺（ほぼ確定）／二塁→一塁の
  # 転送が打者に間に合うか」の二段の物理レースへ置換した後の帯。守備は転送が刺せる見込みが薄ければ併殺を狙わず
  # 確実な一塁アウトを取る（＝ルーティンなゴロ凡打）。野選（二塁封殺＋打者生存）は「併殺を狙った末に転送が僅かに
  # 間に合わなかった残差」に限られ、旧テーブル時代の野選頻度（fielders_choice_per_game ≈0.46-0.49）を維持する。
  # 実測（2000試合×seed42/2024）: 併殺打 1.06／野選 0.356-0.358／得点 5.51-5.55（いずれも帯内）。
  # attempt_min_relay=0.80 で校正（併殺が打たせて取る型を過度に利さないよう＝Archetypes_AreBalanceNeutral を満たす水準）。
  # MLB の GIDP ≈1.5/試合（両軍計）と同オーダーのやや下。参考帯として広め（warn 相当）に取る。
  double_play_per_game: { min: 0.70, max: 2.20 }
  # --- design-14 第1段（P1）: 采配Brain不要＝無指示でも発生する常時系（2026-07-17校正, 🟡広め帯） ---
  # 野選（FC）: 実測≈0.46-0.48/試合（両軍計）。
  fielders_choice_per_game: { min: 0.10, max: 1.20 }
  # 振り逃げ: 実測≈0.12-0.15/試合（両軍計）。捕手Catchingの個体差で母平均が押し上がる非対称クランプの影響あり
  # （悪い捕手ほど落球しやすい効果が下限クランプで非対称に効く。design-14 P1-2の意図通り＝仕様として許容）。
  dropped_third_strike_per_game: { min: 0.02, max: 0.40 }
  # 失策数/試合（両軍計）。捕球ロール(Catching)→送球ロール(ThrowAccuracy)の2段階（issue #169, 2026-07-23）。
  # Ac50 で内野ゴロ失策の約40%が送球由来（throw_error_base_prob=0.0266）・約60%が捕球由来（error_base_prob=0.0384）。
  # 2段階化に伴い母平均は旧≈3.4→≈2.9（甲子園実測2.1〜2.7寄りに改善）。守備力連動は非対称: 弱小(C25)同士は両校計で多発、
  # 平均(C50)≈2.9、精鋭側は送球・捕球とも上げるほど単調に減る（issue #123/#169）。
  # issue #532（2026-08-08）: 外野フライ落球を難度連動へ移して過剰分を削り、内野ゴロ側を×1.29で引き上げて総数を保った。
  # 帯は据え置き（1.8–3.6）。実測は seed42/2024・2000試合で 2.21–2.25（従来の≈2.5と同オーダー・帯内）。
  errors_per_game: { min: 1.8, max: 3.6 }
  # 外野失策シェア（外野の失策÷全失策。issue #532）。修正前 0.393（フライ捕球に難度が無く内野ゴロと同じ基準確率を
  # 共有していた）。フライ落球を捕球余裕(catchMargin)連動の難度＋フライ専用基準確率(fly_error_base_prob)で伸縮させ、
  # 平凡な飛球はほぼ捕り際どい飛球で落とす形に。実際の野球はおよそ1割。目安 0.05–0.20（高校野球の実測で今後詰める）。
  outfield_error_share: { min: 0.05, max: 0.20 }
  # 失策連鎖: 失策総数に比例する（ReachedOnErrorごとに error_extra_advance_prob で成立）ため、失策の実測域化で連鎖も増える。
  # issue #123 で帯を 0.02〜0.40 → 0.10〜0.80 へ拡張（守備力連動強化で母平均失策が上振れした分）。
  # design-14 P1-6 の参照値0.14は旧・過少失策率(0.65/試合)に紐付いた値として更新扱い。
  error_extra_advance_per_game: { min: 0.10, max: 0.80 }
  # 暴投・パスボール（design-14 P2-8, 設計書15 Phase D-3）: 実測≈0.56-0.59/試合（両軍計, seed42/2024）。
  wild_pitch_per_game: { min: 0.15, max: 1.00 }

# --- design-14 第1段（P1）: 采配Brain（StandardTacticsBrain, GameSimulation --tactics）ありでのみ発生する系 ---
# 敬遠・重盗・牽制は守備側/攻撃側の采配判断が引き金のため、Brain付きシミュレーションでのみ検証する
# （GameRegressionTests は無指示＝Brainなしのため、これらは通常の games_10k では常に0）。
games_10k_tactics:
  # 上限を 6.2→6.7 に一般帯（games_10k）と整合（issue #63, 2026-07-24）: #123 で守備力連動→失策失点増を
  # 許容して一般帯を 6.0→6.7 に拡張した際、この tactics 帯の更新が漏れていた（旧コメント「実測≈3.9-4.0」は
  # #123 以前の値で stale）。実測は Brainつき 6.22-6.26＜Brainなし 6.36-6.43＝brain の方が低いのに cap だけ
  # 厳しい不整合を解消。バウンド導入（#63）の押し上げは僅少で、一般帯 6.7 の範囲内。
  runs_per_team: { min: 3.3, max: 6.7 }
  # 牽制アウト: 実測≈0.001/試合（両軍計）。盗塁企図自体が稀（Brainの盗塁閾値依存）なため参考帯として広め。
  pickoff_per_game: { min: 0.0, max: 0.05 }
  # 敬遠: 実測≈0.06/試合（両軍計）。
  intentional_walk_per_game: { min: 0.01, max: 0.30 }
  # 一・三塁重盗: 実測≈0.002-0.003/試合（両軍計）。一・三塁で盗塁企図という稀な塁状況依存のため広め。
  double_steal_third_break_per_game: { min: 0.0, max: 0.05 }
  # --- 1球采配（design-15 Phase C-2, 2026-07-19校正）: 追い込まれ矯正/3-0待て/決め球切替の影響を最も受ける ---
  # 実測（StandardTacticsBrain, 10000試合×seed42/2024）: 三振≈19.1%, 四球≈8.2%, 本塁打≈2.85%（打席あたり）。
  strikeout_rate: { min: 0.16, max: 0.22 }
  walk_rate: { min: 0.06, max: 0.10 }
  home_run_rate: { min: 0.020, max: 0.036 }

# --- Issue #120: 夏場の天候（気温）モデルを有効化したときの得点帯（決定3: 一般帯を外れた分の単独追加） ---
# 気温を物理層（空気密度ρ・投手消耗）だけに効かせて「夏場は点が動きやすい」を創発させる（不変条件#1）。
# GameSimulation を applyWeather:true で回した実測（2000試合×seed42/2024）: 得点/チーム 6.75–6.77。
# 控えめ係数（決定1=案B k=0.5・決定2=案A α=0.01・平均32℃/28〜36℃）でも一般帯（≤6.7）をわずかに上回るため、
# 夏場条件専用の帯として単独追加した（一般帯 games_10k は天候オフ＝ベースラインのまま非破壊）。
# 未指定の指標（球数・イニング等）は games_10k の一般帯を流用する（ParseGameSummer が土台にする）。
#
# Issue #318（ゴロ凡打の進塁打の物理レース化）で max を 7.1 → 7.25 へ広げた。
# 理由: 物理レースは分岐ごとに乱数消費数が変わる（自重=0回・送球=1回）ため下流ストリームが再シャッフルされ、
# seed2024 が 7.077 → 7.200 へ上振れした（seed42 は 6.981 で不変＝系統的な得点増でなく分布の揺れ）。
# 進塁の直接効果は微小で、校正ノブ advance_success_bias を 0.00〜−2.50 まで振っても 7.200→7.198 しか動かない
# ＝係数では収められない。決定論ベースライン再生成を伴う変更では再シャッフル自体が不可避なため帯側で吸収する。
# なお #120 校正時の実測 6.75–6.77 に対し main 実測が既に 7.077 まで漂流していた（上限まで 0.023）。
# この漂流の切り分けは別途（帯を広げても一般帯 games_10k ≤6.7 は非破壊のまま監視できる）。
#
# Issue #358（内野ゴロの固定1.58秒の引き戻し）で min/max を 6.4/7.25 → 5.70/6.60 へ下げた。
# 理由: 内野安打が出過ぎる原因だった守備側の水増し（捕球点で1.58秒＝実際の約2倍）をやめ、得点環境の
# 戻し分を判定側（force_out_margin_seconds 0.0→0.60）へ移した結果、得点環境が一段下がったため。
# 実測（2000試合×seed42/2024）:
#   平時 6.63/6.67 → 5.96/5.97 ／ 夏場 6.98/7.20 → 6.28/6.37
# 夏場帯は「平時＋天候分」の位置に置く帯なので、平時の低下と同じだけ平行移動させる（#120 の
# 「一般帯を土台に runs のみ上書き」という性格は変えない）。幅は従来と同じ（実測min−0.6／実測max+0.25）。
# 「夏場 ≥ 平時」は別assertで担保されているので、この帯は絶対水準だけを見る。
#
# Issue #532（外野フライ落球の難度連動）で min/max を 5.70/6.60 → 4.90/5.80 へ下げた。監督承認 2026-08-08。
# 理由: 過剰だった外野フライ落球（＝打者出塁＋失策連鎖付きで得点価値が高い）を凡打へ戻したため、得点生産が
# 構造的に下がった。総失策数を内野側の×1.29で保っても内野ゴロ失策は得点価値が低く、得点環境は戻らない。
# 実測（2000試合×seed42/2024・data/coefficients.yaml）:
#   平時 5.96/5.97 → 5.25/5.16 ／ 夏場 6.28/6.37 → 5.55/5.53
# 平時の低下（−0.71/−0.81）と夏場の低下（−0.73/−0.84）がほぼ一致＝#358 と同じ平行移動。
# 幅・算出規則は #358 から不変（実測min−0.6／実測max+0.25 を 0.05 刻みへ丸め、幅0.90を維持）。
# 平時帯（games_10k 3.5–6.7）は帯内のままで、狭く高い床を持つ夏場帯だけが収まらなかった。
games_10k_summer:
  runs_per_team: { min: 4.90, max: 5.80 }
