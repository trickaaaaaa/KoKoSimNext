# 大会展望の文言（issue #784・設計書06 §3.5b）
#
# 学校の寸評と注目選手の紹介文を、部品の組み合わせで組む。組み立ての規則は engine の
# TournamentPreviewBuilder（PreviewWriter）にあり、ここは語彙だけを持つ（不変条件#4 データ駆動）。
# 読むのは engine の純パーサ PreviewPhrasesParser（Unity は StreamingAssets 経由・テストは data/ を直接）。
#
# ■ 学校の寸評 ＝ 書き出し（school.open.*）＋ 特徴（school.body.*）＋ 締め（school.close.*）
#   - 書き出し: 格付けと順位帯で選ぶ。fav=◎ / cont=○ / dark=▲ / 無印は順位で upper / middle / lower / bottom
#     リーグ戦（地区予選）の ◎○▲ は school.open.league.* を使う
#   - 特徴: 3軸（打線・投手陣・守備）の形。balanced=差が小さい / spike.X=Xが突出 / hole.X=Xが弱点
#     ＝その学校の中での比較だけを書く（強豪にも弱小にも使える言い方にする）。balanced だけは
#     「穴が無い」と「どれもまだ武器になっていない」で意味が逆になるので強弱（.strong / .weak）で分ける
#   - 締め: 校風（smallball / power / defense / total / ace / standard）× 強弱（strong=◎○▲と上位 / weak=それ以外）
#   同じ組（書き出し・特徴・締めの置き場が同じ学校）には、大会の中で別々の組み合わせを割り当てる
#   ＝同じ寸評文が2校に出ない。組の数は 書き出し×特徴×締め の本数の積（いまは 8×6×5=240）。
#   ◎○▲ は同じ印どうしで書き出しから変える（展望の上段で対抗2校が同じ一文で始まらない）。
#   甲子園にはシードが無いので、◎○▲ の書き出しにも「シード」は書かない（勝ち抜き戦の県大会・甲子園の共用）
#
# ■ 注目選手の紹介 ＝ 見出し（player.head.<特徴>.<水準>）＋ 描写（player.body.<特徴>）＋ 結び（player.tail.g<学年>）
#   - 特徴: power 長打 / contact ミート / speed 走力 / arm 肩 / eye 選球眼 / glove 守備
#           ace.power 本格派 / ace.finesse 技巧派 / ace.soft 軟投派 / ace.balanced バランス型（エース＝先発だけ）
#           ace.flamethrower 剛腕 / ace.pinpoint 精密機械 / ace.artist 変化球の魔術師（尖った型・issue #908）
#   - 水準: star（{area}屈指＝強豪の看板） / solid（チームの看板） / modest（その学校の中での見どころ）
#     {area} は舞台で 県内 / 地区 / 全国 に変わる。**{area} と「屈指」「指折り」「トップクラス」は star だけ**で使う
#   - 組み合わせは 見出し×描写×結び（いまは 4×8×10=320）。出場校の順位で別々の番号を振るので、
#     320校までの大会なら同じ紹介文が2人に出ない（全国生成で最大の東京が287校＝2026-11-08 実測）
#   - 1校詳細の寸評には player.intro（「注目は2年の山田。」）を挟んで紹介文を続ける
#
# 書いてはいけないこと（CLAUDE.md・issue #784）
#   - 守備位置・投手適性（遊撃手・捕手・外野手・「本来は投手」など）。投手の紹介は「エース」の範囲だけ
#   - 能力の生の数値、隠し能力（才能上限・成長タイプ・隠しスキル・怪物）
#   - 無印（upper〜bottom）・特徴・締め・選手の部品には、勝ち抜き戦の語（優勝・トーナメント・シード・短期決戦・頂点）を
#     書かない＝リーグ戦（地区予選）でも同じ部品を使うため
#
# 置換: {field}=出場校数 {seed}=戦力評価の順位 {strong}/{weak}=最も強い/弱い軸の名前
#       {area}=県内/地区/全国 {grade}=学年 {name}=選手名
#
# すべての項目を "..." で囲む（{ で始まる行が YAML のマップと読まれないように）。

