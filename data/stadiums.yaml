# 球場カタログ（設計書13-stadiums ①物理層）
# 寸法: left/right=両翼[m], center=中堅[m], fence_height=フェンス高[m]
#   right 省略時は left にフォールバック（左右対称）。fence_height 省略時は 2.5m。
# tier: municipal（市営級・序盤）/ prefectural（県営級・準決勝決勝）/ national（聖地）
# model: 3D表示のモデル名（data/stadiums/<model>.obj）。省略時は standard を寸法へ伸縮（issue #904）。
# indoor: true＝屋内（ドーム）。天候・気温（coefficients.yaml weather の月の表・#971）を効かせない＝空気密度も投手の消耗も基準のまま
#   （issue #1020）。省略時は false（屋外）。
# wind: ②環境用の箱。今回未使用（設計書13-stadiums §5）。将来の風雨システムで有効化。
# 表示名は命名権（企業名）除去済みの施設名（stadiums-research.md）。甲子園は商標配慮で「甲子園」表記。

# ── 架空基礎タイプ（序盤ラウンド）＋聖地 ─────────────────────────
stadiums:
  # 架空タイプ: 統計検証（狭>標準>広の順序）と序盤ラウンドに使用
  # issue #976（2026-11-15）: 市営級2種を 両翼+1m・中堅+1m・フェンス高 2.0→3.0m。県大会の試合の98%以上がこの2種で、
  # 本塁打の出すぎの最大の源だった。「狭い」性格（標準95/118より狭い）は残し、主にフェンスを上げる＝柵越えをフェンス直撃の長打へ。
  # 汎用の球場（model 無し）なので 3D は standard を寸法へ伸縮して描く（フェンス高も追従する）。
  - id: municipal_small_01
    name: 市営球場（狭い）
    left: 92
    center: 116
    fence_height: 3.0
    tier: municipal
  - id: municipal_small_02
    name: 市営球場（やや狭い）
    left: 94
    center: 117
    fence_height: 3.0
    tier: municipal
  - id: standard_01
    name: 標準球場
    left: 95
    center: 118
    fence_height: 2.6
    tier: prefectural
  - id: pref_large_01
    name: 県営球場（広い）
    left: 100
    center: 122
    fence_height: 3.0
    tier: prefectural

  # 聖地（national）
  - id: koshien
    name: 甲子園
    left: 95
    center: 118
    fence_height: 2.6
    tier: national
    model: koshien
    # wind: 浜風  # ②用の箱。今回未使用
  - id: jingu
    name: 明治神宮野球場
    left: 97.5
    center: 120
    fence_height: 3.3
    tier: national
    model: jingu          # 3Dモデル data/stadiums/jingu.obj（issue #904）

# ── 県大会の決勝会場（実測ベース・命名権除去済み）──────────────
# 2023〜2026年の実績で調べ直した（2026-11-14・stadiums-research.md「夏・秋の決勝会場の実績」）。
# 夏・秋それぞれ代表を1つ: 直近4年で多い会場（同数なら直近の年）。一時的な例外（改修・万博等）は採らない。
#   <県>_final         … 夏（選手権の地方大会）の準決勝・決勝
#   <県>_autumn_final  … 秋季県大会の準決勝・決勝。**夏と違う県だけ**置く（無ければ夏と同じ）。
#                         北海道は秋季全道大会＝hokkaido_autumn_final、東京は都大会も神宮（夏と同じ）
# 試合で使うのは（issue #1020・2026-11-15 監督決定）: 東京（夏秋とも神宮）・神奈川/北海道/宮城/広島の夏・
#   <県>_autumn_final の全件（秋の準決勝・決勝）。それ以外の県は夏・秋とも汎用の県営級（pref_large_01）のまま
#   ＝47県すべての配線はしない（設計書13 §1）。使う項目は C#既定（Stadium.*／Stadium.AutumnFinals）と一致させる。
#   3D モデルの無い会場は standard を判定寸法へ伸縮して描く（見た目は汎用・名前と寸法は実在の会場）。
# 寸法は ja.wikipedia の各球場記事。fence_height が無いものは資料に記載なし（既定2.5m）。
# ただし秋の会場（<県>_autumn_final）で資料の無いものは 3.0m を明記している（2026-11-15 監督決定・下の秋の節）。
