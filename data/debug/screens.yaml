# データ画面の撮影レシピ（ホーム・選手・メンバー設定・練習・経営・キャリア・記録などの確認用）。1件の確認＝1項目。
# 試合の場面は captures.yaml。画面ごとの使い捨て *Shooter は新しく書かない（ここに手順を書く）。
#
# 実行（Unity Editor・Play していない状態で。MCP execute_code からも呼べる）:
#   KokoSim.UnityEditorTools.ScreenCaptureRunner.Run("management-contracts")   # 複数 id を並べると続けて撮る
# 終わると screenshots/<id>/ に DONE か FAILED と summary.json（撮った絵・書体監査・reads・手順のメモ・エラー）、
# *.png（shot）が出る。全体の結果は screenshots/_screen-run.txt。
#
# このディレクトリ（data/debug/）はデバッグ専有でリリースから除外する。
#
# フィールド:
#   id / name : 識別子（出力フォルダ名）と説明（" #" を含むなら "" で囲む）
#   size      : {w: 1600, h: 900}（既定）
#   game_scale: true  論理解像度を絵の大きさに合わせず、本番と同じ参照解像度 1600×900 のまま撮る（1280×720 の窓の本番の見え方＝0.8倍。issue #1533）
#   steps     : 手順を上から順に。1つでも失敗したらその先は撮らずに FAILED
#
# 手順:
#   new_game: {seed: 1, prefecture: 13, school: 桜丘, district: 0}
#                       新設校で新規ゲーム→ホーム（どれも省略可。seed 既定 1＝毎回同じ部員）。
#                       レシピの先頭に置かなければ、前のレシピ（同じ Run 内）の状態を引き継ぐ
#   advance_weeks: 3    週を送る（ホームの「次の週へ」と同じ経路）。大会に入ったらそこで止める
#   advance_days: 2     日を送る（大会中）
#   advance_to_match_day: ""   大会中に自校の次の試合の日まで日を送る
#   play_tournament: ""        いまの大会を最後まで消化（試合の日まで日送り→試合は委任で解く→結果を閉じる、を繰り返す。
#                       続けて開幕する大会も含む）。成績・通知・大会の後始末は本番どおりに残る
#                       週送り・大会の途中で出る答え待ち（新チームの主将・背番号・年契約の更新・転任の打診）には
#                       本番の既定どおり自動で答える（主将＝暫定主将／背番号・契約＝そのまま確定／転任＝残留）。summary の notes に残る
#   advance_to_week: 39 | {week: 39, year: 2}   途中の大会を消化しながら指定の週まで進める（year は1始まりの年度・週は 0〜49）
#   boost_roster: 95 | {level: 95, cap: 99}     自校の部員の全能力を上げる（勝ち進む分岐を見る用）
#   transfer: "" | weakest | {school: 123}   監督を転任させる（""＝同じ県でいちばん強い他校・weakest＝いちばん弱い他校）。年度末の判定を待たずに
#                       打診を開き、ホームの「転任する」と同じ確定処理を通す（記録・配色の持ち越しを見る用）
#   show: ManagementScreen     画面を開く（GameObject 名＝ScreenRouter の画面名）
#   click: name | .class[添字]   押す（ClickEvent。Button なら自動で決定キーと同じ NavigationSubmitEvent）
#   submit: name               決定キーで押す
#   hover / leave: name        マウスを載せる／離す（PointerEnter/Leave。:hover の見た目は変わらない）
#   call: Method(1, "a")       表示中の画面のコントローラのメソッド
#   call: ManagerService.Contracts.ScheduleCancel("scouting")   KokoSim の型から辿った先のメソッド
#   set: {ManagerService.Manager.Funds: 20, RosterService.Active.0.IsCaptain: true}
#                       static から辿った値を書き換える（数字の段はリストの添字）
#   wait: 5 | 300ms     フレーム数か実時間（UI の遅延タイマーを越えるとき）
#   read: ngs-district  要素の中身（ドロップダウンは選択肢まで）を summary.json の reads に書く
#   read: =GameSession.Current.PendingSenbatsuFieldIds   static から辿った値（コレクションは件数と先頭8件）。画面に出ない状態の確認用
#   shot: 01-name | {name: 01-name, h: 1400}   いまの画面を撮る（同時に書体監査を summary.json へ）

screens:
  # ── 製品版（スレッドのある側）の通し確認・Web 体験版の直しで壊れていないか（#1323） ──

  - id: regression-playthrough-1323
    name: "新規→横の画面から週送り（イベントはホームへ）→夏の大会を消化→年度替わり→2年目の夏→セーブ（#1323 の直しの回帰確認）"
    steps:
      - new_game: {seed: 7, prefecture: 14, school: 桜丘, district: 0}
      - shot: 00-home
      - show: SaveSlots
      - wait: 5
      - click: advance
      - wait: 10
      - read: =ScreenRouter.Instance.CurrentScreen
      - read: =GameClock.Week
      - read: =EventService.HasPending
      - shot: 01-after-side-advance
      - show: PlayerList
      - wait: 5
      - click: advance
      - wait: 10
      - read: =ScreenRouter.Instance.CurrentScreen
      - read: =GameClock.Week
      - shot: 02-after-side-advance-2
      - advance_weeks: 16
      - read: =GameSession.Current.InTournament
      - play_tournament: ""
      - read: =GameClock.Week
      - shot: 03-after-summer
      - advance_to_week: {week: 14, year: 2}
      - read: =GameClock.YearIndex
      - read: =GameClock.Week
      - read: =RosterService.Active.Count
      - shot: 04-year2
      - call: SaveSlots.Save("manual3")
      - read: =SaveSlots.AnySaveExists()
      - show: SaveSlots
      - wait: 5
      - shot: 05-saves

  # ── 県選択（日本地図）・issue #1410 ──

  - id: prefecture-map-1410
    name: "はじめからの県選択を日本地図に（全国図・乗せたとき・北海道/東京の拡大・設定画面）（issue #1410）"
    steps:
      - show: PrefectureSelect
      - wait: 5
      - shot: 01-national
      - call: HoverForCapture(33)
      - wait: 3
      - shot: 02-hover-hiroshima
      - call: HoverForCapture(36)
      - wait: 3
      - shot: 03-hover-kagawa
      # 沖縄は傾けた本土の左上の海に同じ縮尺で置く（#1502）。乗せて強調・札が出ること
      - call: HoverForCapture(46)
      - wait: 3
      - shot: 03b-hover-okinawa
      - call: PickForCapture(0)
      - wait: 5
      - shot: 04-hokkaido-zoom
      - call: HoverForCapture(0, 1)
      - wait: 3
      - shot: 05-hokkaido-hover-south
      - call: ResetForCapture()
      - call: PickForCapture(12)
      - wait: 5
      - shot: 06-tokyo-zoom
      - call: HoverForCapture(12, 1)
      - wait: 3
      - shot: 07-tokyo-hover-west
      - call: PickForCapture(12, 1)
      - wait: 8
      - read: ngs-pref-name
      - read: ngs-district
      - shot: 08-setup-tokyo-west

  # 信頼度を画面から外した後の確認（issue #1603）: トップバー・キャリア・経営の予算の内訳に「信頼度」が出ない。
  - id: trust-hidden-1603
    name: "信頼度が画面に出ない（トップバー・キャリア・経営の内訳・issue #1603）"
    steps:
      - new_game: {seed: 1}
      - show: HomeDashboard
      - shot: 01-home-topbar
      - show: CareerScreen
      - shot: 02-career
      - show: ManagementScreen
      - shot: 03-management-income

  # ── 束7 お金・信頼度・名声（2026-11-23・issue #1299 #1469 #1270 #1467）──
  # 経営タブ: 収入の内訳の「後援会」（旧「後援会・OB」）と、年契約の新しい年額（スカウト網 100/250/420・遠征60・コーチ160）。
  - id: management-economy-bundle7
    name: "経営タブの収入の内訳（後援会）と年契約の年額（issue #1299 #1469）"
    steps:
      - new_game: {seed: 1}
      - show: ManagementScreen
      - shot: 01-income
      - call: SelectTab(3)
      - shot: 02-contracts
      - call: ManagerService.Contracts.SetLevel("scouting", 3)
      - call: ManagerService.Contracts.SetLevel("coach_batting", 1)
      - show: ManagementScreen
      - call: SelectTab(3)
      - shot: 03-contracts-lv3-coach-net-red

  # ── 性格の匂わせ（issue #1599）。出だしの会話に当事者の性格のヒントが乗っているかを選択肢の手前で撮る ──
  - id: event-personality-hint-1599-skipping
    name: "練習サボり・性格の匂わせ会話（issue #1599）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - call: EventService.PushChoiceEvent("skipping_practice", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices

  - id: event-personality-hint-1599-grade-friction
    name: "学年間のもめ事・性格の匂わせ会話（issue #1599）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 1, year: 2}   # grade_friction は上級生×1年生が要る＝新設直後（全員1年生）には出せない
      - call: EventService.Clear()
      - call: EventService.PushChoiceEvent("grade_friction", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices

  - id: event-personality-hint-1599-selfish-clash
    name: "目立ちたがりと献身派の衝突・性格の匂わせ会話（issue #1599）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - call: EventService.PushChoiceEvent("selfish_clash", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices

  # 選択肢の結果行に信頼度が並ぶ（結束の上下＋信頼度 ±2）。好転側（roll 0）を撮る。
  - id: event-trust-interpersonal-1270
    name: "選手間の選択肢の結果行に信頼度 ＋2（issue #1270 E1）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - read: "=ManagerService.Manager.Trust"
      - call: EventService.PushChoiceEvent("skipping_practice", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices
      - click: .choice-btn[0]
      - wait: 5
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 02-result-line
      - read: "=ManagerService.Manager.Trust"

  # テスト週の配慮（練習を軽くする＝効率 ×0.85・2週・信頼度 ＋2）。
  - id: event-exam-ease-1270
    name: "テスト週・練習を軽くする（信頼度 ＋2・issue #1270 E1）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - read: "=ManagerService.Manager.Trust"
      - call: EventService.PushChoiceEvent("exam_week_slump", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices
      # 選ぶと結果の会話の1行目が出る。「練習を軽くする」の結果は2行＋結果行＝あと2回送ると結果行
      # （選手間の選択肢は結果の会話が3行なので3回。行数が違うのでレシピも別）。
      - click: .choice-btn[0]
      - wait: 5
      - shot: 02-outcome-1
      - click: ev-novel
      - wait: 3
      - shot: 03-outcome-2
      - click: ev-novel
      - wait: 5
      - shot: 04-result-line
      - read: "=ManagerService.Manager.Trust"

  # ── 合宿をしますか？（issue #1482）。第18週に入って本番どおりの経路で出る質問（費用・期間・効果）→ 選ぶ → 結果 ──
  - id: camp-decision-skip-1482
    name: "夏合宿の質問→しない（倍率・結束・費用がなくなる・issue #1482）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 17
      - read: =GameSession.Current.CohesionDelta
      - advance_weeks: 1
      - read: =GameClock.Week
      - read: =GameSession.Current.CohesionDelta
      - read: =EventService.Pending.Count
      # 第18週には他の場面も積まれる（新チーム・週次イベント）。合宿の質問だけを先頭に出し直す（週頭の結束 +6 は本番どおり入っている）
      - call: EventService.Clear()
      - call: EventService.PushChoiceEvent("summer_camp", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - shot: 01-explain-lines
      - click: ev-novel
      - wait: 5
      - shot: 02-choices
      - click: .choice-btn[1]
      - wait: 5
      - shot: 03-skip-outcome
      - read: =GameSession.Current.CampSkips
      - read: =GameSession.Current.CohesionDelta
      - read: =TrainingWeek.CampMultiplier(18)

  - id: camp-decision-join-1482
    name: "夏合宿の質問→する（倍率×2.0・結束↑・結果行・issue #1482）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 17
      - advance_weeks: 1
      - read: =GameClock.Week
      - read: =GameSession.Current.CohesionDelta
      - call: EventService.Clear()
      - call: EventService.PushChoiceEvent("summer_camp", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - click: .choice-btn[0]
      - wait: 5
      - shot: 01-join-outcome-1
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 02-join-result-line
      - read: =GameSession.Current.CampSkips
      - read: =GameSession.Current.CohesionDelta
      - read: =TrainingWeek.CampMultiplier(18)

  # ── 転任判定の前の校長の会話（issue #1606）。教員監督・在任3年目の2月（第44週）。信頼度の段ごとに撮る ──

  - id: principal-talk-high-1606
    name: "転任判定の前の校長の会話・高い段（issue #1606）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 43, year: 1}
      - set: {ManagerService.Manager.YearsAtSchool: 2, ManagerService.Manager.Trust: 75}
      - call: EventService.Clear()
      - advance_weeks: 1
      - read: =GameClock.Week
      - read: =EventService.Pending.Count
      - show: HomeDashboard
      - wait: 10
      - shot: 01-first-line
      - click: ev-novel
      - wait: 3
      - shot: 02-principal
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - shot: 04-last-line

  - id: principal-talk-mid-1606
    name: "転任判定の前の校長の会話・中ほどの段（issue #1606）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 43, year: 1}
      - set: {ManagerService.Manager.YearsAtSchool: 2, ManagerService.Manager.Trust: 60}
      - call: EventService.Clear()
      - advance_weeks: 1
      - read: =GameClock.Week
      - read: =EventService.Pending.Count
      - show: HomeDashboard
      - wait: 10
      - shot: 01-first-line
      - click: ev-novel
      - wait: 3
      - shot: 02-principal
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - shot: 04-last-line

  - id: principal-talk-low-1606
    name: "転任判定の前の校長の会話・低い段（issue #1606）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 43, year: 1}
      - set: {ManagerService.Manager.YearsAtSchool: 2, ManagerService.Manager.Trust: 30}
      - call: EventService.Clear()
      - advance_weeks: 1
      - read: =GameClock.Week
      - read: =EventService.Pending.Count
      - show: HomeDashboard
      - wait: 10
      - shot: 01-first-line
      - click: ev-novel
      - wait: 3
      - shot: 02-principal
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - shot: 04-last-line

  # ── 夜間マージ分の実機確認（2026-11-22・out/overnight/verify-targets-20261122.md）──

  - id: career-cards-1325
    name: "キャリア画面のカードが潰れない（PR #1385・issue #1325）"
    steps:
      - new_game: {seed: 1}
      - show: CareerScreen
      - shot: 01-career

  - id: management-contract-cancel-1298
    name: "経営タブ・年契約の解約予定の表示（PR #1376・issue #1298）"
    steps:
      - new_game: {seed: 1}
      - call: ManagerService.Contracts.SetLevel("expedition", 1)
      - call: ManagerService.Contracts.ScheduleCancel("expedition")
      - show: ManagementScreen
      - call: SelectTab(3)
      - shot: 01-contracts

  - id: training-plan-1297
    name: "練習計画の列見出しの揃い（PR #1374・issue #1297）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - shot: 01-training-plan

  - id: training-plan-details-1287
    name: "練習計画の細部（戻ると球種チャート・モーダルの状態・トースト・Esc。issue #1287）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 01-abil-first
      - show: HomeDashboard
      - show: TrainingPlan
      - wait: 5
      - shot: 02-after-return-closed
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 03-abil-second
      - click: template-save
