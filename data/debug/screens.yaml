  # 共通トップバーのチーム状態（結束の言葉）。game_scale＝1280×720 の窓の本番の見え方（0.8倍）
  - id: team-state-1600
    name: "共通トップバーのチーム状態（言葉）・チーム総合力パネル・選手間イベントの結果行・主将指名（issue #1600）"
    game_scale: true
    steps:
