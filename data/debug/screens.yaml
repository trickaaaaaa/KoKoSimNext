      - call: GameSession.Current.ApplyCohesionEvent(false)
      - call: GameSession.Current.ApplyCohesionEvent(false)
      - call: GameSession.Current.ApplyCohesionEvent(false)
      - call: GameSession.Current.ApplyCohesionEvent(false)
