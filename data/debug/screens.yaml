      - shot: 02-saved-playing
      - show: HomeDashboard
      - show: SaveSlots
      - click: .ss-op-trash[0]
      - shot: 03-confirm-delete
      - show: HomeDashboard
      - show: SaveSlots
      - click: .ss-op--fill[0]
      - shot: 04-confirm-overwrite
      - show: HomeDashboard
      - set: {SaveSlots.Entry: Title}
      - show: SaveSlots
