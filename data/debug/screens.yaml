# データ画面の撮影レシピ（ホーム・選手・メンバー設定・練習・経営・キャリア・記録などの確認用）。1件の確認＝1項目。
# 試合の場面は captures.yaml。画面ごとの使い捨て *Shooter は新しく書かない（ここに手順を書く）。
#
# 実行（Unity Editor・Play していない状態で。MCP execute_code からも呼べる）:
#   KokoSim.UnityEditorTools.ScreenCaptureRunner.Run("management-contracts")   # 複数 id を並べると続けて撮る
# 終わると screenshots/<id>/ に DONE か FAILED と summary.json（撮った絵・書体監査・reads・手順のメモ・エラー）、
# *.png（shot）が出る。全体の結果は screenshots/_screen-run.txt。
#
# このディレクトリ（data/debug/）はデバッグ専有でリリースから除外する。
#
# フィールド:
#   id / name : 識別子（出力フォルダ名）と説明（" #" を含むなら "" で囲む）
#   size      : {w: 1600, h: 900}（既定）
#   steps     : 手順を上から順に。1つでも失敗したらその先は撮らずに FAILED
#
# 手順:
#   new_game: {seed: 1, prefecture: 13, school: 桜丘, district: 0}
#                       新設校で新規ゲーム→ホーム（どれも省略可。seed 既定 1＝毎回同じ部員）。
#                       レシピの先頭に置かなければ、前のレシピ（同じ Run 内）の状態を引き継ぐ
#   advance_weeks: 3    週を送る（ホームの「次の週へ」と同じ経路）。大会に入ったらそこで止める
#   advance_days: 2     日を送る（大会中）
#   advance_to_match_day: ""   大会中に自校の次の試合の日まで日を送る
#   play_tournament: ""        いまの大会を最後まで消化（試合の日まで日送り→試合は委任で解く→結果を閉じる、を繰り返す。
#                       続けて開幕する大会も含む）。成績・通知・大会の後始末は本番どおりに残る
#                       週送り・大会の途中で出る答え待ち（新チームの主将・背番号・年契約の更新・転任の打診）には
#                       本番の既定どおり自動で答える（主将＝暫定主将／背番号・契約＝そのまま確定／転任＝残留）。summary の notes に残る
#   advance_to_week: 39 | {week: 39, year: 2}   途中の大会を消化しながら指定の週まで進める（year は1始まりの年度・週は 0〜49）
#   boost_roster: 95 | {level: 95, cap: 99}     自校の部員の全能力を上げる（勝ち進む分岐を見る用）
#   transfer: "" | weakest | {school: 123}   監督を転任させる（""＝同じ県でいちばん強い他校・weakest＝いちばん弱い他校）。年度末の判定を待たずに
#                       打診を開き、ホームの「転任する」と同じ確定処理を通す（記録・配色の持ち越しを見る用）
#   show: ManagementScreen     画面を開く（GameObject 名＝ScreenRouter の画面名）
#   click: name | .class[添字]   押す（ClickEvent。Button なら自動で決定キーと同じ NavigationSubmitEvent）
#   submit: name               決定キーで押す
#   hover / leave: name        マウスを載せる／離す（PointerEnter/Leave。:hover の見た目は変わらない）
#   call: Method(1, "a")       表示中の画面のコントローラのメソッド
#   call: ManagerService.Contracts.ScheduleCancel("scouting")   KokoSim の型から辿った先のメソッド
#   set: {ManagerService.Manager.Funds: 20, RosterService.Active.0.IsCaptain: true}
#                       static から辿った値を書き換える（数字の段はリストの添字）
#   wait: 5 | 300ms     フレーム数か実時間（UI の遅延タイマーを越えるとき）
#   read: ngs-district  要素の中身（ドロップダウンは選択肢まで）を summary.json の reads に書く
#   read: =GameSession.Current.PendingSenbatsuFieldIds   static から辿った値（コレクションは件数と先頭8件）。画面に出ない状態の確認用
#   shot: 01-name | {name: 01-name, h: 1400}   いまの画面を撮る（同時に書体監査を summary.json へ）

screens:
  # ── 県選択（日本地図）・issue #1410 ──

  - id: prefecture-map-1410
    name: "はじめからの県選択を日本地図に（全国図・乗せたとき・北海道/東京の拡大・設定画面）（issue #1410）"
    steps:
      - show: PrefectureSelect
      - wait: 5
      - shot: 01-national
      - call: HoverForCapture(33)
      - wait: 3
      - shot: 02-hover-hiroshima
      - call: HoverForCapture(36)
      - wait: 3
      - shot: 03-hover-kagawa
      # 沖縄は傾けた本土の左上の海に同じ縮尺で置く（#1502）。乗せて強調・札が出ること
      - call: HoverForCapture(46)
      - wait: 3
      - shot: 03b-hover-okinawa
      - call: PickForCapture(0)
      - wait: 5
      - shot: 04-hokkaido-zoom
      - call: HoverForCapture(0, 1)
      - wait: 3
      - shot: 05-hokkaido-hover-south
      - call: ResetForCapture()
      - call: PickForCapture(12)
      - wait: 5
      - shot: 06-tokyo-zoom
      - call: HoverForCapture(12, 1)
      - wait: 3
      - shot: 07-tokyo-hover-west
      - call: PickForCapture(12, 1)
      - wait: 8
      - read: ngs-pref-name
      - read: ngs-district
      - shot: 08-setup-tokyo-west

  # ── 束7 お金・信頼度・名声（2026-11-23・issue #1299 #1469 #1270 #1467）──
  # 経営タブ: 収入の内訳の「後援会」（旧「後援会・OB」）と、年契約の新しい年額（スカウト網 100/250/420・遠征60・コーチ160）。
  - id: management-economy-bundle7
    name: "経営タブの収入の内訳（後援会）と年契約の年額（issue #1299 #1469）"
    steps:
      - new_game: {seed: 1}
      - show: ManagementScreen
      - shot: 01-income
      - call: SelectTab(3)
      - shot: 02-contracts
      - call: ManagerService.Contracts.SetLevel("scouting", 3)
      - call: ManagerService.Contracts.SetLevel("coach_batting", 1)
      - show: ManagementScreen
      - call: SelectTab(3)
      - shot: 03-contracts-lv3-coach-net-red

  # 選択肢の結果行に信頼度が並ぶ（結束の上下＋信頼度 ±2）。好転側（roll 0）を撮る。
  - id: event-trust-interpersonal-1270
    name: "選手間の選択肢の結果行に信頼度 ＋2（issue #1270 E1）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - read: "=ManagerService.Manager.Trust"
      - call: EventService.PushChoiceEvent("skipping_practice", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices
      - click: .choice-btn[0]
      - wait: 5
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 02-result-line
      - read: "=ManagerService.Manager.Trust"

  # テスト週の配慮（練習を軽くする＝効率 ×0.85・2週・信頼度 ＋2）。
  - id: event-exam-ease-1270
    name: "テスト週・練習を軽くする（信頼度 ＋2・issue #1270 E1）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - read: "=ManagerService.Manager.Trust"
      - call: EventService.PushChoiceEvent("exam_week_slump", 0)
      - show: HomeDashboard
      - wait: 10
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 3
      - click: ev-novel
      - wait: 5
      - shot: 01-choices
      # 選ぶと結果の会話の1行目が出る。「練習を軽くする」の結果は2行＋結果行＝あと2回送ると結果行
      # （選手間の選択肢は結果の会話が3行なので3回。行数が違うのでレシピも別）。
      - click: .choice-btn[0]
      - wait: 5
      - shot: 02-outcome-1
      - click: ev-novel
      - wait: 3
      - shot: 03-outcome-2
      - click: ev-novel
      - wait: 5
      - shot: 04-result-line
      - read: "=ManagerService.Manager.Trust"

  # ── 夜間マージ分の実機確認（2026-11-22・out/overnight/verify-targets-20261122.md）──

  - id: career-cards-1325
    name: "キャリア画面のカードが潰れない（PR #1385・issue #1325）"
    steps:
      - new_game: {seed: 1}
      - show: CareerScreen
      - shot: 01-career

  - id: management-contract-cancel-1298
    name: "経営タブ・年契約の解約予定の表示（PR #1376・issue #1298）"
    steps:
      - new_game: {seed: 1}
      - call: ManagerService.Contracts.SetLevel("expedition", 1)
      - call: ManagerService.Contracts.ScheduleCancel("expedition")
      - show: ManagementScreen
      - call: SelectTab(3)
      - shot: 01-contracts

  - id: training-plan-1297
    name: "練習計画の列見出しの揃い（PR #1374・issue #1297）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - shot: 01-training-plan

  - id: training-plan-details-1287
    name: "練習計画の細部（戻ると球種チャート・モーダルの状態・トースト・Esc。issue #1287）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 01-abil-first
      - show: HomeDashboard
      - show: TrainingPlan
      - wait: 5
      - shot: 02-after-return-closed
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 03-abil-second
      - click: template-save
      - wait: 3
      - shot: 04-toast-over-scrim

  - id: skill-change-1471
    name: "特殊能力の変化（気づきで開示・覚醒で習得・克服）のノベル・通知フィード・選手詳細のスキル欄（issue #1471）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      # 先頭3人に 開示／覚醒で習得／克服 をこの順に1件ずつ起こし、本番と同じ提示経路で流す（撮影用の入口）。
      # skill_* の会話はどの通りも2行＋結果行＝1件3ページ（送り2回で結果行・3回で次の会話の1行目）
      - call: HomeState.Current.PresentSkillChangesForCapture()
      - show: HomeDashboard
      - wait: 10
      - shot: 01-novel-insight-revealed
      - click: ev-novel
      - wait: 5
      - click: ev-novel
      - wait: 5
      - shot: 02-novel-insight-result
      - click: ev-novel
      - wait: 5
      - shot: 03-novel-awakening
      - click: ev-novel
      - wait: 5
      - click: ev-novel
      - wait: 5
      - shot: 04-novel-awakening-result
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 5
      - read: feed-list
      - shot: 05-home-feed
      # 先頭の部員（気づきで開示した選手）の詳細を、通知フィードから開いたときと同じ指名で出す。
      # スキル欄は右ペインの下の方なので縦に長く撮る
      - set: {PlayerSelection.Index: 0, PlayerSelection.Pinned: true}
      - show: PlayerList
      - wait: 5
      - read: skills-list
      - shot: {name: 06-player-detail-skills, h: 2400}

  - id: player-detail-radar-1279
    name: "選手詳細のレーダーの格子色（PR #1370・issue #1279 項目2）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      - show: PlayerList
      - shot: 01-player-detail
      - show: TeamStrength
      - shot: 02-team-strength

  - id: member-captain-1239
    name: "メンバー設定の主将マーカー「主」と学年ラベル（PR #1412・issue #1239）"
    steps:
      - new_game: {seed: 1}
      # 「主」は控えの枠カード（背番号10〜）とフルカードにだけ出る。だれが控えに回るかは編成しだいなので、
      # 見た目の確認のために全員に立てる（本番では1人だけ）
      - set: {RosterService.Active.0.IsCaptain: true, RosterService.Active.1.IsCaptain: true, RosterService.Active.2.IsCaptain: true, RosterService.Active.3.IsCaptain: true, RosterService.Active.4.IsCaptain: true, RosterService.Active.5.IsCaptain: true, RosterService.Active.6.IsCaptain: true, RosterService.Active.7.IsCaptain: true, RosterService.Active.8.IsCaptain: true, RosterService.Active.9.IsCaptain: true}
      - show: MemberSetting
      - hover: .field-chip[0]
      - shot: 01-member

  - id: member-popover-close-1267
    name: "背番号チップのポップオーバーの✕に届く（PR #1394・issue #1267 項目1）"
    steps:
      - new_game: {seed: 1}
      - show: MemberSetting
      - hover: .field-chip[0]
      - shot: 01-popover-open
      - leave: .field-chip[0]
      - hover: .field-pop
      - wait: 300ms
      - read: .field-pop
      - shot: 02-still-open-after-leaving-chip

  - id: home-feed-1239
    name: "ホームの通知フィードのタグ（枠なし・左バー・発見は空色）（PR #1412・issue #1239）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 10
      - call: EventService.Clear()
      - show: HomeDashboard
      - read: feed-list
      - shot: 01-home

  - id: new-game-hokkaido-1334
    name: "新規開始で北海道を選ぶと北北海道/南北海道の2択（PR #1387・issue #1334）"
    steps:
      - show: NewGameSetup
      - call: SetForCapture(0, "検証")
      - read: ngs-district
      - read: ngs-summary-text
      - shot: 01-hokkaido

  - id: home-weather-1199
    name: "大会中のホームの天気・気温は試合当日だけ出る（PR #1391・issue #1199）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 20
      - show: HomeDashboard
      - read: weather-icon
      - shot: 01-tournament-not-match-day
      - advance_to_match_day: ""
      # 試合当日の朝に積まれたイベント会話が本文を覆うので、片付けてから撮る（天気マークを見る用・#1200）
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 5
      - read: weather-icon
      - shot: 02-match-day

  - id: innings-thirds-1279
    name: "投球回の 1/3・2/3 の組み方（夏の県大会を消化した後のホームと選手詳細の成績・PR #1370・issue #1279 項目4）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 13
      - play_tournament: ""
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 01-home-ranking
      - show: PlayerList
      - click: tab-stats-btn
      - shot: 02-player-stats

  - id: senbatsu-watch-1265
    name: "観るだけのセンバツが大会タブと通知フィードに出る（PR #1365・issue #1265）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 39
      - read: =GameSession.Current.HasSpectatedSenbatsu
      - call: EventService.Clear()
      - show: TournamentPreview
      - shot: 01-tournament-tab-week39
      - advance_to_week: 41
      - read: =GameSession.Current.HasSpectatedSenbatsu
      - call: EventService.Clear()
      - show: HomeDashboard
      - read: feed-list
      - shot: 02-home-feed-week41

  - id: transfer-records-1261
    name: "転任で記録・配色が学校に付いて回る（記録画面の赴任校列・配色・PR #1417・issue #1261）"
    steps:
      - new_game: {seed: 1}
      # 本番の転任は年度末の総括（第46週）にだけ起きる。その週まで1年分の大会を消化してから転任させる
      - advance_to_week: 46
      - read: =TeamColorProvider.ManagerColors
      - call: EventService.Clear()
      - show: RecordsScreen
      - shot: 01-records-before
      - transfer: ""
      - read: =TeamColorProvider.ManagerColors
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 02-home-after
      - advance_to_week: {week: 30, year: 2}
      - call: EventService.Clear()
      - show: RecordsScreen
      - shot: 03-records-year2
      - click: .seg-tab[1]
      - shot: 04-personal-records-year2

  - id: match-history-1413
    name: "記録画面の［戦績］タブ・過去の試合の結果画面・閉じると戦績へ戻る・転任後は旧校に残る（issue #1413）"
    steps:
      - new_game: {seed: 1}
      - boost_roster: 80
      - advance_to_week: 46
      - call: EventService.Clear()
      - show: RecordsScreen
      - click: .seg-tab[2]
      - shot: 01-matches-tab
      - read: =GameSession.Current.MatchHistory.Count
      - click: .rc-mt--open[0]
      - wait: 5
      - shot: 02-past-match-result
      - click: mr-close
      - wait: 5
      - shot: 03-back-on-matches-tab
      - transfer: ""
      - call: EventService.Clear()
      - show: RecordsScreen
      - click: .seg-tab[2]
      - shot: 04-matches-after-transfer
      - read: =GameSession.Current.MatchHistory.Count

  - id: new-students-1250
    name: "年度が替わった週送りの後、選手一覧・練習・メンバー設定に新入生が出る（PR #1357・issue #1250）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 1, year: 2}
      - read: =RosterService.Active
      - call: EventService.Clear()
      - show: PlayerList
      - read: =RosterService.Roster
      - shot: 01-player-list
      - show: TrainingPlan
      - shot: 02-training
      - show: MemberSetting
      - shot: 03-member

  # ── 能力の表示の物差しを Δ=7 下げた（issue #1080）: 1桁（3〜9）の能力が崩れないか ──

  - id: single-digit-weak-school-1080
    name: "弱小校の部員の能力が1桁（3〜9）でも、選手詳細・選手一覧・メンバー設定・練習の列とバーが崩れない（issue #1080）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      # 同じ県でいちばん弱い学校へ転任＝その学校の部員（AI校の能力のまま）が自校の部員になる
      - transfer: weakest
      - call: EventService.Clear()
      - show: PlayerList
      - read: =RosterService.Roster
      - shot: 01-player-detail
      - show: MemberSetting
      - shot: 03-member
      - show: TrainingPlan
      - shot: 04-training
      - show: TeamStrength
      - shot: 05-team-strength

  - id: single-digit-fame0-intake-1080
    name: "名声0の自校の新入生（新設校の1年生と、翌年度の新入生）の能力が1桁でも崩れない（issue #1080）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      # 新設校の初年度＝名声0の新入生だけ
      - read: =ManagerService.Manager.Fame
      - show: PlayerList
      - read: =RosterService.Roster
      - shot: 01-player-detail-year1
      - show: MemberSetting
      - shot: 02-member-year1
      - show: TrainingPlan
      - shot: 03-training-year1
      # 名声0のまま翌年度へ（3月の新入生の確定が名声を読む）
      - set: {ManagerService.Manager.Fame: 0}
      - advance_to_week: {week: 1, year: 2}
      - call: EventService.Clear()
      - show: PlayerList
      - read: =RosterService.Roster
      - shot: 04-player-detail-year2
      - show: MemberSetting
      - shot: 05-member-year2

  # ── 昼の配色への読み替え漏れ（issue #1286）──

  - id: day-palette-1286
    name: "チーム総合力の分析文・スクロールバー・選択行のずれ・施設台帳の行高（issue #1286）"
    steps:
      - new_game: {seed: 1}
      - show: TeamStrength
      - shot: {name: 01-team-strength, h: 1500}
      - show: TrainingPlan
      - shot: 02-training-unselected
      - click: .trow[2]
      - shot: 03-training-selected
      - show: ManagementScreen
      - shot: 04-management

  - id: title-watercolor-1423-169
    name: "タイトル画面の水彩画の背景・16:9（issue #1423）"
    size: {w: 1600, h: 900}
    steps:
      - show: TitleScreen
      - wait: 5
      - shot: 01-title

  - id: title-watercolor-1423-1610
    name: "タイトル画面の水彩画の背景・16:10（issue #1423）"
    size: {w: 1600, h: 1000}
    steps:
      - show: TitleScreen
      - wait: 5
      - shot: 01-title

  - id: team-manager-succession-1430
    name: "マネージャーの学年つき入れ替わり・立ち絵10人・引き継ぎイベント（issue #1430）"
    steps:
      - new_game: {seed: 1}
      # 新設校は1年（読み値は summary.json の reads で確認）。
      - read: "=ManagerService.Manager.TeamManagerGrade"
      - read: "=ManagerService.Manager.TeamManagerPortrait"
      # 転任（既存の学校への赴任）で2年か3年に入れ替わる。見た目も前任と違う人になる（実際の転任経路）。
      - transfer: ""
      - read: "=ManagerService.Manager.TeamManagerGrade"
      - read: "=ManagerService.Manager.TeamManagerPortrait"
      # 3年夏の引き継ぎイベント（引退する側=9番・新しい側=4番）を直接積んで、立ち絵が役割ごとに
      # 違う番号で出ることを撮る（本番は summer_retirement_* の直後に自動で積まれる）。
      - set: {ManagerService.Manager.TeamManagerPortrait: 4, ManagerService.Manager.OutgoingTeamManagerPortrait: 9}
      - call: EventService.PushMilestone("team_manager_succession")
      - show: HomeDashboard
      - wait: 10
      - shot: 01-succession-a
      - click: ev-novel
      - wait: 5
      - shot: 02-succession-b
      - click: ev-novel
      - wait: 5
      - shot: 03-succession-c
      - click: ev-novel
      - wait: 5
      - shot: 04-succession-d

  - id: home-ranking-active-1411
    name: "ホームのチーム内ランキングに引退した部員が載らない（引退前→引退後・issue #1411。年度替わり後はテスト TeamStatsRankingsTests）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 24
      - read: =RosterService.Roster.0.Name
      - read: =RosterService.Roster.1.Name
      - read: =RosterService.Roster.2.Name
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 01-home-before-retire
      # 新設校は3年が居ないので、夏の引退と同じフラグ（IsRetired）を直接立てて引退直後の状態にする。
      - set: {RosterService.Roster.0.IsRetired: true, RosterService.Roster.1.IsRetired: true, RosterService.Roster.2.IsRetired: true}
      - read: =RosterService.Active.Count
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 02-home-after-retire

  - id: graduates-name-table-1414
    name: "卒業生を名前の表で持つ（卒業後も記録画面の個人記録に名前が出る・issue #1414）"
    steps:
      - new_game: {seed: 1}
      - boost_roster: 80
      # 新設校は1年生だけ＝3年後（第4年度）の春に最初の卒業生が出る。卒業後の年度まで進めて個人記録（通算）を見る
      - advance_to_week: {week: 30, year: 5}
      - call: EventService.Clear()
      - read: =RosterService.Graduated.Count
      - read: =RosterService.Graduated.Entries.0.Name
      - show: RecordsScreen
      - click: .seg-tab[1]
      - shot: 01-personal-records-career

  - id: feed-link-1474
    name: "通知フィードの行を押すと飛び先へ（選手の通知＝その選手の詳細・試合の通知＝記録の戦績）（issue #1474）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 2
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 5
      - shot: 01-home-feed
      # 名簿の先頭ではない選手の通知を押す（先頭だと「既定で先頭を開いた」と区別できない）
      - click: .fd-item--link[4]
      - wait: 8
      - read: name
      - read: "=PlayerSelection.Index"
      - shot: 02-opened-player
      - advance_weeks: 11
      - advance_to_match_day: ""
      - play_tournament: ""
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 5
      - shot: 03-home-after-tournament
      - click: .fd-item--link[0]
      - wait: 8
      - shot: 04-opened-from-feed

  - id: favorite-feed-1476
    name: "展望で自校に印（◎○▲）が付くと、開幕の通知に部員の反応を添えて1行出る（issue #1476）"
    steps:
      - new_game: {seed: 1}
      - boost_roster: 95
      - advance_weeks: 20
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 4000ms
      - read: feed-list
      - shot: 01-home-feed

  - id: settings-1315
    name: "システムタブの［設定］ページ（画面・fps・音量の1枚のカード）（issue #1315）"
    steps:
      - new_game: {seed: 1}
      - show: SaveSlots
      - wait: 5
      # 撮影の道筋ではタイトル経由の形で開く（校名の編集が無い）＝［セーブデータ｜設定｜クレジット］の2番目
      - click: .seg-tab[1]
      - wait: 5
      - shot: 01-settings
      - click: .ucp-arrow[2]
      - wait: 3
      - read: ss-set-rows
      - shot: 02-master-volume-down
      # 設定は PlayerPrefs（この機械の好み）に残るので、下げた音量を戻しておく
      - click: .ucp-arrow[3]

  # ── 赴任イベントとチュートリアル（issue #1496） ──

  - id: arrival-tutorial-1496-new
    name: "はじめから→赴任イベント（新設校・1年のマネージャー）→最初の説明（週の送り方・練習）→スキップ→もう説明はいらない（issue #1496）"
    steps:
      - new_game: {seed: 1}
      # 本番は新規ゲーム設定の「この高校ではじめる」が積む（StartNewSchool には入れていない＝ここで同じ入口を呼ぶ）。
      - call: TutorialService.OnNewSchoolStarted()
      - show: HomeDashboard
      - wait: 10
      - shot: 01-arrival-first-line
      - click: ev-novel
      - wait: 5
      - shot: 02-arrival-second-line
      # 赴任イベントを飛ばす→最後の行へ
      - click: ev-skip
      - wait: 5
      - shot: 03-arrival-skipped-to-last
      - click: ev-novel
      - wait: 5
      - shot: 04-basics-first-line
      - click: ev-novel
      - wait: 5
      - shot: 05-basics-second-line
      # 説明を飛ばす→最後の行と「分かった／もう説明はいらない」
      - click: ev-skip
      - wait: 5
      - shot: 06-basics-choices
      - click: .choice-btn[1]
      - wait: 5
      - shot: 07-dismissed-reply
      - read: =TutorialService.Progress.Dismissed
      - read: =TutorialService.Progress.Seen

  - id: arrival-tutorial-1496-transfer
    name: "転任→赴任イベント（転任用・2年か3年のマネージャー）。チュートリアルは出ない（issue #1496）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      # 転任の確定（ManagerTransferService.Confirm）が赴任イベントを積む
      - transfer: ""
      - read: =ManagerService.Manager.TeamManagerGrade
      - read: =EventService.Pending
      - show: HomeDashboard
      - wait: 10
      - shot: 01-transfer-arrival-a
      - click: ev-novel
      - wait: 5
      - shot: 02-transfer-arrival-b
      - click: ev-novel
      - wait: 5
      - shot: 03-transfer-arrival-c

  - id: arrival-tutorial-1496-scenes
    name: "場面ごとの説明（公式戦の前・試合の前・スカウト・部費・夏の引退）の1行目と選択肢（issue #1496）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      - call: TutorialService.Raise("FirstTournament")
      - show: HomeDashboard
      - wait: 10
      - shot: 01-first-tournament
      - click: ev-skip
      - wait: 5
      - shot: 02-first-tournament-choices
