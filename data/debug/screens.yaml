      - shot: 04-toast-over-scrim

  - id: skill-change-1471
    name: "特殊能力の変化（気づきで開示・覚醒で習得・克服）のノベル・通知フィード・選手詳細のスキル欄（issue #1471）"
    steps:
      - new_game: {seed: 1}
      - call: EventService.Clear()
      # 先頭3人に 開示／覚醒で習得／克服 をこの順に1件ずつ起こし、本番と同じ提示経路で流す（撮影用の入口）。
      # skill_* の会話はどの通りも2行＋結果行＝1件3ページ（送り2回で結果行・3回で次の会話の1行目）
      - call: HomeState.Current.PresentSkillChangesForCapture()
      - show: HomeDashboard
      - wait: 10
      - shot: 01-novel-insight-revealed
      - click: ev-novel
      - wait: 5
      - click: ev-novel
      - wait: 5
      - shot: 02-novel-insight-result
      - click: ev-novel
      - wait: 5
      - shot: 03-novel-awakening
      - click: ev-novel
      - wait: 5
      - click: ev-novel
      - wait: 5
      - shot: 04-novel-awakening-result
      - call: EventService.Clear()
      - show: HomeDashboard
      - wait: 5
      - read: feed-list
      - shot: 05-home-feed
      # 先頭の部員（気づきで開示した選手）の詳細を、通知フィードから開いたときと同じ指名で出す。
      # スキル欄は右ペインの下の方なので縦に長く撮る
      - set: {PlayerSelection.Index: 0, PlayerSelection.Pinned: true}
      - show: PlayerList
      - wait: 5
      - read: skills-list
      - shot: {name: 06-player-detail-skills, h: 2400}

  - id: player-detail-radar-1279
    name: "選手詳細のレーダーの格子色（PR #1370・issue #1279 項目2）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      - show: PlayerList
      - shot: 01-player-detail
      - show: TeamStrength
      - shot: {name: 02-team-strength, h: 1300}

  - id: player-detail-pitcher-sense-1472
    name: "選手詳細の隠しパラメータ欄に投手センスの見立て（ランク）が出る・見立てが無い選手は「？」（issue #1472）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      # 見極めの見立ては週の気づきで乱数しだいに付くので、ここでは見立てを直接置く（表示Lv。40＝C・15＝F の見立て）
      - set: {RosterService.Active.0.PitcherSenseReading: 40, RosterService.Active.2.PitcherSenseReading: 15}
      - read: =RosterService.Active.0.PitcherSense
      - set: {PlayerSelection.Index: 0, PlayerSelection.Pinned: true}
      - show: PlayerList
      - wait: 5
      - read: hidden-list
      - shot: 01-player-detail-sense-known
      # 見立てが無い選手（2人目）は「？」
      - set: {PlayerSelection.Index: 1, PlayerSelection.Pinned: true}
      - show: PlayerList
      - wait: 5
