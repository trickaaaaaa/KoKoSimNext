# データ画面の撮影レシピ（ホーム・選手・メンバー設定・練習・経営・キャリア・記録などの確認用）。1件の確認＝1項目。
# 試合の場面は captures.yaml。画面ごとの使い捨て *Shooter は新しく書かない（ここに手順を書く）。
#
# 実行（Unity Editor・Play していない状態で。MCP execute_code からも呼べる）:
#   KokoSim.UnityEditorTools.ScreenCaptureRunner.Run("management-contracts")   # 複数 id を並べると続けて撮る
# 終わると screenshots/<id>/ に DONE か FAILED と summary.json（撮った絵・書体監査・reads・手順のメモ・エラー）、
# *.png（shot）が出る。全体の結果は screenshots/_screen-run.txt。
#
# このディレクトリ（data/debug/）はデバッグ専有でリリースから除外する。
#
# フィールド:
#   id / name : 識別子（出力フォルダ名）と説明（" #" を含むなら "" で囲む）
#   size      : {w: 1600, h: 900}（既定）
#   steps     : 手順を上から順に。1つでも失敗したらその先は撮らずに FAILED
#
# 手順:
#   new_game: {seed: 1, prefecture: 13, school: 桜丘, district: 0}
#                       新設校で新規ゲーム→ホーム（どれも省略可。seed 既定 1＝毎回同じ部員）。
#                       レシピの先頭に置かなければ、前のレシピ（同じ Run 内）の状態を引き継ぐ
#   advance_weeks: 3    週を送る（ホームの「次の週へ」と同じ経路）。大会に入ったらそこで止める
#   advance_days: 2     日を送る（大会中）
#   advance_to_match_day: ""   大会中に自校の次の試合の日まで日を送る
#   play_tournament: ""        いまの大会を最後まで消化（試合の日まで日送り→試合は委任で解く→結果を閉じる、を繰り返す。
#                       続けて開幕する大会も含む）。成績・通知・大会の後始末は本番どおりに残る
#                       週送り・大会の途中で出る答え待ち（新チームの主将・背番号・年契約の更新・転任の打診）には
#                       本番の既定どおり自動で答える（主将＝暫定主将／背番号・契約＝そのまま確定／転任＝残留）。summary の notes に残る
#   advance_to_week: 39 | {week: 39, year: 2}   途中の大会を消化しながら指定の週まで進める（year は1始まりの年度・週は 0〜49）
#   boost_roster: 95 | {level: 95, cap: 99}     自校の部員の全能力を上げる（勝ち進む分岐を見る用）
#   transfer: "" | {school: 123}   監督を転任させる（""＝同じ県でいちばん強い他校）。年度末の判定を待たずに
#                       打診を開き、ホームの「転任する」と同じ確定処理を通す（記録・配色の持ち越しを見る用）
#   show: ManagementScreen     画面を開く（GameObject 名＝ScreenRouter の画面名）
#   click: name | .class[添字]   押す（ClickEvent。Button なら自動で決定キーと同じ NavigationSubmitEvent）
#   submit: name               決定キーで押す
#   hover / leave: name        マウスを載せる／離す（PointerEnter/Leave。:hover の見た目は変わらない）
#   call: Method(1, "a")       表示中の画面のコントローラのメソッド
#   call: ManagerService.Contracts.ScheduleCancel("scouting")   KokoSim の型から辿った先のメソッド
#   set: {ManagerService.Manager.Funds: 20, RosterService.Active.0.IsCaptain: true}
#                       static から辿った値を書き換える（数字の段はリストの添字）
#   wait: 5 | 300ms     フレーム数か実時間（UI の遅延タイマーを越えるとき）
#   read: ngs-district  要素の中身（ドロップダウンは選択肢まで）を summary.json の reads に書く
#   read: =GameSession.Current.PendingSenbatsuFieldIds   static から辿った値（コレクションは件数と先頭8件）。画面に出ない状態の確認用
#   shot: 01-name | {name: 01-name, h: 1400}   いまの画面を撮る（同時に書体監査を summary.json へ）

screens:
  # ── 夜間マージ分の実機確認（2026-11-22・out/overnight/verify-targets-20261122.md）──

  - id: career-cards-1325
    name: "キャリア画面のカードが潰れない（PR #1385・issue #1325）"
    steps:
      - new_game: {seed: 1}
      - show: CareerScreen
      - shot: 01-career

  - id: management-contract-cancel-1298
    name: "経営タブ・年契約の解約予定の表示（PR #1376・issue #1298）"
    steps:
      - new_game: {seed: 1}
      - call: ManagerService.Contracts.SetLevel("expedition", 1)
      - call: ManagerService.Contracts.ScheduleCancel("expedition")
      - show: ManagementScreen
      - call: SelectTab(3)
      - shot: 01-contracts

  - id: training-plan-1297
    name: "練習計画の列見出しの揃い（PR #1374・issue #1297）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - shot: 01-training-plan

  - id: training-plan-details-1287
    name: "練習計画の細部（戻ると球種チャート・モーダルの状態・トースト・Esc。issue #1287）"
    steps:
      - new_game: {seed: 1}
      - show: TrainingPlan
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 01-abil-first
      - show: HomeDashboard
      - show: TrainingPlan
      - wait: 5
      - shot: 02-after-return-closed
      - call: OpenModal(0)
      - click: tab-abil
      - wait: 5
      - shot: 03-abil-second
      - click: template-save
      - wait: 3
      - shot: 04-toast-over-scrim

  - id: player-detail-radar-1279
    name: "選手詳細のレーダーの格子色（PR #1370・issue #1279 項目2）"
    size: {w: 1600, h: 1500}
    steps:
      - new_game: {seed: 1}
      - show: PlayerList
      - shot: 01-player-detail
      - show: TeamStrength
      - shot: 02-team-strength

  - id: member-captain-1239
    name: "メンバー設定の主将マーカー「主」と学年ラベル（PR #1412・issue #1239）"
    steps:
      - new_game: {seed: 1}
      # 「主」は控えの枠カード（背番号10〜）とフルカードにだけ出る。だれが控えに回るかは編成しだいなので、
      # 見た目の確認のために全員に立てる（本番では1人だけ）
      - set: {RosterService.Active.0.IsCaptain: true, RosterService.Active.1.IsCaptain: true, RosterService.Active.2.IsCaptain: true, RosterService.Active.3.IsCaptain: true, RosterService.Active.4.IsCaptain: true, RosterService.Active.5.IsCaptain: true, RosterService.Active.6.IsCaptain: true, RosterService.Active.7.IsCaptain: true, RosterService.Active.8.IsCaptain: true, RosterService.Active.9.IsCaptain: true}
      - show: MemberSetting
      - hover: .field-chip[0]
      - shot: 01-member

  - id: member-popover-close-1267
    name: "背番号チップのポップオーバーの✕に届く（PR #1394・issue #1267 項目1）"
    steps:
      - new_game: {seed: 1}
      - show: MemberSetting
      - hover: .field-chip[0]
      - shot: 01-popover-open
      - leave: .field-chip[0]
      - hover: .field-pop
      - wait: 300ms
      - read: .field-pop
      - shot: 02-still-open-after-leaving-chip

  - id: home-feed-1239
    name: "ホームの通知フィードのタグ（枠なし・左バー・発見は空色）（PR #1412・issue #1239）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 10
      - call: EventService.Clear()
      - show: HomeDashboard
      - read: feed-list
      - shot: 01-home

  - id: new-game-hokkaido-1334
    name: "新規開始で北海道を選ぶと北北海道/南北海道の2択（PR #1387・issue #1334）"
    steps:
      - show: NewGameSetup
      - call: SetForCapture(0, "検証")
      - read: ngs-district
      - read: ngs-summary-text
      - shot: 01-hokkaido

  - id: home-weather-1199
    name: "大会中のホームの天気・気温は試合当日だけ出る（PR #1391・issue #1199）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 20
      - show: HomeDashboard
      - read: weather-label
      - shot: 01-tournament-not-match-day
      - advance_to_match_day: ""
      - show: HomeDashboard
      - read: weather-label
      - shot: 02-match-day

  - id: innings-thirds-1279
    name: "投球回の 1/3・2/3 の組み方（夏の県大会を消化した後のホームと選手詳細の成績・PR #1370・issue #1279 項目4）"
    steps:
      - new_game: {seed: 1}
      - advance_weeks: 13
      - play_tournament: ""
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 01-home-ranking
      - show: PlayerList
      - click: tab-stats-btn
      - shot: 02-player-stats

  - id: senbatsu-watch-1265
    name: "観るだけのセンバツが大会タブと通知フィードに出る（PR #1365・issue #1265）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 39
      - read: =GameSession.Current.HasSpectatedSenbatsu
      - call: EventService.Clear()
      - show: TournamentPreview
      - shot: 01-tournament-tab-week39
      - advance_to_week: 41
      - read: =GameSession.Current.HasSpectatedSenbatsu
      - call: EventService.Clear()
      - show: HomeDashboard
      - read: feed-list
      - shot: 02-home-feed-week41

  - id: transfer-records-1261
    name: "転任で記録・配色が学校に付いて回る（記録画面の赴任校列・配色・PR #1417・issue #1261）"
    steps:
      - new_game: {seed: 1}
      # 本番の転任は年度末の総括（第46週）にだけ起きる。その週まで1年分の大会を消化してから転任させる
      - advance_to_week: 46
      - read: =TeamColorProvider.ManagerColors
      - call: EventService.Clear()
      - show: RecordsScreen
      - shot: 01-records-before
      - transfer: ""
      - read: =TeamColorProvider.ManagerColors
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 02-home-after
      - advance_to_week: {week: 30, year: 2}
      - call: EventService.Clear()
      - show: RecordsScreen
      - shot: 03-records-year2
      - click: .seg-tab[1]
      - shot: 04-personal-records-year2

  - id: new-students-1250
    name: "年度が替わった週送りの後、選手一覧・練習・メンバー設定に新入生が出る（PR #1357・issue #1250）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: {week: 1, year: 2}
      - read: =RosterService.Active
      - call: EventService.Clear()
      - show: PlayerList
      - read: =RosterService.Roster
      - shot: 01-player-list
      - show: TrainingPlan
      - shot: 02-training
      - show: MemberSetting
      - shot: 03-member

  # ── 昼の配色への読み替え漏れ（issue #1286）──

  - id: day-palette-1286
    name: "チーム総合力の分析文・スクロールバー・選択行のずれ・施設台帳の行高（issue #1286）"
    steps:
      - new_game: {seed: 1}
      - show: TeamStrength
      - shot: {name: 01-team-strength, h: 1500}
      - show: TrainingPlan
      - shot: 02-training-unselected
      - click: .trow[2]
      - shot: 03-training-selected
      - show: ManagementScreen
      - shot: 04-management

  - id: title-watercolor-1423-169
    name: "タイトル画面の水彩画の背景・16:9（issue #1423）"
    size: {w: 1600, h: 900}
    steps:
      - show: TitleScreen
      - wait: 5
      - shot: 01-title

  - id: title-watercolor-1423-1610
    name: "タイトル画面の水彩画の背景・16:10（issue #1423）"
    size: {w: 1600, h: 1000}
    steps:
      - show: TitleScreen
      - wait: 5
      - shot: 01-title

  - id: team-manager-succession-1430
    name: "マネージャーの学年つき入れ替わり・立ち絵10人・引き継ぎイベント（issue #1430）"
    steps:
      - new_game: {seed: 1}
      # 新設校は1年（読み値は summary.json の reads で確認）。
      - read: "=ManagerService.Manager.TeamManagerGrade"
      - read: "=ManagerService.Manager.TeamManagerPortrait"
      # 転任（既存の学校への赴任）で2年か3年に入れ替わる。見た目も前任と違う人になる（実際の転任経路）。
      - transfer: ""
      - read: "=ManagerService.Manager.TeamManagerGrade"
      - read: "=ManagerService.Manager.TeamManagerPortrait"
      # 3年夏の引き継ぎイベント（引退する側=9番・新しい側=4番）を直接積んで、立ち絵が役割ごとに
      # 違う番号で出ることを撮る（本番は summer_retirement_* の直後に自動で積まれる）。
      - set: {ManagerService.Manager.TeamManagerPortrait: 4, ManagerService.Manager.OutgoingTeamManagerPortrait: 9}
      - call: EventService.PushMilestone("team_manager_succession")
      - show: HomeDashboard
      - wait: 10
      - shot: 01-succession-a
      - click: ev-novel
      - wait: 5
      - shot: 02-succession-b
      - click: ev-novel
      - wait: 5
      - shot: 03-succession-c
      - click: ev-novel
      - wait: 5
      - shot: 04-succession-d

  - id: home-ranking-active-1411
    name: "ホームのチーム内ランキングに引退した部員が載らない（引退前→引退後・issue #1411。年度替わり後はテスト TeamStatsRankingsTests）"
    steps:
      - new_game: {seed: 1}
      - advance_to_week: 24
      - read: =RosterService.Roster.0.Name
      - read: =RosterService.Roster.1.Name
      - read: =RosterService.Roster.2.Name
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 01-home-before-retire
      # 新設校は3年が居ないので、夏の引退と同じフラグ（IsRetired）を直接立てて引退直後の状態にする。
      - set: {RosterService.Roster.0.IsRetired: true, RosterService.Roster.1.IsRetired: true, RosterService.Roster.2.IsRetired: true}
      - read: =RosterService.Active.Count
      - call: EventService.Clear()
      - show: HomeDashboard
      - shot: 02-home-after-retire
