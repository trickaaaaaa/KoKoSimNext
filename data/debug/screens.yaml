      - wait: 5
      - call: TutorialService.Raise("FirstMatch")
      - show: HomeDashboard
      - wait: 10
      - shot: 03-first-match
      - click: ev-skip
      - wait: 5
      - click: .choice-btn[0]
      - wait: 5
      - call: TutorialService.Raise("Scouting")
      - show: HomeDashboard
      - wait: 10
      - shot: 04-scouting
      - click: ev-skip
      - wait: 5
      - click: .choice-btn[0]
      - wait: 5
      - call: TutorialService.Raise("Purchases")
      - show: HomeDashboard
      - wait: 10
      - shot: 05-purchases
      - click: ev-skip
      - wait: 5
      - click: .choice-btn[0]
      - wait: 5
      - call: TutorialService.Raise("SummerRetirement")
      - show: HomeDashboard
      - wait: 10
